server.host: "0.0.0.0"
server.port: 443
opensearch.hosts: ["https://wazuh.indexer:9200"]
opensearch.username: "admin"
opensearch.password: "SecretPassword1!"
opensearch.ssl.verificationMode: full
opensearch.pemcertFilepath: /etc/wazuh-dashboard/certs/root-ca.pem
opensearch.pinnedCredentials: null
opensearch.ssl.certificate: /etc/wazuh-dashboard/certs/wazuh-dashboard.pem
opensearch.ssl.key: /etc/wazuh-dashboard/certs/wazuh-dashboard.key
opensearch.ssl.certificateAuthorities: ["/etc/wazuh-dashboard/certs/root-ca.pem"]
opensearch.requestTimeout: 60000
opensearch_security.multitenancy.enabled: false
opensearch_security.multitenancy.tenants.preferred: [Private, Global]
opensearch_security.multitenancy.roles.enabled: ["global_tenant", "admin_tenant"]
opensearch_security.readonly_mode.roles: ["opendistro_security_all_access"]
server.ssl.enabled: true
server.ssl.certificate: /etc/wazuh-dashboard/certs/wazuh-dashboard.pem
server.ssl.key: /etc/wazuh-dashboard/certs/wazuh-dashboard.key
logging.root.level: warn
