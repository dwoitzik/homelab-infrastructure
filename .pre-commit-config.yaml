repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--multi]
      - id: check-added-large-files
        exclude: ^(ansible/roles/monitoring_core/templates/snmp\.yml\.j2|terraform/providers/.*\.zip)$

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        description: Automatically formats Terraform files to standard style.
        entry: terraform fmt
        language: system
        files: \.tf$
        pass_filenames: true

      - id: ansible-lint
        name: Ansible Lint
        description: Enforces Ansible best practices and fully qualified collection names.
        entry: bash -c 'cd ansible && ansible-lint'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: tflint
        name: TFLint
        description: Check for Terraform errors and best practices.
        entry: tflint
        language: system
        files: \.tf$
        pass_filenames: false
        args: ["--recursive"]
        stages: [pre-commit, pre-push]

      - id: tflint-full-repo
        name: TFLint (all stacks, pre-push only)
        description: Re-checks every Terraform stack before push, not just changed files.
        entry: bash -c 'for d in terraform/stacks/network terraform/stacks/proxmox; do (cd "$d" && tflint --recursive); done'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: terraform-fmt-check-full-repo
        name: Terraform fmt -check (all stacks, pre-push only)
        description: Re-checks formatting for every Terraform stack before push.
        entry: bash -c 'for d in terraform/stacks/network terraform/stacks/proxmox; do (cd "$d" && terraform fmt -check); done'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: yamllint
        name: YAML Lint
        description: Check YAML files for syntax and style.
        entry: yamllint
        language: system
        types: [yaml]
        args: [-d, "{extends: relaxed, rules: {line-length: disable}}"]
