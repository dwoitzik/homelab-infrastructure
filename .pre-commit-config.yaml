repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--multi]
      - id: check-added-large-files
        exclude: ^(ansible/roles/monitoring_core/templates/snmp\.yml\.j2|terraform/providers/.*\.zip)$

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        description: Automatically formats Terraform files to standard style.
        entry: terraform fmt
        language: system
        files: \.tf$
        pass_filenames: true

      - id: ansible-lint
        name: Ansible Lint
        description: Enforces Ansible best practices and fully qualified collection names.
        # Absolute path: git hooks run without sourcing .bashrc, so PATH
        # additions (e.g. pipx's ~/.local/bin) aren't picked up otherwise -
        # this caused a stale apt-installed ansible-lint (6.17.2) to win
        # over the pinned 26.4.0 and silently pass things CI then failed on.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; cd ansible && ansible-lint'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: tflint
        name: TFLint
        description: Check for Terraform errors and best practices.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; tflint "$@"' --
        language: system
        files: \.tf$
        pass_filenames: false
        args: ["--recursive"]
        stages: [pre-commit, pre-push]

      - id: tflint-full-repo
        name: TFLint (all stacks, pre-push only)
        description: Re-checks every Terraform stack before push, not just changed files.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; for d in terraform/stacks/network terraform/stacks/proxmox; do (cd "$d" && tflint --recursive); done'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: terraform-fmt-check-full-repo
        name: Terraform fmt -check (all stacks, pre-push only)
        description: Re-checks formatting for every Terraform stack before push.
        entry: bash -c 'for d in terraform/stacks/network terraform/stacks/proxmox; do (cd "$d" && terraform fmt -check); done'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: yamllint
        name: YAML Lint
        description: Check YAML files for syntax and style.
        entry: yamllint
        language: system
        types: [yaml]
        args: [-d, "{extends: relaxed, rules: {line-length: disable}}"]

      - id: gitleaks-staged
        name: Gitleaks (staged changes)
        description: >-
          Blocks committing NEW secrets. Uses .gitleaks-baseline.json so the
          12 pre-existing leaks found on 2026-06-21 (tracked for cleanup in
          docs/secrets-inventory.md) don't block every commit until they're
          fully remediated - only genuinely new secrets fail this.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; gitleaks protect --staged --baseline-path .gitleaks-baseline.json --no-banner -v'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks-full-repo
        name: Gitleaks (full history, pre-push only)
        description: Re-scans the entire repo and history before any push, against the same baseline.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; gitleaks detect --baseline-path .gitleaks-baseline.json --no-banner -v'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
