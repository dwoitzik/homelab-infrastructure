repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--multi]
      - id: check-added-large-files
        exclude: ^(ansible/roles/monitoring_core/templates/snmp\.yml\.j2|terraform/providers/.*\.zip|ci/kubeconform-schemas/.*)$

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        description: Automatically formats Terraform files to standard style.
        entry: terraform fmt
        language: system
        files: \.tf$
        pass_filenames: true

      - id: ansible-lint
        name: Ansible Lint
        description: Enforces Ansible best practices and fully qualified collection names.
        # Absolute path: git hooks run without sourcing .bashrc, so PATH
        # additions (e.g. pipx's ~/.local/bin) aren't picked up otherwise -
        # this caused a stale apt-installed ansible-lint (6.17.2) to win
        # over the pinned 26.4.0 and silently pass things CI then failed on.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; cd ansible && ansible-lint'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: tflint
        name: TFLint
        description: Check for Terraform errors and best practices.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; tflint "$@"' --
        language: system
        files: \.tf$
        pass_filenames: false
        args: ["--recursive"]
        stages: [pre-commit, pre-push]

      - id: host-memory-overcommit-guard
        name: Host memory overcommit guard (REL-035)
        description: >-
          Two-tier guard (REL-035b). Hard gate: VM memory reservations + ZFS
          ARC + host reserve vs a 44 GB ceiling -- fails the build, a
          regression guard against the REL-016 ZFS-IO host-freeze. Soft
          check: LXC CT `dedicated` limits vs physical RAM -- warns only,
          never fails (CT limits are soft cgroup ceilings, not host
          reservations). See scripts/check-host-memory-overcommit.py for the
          full rationale. Runs whenever the Proxmox VM/LXC definitions
          change.
        entry: python3 scripts/check-host-memory-overcommit.py
        language: system
        files: ^terraform/stacks/proxmox/(lxc|vm)\.tf$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: host-memory-overcommit-guard-full-repo
        name: Host memory overcommit guard (REL-035, pre-push re-check)
        description: >-
          Re-checks the two-tier hard gate/soft check (REL-035b) before every
          push, not just on changed files.
        entry: python3 scripts/check-host-memory-overcommit.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: tflint-full-repo
        name: TFLint (all stacks, pre-push only)
        description: Re-checks every Terraform stack before push, not just changed files.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; for d in terraform/stacks/network terraform/stacks/proxmox; do (cd "$d" && tflint --recursive); done'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: terraform-fmt-check-full-repo
        name: Terraform fmt -check (all stacks, pre-push only)
        description: Re-checks formatting for every Terraform stack before push.
        entry: bash -c 'for d in terraform/stacks/network terraform/stacks/proxmox; do (cd "$d" && terraform fmt -check); done'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: yamllint
        name: YAML Lint
        description: Check YAML files for syntax and style.
        entry: yamllint
        language: system
        types: [yaml]
        args: [-d, "{extends: relaxed, rules: {line-length: disable}}"]

      - id: markdownlint
        name: Markdown Lint
        description: >-
          Lint Markdown files for style and structure. Config in
          .markdownlint-cli2.yaml (MD013/line-length, MD024/duplicate-heading,
          MD041/first-line-heading, MD060/table-column-style disabled as
          style choices; vendor dirs excluded).
        # Use the nvm-managed binary directly — PATH isn't sourced in hooks.
        entry: bash -c 'export PATH="$HOME/.nvm/versions/node/$(node --version 2>/dev/null | tr -d v)/bin:$HOME/.nvm/versions/node/v22.22.1/bin:$PATH"; markdownlint-cli2 "$@"' --
        language: system
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit, pre-push]

      - id: kubeconform
        name: Kubeconform
        description: >-
          Validate Kubernetes manifests against the 1.31 API schema.
          Schemas are read entirely from the vendored ci/kubeconform-schemas/
          directory via -schema-location -- zero network calls, so this can't
          flake on raw.githubusercontent.com's rate limit. See
          ci/kubeconform-schemas/README.md to refresh after adding a new kind.
          CRD types with no upstream schema (Application, IngressRoute, etc.)
          are skipped with -ignore-missing-schemas, same as always. Non-manifest
          YAML files (e.g. Authelia user DB) are excluded.
        entry: bash -c '
          export PATH="$HOME/.local/bin:$PATH";
          find kubernetes/ -name "*.yaml" -o -name "*.yml" |
            grep -v users_database |
            xargs kubeconform
              -kubernetes-version 1.31.0
              -schema-location "ci/kubeconform-schemas/{{ .NormalizedKubernetesVersion }}-standalone/{{ .ResourceKind }}{{ .KindSuffix }}.json"
              -ignore-missing-schemas
              -summary
              -exit-on-error'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: gitleaks-staged
        name: Gitleaks (staged changes)
        description: >-
          Blocks committing NEW secrets. Git history was fully purged of known
          leaks on 2026-06-22 (git-filter-repo); .gitleaks-baseline.json now
          only allowlists the ROADMAP.md documentation false positive. Run
          `gitleaks detect --no-git --source=. --baseline-path
          .gitleaks-baseline.json` periodically against the live tree too -
          this hook only catches what gets committed going forward, not gaps
          in what's already merged.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; gitleaks protect --staged --baseline-path .gitleaks-baseline.json --no-banner -v'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks-full-repo
        name: Gitleaks (full history, pre-push only)
        description: Re-scans the entire repo and history before any push, against the same baseline.
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; gitleaks detect --baseline-path .gitleaks-baseline.json --no-banner -v'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
