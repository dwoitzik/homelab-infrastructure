# Runs on ct-dmz-proxy-01 (dmz_proxies), /opt/npm/docker-compose.yml.
# Reconciled into git 2026-07-06 (DOC-005) -- this replaces docker/npmplus/,
# which described the zoeyvid/npmplus fork (+ built-in GeoIP/goaccess). The
# host actually runs plain jc21/nginx-proxy-manager with a separate CrowdSec
# container reading its logs; the committed npmplus compose file never
# matched what's actually deployed. Not Ansible-managed -- deployed/updated
# by hand via SSH on the LXC.
---
services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    network_mode: "bridge"
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
      - '25565:25565'
      - '25566:25566'
    volumes:
      - /opt/npm/data:/data
      - /opt/npm/letsencrypt:/etc/letsencrypt
      # Mount NPM logs read-only for CrowdSec analysis
      - /opt/npm/data/logs:/var/log/npm:ro
    environment:
      - DISABLE_IPV6=true

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - GID=991
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve
      - LAPI_LISTEN_ADDR=0.0.0.0
      - TRUSTED_PROXIES=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    volumes:
      - /opt/npm/crowdsec/data:/var/lib/crowdsec/data
      - /opt/npm/crowdsec/config:/etc/crowdsec
      # Read-only access to NPM logs
      - /opt/npm/data/logs:/var/log/npm:ro
      - /opt/npm/crowdsec/config/local_api_credentials.yaml:/etc/crowdsec/local_api_credentials.yaml
    ports:
      - "127.0.0.1:8080:8080"
