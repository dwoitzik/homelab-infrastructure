# Runs on both DMZ LXCs (ct-dmz-proxy-01, ct-dmz-games-01), /opt/docker/promtail/.
# Added to git 2026-07-06 (DOC-005) -- ships syslog/auth/docker container logs
# to the same Loki instance (loki.woitzik.dev) used by the in-cluster stack.
# promtail.yml's `host:` label differs per LXC -- see the two variants below.
services:
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail.yml
