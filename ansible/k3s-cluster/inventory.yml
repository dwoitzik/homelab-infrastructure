---
k3s_cluster:
  children:
    server:
      hosts:
        10.0.20.11:
    agent:
      hosts:
        10.0.20.12:
        10.0.20.13:
  vars:
    ansible_user: dw
    k3s_version: v1.31.12+k3s1
    api_endpoint: "10.0.20.11"
    # REL-012: etcd heartbeat/election timeouts increased 5x (100ms->500ms,
    # 1000ms->5000ms) to tolerate brief NVMe I/O stalls without triggering
    # leader re-election. Default values assume sub-100ms disk latency; on
    # a shared single-NVMe host under concurrent load (Velero backups, Immich
    # ML indexing, Ollama inference) latencies spike to 2-14s, causing
    # "apply request took too long" -> raft timeout -> k3s restart (REL-012).
    # 5s election timeout absorbs most burst events while keeping failover
    # detection fast enough for any eventual real hardware failure.
    extra_server_args: >-
      --disable servicelb
      --disable traefik
      --etcd-arg=heartbeat-interval=500
      --etcd-arg=election-timeout=5000
