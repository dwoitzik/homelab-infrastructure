---
k3s_cluster:
  children:
    server:
      hosts:
        10.0.20.11:
    agent:
      hosts:
        10.0.20.12:
        10.0.20.13:
  vars:
    ansible_user: dw
    k3s_version: v1.31.12+k3s1
    api_endpoint: "10.0.20.11"
    # REL-012 / REL-012b: etcd tuned to survive NVMe I/O stalls on a shared
    # single-disk host. Two complementary fixes:
    #
    # 1. heartbeat/election timeouts 5x (100ms->500ms, 1000ms->5000ms): gives
    #    etcd headroom to absorb burst I/O stalls without triggering leader
    #    re-election. Stalls up to ~5s are absorbed; real failure detection
    #    still fast enough for a homelab.
    #
    # 2. wal-dir on tmpfs (/run/k3s-etcd-wal): etcd's write-ahead log lives
    #    entirely in RAM. WAL writes are the hot path for every k8s API call.
    #    With wal-dir on disk, any workload that saturates the NVMe (SABnzbd
    #    unrar, Immich ML, Jellyfin transcode, Velero backup) stalls WAL writes
    #    -> etcd read-index timeout -> k3s API server crash. On tmpfs, WAL
    #    writes are nanosecond-fast regardless of disk pressure from any source,
    #    including new VMs/LXCs added in future.
    #    Trade-off: on host power loss, WAL since last etcd snap is lost (etcd
    #    restores from on-disk snap; k8s state loss is typically <5 min).
    #    For a homelab, acceptable. etcd snap dir stays on disk.
    extra_server_args: >-
      --disable servicelb
      --disable traefik
      --etcd-arg=heartbeat-interval=500
      --etcd-arg=election-timeout=5000
      --etcd-arg=wal-dir=/run/k3s-etcd-wal
