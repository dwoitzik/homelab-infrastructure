---
# Creates the vault-unseal-keys Kubernetes Secret from Ansible Vault.
# Run this once after cluster bootstrap or when rotating unseal keys:
#   ansible-playbook ansible/vault-unseal-secret.yml
- name: Create Vault unseal Secret in Kubernetes
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all/vault.yml
  tasks:
    - name: Apply vault-unseal-keys Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: vault-unseal-keys
            namespace: vault
          type: Opaque
          stringData:
            key1: "{{ vault_unseal_key_1 }}"
            key2: "{{ vault_unseal_key_2 }}"
