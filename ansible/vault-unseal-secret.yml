---
# Creates the vault-unseal-keys Kubernetes Secret from Ansible Vault.
# Run this once after cluster bootstrap or when rotating unseal keys:
#   ansible-playbook ansible/vault-unseal-secret.yml
- name: Create Vault unseal Secret in Kubernetes
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all/vault.yml
  tasks:
    - name: Apply vault-unseal-keys Secret via kubectl
      ansible.builtin.command:
        cmd: kubectl create secret generic vault-unseal-keys -n vault
          --from-literal=key1={{ vault_unseal_key_1 }}
          --from-literal=key2={{ vault_unseal_key_2 }}
          --dry-run=client -o yaml
      register: vault_unseal_secret_manifest
      changed_when: false
      no_log: true

    - name: Apply the generated manifest
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ vault_unseal_secret_manifest.stdout }}"
      changed_when: true
      no_log: true
