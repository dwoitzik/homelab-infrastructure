---
ansible_user: dw
ansible_ssh_private_key_file: ~/.ssh/homelab-infrastructure

npm_network_mode: "host"
npm_enable_crowdsec: false

# DNS/VIP pair: a Docker upgrade restarts AdGuard and Unbound, so Docker
# updates on these hosts go through a planned role run, not unattended.
common_uu_package_blacklist:
  - docker-ce
  - docker-ce-cli
  - docker-ce-rootless-extras
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
