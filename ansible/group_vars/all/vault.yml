# Entry 88 and others) all trace back to that one full-file decrypt step.
#
# With per-key encryption: a git conflict on one key is resolved by taking
# one side's block wholesale (never by decrypting to compare), and rotating
# or adding a single secret only ever touches that one key via
# `ansible-vault encrypt_string --stdin-name <key>` (value piped over stdin,
# never a CLI arg) -- no reason to ever run a full-file view/decrypt again.
#
# To rotate a value:
#   printf '%s' 'new-value' | ansible-vault encrypt_string \
#     --vault-password-file ansible/.ansible_vault_pass --stdin-name vault_foo
# then paste the output block in place of the existing vault_foo entry.

