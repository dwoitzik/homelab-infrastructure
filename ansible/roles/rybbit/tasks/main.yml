---
- name: Ensure rybbit directory exists
  ansible.builtin.file:
    path: /opt/rybbit
    state: directory
    mode: '0755'

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/rybbit/Caddyfile
    mode: '0644'
  when: rybbit_postgres_password is defined

- name: Deploy docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/rybbit/docker-compose.yml
    mode: '0644'
  when: rybbit_postgres_password is defined

- name: Ensure rybbit stack is running
  community.docker.docker_compose_v2:
    project_src: /opt/rybbit
    state: present
  when: rybbit_postgres_password is defined

- name: Deploy the ClickHouse reporting views
  ansible.builtin.include_tasks:
    file: clickhouse-views.yml
    apply:
      tags: [rybbit_views]
  when: rybbit_postgres_password is defined
  tags: [rybbit_views]

- name: Deploy Rybbit healthcheck script
  ansible.builtin.template:
    src: rybbit-healthcheck.sh.j2
    dest: /usr/local/bin/rybbit-healthcheck.sh
    owner: root
    group: root
    mode: '0700'

- name: Schedule Rybbit healthcheck via cron (every 5 minutes)
  ansible.builtin.cron:
    name: rybbit-healthcheck
    minute: "*/5"
    job: /usr/local/bin/rybbit-healthcheck.sh
