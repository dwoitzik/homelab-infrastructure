---
- name: Ensure base Nginx Proxy Manager directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/npm
    - /opt/npm/data
    - /opt/npm/letsencrypt

- name: Ensure CrowdSec directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/npm/crowdsec
    - /opt/npm/crowdsec/config
    - /opt/npm/crowdsec/data
  when: npm_enable_crowdsec | default(false) | bool

- name: Get docker group info
  ansible.builtin.getent:
    key: docker
    database: group
  register: nginx_proxy_manager_docker_group_info

- name: Set nginx_proxy_manager_docker_gid fact
  ansible.builtin.set_fact:
    nginx_proxy_manager_docker_gid: "{{ nginx_proxy_manager_docker_group_info.ansible_facts.getent_group.docker[1] }}"

# Collections were enabled but acquis.yaml had no real source -- detecting
# nothing. journald-only host + no journalctl in the image, so rsyslog
# gives it a flat auth.log to read instead.
- name: Install rsyslog (host ships journald only, no flat auth.log)
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: true
  when: npm_enable_crowdsec | default(false) | bool

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started
  when: npm_enable_crowdsec | default(false) | bool

# rsyslog's modern default (RSYSLOG_FileFormat, ISO8601 timestamps) doesn't
# match CrowdSec's grok patterns -- every line went unparsed until this.
- name: Force traditional syslog timestamp format (CrowdSec's grok expects it)
  ansible.builtin.template:
    src: rsyslog-traditional-format.conf.j2
    dest: /etc/rsyslog.d/49-crowdsec-traditional-format.conf
    mode: '0644'
  when: npm_enable_crowdsec | default(false) | bool
  notify: Restart rsyslog

- name: Deploy CrowdSec acquisition config (log sources it actually reads)
  ansible.builtin.template:
    src: acquis.yaml.j2
    dest: /opt/npm/crowdsec/config/acquis.yaml
    mode: '0644'
  when: npm_enable_crowdsec | default(false) | bool
  # the new bind-mount below (docker-compose.yml.j2) already forces a
  # container recreate on drift -- this only covers acquis.yaml content
  # changing on its own with the compose file otherwise unchanged.
  notify: Recreate crowdsec container

- name: Disable SSH password authentication (key-only)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: Restart sshd

- name: Deploy Nginx Proxy Manager docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/npm/docker-compose.yml
    mode: '0644'

- name: Ensure Nginx Proxy Manager stack is running
  community.docker.docker_compose_v2:
    project_src: /opt/npm
    state: present

# Defense in depth: only the WAN dst-nat'd port (443) should ever reach this
# box from outside. Docker publishes 80 and 81 (plain HTTP, NPM admin UI) on
# 0.0.0.0 regardless -- correct behavior depends entirely on upstream NAT
# (MikroTik, FritzBox) never forwarding those ports. This restricts them to
# RFC1918 sources at the DOCKER-USER chain (evaluated before Docker's own
# ACCEPT rules) so a FritzBox misconfig/UPnP surprise can't expose the admin
# UI, independent of what the router side does.
- name: Allow internal sources to NPM admin UI (81) and plain HTTP (80)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    source: 10.0.0.0/8
    destination_ports: "80,81"
    jump: ACCEPT
    action: insert
    rule_num: 1
    comment: "NPM admin/HTTP -- internal only, allow"

- name: Drop non-internal sources to NPM admin UI (81) and plain HTTP (80)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_ports: "80,81"
    jump: DROP
    action: insert
    rule_num: 2
    comment: "NPM admin/HTTP -- drop non-internal (defense in depth vs. WAN NAT misconfig)"

# The community blocklist (CAPI decisions) already syncs continuously on its
# own -- confirmed live, real IPs in the nftables set. This is a different
# thing: the local scenario/parser/collection ruleset (what counts as an
# attack in the first place) only updates when `cscli hub upgrade` runs --
# nothing did that automatically before this task existed.
- name: Schedule weekly CrowdSec hub upgrade (parsers/scenarios/collections)
  ansible.builtin.cron:
    name: crowdsec-hub-upgrade
    weekday: "0"
    hour: "4"
    minute: "0"
    job: >-
      docker exec crowdsec cscli hub upgrade >> /var/log/crowdsec-hub-upgrade.log 2>&1 &&
      docker restart crowdsec >> /var/log/crowdsec-hub-upgrade.log 2>&1
  when: npm_enable_crowdsec | default(false) | bool

# Closes the exact gap that let CrowdSec's log source silently go stale
# this session -- "enabled" collections with no real ingestion, nothing
# ever noticed.
- name: Create node_exporter textfile-collector directory (bind-mounted into the container)
  ansible.builtin.file:
    path: /opt/npm/node-exporter-textfile
    state: directory
    mode: '0755'
  when: npm_enable_crowdsec | default(false) | bool

- name: Deploy CrowdSec healthcheck script
  ansible.builtin.template:
    src: crowdsec-healthcheck.sh.j2
    dest: /usr/local/bin/crowdsec-healthcheck.sh
    owner: root
    group: root
    mode: '0700'
  when: npm_enable_crowdsec | default(false) | bool

- name: Schedule CrowdSec healthcheck via cron (every 5 minutes)
  ansible.builtin.cron:
    name: crowdsec-healthcheck
    minute: "*/5"
    job: /usr/local/bin/crowdsec-healthcheck.sh
  when: npm_enable_crowdsec | default(false) | bool
