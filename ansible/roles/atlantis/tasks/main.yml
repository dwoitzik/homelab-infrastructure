---
# The runner's plan/apply jobs read the env file as the runner user, so the
# directory and file are group-owned by the runner's group.
- name: Ensure the runner group exists
  ansible.builtin.group:
    name: "{{ atlantis_runner_group }}"
    system: true

- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: '0750'
  loop:
    - { path: "{{ atlantis_base_dir }}", group: "{{ atlantis_runner_group }}" }
    - { path: "{{ atlantis_base_dir }}/build", group: root }

# ADR-021 replaced the Atlantis server with comment-triggered GitHub Actions
# workflows; only its image survives, as the runner's terraform toolbox.
- name: Check for the retired Atlantis server stack
  ansible.builtin.stat:
    path: "{{ atlantis_base_dir }}/docker-compose.yml"
  register: atlantis_server_compose

- name: Stop and remove the retired Atlantis server
  community.docker.docker_compose_v2:
    project_src: "{{ atlantis_base_dir }}"
    state: absent
  when: atlantis_server_compose.stat.exists

- name: Remove the retired Atlantis server's config and working data
  ansible.builtin.file:
    path: "{{ atlantis_base_dir }}/{{ item }}"
    state: absent
  loop:
    - docker-compose.yml
    - repos.yaml
    - data

# SEC-007: custom image adds Proxmox's self-signed cluster CA to the trust
# store so terraform/stacks/proxmox can run with insecure = false instead of
# skipping TLS verification. Rebuilt every run (force_source) so a bump to
# atlantis_image (Renovate) or a CA rotation is always picked up.
- name: Copy Dockerfile and Proxmox CA cert for custom Atlantis image
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ atlantis_base_dir }}/build/{{ item }}"
    mode: '0644'
  loop:
    - Dockerfile
    - pve-root-ca.crt

- name: Build custom Atlantis image with trusted Proxmox CA
  community.docker.docker_image:
    name: atlantis-custom
    tag: "{{ atlantis_image_tag }}"
    source: build
    force_source: true
    build:
      path: "{{ atlantis_base_dir }}/build"
      args:
        BASE_IMAGE: "{{ atlantis_image }}"
      pull: true

# ADR-021: the GitHub Actions runner's terraform steps need the same
# provider credentials the Atlantis container already gets via its own
# docker-compose environment block -- rather than duplicating these into
# GitHub Secrets (a worse posture: two credential stores to keep in sync,
# one of them outside this repo's normal Vault->Ansible flow), write them
# to a host-local env file the runner's `docker run --env-file` can
# reference directly. Root-only readable; never leaves this host.
- name: Deploy terraform-runner env file (same credentials as Atlantis's own container)
  ansible.builtin.template:
    src: terraform-runner.env.j2
    dest: "{{ atlantis_base_dir }}/terraform-runner.env"
    owner: root
    group: "{{ atlantis_runner_group }}"
    mode: '0640'
