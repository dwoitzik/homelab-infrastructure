---
# Atlantis image runs as uid=100(atlantis) gid=1000(atlantis), not root --
# bind-mounted files/dirs must be readable (and /data writable) by that uid,
# confirmed live 2026-07-04 (container crash-looped on "permission denied"
# reading repos.yaml until ownership was set here).
- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "100"
    group: "1000"
    mode: '0750'
  loop:
    - "{{ atlantis_base_dir }}"
    - "{{ atlantis_base_dir }}/data"
    - "{{ atlantis_base_dir }}/build"

- name: Deploy Atlantis repo config
  ansible.builtin.template:
    src: repos.yaml.j2
    dest: "{{ atlantis_base_dir }}/repos.yaml"
    owner: "100"
    group: "1000"
    mode: '0640'

# SEC-007: custom image adds Proxmox's self-signed cluster CA to the trust
# store so terraform/stacks/proxmox can run with insecure = false instead of
# skipping TLS verification. Rebuilt every run (force_source) so a bump to
# atlantis_image (Renovate) or a CA rotation is always picked up.
- name: Copy Dockerfile and Proxmox CA cert for custom Atlantis image
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ atlantis_base_dir }}/build/{{ item }}"
    mode: '0644'
  loop:
    - Dockerfile
    - pve-root-ca.crt

- name: Build custom Atlantis image with trusted Proxmox CA
  community.docker.docker_image:
    name: atlantis-custom
    tag: "{{ atlantis_image.split(':')[-1] }}"
    source: build
    force_source: true
    build:
      path: "{{ atlantis_base_dir }}/build"
      args:
        BASE_IMAGE: "{{ atlantis_image }}"
      pull: true

- name: Deploy Atlantis docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ atlantis_base_dir }}/docker-compose.yml"
    mode: '0640'

- name: Ensure Atlantis stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ atlantis_base_dir }}"
    state: present
