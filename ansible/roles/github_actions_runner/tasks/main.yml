---
# ADR-021: self-hosted GitHub Actions runner. Everything in this file up to
# and including "Extract runner archive" / "Install runner dependencies" is
# safe to run with zero token -- pure software staging. Registration and
# the systemd service are explicitly gated on
# github_actions_runner_registration_token being set, since that value is
# short-lived, single-use, and only obtainable via the GitHub web UI.

- name: Create dedicated runner user
  ansible.builtin.user:
    name: "{{ github_actions_runner_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ github_actions_runner_dir }}"
    create_home: false
    groups: docker
    append: true

- name: Create runner install directory
  ansible.builtin.file:
    path: "{{ github_actions_runner_dir }}"
    state: directory
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_user }}"
    mode: '0755'

- name: Check if runner is already extracted
  ansible.builtin.stat:
    path: "{{ github_actions_runner_dir }}/run.sh"
  register: github_actions_runner_installed

- name: Download runner archive
  ansible.builtin.get_url:
    url: "{{ github_actions_runner_checksum_url }}"
    dest: "/tmp/actions-runner-{{ github_actions_runner_version }}.tar.gz"
    mode: '0644'
  when: not github_actions_runner_installed.stat.exists

- name: Extract runner archive
  ansible.builtin.unarchive:
    src: "/tmp/actions-runner-{{ github_actions_runner_version }}.tar.gz"
    dest: "{{ github_actions_runner_dir }}"
    remote_src: true
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_user }}"
  when: not github_actions_runner_installed.stat.exists

- name: Install runner OS dependencies
  ansible.builtin.command: ./bin/installdependencies.sh
  args:
    chdir: "{{ github_actions_runner_dir }}"
  when: not github_actions_runner_installed.stat.exists
  changed_when: true

# --- Everything below here needs a real, unexpired registration token. ---

- name: Check current registration state
  ansible.builtin.stat:
    path: "{{ github_actions_runner_dir }}/.runner"
  register: github_actions_runner_configured
  when: github_actions_runner_registration_token != ""

- name: Register runner with GitHub
  ansible.builtin.command: >
    ./config.sh --url {{ github_actions_runner_repo_url }}
    --token {{ github_actions_runner_registration_token }}
    --name {{ github_actions_runner_name }}
    --labels {{ github_actions_runner_labels }}
    --unattended --replace
  args:
    chdir: "{{ github_actions_runner_dir }}"
  become: true
  become_user: "{{ github_actions_runner_user }}"
  when:
    - github_actions_runner_registration_token != ""
    - not github_actions_runner_configured.stat.exists
  no_log: true # the command line itself contains the token
  changed_when: true

- name: Check if the runner systemd service is already installed
  ansible.builtin.stat:
    # svc.sh names the unit from the repo URL + runner name, not a fixed
    # name -- `creates:` on the command module below doesn't support glob
    # patterns (it checks for a literal path), so this task does the real
    # existence check instead of a creates: glob that would never match.
    path: "/etc/systemd/system/actions.runner.{{ github_actions_runner_repo_url | regex_replace('^https://github.com/', '') | regex_replace('/', '-') }}.{{ github_actions_runner_name }}.service"
  register: github_actions_runner_service_file
  when: github_actions_runner_registration_token != ""

- name: Install the runner as a systemd service
  ansible.builtin.command: ./svc.sh install {{ github_actions_runner_user }}
  args:
    chdir: "{{ github_actions_runner_dir }}"
  when:
    - github_actions_runner_registration_token != ""
    - not github_actions_runner_service_file.stat.exists
  changed_when: true

- name: Start and enable the runner service
  ansible.builtin.command: ./svc.sh start
  args:
    chdir: "{{ github_actions_runner_dir }}"
  when: github_actions_runner_registration_token != ""
  changed_when: true

# ADR-027: declared-vs-live drift guard. The scheduled drift-check.yml
# workflow needs cluster read access from this runner -- credential lives
# on this host's disk rather than as a GitHub Actions secret because the
# PAT this mission has available lacks the `secrets:write` permission
# needed to set repo secrets via API, and a self-hosted runner (unlike a
# GitHub-hosted one) has persistent local storage anyway, so there's no
# real downside to keeping it here instead.
- name: Deploy the k3s server CA cert for the drift-check kubeconfig
  ansible.builtin.copy:
    src: k3s-server-ca.crt
    dest: "{{ github_actions_runner_dir }}/k3s-server-ca.crt"
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_user }}"
    mode: "0644"

- name: Deploy the drift-checker kubeconfig (read-only ServiceAccount token)
  ansible.builtin.template:
    src: drift-check-kubeconfig.yaml.j2
    dest: "{{ github_actions_runner_dir }}/drift-check-kubeconfig.yaml"
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_user }}"
    mode: "0600"

# The ntfy.sh topic name is this operator's real, in-use notification
# channel -- its obscurity (a random-looking suffix, not a guessable
# name) is the entire protection, since ntfy topics are unauthenticated
# pub/sub by default. This repo is a public portfolio repo, so it can't
# go in the workflow YAML itself; deployed to disk the same way as the
# kubeconfig above instead.
- name: Deploy the drift-check ntfy.sh topic name
  ansible.builtin.copy:
    content: "{{ vault_drift_check_ntfy_topic }}"
    dest: "{{ github_actions_runner_dir }}/drift-check-ntfy-topic.txt"
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_user }}"
    mode: "0600"

- name: Install python3-yaml for the drift-check script
  ansible.builtin.apt:
    name: python3-yaml
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check current kubectl version, if installed
  ansible.builtin.command: kubectl version --client -o yaml
  register: github_actions_runner_kubectl_check
  changed_when: false
  failed_when: false

- name: Install kubectl for the drift-check script (read-only use only)
  when: >
    github_actions_runner_kubectl_check.rc != 0 or
    github_actions_runner_kubectl_version not in github_actions_runner_kubectl_check.stdout
  block:
    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ github_actions_runner_kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
        owner: root
        group: root
