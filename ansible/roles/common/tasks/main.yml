---
- name: Ensure the correct hostname is set
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# cloud-init (VMs, Pis) and Proxmox (LXCs) rewrite the 127.0.1.1 line on every
# boot, so the line below drifted back after each reboot. Ansible owns it instead.
- name: Check whether cloud-init is installed
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: common_cloud_cfg_d

- name: Stop cloud-init from rewriting /etc/hosts
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-ansible-etc-hosts.cfg
    content: "manage_etc_hosts: false\n"
    mode: "0644"
  when: common_cloud_cfg_d.stat.exists

- name: Stop Proxmox from rewriting /etc/hosts in the container
  ansible.builtin.copy:
    dest: /etc/.pve-ignore.hosts
    content: ""
    mode: "0644"
    force: false
  when: ansible_virtualization_type == "lxc"

# Proxmox's cloud-init user-data sets manage_etc_hosts: true, which overrides
# the drop-in above, so cloud-init still renders /etc/hosts from this template
# on every boot. Make the template produce the same 127.0.1.1 line.
- name: Check whether cloud-init renders /etc/hosts from a template
  ansible.builtin.stat:
    path: /etc/cloud/templates/hosts.debian.tmpl
  register: common_cloud_hosts_tmpl

- name: Render only the short hostname on the 127.0.1.1 line at boot
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: '^127\.0\.1\.1 '
    line: !unsafe "127.0.1.1 {{ hostname }}"
  when: common_cloud_hosts_tmpl.stat.exists

- name: Update /etc/hosts with the new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  # A cache refresh changes no configuration; reporting it would make every
  # run look like drift once the cache is an hour old.
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone to Europe/Berlin
  community.general.timezone:
    name: Europe/Berlin

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Ensure unattended-upgrades is enabled and running
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: '0644'
  # The periodic settings above are booleans, not intervals. AutocleanInterval
  # is in days and is the only one that reads as a number.

- name: Let unattended-upgrades cover the third-party repositories
  ansible.builtin.blockinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    marker: "# {mark} ANSIBLE MANAGED ORIGINS"
    block: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename},label=Debian";
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          "origin=Debian,codename=${distro_codename}-updates,label=Debian";
          "origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation,c=main";
          "origin=Docker,label=Docker CE,c=stable";
          "origin=Tailscale,codename=bookworm,label=Tailscale,c=main";
      };
  # The stock pattern only lists Debian, so packages from the other
  # repositories never became candidates. It is replaced rather than
  # extended: one stock entry names a nonexistent label.


- name: Keep listed packages out of unattended upgrades
  ansible.builtin.blockinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    marker: "# {mark} ANSIBLE MANAGED PACKAGE BLACKLIST"
    block: |
      Unattended-Upgrade::Package-Blacklist {
      {% for pkg in common_uu_package_blacklist %}
          "{{ pkg }}";
      {% endfor %}
      };
    state: "{{ 'present' if common_uu_package_blacklist | length > 0 else 'absent' }}"

- name: Ensure the apt-daily-upgrade timer drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    mode: '0755'
  when: common_apt_upgrade_time is defined

# Hosts that back each other up (the DNS pair) upgrade at different fixed
# times, so a package restart can never take both down at once.
- name: Pin the unattended-upgrade time
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/time.conf
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ common_apt_upgrade_time }}
      RandomizedDelaySec=0
    mode: '0644'
  when: common_apt_upgrade_time is defined
  notify: Reload systemd for apt timer

- name: Set inotify limits for k3s/container workloads
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    reload: true
    state: present
  loop:
    - name: fs.inotify.max_user_instances
      value: "512"
    - name: fs.inotify.max_user_watches
      value: "1048576"
  # LXC guests inherit these from the Proxmox host and cannot set them; the
  # host's values are higher anyway. A privileged guest would lower the host's.
  when: not (ansible_virtualization_type == 'lxc' and ansible_virtualization_role == 'guest')
