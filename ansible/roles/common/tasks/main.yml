---
- name: Ensure the correct hostname is set
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Update /etc/hosts with the new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  # A cache refresh changes no configuration; reporting it would make every
  # run look like drift once the cache is an hour old.
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone to Europe/Berlin
  community.general.timezone:
    name: Europe/Berlin

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Ensure unattended-upgrades is enabled and running
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: '0644'
  # The periodic settings above are booleans, not intervals. AutocleanInterval
  # is in days and is the only one that reads as a number.

- name: Let unattended-upgrades cover the third-party repositories
  ansible.builtin.blockinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    marker: "# {mark} ANSIBLE MANAGED ORIGINS"
    block: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename},label=Debian";
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          "origin=Debian,codename=${distro_codename}-updates,label=Debian";
          "origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation,c=main";
          "origin=Docker,label=Docker CE,c=stable";
          "origin=Tailscale,codename=bookworm,label=Tailscale,c=main";
      };
  # The stock pattern only lists Debian, so packages from the other
  # repositories never became candidates. It is replaced rather than
  # extended: one stock entry names a nonexistent label.


- name: Set inotify limits for k3s/container workloads
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    reload: true
    state: present
  loop:
    - name: fs.inotify.max_user_instances
      value: "512"
    - name: fs.inotify.max_user_watches
      value: "1048576"
  # LXC guests inherit these from the Proxmox host and cannot set them; the
  # host's values are higher anyway. A privileged guest would lower the host's.
  when: not (ansible_virtualization_type == 'lxc' and ansible_virtualization_role == 'guest')
