---
- name: Ensure Minecraft directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/minecraft
    - /opt/minecraft/data
    - /opt/minecraft/data-cobblemon

- name: Deploy Minecraft docker-compose.yml
  ansible.builtin.copy:
    dest: /opt/minecraft/docker-compose.yml
    content: |
      services:
        minecraft-2:
          image: itzg/minecraft-server
          container_name: mc-server-2
          environment:
            EULA: "TRUE"
            TYPE: "PAPER"
            INIT_MEMORY: "2G"
            MAX_MEMORY: "4G"
            VERSION: "LATEST"
            TZ: "Europe/Berlin"
          ports:
            - "25565:25565"
          volumes:
            - ./data-2:/data
          restart: unless-stopped

        cobblemon:
          # Cobblemon 1.7.x requires Java 21 specifically - the "latest" tag ships Java 25
          image: itzg/minecraft-server:java21
          container_name: mc-server-cobblemon
          environment:
            EULA: "TRUE"
            TYPE: "FABRIC"
            VERSION: "1.21.1"
            MODRINTH_PROJECTS: "cobblemon,fabric-api"
            INIT_MEMORY: "2G"
            MAX_MEMORY: "4G"
            TZ: "Europe/Berlin"
          ports:
            - "25566:25565"
          volumes:
            - ./data-cobblemon:/data
          restart: unless-stopped
    mode: '0644'

- name: Start Minecraft server containers
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft
    state: present
    remove_orphans: true
