---
- name: Ensure Minecraft directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/minecraft
    - /opt/minecraft/data-4

- name: Deploy Minecraft docker-compose.yml
  ansible.builtin.copy:
    dest: /opt/minecraft/docker-compose.yml
    content: |
      services:
        minecraft-4:
          image: itzg/minecraft-server:latest@sha256:f4375fbbc3e5f797c394856739ea664442d2b5c647470d2c9c7735a96406f8d3
          container_name: mc-server-4
          environment:
            EULA: "TRUE"
            TYPE: "PAPER"
            INIT_MEMORY: "2G"
            MAX_MEMORY: "4G"
            VERSION: "LATEST"
            TZ: "Europe/Berlin"
          ports:
            - "25565:25565"
          volumes:
            - ./data-4:/data
          restart: unless-stopped
    mode: '0644'

- name: Start Minecraft server containers
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft
    state: present
    remove_orphans: true
