---
- name: Ensure Minecraft directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/minecraft
    - /opt/minecraft/data-4

- name: Deploy Minecraft docker-compose.yml
  ansible.builtin.copy:
    dest: /opt/minecraft/docker-compose.yml
    content: |
      services:
        minecraft-new:
          image: itzg/minecraft-server:latest@sha256:2fe790e54fc0138ab9f011b38473c11161984b911d32ebfd6877f7411f736937
          container_name: mc-server-4
          environment:
            EULA: "TRUE"
            TYPE: "PAPER"
            PAPER_CHANNEL: "default"
            INIT_MEMORY: "2G"
            MAX_MEMORY: "4G"
            VERSION: "LATEST"
            TZ: "Europe/Berlin"
          ports:
            - "25565:25565"
          volumes:
            - ./data-4:/data
          restart: unless-stopped
    mode: '0644'

- name: Start Minecraft server containers
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft
    state: present
    remove_orphans: true
