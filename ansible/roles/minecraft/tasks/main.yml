---
- name: Ensure Minecraft directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/minecraft
    - /opt/minecraft/data

- name: Deploy Minecraft docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/minecraft/docker-compose.yml
    mode: '0644'

- name: Start Minecraft server container
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft
    state: present
    remove_orphans: true
