---
nfs_server_data_dir: /nfs-data
nfs_server_export_clients:
  - "10.0.20.0/24"   # Server VLAN (K3s nodes)
  - "10.42.0.0/16"   # K3s pod CIDR
  - "10.43.0.0/16"   # K3s service CIDR

nfs_server_export_options: "rw,sync,no_subtree_check,no_root_squash"

nfs_server_shares:
  - name: k8s-general
    description: General Kubernetes PVCs
  - name: garage-meta
    description: Garage S3 metadata
  - name: jellyfin
    description: Jellyfin media config
  - name: nextcloud
    description: Nextcloud data
  - name: home-assistant
    description: Home Assistant config
  - name: paperless
    description: Paperless-ngx data
  - name: sabnzbd
    description: SABnzbd downloads config
  - name: sonarr
    description: Sonarr config
  - name: radarr
    description: Radarr config
  - name: bazarr
    description: Bazarr config
  - name: open-webui
    description: Open WebUI data
  - name: vaultwarden
    description: Vaultwarden data
  - name: mealie
    description: Mealie data
  - name: headscale
    description: Headscale data
  - name: gitea
    description: Gitea data
  - name: atlantis
    description: Atlantis workspace
  - name: loki
    description: Loki storage

# REL-019: Garage's data PVC is migrating off rpool (mounted at
# nfs_server_data_dir above) onto the archive pool instead -- a separate
# mount point on this LXC (/archive-garage-data), not a subdirectory of
# nfs_server_data_dir, so it needs its own absolute-path export.
nfs_server_extra_exports:
  - path: /archive-garage-data
    description: Garage S3 data (migrated off rpool, archive pool)
