---
- name: Ensure required dependencies are installed (curl, zstd)
  ansible.builtin.apt:
    name:
      - curl
      - zstd
    state: present
    update_cache: true

- name: Check if Ollama is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/ollama
  register: ollama_check_bin

- name: Download and execute official Ollama install script
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://ollama.com/install.sh | sh
  args:
    executable: /bin/bash
  when: not ollama_check_bin.stat.exists
  changed_when: true

- name: Ensure Ollama user is in video and render groups
  ansible.builtin.user:
    name: ollama
    groups: video, render
    append: true

- name: Ensure systemd override directory for Ollama exists
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure Ollama environment variables
  # CPU-only by deliberate choice (2026-06-23 incident): this AMD Barcelo iGPU
  # (gfx90c) has no official ROCm support. Both GPU paths tried so far crashed
  # Ollama's inference backend constantly under real load:
  #   - HSA_OVERRIDE_GFX_VERSION=9.0.0 (ROCm, spoofing gfx900) - never actually
  #     stable on this chip, abandoned before this comment was written.
  #   - OLLAMA_IGPU_ENABLE=1 (Vulkan/radv path) - 451 "vk::DeviceLostError" /
  #     "context is lost" crashes in a single day under paperless-gpt's
  #     auto-tagging backlog, ~1 crash per request under concurrent load.
  # Do not re-enable GPU acceleration here without first confirming a fix
  # actually holds up under several minutes of concurrent generate calls
  # (the failure only shows up under sustained/parallel load, not single
  # isolated requests, which is why both regressions went unnoticed at first).
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      Environment="OLLAMA_HOST=0.0.0.0"
  notify: Restart Ollama

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure Ollama service is enabled and started
  ansible.builtin.systemd:
    name: ollama
    state: started
    enabled: true

- name: Check whether the Gemma 4 26B-A4B model is already present
  ansible.builtin.command: ollama list
  register: ollama_list_result
  changed_when: false

# No idempotency check before this ran a full multi-GB pull on every
# playbook run against ai_nodes -- caused a real host I/O storm when a
# common-role fix pulled ai_nodes into an unrelated ansible run.
- name: Pull the Gemma 4 26B-A4B model
  ansible.builtin.command: ollama pull gemma4:26b
  register: ollama_pull_result
  changed_when: "'downloading' in ollama_pull_result.stdout"
  when: "'gemma4:26b' not in ollama_list_result.stdout"
