---
# The Immich library lives on a USB stick bind-mounted into the NFS LXC.
# Velero excludes the volume and vzdump skips bind mounts, so this role is
# its only local copy.
immich_library_backup_source: /mnt/pve/usb-immich/immich-library
immich_library_backup_source_mount: /mnt/pve/usb-immich
immich_library_backup_dataset: archive/immich-library
immich_library_backup_snapshot_retention_days: 30
immich_library_backup_schedule: "*-*-* 01:30:00"
immich_library_backup_textfile_dir: /var/lib/node_exporter/textfile_collector
