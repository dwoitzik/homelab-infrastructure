---
media_acquisition_base_dir: /opt/media-acq
media_acquisition_puid: "1000"
media_acquisition_pgid: "1000"
media_acquisition_tz: "Europe/Berlin"

# Eweka NNTP server -- SSL on port 563, credentials from Vault.
# SABnzbd connects directly (no VPN): Usenet over SSL is encrypted at the
# transport layer so the ISP sees only "connected to news.eweka.nl", not
# content. No VPN kill-switch needed for downloads; Eweka's own SSL IS the
# protection. Indexer search queries (NZBHydra2) are routed through Tor instead
# (see docker-compose template) to avoid exposing the home IP to indexer sites.
media_acquisition_eweka_host: "news.eweka.nl"
media_acquisition_eweka_port: "563"
media_acquisition_eweka_ssl: "1"
media_acquisition_eweka_connections: "20"
media_acquisition_eweka_username: "{{ vault_eweka_username }}"
media_acquisition_eweka_password: "{{ vault_eweka_password }}"
