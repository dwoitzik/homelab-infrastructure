---
# NOTE on architecture, found live (2026-06-24): NFS client mounts from inside
# this unprivileged LXC fail with EPERM regardless of the `mount=nfs` Proxmox
# feature flag (a deeper unprivileged-userns kernel restriction, not just an
# AppArmor/seccomp config gap) -- confirmed both NFSv3 and NFSv4 fail the same
# way, while `showmount` (a plain RPC query, not an actual mount) succeeds
# fine, ruling out a network/export-ACL problem. Two different fixes for the
# two different data sources, neither of which needs an NFS client mount
# inside this container at all:
#   - Media library (/mnt/media): this lives on a LOCAL ZFS dataset on the
#     SAME Proxmox host this LXC runs on (the NFS export to k8s pods is
#     incidental -- the host doesn't need NFS to reach its own disk). Bound
#     in directly via a native Proxmox LXC mount point (`mp0` in
#     terraform/stacks/proxmox/lxc.tf), no NFS involved.
#   - Per-app configs (sonarr/radarr/bazarr/sabnzbd/nzbhydra2/jellyseerr):
#     these live on a *different* host (the NFS LXC, ct-srv-nfs-01) so a
#     bind-mount isn't available the same way. One-time data copy via
#     `tar | ssh | tar` directly between the two hosts (see WRK-006 in
#     docs/AUDIT.md) instead of an ongoing NFS mount -- matches this repo's
#     established pattern of keeping SQLite-backed app state off NFS
#     entirely (GIT-006) rather than fighting NFS locking/mount issues.
#     The real, final sync (with the source apps stopped, for consistency)
#     happens at actual cutover time, not here.

- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ media_acquisition_base_dir }}"
    - "{{ media_acquisition_base_dir }}/sonarr/config"
    - "{{ media_acquisition_base_dir }}/radarr/config"
    - "{{ media_acquisition_base_dir }}/bazarr/config"
    - "{{ media_acquisition_base_dir }}/sabnzbd/config"
    - "{{ media_acquisition_base_dir }}/nzbhydra2/config"
    - "{{ media_acquisition_base_dir }}/jellyseerr/config"

- name: Deploy media acquisition docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ media_acquisition_base_dir }}/docker-compose.yml"
    mode: '0640'

- name: Ensure media acquisition stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ media_acquisition_base_dir }}"
    state: present

# --- Sonarr quality + language configuration via API ---
# Sonarr generates a random API key on first start and writes it to
# /config/config.xml. We wait for it, read it, then use it to push
# a 1080p quality profile (with German preferred) via the REST API.
# Idempotent: profile creation is skipped if "HD-1080p-DE" already exists.

- name: Wait for Sonarr to be ready
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/system/status"
    status_code: 200
  register: media_acquisition_sonarr_health
  until: media_acquisition_sonarr_health.status == 200
  retries: 20
  delay: 5

- name: Read Sonarr API key from config.xml
  community.general.xml:
    path: "{{ media_acquisition_base_dir }}/sonarr/config/config.xml"
    xpath: /Config/ApiKey
    content: text
  register: media_acquisition_sonarr_apikey_xml

- name: Set Sonarr API key fact
  ansible.builtin.set_fact:
    media_acquisition_sonarr_api_key: "{{ media_acquisition_sonarr_apikey_xml.matches[0].ApiKey }}"

- name: Get existing Sonarr quality profiles
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/qualityprofile"
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
  register: media_acquisition_sonarr_profiles

- name: Create Sonarr HD-1080p quality profile (German preferred)
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/qualityprofile"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "HD-1080p-DE"
      upgradeAllowed: true
      cutoff: 7
      items:
        - quality: {id: 7, name: "Bluray-1080p"}
          allowed: true
        - quality: {id: 15, name: "WEB 1080p"}
          allowed: true
        - quality: {id: 3, name: "WEBDL-1080p"}
          allowed: true
        - quality: {id: 10, name: "Raw-HD"}
          allowed: false
      minFormatScore: 0
      cutoffFormatScore: 0
      formatItems: []
      language: {id: 4, name: "German"}
    status_code: 201
  when: media_acquisition_sonarr_profiles.json | selectattr('name','equalto','HD-1080p-DE') | list | length == 0

# --- Radarr quality + language configuration via API ---

- name: Wait for Radarr to be ready
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/system/status"
    status_code: 200
  register: media_acquisition_radarr_health
  until: media_acquisition_radarr_health.status == 200
  retries: 20
  delay: 5

- name: Read Radarr API key from config.xml
  community.general.xml:
    path: "{{ media_acquisition_base_dir }}/radarr/config/config.xml"
    xpath: /Config/ApiKey
    content: text
  register: media_acquisition_radarr_apikey_xml

- name: Set Radarr API key fact
  ansible.builtin.set_fact:
    media_acquisition_radarr_api_key: "{{ media_acquisition_radarr_apikey_xml.matches[0].ApiKey }}"

- name: Get existing Radarr quality profiles
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/qualityprofile"
    headers:
      X-Api-Key: "{{ media_acquisition_radarr_api_key }}"
  register: media_acquisition_radarr_profiles

- name: Create Radarr 4K-HDR quality profile (German preferred)
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/qualityprofile"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_radarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "4K-HDR-DE"
      upgradeAllowed: true
      cutoff: 19
      items:
        - quality: {id: 19, name: "Remux-2160p"}
          allowed: true
        - quality: {id: 18, name: "Bluray-2160p"}
          allowed: true
        - quality: {id: 17, name: "WEB 2160p"}
          allowed: true
        - quality: {id: 16, name: "WEBDL-2160p"}
          allowed: true
        - quality: {id: 7, name: "Bluray-1080p"}
          allowed: true
        - quality: {id: 15, name: "WEB 1080p"}
          allowed: true
        - quality: {id: 3, name: "WEBDL-1080p"}
          allowed: true
      minFormatScore: 0
      cutoffFormatScore: 0
      formatItems: []
      language: {id: 4, name: "German"}
    status_code: 201
  when: media_acquisition_radarr_profiles.json | selectattr('name','equalto','4K-HDR-DE') | list | length == 0

# --- Bazarr subtitle language configuration ---
# Bazarr stores config in config/config.ini on disk.
# Set German as primary subtitle language with English fallback.

- name: Configure Bazarr subtitle languages
  community.general.ini_file:
    path: "{{ media_acquisition_base_dir }}/bazarr/config/config.ini"
    section: general
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: '0640'
    create: false
  loop:
    - {key: languages, value: "['de', 'en']"}
    - {key: single_language, value: "False"}
  notify: Restart bazarr
