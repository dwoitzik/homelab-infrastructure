# ── Queue watchdog (REL-032): auto-clear stuck import jams ────────
# See templates/queue-watchdog.sh.j2 for the failure class this covers.
# Runs every 10 minutes; only ever acts on items stuck >30min in a
# "warning" state, and only notifies Discord when it actually clears
# something.

- name: Deploy queue watchdog script
  ansible.builtin.template:
    src: queue-watchdog.sh.j2
    dest: /usr/local/bin/media-acq-queue-watchdog.sh
    mode: '0755'

- name: Schedule queue watchdog every 10 minutes
  ansible.builtin.cron:
    name: media-acq-queue-watchdog
    minute: "*/10"
    job: /usr/local/bin/media-acq-queue-watchdog.sh >> /var/log/media-acq-queue-watchdog.log 2>&1
