---
# NOTE on architecture, found live (2026-06-24): NFS client mounts from inside
# this unprivileged LXC fail with EPERM regardless of the `mount=nfs` Proxmox
# feature flag (a deeper unprivileged-userns kernel restriction, not just an
# AppArmor/seccomp config gap) -- confirmed both NFSv3 and NFSv4 fail the same
# way, while `showmount` (a plain RPC query, not an actual mount) succeeds
# fine, ruling out a network/export-ACL problem. Two different fixes for the
# two different data sources, neither of which needs an NFS client mount
# inside this container at all:
#   - Media library (/mnt/media): this lives on a LOCAL ZFS dataset on the
#     SAME Proxmox host this LXC runs on (the NFS export to k8s pods is
#     incidental -- the host doesn't need NFS to reach its own disk). Bound
#     in directly via a native Proxmox LXC mount point (`mp0` in
#     terraform/stacks/proxmox/lxc.tf), no NFS involved.
#   - Per-app configs (sonarr/radarr/bazarr/sabnzbd/nzbhydra2/jellyseerr):
#     these live on a *different* host (the NFS LXC, ct-srv-nfs-01) so a
#     bind-mount isn't available the same way. One-time data copy via
#     `tar | ssh | tar` directly between the two hosts (see WRK-006 in
#     docs/AUDIT.md) instead of an ongoing NFS mount -- matches this repo's
#     established pattern of keeping SQLite-backed app state off NFS
#     entirely (GIT-006) rather than fighting NFS locking/mount issues.
#     The real, final sync (with the source apps stopped, for consistency)
#     happens at actual cutover time, not here.

- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ media_acquisition_base_dir }}"
    - "{{ media_acquisition_base_dir }}/sonarr/config"
    - "{{ media_acquisition_base_dir }}/radarr/config"
    - "{{ media_acquisition_base_dir }}/bazarr/config"
    - "{{ media_acquisition_base_dir }}/sabnzbd/config"
    - "{{ media_acquisition_base_dir }}/nzbhydra2/config"
    - "{{ media_acquisition_base_dir }}/jellyseerr/config"

- name: Deploy media acquisition docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ media_acquisition_base_dir }}/docker-compose.yml"
    mode: '0640'

- name: Ensure media acquisition stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ media_acquisition_base_dir }}"
    state: present

# ── Sonarr quality profile + download client + indexer ────────────
# Sonarr v4 requires auth on ALL endpoints (returns 401 without a key),
# so we check health via docker exec curl and treat both 200 and 401 as ready.
# Quality profiles must include the complete items list -- we clone profile 1
# (the default "Any" profile which contains every quality item) and rename it,
# rather than hand-crafting the items array which would fail with
# "Must contain all qualities".

- name: Wait for Sonarr to be ready
  ansible.builtin.shell:
    cmd: docker exec sonarr curl -s -o /dev/null -w '%{http_code}' http://localhost:8989/api/v3/system/status
  register: media_acquisition_sonarr_health
  until: media_acquisition_sonarr_health.stdout in ['200', '401']
  retries: 20
  delay: 5
  changed_when: false

- name: Read Sonarr API key from config.xml
  ansible.builtin.shell:
    cmd: "grep -oP '(?<=<ApiKey>)[^<]+' {{ media_acquisition_base_dir }}/sonarr/config/config.xml"
  register: media_acquisition_sonarr_apikey_xml
  changed_when: false

- name: Set Sonarr API key fact
  ansible.builtin.set_fact:
    media_acquisition_sonarr_api_key: "{{ media_acquisition_sonarr_apikey_xml.stdout }}"

- name: Get existing Sonarr quality profiles
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/qualityprofile"
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
  register: media_acquisition_sonarr_profiles

- name: Get Sonarr base quality profile for cloning
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/qualityprofile/1"
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
  register: media_acquisition_sonarr_base_profile
  when: media_acquisition_sonarr_profiles.json | selectattr('name', 'equalto', 'HD-1080p-DE') | list | length == 0

- name: Create Sonarr HD-1080p-DE quality profile (German preferred, 1080p cutoff)
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/qualityprofile"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body: >-
      {{
        media_acquisition_sonarr_base_profile.json
        | combine({'name': 'HD-1080p-DE', 'cutoff': 7, 'upgradeAllowed': true})
        | dict2items | rejectattr('key', 'equalto', 'id') | items2dict
      }}
    status_code: 201
  when: media_acquisition_sonarr_profiles.json | selectattr('name', 'equalto', 'HD-1080p-DE') | list | length == 0

- name: Get Sonarr existing download clients
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/downloadclient"
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
  register: media_acquisition_sonarr_download_clients

- name: Read SABnzbd API key from config ini
  ansible.builtin.shell:
    cmd: "grep -oP '(?<=^api_key = )\\S+' {{ media_acquisition_base_dir }}/sabnzbd/config/sabnzbd.ini"
  register: media_acquisition_sabnzbd_apikey_ini
  changed_when: false

- name: Set SABnzbd API key fact
  ansible.builtin.set_fact:
    media_acquisition_sabnzbd_api_key: "{{ media_acquisition_sabnzbd_apikey_ini.stdout }}"

- name: Add SABnzbd as Sonarr download client
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: SABnzbd
      enable: true
      protocol: usenet
      priority: 1
      removeCompletedDownloads: true
      removeFailedDownloads: true
      implementation: Sabnzbd
      configContract: SabnzbdSettings
      tags: []
      fields:
        - {name: host, value: sabnzbd}
        - {name: port, value: 8080}
        - {name: apiKey, value: "{{ media_acquisition_sabnzbd_api_key }}"}
        - {name: tvCategory, value: tv}
        - {name: tvImportedCategory, value: ""}
        - {name: recentTvPriority, value: 0}
        - {name: olderTvPriority, value: 0}
        - {name: useSsl, value: false}
    status_code: 201
  when: media_acquisition_sonarr_download_clients.json | selectattr('name', 'equalto', 'SABnzbd') | list | length == 0

- name: Get Sonarr existing indexers
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/indexer"
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
  register: media_acquisition_sonarr_indexers

- name: Add NZBHydra2 as Sonarr indexer
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/indexer"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: NZBHydra2
      enable: true
      supportsRss: true
      supportsSearch: true
      priority: 25
      implementation: Newznab
      configContract: NewznabSettings
      tags: []
      fields:
        - {name: baseUrl, value: "http://nzbhydra2:5076"}
        - {name: apiPath, value: /api}
        - {name: apiKey, value: ""}
        - {name: categories, value: [5030, 5040]}
        - {name: animeCategories, value: [5070]}
        - {name: additionalParameters, value: ""}
    status_code: 201
  when: media_acquisition_sonarr_indexers.json | selectattr('name', 'equalto', 'NZBHydra2') | list | length == 0

- name: Get Sonarr existing release profiles
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/releaseprofile"
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
  register: media_acquisition_sonarr_release_profiles

- name: Add Block Bonus Disc release profile to Sonarr
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/releaseprofile"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: Block Bonus Disc
      enabled: true
      required: []
      ignored:
        - BONUS.DISC
        - BONUS DISC
      indexerId: 0
      tags: []
    status_code: 201
  when: media_acquisition_sonarr_release_profiles.json | selectattr('name', 'equalto', 'Block Bonus Disc') | list | length == 0

