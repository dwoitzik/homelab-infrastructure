# ── SABnzbd: Eweka server + download categories ───────────────────
# SABnzbd writes its config on first start. We wait for the ini to exist,
# then stop the container before injecting config (so SABnzbd cannot
# overwrite our changes on its own shutdown). The [[server]] format is
# Python configobj nested-section syntax -- standard for SABnzbd ini files.
# Idempotent: the block is inserted only if [[{{ eweka_host }}]] is absent.

- name: Wait for SABnzbd to initialize its config file
  ansible.builtin.wait_for:
    path: "{{ media_acquisition_base_dir }}/sabnzbd/config/sabnzbd.ini"
    state: present
    timeout: 60

- name: Check whether Eweka server block already exists in SABnzbd config
  ansible.builtin.command:
    cmd: "grep -qF '[[{{ media_acquisition_eweka_host }}]]' {{ media_acquisition_base_dir }}/sabnzbd/config/sabnzbd.ini"
  register: media_acquisition_sab_server_check
  changed_when: false
  failed_when: false

- name: Stop SABnzbd before modifying its config
  community.docker.docker_container:
    name: sabnzbd
    state: stopped
  when: media_acquisition_sab_server_check.rc != 0

- name: Inject Eweka server into SABnzbd config
  ansible.builtin.blockinfile:
    path: "{{ media_acquisition_base_dir }}/sabnzbd/config/sabnzbd.ini"
    marker: "# {mark} ANSIBLE MANAGED BLOCK eweka-server"
    insertafter: EOF
    block: |
      [servers]
      [[{{ media_acquisition_eweka_host }}]]
      displayname = Eweka SSL
      host = {{ media_acquisition_eweka_host }}
      port = {{ media_acquisition_eweka_port }}
      timeout = 60
      username = {{ media_acquisition_eweka_username }}
      password = {{ media_acquisition_eweka_password }}
      connections = {{ media_acquisition_eweka_connections }}
      ssl = {{ media_acquisition_eweka_ssl }}
      ssl_verify = 2
      ssl_ciphers = ""
      enable = 1
      priority = 0
      retention = 0
      expire_date = ""
      quota = ""
      notes = ""
  when: media_acquisition_sab_server_check.rc != 0
  notify: Start sabnzbd

- name: Check whether download categories already exist in SABnzbd config
  ansible.builtin.command:
    cmd: "grep -qF '[[tv]]' {{ media_acquisition_base_dir }}/sabnzbd/config/sabnzbd.ini"
  register: media_acquisition_sab_categories_check
  changed_when: false
  failed_when: false

- name: Inject download categories into SABnzbd config
  ansible.builtin.blockinfile:
    path: "{{ media_acquisition_base_dir }}/sabnzbd/config/sabnzbd.ini"
    marker: "# {mark} ANSIBLE MANAGED BLOCK sabnzbd-categories"
    insertafter: EOF
    block: |
      [categories]
      [[*]]
      name = *
      order = 0
      pp = ""
      script = Default
      dir = ""
      newzbin = ""
      priority = -100
      [[tv]]
      name = tv
      order = 1
      pp = ""
      script = Default
      dir = tv
      newzbin = ""
      priority = -100
      [[movies]]
      name = movies
      order = 2
      pp = ""
      script = Default
      dir = movies
      newzbin = ""
      priority = -100
  when: media_acquisition_sab_categories_check.rc != 0
  notify: Start sabnzbd

- name: Flush handlers to start SABnzbd before Sonarr/Radarr client tests
  ansible.builtin.meta: flush_handlers

# ── NZBHydra2: Tor SOCKS5 proxy ──────────────────────────────────
# Route indexer search queries through the Tor container (172.28.1.10:9150).
# peterdavehello/tor-socks-proxy listens on 9150 (not 9050).
# proxyIgnoreLocal: true is required so OkHttp can reach Docker's internal
# DNS resolver at 127.0.0.11 to resolve container hostnames; without it,
# the proxy-bypass check itself does a local DNS lookup that fails for
# external FQDNs and prevents Tor from being used at all.
# proxyIgnoreDomains: nzbfinder.ws bypasses Tor for NZBFinder because
# Cloudflare blocks Tor exit nodes for that domain.

- name: Configure NZBHydra2 Tor SOCKS5 proxy type
  ansible.builtin.replace:
    path: "{{ media_acquisition_base_dir }}/nzbhydra2/config/nzbhydra.yml"
    regexp: '^  proxyType: "NONE"'
    replace: '  proxyType: "SOCKS"'

- name: Configure NZBHydra2 Tor SOCKS5 proxy host
  ansible.builtin.replace:
    path: "{{ media_acquisition_base_dir }}/nzbhydra2/config/nzbhydra.yml"
    regexp: '^  proxyHost: null'
    replace: '  proxyHost: "172.28.1.10"'

- name: Configure NZBHydra2 Tor SOCKS5 proxy port
  ansible.builtin.replace:
    path: "{{ media_acquisition_base_dir }}/nzbhydra2/config/nzbhydra.yml"
    regexp: '^  proxyPort: 1080'
    replace: '  proxyPort: 9150'

- name: Allow Docker DNS to bypass Tor proxy
  ansible.builtin.replace:
    path: "{{ media_acquisition_base_dir }}/nzbhydra2/config/nzbhydra.yml"
    regexp: '^  proxyIgnoreLocal: false'
    replace: '  proxyIgnoreLocal: true'

# ── Jellyseerr: point at local Docker services ────────────────────
# Jellyseerr settings.json stores Sonarr/Radarr hostnames which initially
# point at the old Kubernetes service DNS. Update them to use Docker
# service names (sonarr, radarr) on the shared bridge network, and set
# the correct quality profile IDs created above.
# The 4K-HDR-DE profile is profile id=7 in Radarr; is4k=true routes
# Ultra HD requests from Jellyseerr to this server.

- name: Update Jellyseerr server configuration
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import json, sys
      path = '{{ media_acquisition_base_dir }}/jellyseerr/config/settings.json'
      with open(path) as f:
          d = json.load(f)
      d['jellyfin']['ip'] = '10.0.20.254'
      seen_sonarr, seen_radarr = False, False
      new_sonarr = []
      for s in d.get('sonarr', []):
          if seen_sonarr:
              continue
          s['hostname'] = 'sonarr'
          s['activeProfileId'] = 7
          s['activeProfileName'] = 'HD-1080p-DE'
          s['activeAnimeProfileId'] = 7
          s['activeAnimeProfileName'] = 'HD-1080p-DE'
          s['isDefault'] = True
          s['enabled'] = True
          new_sonarr.append(s)
          seen_sonarr = True
      d['sonarr'] = new_sonarr
      new_radarr = []
      for r in d.get('radarr', []):
          if seen_radarr:
              continue
          r['hostname'] = 'radarr'
          r['activeProfileId'] = 7
          r['activeProfileName'] = '4K-HDR-DE'
          r['is4k'] = True
          r['isDefault'] = True
          r['enabled'] = True
          new_radarr.append(r)
          seen_radarr = True
      d['radarr'] = new_radarr
      with open(path, 'w') as f:
          json.dump(d, f, indent=2)
      print('ok')
      "
  register: media_acquisition_jellyseerr_result
  changed_when: "'ok' in media_acquisition_jellyseerr_result.stdout"
  notify: Restart jellyseerr

# ── Bazarr: single_language guard ─────────────────────────────────
# Bazarr v1+ stores config in config/config/config.yaml (nested path).
# Language profiles (German/English) are configured per-series in the
# SQLite DB — they are not a global flat-config key. Only single_language
# is meaningful here: ensure it is false so both DE and EN subtitles can
# be downloaded per release.

- name: Wait for Bazarr to initialize its config file
  ansible.builtin.wait_for:
    path: "{{ media_acquisition_base_dir }}/bazarr/config/config/config.yaml"
    state: present
    timeout: 60

- name: Ensure Bazarr single_language is disabled
  ansible.builtin.replace:
    path: "{{ media_acquisition_base_dir }}/bazarr/config/config/config.yaml"
    regexp: '^  single_language: true'
    replace: '  single_language: false'
  notify: Restart bazarr

# ── Sonarr / Radarr: scheduled missing-content searches ──────────
# SeasonSearch returns 0 results when only blocked releases (e.g. BONUS DISC)
# exist in the index — it does NOT fall back to per-episode searches.
# MissingEpisodeSearch / MissingMoviesSearch query per-episode/per-movie and
# reliably surface individual releases, so we schedule them daily to
# automatically pick up any backlog gaps without manual intervention.
# The API key is read at runtime from config.xml so nothing is hardcoded.

- name: Schedule daily Sonarr MissingEpisodeSearch
  ansible.builtin.cron:
    name: sonarr-missing-episode-search
    hour: "3"
    minute: "0"
    job: >-
      APIKEY=$(grep -oP '(?<=<ApiKey>)[^<]+' {{ media_acquisition_base_dir }}/sonarr/config/config.xml 2>/dev/null) &&
      curl -sf -X POST "http://localhost:8989/api/v3/command"
      -H "X-Api-Key: $APIKEY" -H "Content-Type: application/json"
      -d '{"name":"MissingEpisodeSearch"}' -o /dev/null

- name: Schedule daily Radarr MissingMoviesSearch
  ansible.builtin.cron:
    name: radarr-missing-movies-search
    hour: "3"
    minute: "30"
    job: >-
      APIKEY=$(grep -oP '(?<=<ApiKey>)[^<]+' {{ media_acquisition_base_dir }}/radarr/config/config.xml 2>/dev/null) &&
      curl -sf -X POST "http://localhost:7878/api/v3/command"
      -H "X-Api-Key: $APIKEY" -H "Content-Type: application/json"
      -d '{"name":"MissingMoviesSearch"}' -o /dev/null

# ── Block raw Blu-ray disc/ISO releases (REL-032) ─────────────────
# "Block Bonus Disc" (above) only catches BONUS.DISC-labeled releases.
# It missed a whole-season raw disc rip (e.g. "S06.D04...Blu-ray...ISO")
# that Sonarr grabbed and then could never import: ffprobe cannot get a
# runtime from a raw .iso disc image (no demuxable video stream at the
# container level), so the file sat retrying import forever, jamming the
# queue behind it. This Custom Format + a large negative score makes
# Sonarr/Radarr reject these releases at grab time instead of downloading
# 50+GB of something that can never be imported.

- name: Get existing Sonarr custom formats
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/customformat"
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
  register: media_acquisition_sonarr_custom_formats

- name: Add Block Raw Disc/ISO Releases custom format to Sonarr
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/customformat"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: Block Raw Disc/ISO Releases
      includeCustomFormatWhenRenaming: false
      specifications:
        - name: Disc/ISO indicators
          implementation: ReleaseTitleSpecification
          implementationName: Release Title
          negate: false
          required: false
          fields:
            - {name: value, value: '(?i)(\bBD25\b|\bBD50\b|\bBD66\b|\bBD100\b|COMPLETE\.BLURAY|\bBDMV\b|\.ISO\b|\bS\d{2}\.D\d{2}\b)'}
    status_code: 201
  when: media_acquisition_sonarr_custom_formats.json | selectattr('name', 'equalto', 'Block Raw Disc/ISO Releases') | list | length == 0

- name: Reject Block Raw Disc/ISO Releases format in every Sonarr quality profile
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import json, urllib.request

      api_key = '{{ media_acquisition_sonarr_api_key }}'
      base = 'http://localhost:8989/api/v3'

      def req(method, path, body=None):
          data = json.dumps(body).encode() if body is not None else None
          r = urllib.request.Request(base + path, data=data, method=method,
              headers={'X-Api-Key': api_key, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(r) as resp:
              return json.loads(resp.read() or b'null')

      formats = req('GET', '/customformat')
      fmt_id = next(f['id'] for f in formats if f['name'] == 'Block Raw Disc/ISO Releases')
      changed = False
      for profile in req('GET', '/qualityprofile'):
          items = profile.get('formatItems', [])
          for item in items:
              if item['format'] == fmt_id and item['score'] != -10000:
                  item['score'] = -10000
                  req('PUT', f\"/qualityprofile/{profile['id']}\", profile)
                  changed = True
      print('CHANGED' if changed else 'OK')
      "
  register: media_acquisition_sonarr_disc_format_score
  changed_when: "'CHANGED' in media_acquisition_sonarr_disc_format_score.stdout"

# ── Block 3D/SBS and Hindi/Multi-audio junk releases ──────────────
# 3D SBS = double-image on normal screens.
# Hindi-Multi = regional non-English repacks (Jio, PunisheR, etc.).
# minFormatScore:-9998 + CF score:-9999 = hard reject at grab time.

- name: Add 3D-SBS custom format to Sonarr
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/customformat"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: 3D-SBS
      includeCustomFormatWhenRenaming: false
      specifications:
        - name: 3D/SBS indicators
          implementation: ReleaseTitleSpecification
          implementationName: Release Title
          negate: false
          required: false
          fields:
            - {name: value, value: '\b(3D|SBS|HOU|AI3D|VR360|3D\.SBS|Half\.SBS)\b'}
    status_code: 201
  when: media_acquisition_sonarr_custom_formats.json | selectattr('name', 'equalto', '3D-SBS') | list | length == 0

- name: Add Hindi-Multi custom format to Sonarr
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/customformat"
    method: POST
    headers:
      X-Api-Key: "{{ media_acquisition_sonarr_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: Hindi-Multi
      includeCustomFormatWhenRenaming: false
      specifications:
        - name: Hindi/Multi indicators
          implementation: ReleaseTitleSpecification
          implementationName: Release Title
          negate: false
          required: false
          fields:
            - {name: value, value: '(?i)(Jio|Hindi\.DDP|DDP2\.0\.Hindi|PunisheR|Org\.Jio|ITA[-.]ENG\.MULTI|ITA\.ENG\.MULTI|MULTI\.WEBRip|ENG\.MULTI)'}
    status_code: 201
  when: media_acquisition_sonarr_custom_formats.json | selectattr('name', 'equalto', 'Hindi-Multi') | list | length == 0

- name: Enforce 3D-SBS/Hindi-Multi block scores and minFormatScore in every Sonarr quality profile
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import json, urllib.request

      api_key = '{{ media_acquisition_sonarr_api_key }}'
      base = 'http://localhost:8989/api/v3'

      def req(method, path, body=None):
          data = json.dumps(body).encode() if body is not None else None
          r = urllib.request.Request(base + path, data=data, method=method,
              headers={'X-Api-Key': api_key, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(r) as resp:
              return json.loads(resp.read() or b'null')

      block_names = {'3D-SBS', 'Hindi-Multi'}
      block_score = -9999
      min_format_score = -9998

      formats = req('GET', '/customformat')
      block_ids = {f['id'] for f in formats if f['name'] in block_names}
      changed = False
      for profile in req('GET', '/qualityprofile'):
          dirty = False
          for item in profile.get('formatItems', []):
              if item['format'] in block_ids and item['score'] != block_score:
                  item['score'] = block_score
                  dirty = True
          if profile.get('minFormatScore', 0) != min_format_score:
              profile['minFormatScore'] = min_format_score
              dirty = True
          if dirty:
              req('PUT', f\"/qualityprofile/{profile['id']}\", profile)
              changed = True
      print('CHANGED' if changed else 'OK')
      "
  register: media_acquisition_sonarr_block_format_scores
  changed_when: "'CHANGED' in media_acquisition_sonarr_block_format_scores.stdout"

