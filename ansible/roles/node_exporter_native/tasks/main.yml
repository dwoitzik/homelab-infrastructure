---
- name: Check if node_exporter is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_native_binary

- name: Determine architecture
  ansible.builtin.set_fact:
    node_exporter_native_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download node_exporter binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_native_version
      }}/node_exporter-{{ node_exporter_native_version }}.linux-{{ node_exporter_native_arch }}.tar.gz
    dest: "/tmp/node_exporter-{{ node_exporter_native_version }}.linux-{{ node_exporter_native_arch }}.tar.gz"
    mode: "0644"
  when: not node_exporter_native_binary.stat.exists

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_native_version }}.linux-{{ node_exporter_native_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: not node_exporter_native_binary.stat.exists

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_native_version }}.linux-{{ node_exporter_native_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  when: not node_exporter_native_binary.stat.exists

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /bin/false
    create_home: false

- name: Deploy node_exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Reload systemd and restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
