---
- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true

- name: Allow HAProxy to bind to non-local IP (VIP)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    sysctl_set: true
    # Without a file the setting only lives in the running kernel and is gone
    # after a reboot, so HAProxy then fails to bind the VIP on the standby
    # node and the service stays down until the next run of this role.
    sysctl_file: /etc/sysctl.d/99-haproxy-nonlocal-bind.conf
    state: present
    reload: true

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
  notify: Restart HAProxy

- name: Ensure HAProxy is started and enabled
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
