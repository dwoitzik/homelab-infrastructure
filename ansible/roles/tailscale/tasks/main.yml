---
- name: Install Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/raspbian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/raspbian bookworm main"
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable IP forwarding (IPv4)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Enable IP forwarding (IPv6)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if already connected to Headscale
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Connect to Headscale control server
  ansible.builtin.command: >
    tailscale up
    --login-server={{ tailscale_login_server }}
    --authkey={{ tailscale_authkey }}
    --advertise-routes={{ tailscale_advertise_routes }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --advertise-exit-node=false
    --hostname={{ inventory_hostname }}
  when: >
    (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
    or (tailscale_status.stdout | from_json).CurrentTailnet is not defined
  changed_when: true
  notify: Confirm tailscale status

- name: Re-advertise routes if already connected
  ansible.builtin.command: >
    tailscale set
    --advertise-routes={{ tailscale_advertise_routes }}
  when: >
    (tailscale_status.stdout | from_json).BackendState | default('') == 'Running'
  changed_when: false
  failed_when: false
