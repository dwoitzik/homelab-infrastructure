---
- name: Install Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/raspbian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    # Pinned: without a checksum get_url reports a change on every check-mode
    # run, and a rotated signing key should fail here rather than be trusted silently.
    checksum: "sha256:3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39"
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/raspbian bookworm main"
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable IP forwarding (IPv4)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    # Debian 13 no longer reads /etc/sysctl.conf at boot.
    sysctl_file: /etc/sysctl.d/99-tailscale-forwarding.conf
    state: present
    reload: true

- name: Enable IP forwarding (IPv6)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    # Debian 13 no longer reads /etc/sysctl.conf at boot.
    sysctl_file: /etc/sysctl.d/99-tailscale-forwarding.conf
    state: present
    reload: true

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if already connected to Headscale
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Connect to Headscale control server
  ansible.builtin.command: >
    tailscale up
    --login-server={{ tailscale_login_server }}
    --auth-key={{ tailscale_authkey }}
    --advertise-routes={{ tailscale_advertise_routes }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --advertise-exit-node={{ tailscale_advertise_exit_node | lower }}
    --hostname={{ inventory_hostname }}
  when: >
    (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
    or (tailscale_status.stdout | from_json).CurrentTailnet is not defined
  changed_when: true
  notify: Confirm tailscale status

- name: Re-advertise routes if already connected
  ansible.builtin.command: >
    tailscale set
    --advertise-routes={{ tailscale_advertise_routes }}
    --advertise-exit-node={{ tailscale_advertise_exit_node | lower }}
  when: >
    (tailscale_status.stdout | from_json).BackendState | default('') == 'Running'
  changed_when: false
  failed_when: false

- name: Install iptables-persistent for rule persistence
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

- name: Discover Traefik websecure NodePort from k3s API
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - svc
      - traefik
      - -n
      - kube-system
      - -o
      - jsonpath={.spec.ports[?(@.name=="websecure")].nodePort}
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
  register: tailscale_traefik_nodeport_discovered
  delegate_to: "{{ tailscale_traefik_k3s_api_host }}"
  changed_when: false
  check_mode: false
  failed_when: tailscale_traefik_nodeport_discovered.stdout == ""

# The Service uses externalTrafficPolicy: Cluster, so the NodePort answers on
# every node. A fixed node keeps the rule stable; following the Traefik pod
# added a second DNAT rule (the first one still wins) every time it moved.
- name: Set Traefik target facts
  ansible.builtin.set_fact:
    tailscale_traefik_nodeport_target_dynamic: "{{ hostvars[tailscale_traefik_k3s_api_host].ansible_host }}:{{ tailscale_traefik_nodeport_discovered.stdout }}"

- name: DNAT Traefik VIP:443 → NodePort on k3s node (workaround for MetalLB L2 flannel issue)
  ansible.builtin.iptables:
    table: nat
    chain: "{{ item }}"
    destination: "{{ tailscale_traefik_metallb_vip }}"
    protocol: tcp
    destination_port: "443"
    jump: DNAT
    to_destination: "{{ tailscale_traefik_nodeport_target_dynamic }}"
    state: present
  loop:
    - OUTPUT
    - PREROUTING

- name: Persist iptables rules
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  changed_when: false
