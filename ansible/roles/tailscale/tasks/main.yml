---
- name: Install Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/raspbian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/raspbian bookworm main"
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable IP forwarding (IPv4)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Enable IP forwarding (IPv6)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if already connected to Headscale
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Connect to Headscale control server
  ansible.builtin.command: >
    tailscale up
    --login-server={{ tailscale_login_server }}
    --auth-key={{ tailscale_authkey }}
    --advertise-routes={{ tailscale_advertise_routes }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --advertise-exit-node=false
    --hostname={{ inventory_hostname }}
  when: >
    (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
    or (tailscale_status.stdout | from_json).CurrentTailnet is not defined
  changed_when: true
  notify: Confirm tailscale status

- name: Re-advertise routes if already connected
  ansible.builtin.command: >
    tailscale set
    --advertise-routes={{ tailscale_advertise_routes }}
  when: >
    (tailscale_status.stdout | from_json).BackendState | default('') == 'Running'
  changed_when: false
  failed_when: false

- name: Install iptables-persistent for rule persistence
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

- name: Discover Traefik websecure NodePort from k3s API
  ansible.builtin.command: >
    kubectl get svc traefik -n kube-system
    -o jsonpath={.spec.ports[?(@.name=="websecure")].nodePort}
    --kubeconfig /etc/rancher/k3s/k3s.yaml
  register: traefik_nodeport_discovered
  delegate_to: "{{ traefik_k3s_api_host }}"
  changed_when: false
  failed_when: traefik_nodeport_discovered.stdout == ""

- name: Discover Traefik pod node IP from k3s API
  ansible.builtin.shell: >
    kubectl get pod -n kube-system -l app.kubernetes.io/name=traefik
    -o jsonpath='{.items[0].status.hostIP}'
    --kubeconfig /etc/rancher/k3s/k3s.yaml
  register: traefik_node_ip_discovered
  delegate_to: "{{ traefik_k3s_api_host }}"
  changed_when: false
  failed_when: traefik_node_ip_discovered.stdout == ""

- name: Set Traefik target facts
  ansible.builtin.set_fact:
    traefik_nodeport_target_dynamic: "{{ traefik_node_ip_discovered.stdout }}:{{ traefik_nodeport_discovered.stdout }}"

- name: DNAT Traefik VIP:443 → NodePort on k3s node (workaround for MetalLB L2 flannel issue)
  ansible.builtin.iptables:
    table: nat
    chain: "{{ item }}"
    destination: "{{ traefik_metallb_vip }}"
    protocol: tcp
    destination_port: "443"
    jump: DNAT
    to_destination: "{{ traefik_nodeport_target_dynamic }}"
    state: present
  loop:
    - OUTPUT
    - PREROUTING

- name: Persist iptables rules
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  changed_when: false
