---
tailscale_authkey: ""
tailscale_login_server: "https://headscale.woitzik.dev"
# Advertise nothing unless a host opts in (inventory.ini); a 10.0.0.0/8 default
# would offer every VLAN to the tailnet the moment someone approved it.
tailscale_advertise_routes: ""
tailscale_advertise_exit_node: false
tailscale_accept_dns: false
# MetalLB VIP workaround: RPi's kube-proxy flannel can't reach VIP directly,
# so we DNAT VIP:443 → the k3s node currently running Traefik (discovered at runtime)
tailscale_traefik_metallb_vip: "10.0.20.200"
# k3s master node used to run kubectl and discover the Traefik NodePort/node dynamically
tailscale_traefik_k3s_api_host: "10.0.20.11"
