---
- name: Disable traditional file-based swap to prevent SD card wear
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: stopped
    enabled: false
  failed_when: false

- name: Remove traditional swap package completely
  ansible.builtin.apt:
    name: dphys-swapfile
    state: absent

- name: Install zram-tools for compressed memory swapping
  ansible.builtin.apt:
    name: zram-tools
    state: present
    update_cache: true

- name: Configure zram to use 50% of available RAM
  ansible.builtin.lineinfile:
    path: /etc/default/zramswap
    regexp: '^#?PERCENT='
    line: 'PERCENT=50'
  notify: Restart zramswap

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Azlux repository GPG key for log2ram
  ansible.builtin.get_url:
    url: https://azlux.fr/repo.gpg.key
    dest: /etc/apt/keyrings/azlux.asc
    mode: '0644'

- name: Add Azlux repository for log2ram package
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/azlux.asc] http://packages.azlux.fr/debian/ bookworm main"
    state: present
    filename: azlux

- name: Install log2ram package
  ansible.builtin.apt:
    name: log2ram
    state: present
    update_cache: true

# ─── Headless power optimizations ─────────────────────────────────────────────

- name: Detect config.txt location (RPi OS Bookworm vs. older)
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: rpi_optimize_firmware_config

- name: Set config.txt path fact
  ansible.builtin.set_fact:
    rpi_optimize_config_txt: "{{ '/boot/firmware/config.txt' if rpi_optimize_firmware_config.stat.exists else '/boot/config.txt' }}"

- name: Install cpufrequtils for persistent governor configuration
  ansible.builtin.apt:
    name: cpufrequtils
    state: present
  failed_when: false

- name: Set CPU governor to ondemand (responsive idle, no wasted turbo at rest)
  ansible.builtin.copy:
    dest: /etc/default/cpufrequtils
    content: |
      GOVERNOR="ondemand"
    mode: '0644'
  notify: Restart cpufrequtils
  failed_when: false

- name: Disable WiFi (not used — wired Ethernet only)
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "dtoverlay=disable-wifi"
    regexp: "^#?dtoverlay=disable-wifi"
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Disable Bluetooth (not used — reduces idle power and CPU overhead)
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "dtoverlay=disable-bt"
    regexp: "^#?dtoverlay=disable-bt"
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Set GPU memory to minimum (16 MB — headless, no display needed)
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "gpu_mem=16"
    regexp: "^#?gpu_mem="
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Enable HDMI blanking to reduce port power draw
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "hdmi_blanking=2"
    regexp: "^#?hdmi_blanking="
    state: present
  notify: Reboot RPi (config.txt changed)

# ─── Hardware watchdog ──────────────────────────────────────────────────────
# If the system hangs hard (kernel deadlock, not just a crashed container),
# systemd stops "petting" the BCM hardware watchdog and the chip forcibly
# power-cycles the board. Self-healing for exactly the kind of total-freeze
# scenario the Proxmox host hit repeatedly on 2026-06-20/21 — these RPis run
# DNS for the whole network, so unattended recovery matters more here than
# almost anywhere else in the homelab.

- name: Enable BCM hardware watchdog overlay
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "dtparam=watchdog=on"
    regexp: "^#?dtparam=watchdog="
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Configure systemd to use the hardware watchdog
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - regexp: "^#?RuntimeWatchdogSec="
      line: "RuntimeWatchdogSec=15s"
    - regexp: "^#?RebootWatchdogSec="
      line: "RebootWatchdogSec=10min"
  notify: Reload systemd daemon

# ─── SSH brute-force protection ────────────────────────────────────────────
# These RPis are reachable from the whole SRV VLAN (and, via the keepalived
# VIP, are a visible target). fail2ban only watches sshd auth failures —
# zero interaction with the DNS path (AdGuard/Unbound/Docker).

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      maxretry = 5
      findtime = 10m
      bantime = 1h
    mode: '0644'
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# ─── Local config backup ───────────────────────────────────────────────────
# There is currently no backup mechanism at all for these RPis — they're
# physical hardware, not LXCs/VMs, so PBS/Velero don't cover them. AdGuard's
# config has drifted from its Ansible template multiple times via web-UI
# changes (see 2026-06-21 fix); a local rotating snapshot is a cheap safety
# net against accidental deletion/corruption while NFS-based backup (which
# depends on the Proxmox host) is unavailable.

- name: Create local backup directory
  ansible.builtin.file:
    path: /opt/backups
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Deploy config backup script
  ansible.builtin.copy:
    dest: /usr/local/bin/backup-rpi-configs.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      DEST=/opt/backups
      STAMP=$(date +%Y%m%d-%H%M%S)
      tar czf "${DEST}/configs-${STAMP}.tar.gz" \
        -C / opt/adguardhome/conf opt/unbound 2>/dev/null || true
      # Keep the 14 most recent snapshots, drop the rest
      ls -t "${DEST}"/configs-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm --
    mode: '0755'

- name: Deploy backup systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/backup-rpi-configs.service
    content: |
      [Unit]
      Description=Backup RPi DNS/network configs locally

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/backup-rpi-configs.sh
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy backup systemd timer (daily, staggered to avoid sync collision)
  ansible.builtin.copy:
    dest: /etc/systemd/system/backup-rpi-configs.timer
    content: |
      [Unit]
      Description=Daily local backup of RPi DNS/network configs

      [Timer]
      OnCalendar=*-*-* 02:30:00
      RandomizedDelaySec=300
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable and start the backup timer
  ansible.builtin.systemd:
    name: backup-rpi-configs.timer
    state: started
    enabled: true
    daemon_reload: true

# ─── Independent DNS health alerting ───────────────────────────────────────
# Deliberately zero dependency on the k3s/Prometheus/Alertmanager stack —
# if AdGuard/Unbound die on a day the Proxmox host is also down (like
# 2026-06-21), nobody would otherwise find out. Only posts to Discord on a
# state CHANGE (healthy<->unhealthy), not every run.

- name: Deploy independent DNS healthcheck script
  ansible.builtin.template:
    src: dns-healthcheck.sh.j2
    dest: /usr/local/bin/dns-healthcheck.sh
    mode: '0755'

- name: Deploy DNS healthcheck systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/dns-healthcheck.service
    content: |
      [Unit]
      Description=Independent DNS health check (no dependency on k3s/Prometheus)

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/dns-healthcheck.sh
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy DNS healthcheck timer (every 2 minutes)
  ansible.builtin.copy:
    dest: /etc/systemd/system/dns-healthcheck.timer
    content: |
      [Unit]
      Description=Run independent DNS health check every 2 minutes

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=2min

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable and start the DNS healthcheck timer
  ansible.builtin.systemd:
    name: dns-healthcheck.timer
    state: started
    enabled: true
    daemon_reload: true

# ─── Host firewall (native services only) ──────────────────────────────────
# Deliberately its OWN ruleset file + systemd service, NOT /etc/nftables.conf
# (that file starts with "flush ruleset" - enabling the stock nftables.service
# would wipe Docker's own iptables-nft managed NAT/FORWARD tables on every
# boot and break every published container port). This only adds an
# *additive* `inet hostfw` table; it never touches Docker's tables.
#
# Only covers natively-bound services (ssh, haproxy VIP, tailscale, VRRP) and
# AdGuard (network_mode: host, so it's host-stack traffic, not docker-NAT'd).
# Bridge-mode containers (unbound:5335, node_exporter:9100) are DNAT'd by
# Docker before host INPUT ever sees them, so this does NOT restrict those -
# confirmed by testing live on rpi-srv-02 on 2026-06-21. Tightening that would
# require rules in Docker's DOCKER-USER chain and careful IPv4/IPv6 handling;
# deferred as low value (MikroTik already segments these RPis from the
# internet) versus the real risk of a subtle rule-ordering mistake taking
# down DNS for the house.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Deploy host firewall ruleset (native services only)
  ansible.builtin.copy:
    dest: /etc/nftables-hostfw.conf
    content: |
      #!/usr/sbin/nft -f
      table inet hostfw {
        chain input {
          type filter hook input priority filter; policy drop;
          iif "lo" accept
          ct state established,related accept
          ip protocol icmp accept
          meta l4proto ipv6-icmp accept
          tcp dport 22 accept
          tcp dport 53 accept
          udp dport 53 accept
          tcp dport 3001 accept
          tcp dport { 80, 443 } accept
          udp dport 41641 accept
          ip protocol vrrp accept
        }
      }
    mode: '0644'
  notify: Apply host firewall ruleset

- name: Deploy host firewall systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/hostfw.service
    content: |
      [Unit]
      Description=Host firewall (inet hostfw table, additive - does not touch Docker's tables)
      After=network.target docker.service
      Wants=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/usr/sbin/nft -f /etc/nftables-hostfw.conf
      ExecStop=/usr/sbin/nft delete table inet hostfw

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable and start the host firewall service
  ansible.builtin.systemd:
    name: hostfw.service
    state: started
    enabled: true

# 2026-08-20: cosmetic LED scheduling (off 22:00-06:00 local). Confirmed live
# on rpi-srv-01 (both RPis have identical ACT/PWR LEDs, ls'd on rpi-srv-02
# too) that /sys/class/leds/{ACT,PWR}/brightness are real, root-writable
# control paths, distinctly registering 0 vs. non-zero writes -- the write
# path itself is confirmed real. One caveat found and not fully resolved:
# reading brightness back after a non-zero write reports 255 regardless of
# max_brightness (1) -- a known Linux LED-subsystem quirk on some gpio-led
# drivers (set takes a boolean, get always reports LED_FULL), not evidence
# the write failed, but not independently confirmed against the physical
# LED either (no camera/eyes-on-hardware check was possible from this
# session). Trigger was left at its original value (mmc0 on ACT, default-on
# on PWR) for both LEDs after testing -- a plain brightness write overrides
# the trigger's own control regardless of what trigger is selected, so no
# trigger change was needed.
- name: Deploy LEDs-off oneshot service
  ansible.builtin.copy:
    dest: /etc/systemd/system/leds-off.service
    content: |
      [Unit]
      Description=Turn off ACT/PWR LEDs (cosmetic, night hours)

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo 0 > /sys/class/leds/ACT/brightness; echo 0 > /sys/class/leds/PWR/brightness'
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy LEDs-on oneshot service
  ansible.builtin.copy:
    dest: /etc/systemd/system/leds-on.service
    content: |
      [Unit]
      Description=Restore ACT/PWR LEDs (cosmetic, day hours)

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'cat /sys/class/leds/ACT/max_brightness > /sys/class/leds/ACT/brightness; cat /sys/class/leds/PWR/max_brightness > /sys/class/leds/PWR/brightness'
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy LEDs-off timer (22:00 local)
  ansible.builtin.copy:
    dest: /etc/systemd/system/leds-off.timer
    content: |
      [Unit]
      Description=Turn off ACT/PWR LEDs at 22:00

      [Timer]
      OnCalendar=*-*-* 22:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy LEDs-on timer (06:00 local)
  ansible.builtin.copy:
    dest: /etc/systemd/system/leds-on.timer
    content: |
      [Unit]
      Description=Restore ACT/PWR LEDs at 06:00

      [Timer]
      OnCalendar=*-*-* 06:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable and start LEDs-off timer
  ansible.builtin.systemd:
    name: leds-off.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Enable and start LEDs-on timer
  ansible.builtin.systemd:
    name: leds-on.timer
    state: started
    enabled: true
    daemon_reload: true
