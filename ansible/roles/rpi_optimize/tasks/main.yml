---
- name: Disable traditional file-based swap to prevent SD card wear
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: stopped
    enabled: false
  failed_when: false

- name: Remove traditional swap package completely
  ansible.builtin.apt:
    name: dphys-swapfile
    state: absent

- name: Install zram-tools for compressed memory swapping
  ansible.builtin.apt:
    name: zram-tools
    state: present
    update_cache: true

- name: Configure zram to use 50% of available RAM
  ansible.builtin.lineinfile:
    path: /etc/default/zramswap
    regexp: '^#?PERCENT='
    line: 'PERCENT=50'
  notify: Restart zramswap

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Azlux repository GPG key for log2ram
  ansible.builtin.get_url:
    url: https://azlux.fr/repo.gpg.key
    dest: /etc/apt/keyrings/azlux.asc
    mode: '0644'

- name: Add Azlux repository for log2ram package
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/azlux.asc] http://packages.azlux.fr/debian/ bookworm main"
    state: present
    filename: azlux

- name: Install log2ram package
  ansible.builtin.apt:
    name: log2ram
    state: present
    update_cache: true

# ─── Headless power optimizations ─────────────────────────────────────────────

- name: Detect config.txt location (RPi OS Bookworm vs. older)
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: rpi_optimize_firmware_config

- name: Set config.txt path fact
  ansible.builtin.set_fact:
    rpi_optimize_config_txt: "{{ '/boot/firmware/config.txt' if rpi_optimize_firmware_config.stat.exists else '/boot/config.txt' }}"

- name: Install cpufrequtils for persistent governor configuration
  ansible.builtin.apt:
    name: cpufrequtils
    state: present
  failed_when: false

- name: Set CPU governor to ondemand (responsive idle, no wasted turbo at rest)
  ansible.builtin.copy:
    dest: /etc/default/cpufrequtils
    content: |
      GOVERNOR="ondemand"
    mode: '0644'
  notify: Restart cpufrequtils
  failed_when: false

- name: Disable WiFi (not used — wired Ethernet only)
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "dtoverlay=disable-wifi"
    regexp: "^#?dtoverlay=disable-wifi"
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Disable Bluetooth (not used — reduces idle power and CPU overhead)
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "dtoverlay=disable-bt"
    regexp: "^#?dtoverlay=disable-bt"
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Set GPU memory to minimum (16 MB — headless, no display needed)
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "gpu_mem=16"
    regexp: "^#?gpu_mem="
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Enable HDMI blanking to reduce port power draw
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "hdmi_blanking=2"
    regexp: "^#?hdmi_blanking="
    state: present
  notify: Reboot RPi (config.txt changed)

# ─── Hardware watchdog ──────────────────────────────────────────────────────
# If the system hangs hard (kernel deadlock, not just a crashed container),
# systemd stops "petting" the BCM hardware watchdog and the chip forcibly
# power-cycles the board. Self-healing for exactly the kind of total-freeze
# scenario the Proxmox host hit repeatedly on 2026-06-20/21 — these RPis run
# DNS for the whole network, so unattended recovery matters more here than
# almost anywhere else in the homelab.

- name: Enable BCM hardware watchdog overlay
  ansible.builtin.lineinfile:
    path: "{{ rpi_optimize_config_txt }}"
    line: "dtparam=watchdog=on"
    regexp: "^#?dtparam=watchdog="
    state: present
  notify: Reboot RPi (config.txt changed)

- name: Configure systemd to use the hardware watchdog
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - regexp: "^#?RuntimeWatchdogSec="
      line: "RuntimeWatchdogSec=15s"
    - regexp: "^#?RebootWatchdogSec="
      line: "RebootWatchdogSec=10min"
  notify: Reload systemd daemon

# ─── SSH brute-force protection ────────────────────────────────────────────
# These RPis are reachable from the whole SRV VLAN (and, via the keepalived
# VIP, are a visible target). fail2ban only watches sshd auth failures —
# zero interaction with the DNS path (AdGuard/Unbound/Docker).

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      maxretry = 5
      findtime = 10m
      bantime = 1h
    mode: '0644'
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# ─── Local config backup ───────────────────────────────────────────────────
# There is currently no backup mechanism at all for these RPis — they're
# physical hardware, not LXCs/VMs, so PBS/Velero don't cover them. AdGuard's
# config has drifted from its Ansible template multiple times via web-UI
# changes (see 2026-06-21 fix); a local rotating snapshot is a cheap safety
# net against accidental deletion/corruption while NFS-based backup (which
# depends on the Proxmox host) is unavailable.

- name: Create local backup directory
  ansible.builtin.file:
    path: /opt/backups
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Deploy config backup script
  ansible.builtin.copy:
    dest: /usr/local/bin/backup-rpi-configs.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      DEST=/opt/backups
      STAMP=$(date +%Y%m%d-%H%M%S)
      tar czf "${DEST}/configs-${STAMP}.tar.gz" \
        -C / opt/adguardhome/conf opt/unbound 2>/dev/null || true
      # Keep the 14 most recent snapshots, drop the rest
      ls -t "${DEST}"/configs-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm --
    mode: '0755'

- name: Deploy backup systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/backup-rpi-configs.service
    content: |
      [Unit]
      Description=Backup RPi DNS/network configs locally

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/backup-rpi-configs.sh
    mode: '0644'
  notify: Reload systemd daemon

- name: Deploy backup systemd timer (daily, staggered to avoid sync collision)
  ansible.builtin.copy:
    dest: /etc/systemd/system/backup-rpi-configs.timer
    content: |
      [Unit]
      Description=Daily local backup of RPi DNS/network configs

      [Timer]
      OnCalendar=*-*-* 02:30:00
      RandomizedDelaySec=300
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable and start the backup timer
  ansible.builtin.systemd:
    name: backup-rpi-configs.timer
    state: started
    enabled: true
    daemon_reload: true
