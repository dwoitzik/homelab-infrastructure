---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable the daily unattended-upgrades run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Restrict unattended-upgrades to the Debian security suite
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Ensure the apt timers are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Install the sshd hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# Older unmanaged copy of the same settings; two files would drift apart.
- name: Remove the unmanaged sshd drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/hardening.conf
    state: absent
  notify: Reload sshd

# Identical copy of authorized_keys that nothing maintains. sshd stops reading
# it once AuthorizedKeysFile names only the pmxcfs-backed authorized_keys.
- name: Remove the stale second authorized_keys file
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys2
    state: absent

- name: Check the full sshd configuration before the reload
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false
