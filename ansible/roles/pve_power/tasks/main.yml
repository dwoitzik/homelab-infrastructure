---
- name: Install linux-cpupower for governor management
  ansible.builtin.apt:
    name: linux-cpupower
    state: present
    update_cache: true

- name: Create GRUB drop-in for AMD P-State active driver
  ansible.builtin.copy:
    dest: /etc/default/grub.d/amd_pstate.cfg
    content: |
      # Enable AMD hardware P-State for Ryzen 5825U — replaces acpi-cpufreq with
      # hardware-managed P-states and allows EPP (Energy Performance Preference).
      # Requires reboot. Verify after: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_driver
      GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX amd_pstate={{ pve_power_amd_pstate }}"
    mode: '0644'
  notify: Update GRUB (reboot required)

- name: Create systemd service to set CPU governor and EPP on every boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-cpu-power.service
    content: |
      [Unit]
      Description=Proxmox host CPU power management ({{ pve_power_cpu_governor }} + EPP {{ pve_power_energy_perf_pref }})
      After=multi-user.target

      [Service]
      Type=oneshot
      # 2026-08-17: was a hardcoded /usr/sbin/cpupower -- on this Debian
      # trixie install, the linux-cpupower package puts the binary at
      # /usr/bin/cpupower instead (confirmed live via `dpkg -L
      # linux-cpupower`), so the service failed every time it actually ran
      # ("203/EXEC ... No such file or directory"). Resolving via PATH
      # instead of a hardcoded path avoids re-hardcoding a location that's
      # apparently not stable across package versions/distros.
      ExecStart=/usr/bin/env cpupower frequency-set -g {{ pve_power_cpu_governor }}
      ExecStartPost=/bin/sh -c 'echo {{ pve_power_energy_perf_pref }} | tee /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference 2>/dev/null || true'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Reload systemd and enable pve-cpu-power

- name: Set governor immediately (takes effect without reboot)
  ansible.builtin.command:
    cmd: cpupower frequency-set -g {{ pve_power_cpu_governor }}
  changed_when: false
  failed_when: false

- name: Set EPP to balance_power immediately
  ansible.builtin.shell:
    cmd: set -o pipefail && echo {{ pve_power_energy_perf_pref }} | tee /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference
    executable: /bin/bash
  changed_when: false
  failed_when: false

# REL-012c/REL-037: bring the previously-manual /etc/modprobe.d/zfs.conf
# under Ansible so it survives a fresh host build, and add
# zfs_vdev_async_write_max_active to actually prioritize etcd's synchronous
# WAL fdatasync over bulk async writes from every other VM/CT sharing this
# host's single SSD (see defaults/main.yml comment for the full incident).
- name: Persist ZFS module tuning (survives reboot)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    content: >-
      options zfs
      zfs_arc_max={{ pve_power_zfs_arc_max_bytes }}
      zfs_prefetch_disable={{ pve_power_zfs_prefetch_disable }}
      zfs_dirty_data_max={{ pve_power_zfs_dirty_data_max_bytes }}
      zfs_txg_timeout={{ pve_power_zfs_txg_timeout }}
      zfs_vdev_async_write_max_active={{ pve_power_zfs_vdev_async_write_max_active }}
    mode: '0644'

- name: Apply zfs_vdev_async_write_max_active immediately (no reboot needed)
  # sysfs isn't a real filesystem -- ansible.builtin.copy's atomic
  # write-then-rename fails with EXDEV/EACCES against it, needs a direct echo.
  ansible.builtin.shell:
    cmd: echo {{ pve_power_zfs_vdev_async_write_max_active }} > /sys/module/zfs/parameters/zfs_vdev_async_write_max_active
  changed_when: false

# 2026-08-19: bring vzdump's global throttle under IaC (see defaults/main.yml
# comment) -- surgical, leaves the rest of Proxmox's own stock
# /etc/vzdump.conf template (all commented examples) alone rather than
# replacing the whole file. Two steps, in this order:
#   1. One-time-only: strip any bare (unmanaged) bwlimit:/ionice: lines.
#      Live-caught bug on the real host, twice: the file already had TWO
#      pre-existing `ionice:` lines (real prior drift, predates this role)
#      -- a first-draft version used two separate `lineinfile` calls, whose
#      regexp match only updates the LAST matching line when there are
#      duplicates, silently leaving the other in place. Fixed by removing
#      bare lines outright before inserting a managed block instead. But an
#      UNGATED removal task reran on every play and matched the managed
#      block's own content lines too (they're still bare `bwlimit:
#      NNN`/`ionice: N` text, marker comments don't change that) --
#      confirmed live: `changed=2` on a second consecutive run even though
#      nothing should differ. Gated on the marker not existing yet fixes
#      this for real: once the managed block is in place, this task is
#      permanently skipped, so it can never eat the block's own lines.
- name: Check whether the vzdump throttle block already exists
  ansible.builtin.command:
    cmd: grep -q "BEGIN ANSIBLE MANAGED THROTTLE (pve_power role, ADR-023)" /etc/vzdump.conf
  register: pve_power_vzdump_throttle_block_present
  changed_when: false
  failed_when: false

- name: Remove any unmanaged vzdump bwlimit/ionice lines (one-time, pre-block only)
  ansible.builtin.lineinfile:
    path: /etc/vzdump.conf
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^bwlimit:\s*\d+\s*$'
    - '^ionice:\s*\d+\s*$'
  when: pve_power_vzdump_throttle_block_present.rc != 0

- name: Ensure vzdump throttle block is set (bwlimit + ionice)
  ansible.builtin.blockinfile:
    path: /etc/vzdump.conf
    marker: "# {mark} ANSIBLE MANAGED THROTTLE (pve_power role, ADR-023)"
    block: |
      bwlimit: {{ pve_power_vzdump_bwlimit_kbps }}
      ionice: {{ pve_power_vzdump_ionice }}

# 2026-08-21: see defaults/main.yml comment -- this host's thin pool can
# never autoextend (VG has zero free space), so the default 80% threshold
# only ever blocked backups, never actually protected anything.
- name: Raise LVM thin-pool autoextend threshold (see phase8/LEDGER.md Entry 68)
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: '^(\s*)thin_pool_autoextend_threshold\s*=\s*\d+\s*$'
    line: '\1thin_pool_autoextend_threshold = {{ pve_power_lvm_thin_autoextend_threshold }}'
    backrefs: true

- name: Deploy PBS backup health-check hook script
  ansible.builtin.template:
    src: pbs-backup-healthcheck.sh.j2
    dest: /usr/local/bin/pbs-backup-healthcheck.sh
    owner: root
    group: root
    mode: '0700'

# 2026-08-21: pve-watchdog.sh predates this role (found live-only, no IaC
# ownership -- same drift pattern the vzdump throttle above was in before
# ADR-023). Brought under IaC here rather than left as tribal knowledge, and
# fixed in the same pass: its old flat 15min rate-limit re-alerted on every
# check (every 5min via cron) for a condition that stayed true for hours --
# exactly what happened during the real disk-latency incident the night of
# 2026-08-20/21 (phase8/LEDGER.md Entries 63-64), generating dozens of
# redundant pushes for one already-known, ongoing condition. Now uses an
# escalating backoff (15/30/60/120/240min, resets the moment the condition
# actually clears) instead of a blanket quiet-hours window, so a genuinely
# new problem starting overnight still alerts promptly.
- name: Deploy pve-watchdog.sh (load/pool/temp health alerts)
  ansible.builtin.template:
    src: pve-watchdog.sh.j2
    dest: /usr/local/bin/pve-watchdog.sh
    owner: root
    group: root
    mode: '0700'

- name: Register the health-check script as vzdump's job-end hook
  ansible.builtin.blockinfile:
    path: /etc/vzdump.conf
    marker: "# {mark} ANSIBLE MANAGED HOOK SCRIPT (pve_power role, phase8 Entry 68)"
    insertafter: "END ANSIBLE MANAGED THROTTLE"
    block: |
      script: /usr/local/bin/pbs-backup-healthcheck.sh

- name: Schedule pve-watchdog.sh via cron (every 5 minutes)
  ansible.builtin.cron:
    name: pve-watchdog
    minute: "*/5"
    job: /usr/local/bin/pve-watchdog.sh

# 2026-08-22 (Section G, power draw dashboard): found live that this Ryzen
# host's RAPL package-energy counter (/sys/class/powercap/intel-rapl:0/
# energy_uj -- the "intel-rapl" name is a Linux kernel-framework quirk, AMD
# Zen CPUs since Zen 2 report through the same powercap interface) is real
# and live (confirmed via a direct `cat`), but node_exporter's rapl
# collector was silently failing (node_scrape_collector_success{collector=
# "rapl"} 0) because the file is root-only (0400) and node_exporter runs
# as its own unprivileged system user. World-readable energy counters are
# the standard, widely-used fix for this exact gap (the value itself is
# not sensitive) -- a udev rule makes it durable across reboots/device
# re-enumeration, plus an immediate chmod since udev rules don't
# retroactively touch already-enumerated devices.
- name: Deploy udev rule for world-readable RAPL energy counters
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/95-rapl-readable.rules
    content: |
      SUBSYSTEM=="powercap", KERNEL=="intel-rapl:*", RUN+="/bin/chmod -R a+r /sys%p"
    mode: '0644'
  notify: Reload udev rules

- name: Apply RAPL permissions immediately (udev rule only covers future enumeration)
  ansible.builtin.shell:
    cmd: chmod -R a+r /sys/class/powercap/intel-rapl:0/ 2>/dev/null || true
  changed_when: false

- name: Create node_exporter textfile-collector directory
  ansible.builtin.file:
    path: "{{ pve_power_node_exporter_textfile_dir }}"
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: '0755'

- name: Deploy the NVMe SMART -> Prometheus textfile script
  ansible.builtin.template:
    src: smart-metrics.sh.j2
    dest: /usr/local/bin/smart-metrics.sh
    owner: root
    group: root
    mode: '0700'

- name: Schedule the SMART metrics script via cron (every 15 minutes)
  ansible.builtin.cron:
    name: smart-metrics
    minute: "*/15"
    job: /usr/local/bin/smart-metrics.sh

# node_exporter's own systemd unit and --collector.textfile.directory flag
# are managed by the node_exporter_native role (templated, runs after this
# one in site.yml's pve_hosts play) -- not duplicated here. A lineinfile
# edit against a file another role fully templates just gets clobbered on
# the next run; confirmed live the first time this was tried.
