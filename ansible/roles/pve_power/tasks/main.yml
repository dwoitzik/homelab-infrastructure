---
- name: Install linux-cpupower for governor management
  ansible.builtin.apt:
    name: linux-cpupower
    state: present
    update_cache: true

- name: Create GRUB drop-in for AMD P-State active driver
  ansible.builtin.copy:
    dest: /etc/default/grub.d/amd_pstate.cfg
    content: |
      # Enable AMD hardware P-State for Ryzen 5825U — replaces acpi-cpufreq with
      # hardware-managed P-states and allows EPP (Energy Performance Preference).
      # Requires reboot. Verify after: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_driver
      GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX amd_pstate={{ pve_power_amd_pstate }}"
    mode: '0644'
  notify: Update GRUB (reboot required)

- name: Create systemd service to set CPU governor and EPP on every boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-cpu-power.service
    content: |
      [Unit]
      Description=Proxmox host CPU power management ({{ pve_power_cpu_governor }} + EPP {{ pve_power_energy_perf_pref }})
      After=multi-user.target

      [Service]
      Type=oneshot
      # 2026-08-17: was a hardcoded /usr/sbin/cpupower -- on this Debian
      # trixie install, the linux-cpupower package puts the binary at
      # /usr/bin/cpupower instead (confirmed live via `dpkg -L
      # linux-cpupower`), so the service failed every time it actually ran
      # ("203/EXEC ... No such file or directory"). Resolving via PATH
      # instead of a hardcoded path avoids re-hardcoding a location that's
      # apparently not stable across package versions/distros.
      ExecStart=/usr/bin/env cpupower frequency-set -g {{ pve_power_cpu_governor }}
      ExecStartPost=/bin/sh -c 'echo {{ pve_power_energy_perf_pref }} | tee /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference 2>/dev/null || true'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Reload systemd and enable pve-cpu-power

- name: Set governor immediately (takes effect without reboot)
  ansible.builtin.command:
    cmd: cpupower frequency-set -g {{ pve_power_cpu_governor }}
  changed_when: false
  failed_when: false

- name: Set EPP to balance_power immediately
  ansible.builtin.shell:
    cmd: set -o pipefail && echo {{ pve_power_energy_perf_pref }} | tee /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference
    executable: /bin/bash
  changed_when: false
  failed_when: false

# REL-012c/REL-037: bring the previously-manual /etc/modprobe.d/zfs.conf
# under Ansible so it survives a fresh host build, and add
# zfs_vdev_async_write_max_active to actually prioritize etcd's synchronous
# WAL fdatasync over bulk async writes from every other VM/CT sharing this
# host's single SSD (see defaults/main.yml comment for the full incident).
- name: Persist ZFS module tuning (survives reboot)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    content: >-
      options zfs
      zfs_arc_max={{ pve_power_zfs_arc_max_bytes }}
      zfs_prefetch_disable={{ pve_power_zfs_prefetch_disable }}
      zfs_dirty_data_max={{ pve_power_zfs_dirty_data_max_bytes }}
      zfs_txg_timeout={{ pve_power_zfs_txg_timeout }}
      zfs_vdev_async_write_max_active={{ pve_power_zfs_vdev_async_write_max_active }}
    mode: '0644'

- name: Apply zfs_vdev_async_write_max_active immediately (no reboot needed)
  # sysfs isn't a real filesystem -- ansible.builtin.copy's atomic
  # write-then-rename fails with EXDEV/EACCES against it, needs a direct echo.
  ansible.builtin.shell:
    cmd: echo {{ pve_power_zfs_vdev_async_write_max_active }} > /sys/module/zfs/parameters/zfs_vdev_async_write_max_active
  changed_when: false

# 2026-08-19: bring vzdump's global throttle under IaC (see defaults/main.yml
# comment) -- surgical, only touches these two lines, leaves the rest of
# Proxmox's own stock /etc/vzdump.conf template (all commented examples)
# alone rather than replacing the whole file.
- name: Ensure vzdump bwlimit throttle is set
  ansible.builtin.lineinfile:
    path: /etc/vzdump.conf
    regexp: '^#?bwlimit:'
    line: "bwlimit: {{ pve_power_vzdump_bwlimit_kbps }}"

- name: Ensure vzdump ionice throttle is set
  ansible.builtin.lineinfile:
    path: /etc/vzdump.conf
    regexp: '^#?ionice:'
    line: "ionice: {{ pve_power_vzdump_ionice }}"
