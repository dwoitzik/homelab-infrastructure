---
# CPU governor + AMD P-State + EPP tuning. See ADR-034 for why `powersave`
# is the correct governor under `amd_pstate=active` (schedutil isn't
# offered), not a compromise.
pve_power_cpu_governor: powersave
pve_power_energy_perf_pref: balance_power
pve_power_amd_pstate: active

# ZFS module tuning for a single shared, DRAM-less NVMe. See ADR-034 --
# zfs_vdev_async_write_max_active keeps bulk async writes from starving a
# latency-sensitive synchronous writer's I/O queue priority.
# ADR-037/ADR-042: lowered 16 GiB -> 8 GiB -> 4 GiB. Each cut freed real
# host RAM that k3s VM ballooning needed. The second cut isn't a temporary
# spike response -- by the second incident all 3 k3s VMs were genuinely
# using their full memory ceiling (not just squeezed by ballooning like
# the first incident), reflecting real workload growth on the cluster
# since the 8 GiB baseline was set. 8 GiB is stale; this is the new
# baseline until growth or a hardware change revisits it.
pve_power_zfs_arc_max_bytes: 4294967296
pve_power_zfs_prefetch_disable: 1
pve_power_zfs_dirty_data_max_bytes: 268435456
pve_power_zfs_txg_timeout: 5
pve_power_zfs_vdev_async_write_max_active: 3

# vzdump global throttle -- backup I/O yields to everything else sharing
# this host's one disk. See ADR-034.
pve_power_vzdump_bwlimit_kbps: 51200
pve_power_vzdump_ionice: 7

# This host's LVM thin pool has zero free space at the volume-group level,
# so the default 80% autoextend threshold only ever blocked new thin-LVs
# (every vzdump backup) with no actual protection in return -- see
# ADR-034. Raised, not disabled, to keep a real margin before the
# unrecoverable "pool actually full" failure mode.
pve_power_lvm_thin_autoextend_threshold: 92

# PBS backup health check: verifies real datastore manifest size/age per
# VMID, not just vzdump's own exit status -- see ADR-034 for why that
# distinction matters.
pve_power_pbs_healthcheck_storeid: local-pbs
pve_power_pbs_healthcheck_ntfy_topic: dw-homelab-a12a7b540943
pve_power_pbs_healthcheck_min_size_mib: 100
pve_power_pbs_healthcheck_max_age_hours: 26

# Host watchdog with escalating backoff (see tasks/main.yml and ADR-034)
# instead of a flat rate-limit, so an ongoing condition doesn't re-alert
# every check cycle while a genuinely new one still alerts promptly.
pve_power_watchdog_ntfy_topic: dw-homelab-a12a7b540943

# NVMe SMART data as real Prometheus textfile-collector metrics -- feeds
# the weekly wear report and HARDWARE.md's wear projection.
pve_power_smart_device: /dev/nvme0n1
pve_power_node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
