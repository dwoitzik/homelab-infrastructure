---
# Host mounts that must survive reboots but aren't in PVE's own storage config.
pve_host_mounts_list: []

# Mounts that used to be managed here and must be gone.
# SABnzbd's incomplete directory was a 10 GB tmpfs until ADR-073.
pve_host_mounts_absent:
  - /mnt/sab-incomplete

# ZFS datasets bind-mounted into containers. Owner is the host-side uid of the
# unprivileged container user (container uid 1000 -> host 101000).
pve_host_mounts_datasets:
  - name: archive/sab-incomplete
    mountpoint: /mnt/sab-incomplete
    owner: "101000"
    group: "101000"
    mode: "0777"
