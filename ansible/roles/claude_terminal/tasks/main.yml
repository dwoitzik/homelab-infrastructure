---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - git
    state: present
    update_cache: true

- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_{{ claude_terminal_node_version }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0755"

- name: Run NodeSource setup script
  ansible.builtin.command:
    cmd: /bin/bash /tmp/nodesource_setup.sh
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js {{ claude_terminal_node_version }}
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install claude CLI globally
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: present
  environment:
    npm_config_cache: /tmp/npm-cache

- name: Download ttyd binary
  ansible.builtin.get_url:
    url: "https://github.com/tsl0922/ttyd/releases/download/{{ claude_terminal_ttyd_version }}/ttyd.x86_64"
    dest: /usr/local/bin/ttyd
    mode: "0755"

- name: Create claude system user
  ansible.builtin.user:
    name: "{{ claude_terminal_user }}"
    system: true
    shell: /bin/bash
    home: "/home/{{ claude_terminal_user }}"
    create_home: true

- name: Create claude config directory
  ansible.builtin.file:
    path: "/home/{{ claude_terminal_user }}/.claude"
    state: directory
    owner: "{{ claude_terminal_user }}"
    group: "{{ claude_terminal_user }}"
    mode: "0700"

- name: Deploy ttyd systemd service
  ansible.builtin.template:
    src: ttyd.service.j2
    dest: /etc/systemd/system/ttyd.service
    mode: "0644"
  notify: Restart ttyd

- name: Enable and start ttyd
  ansible.builtin.systemd:
    name: ttyd
    enabled: true
    state: started
    daemon_reload: true
