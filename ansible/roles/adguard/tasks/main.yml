---
- name: Create AdGuard Home directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - /opt/adguardhome/work
    - /opt/adguardhome/conf

# AdGuard rewrites its config on every save (quoting, no comments), so a
# plain template reports a change, and restarts DNS, on every run. Render to a
# staging file and replace the live one only when the parsed content differs.
- name: Render AdGuardHome configuration to a staging file
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /opt/adguardhome/conf/AdGuardHome.yaml.desired
    mode: '0600'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Compare desired and live AdGuardHome configuration
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, yaml
        def load(p):
            try:
                with open(p) as f:
                    return yaml.safe_load(f)
            except FileNotFoundError:
                return None
        sys.exit(0 if load(sys.argv[1]) == load(sys.argv[2]) else 1)
      - /opt/adguardhome/conf/AdGuardHome.yaml.desired
      - /opt/adguardhome/conf/AdGuardHome.yaml
  register: adguard_config_compare
  changed_when: false
  failed_when: adguard_config_compare.rc not in [0, 1]
  check_mode: false

- name: Deploy AdGuardHome configuration when its content changed
  ansible.builtin.copy:
    src: /opt/adguardhome/conf/AdGuardHome.yaml.desired
    dest: /opt/adguardhome/conf/AdGuardHome.yaml
    remote_src: true
    mode: '0600'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: adguard_config_compare.rc == 1
  notify: Restart AdGuard Home

- name: Deploy AdGuard Home Docker Compose file
  ansible.builtin.copy:
    dest: /opt/adguardhome/docker-compose.yml
    content: |
      services:
        adguardhome:
          image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
          container_name: adguardhome
          restart: always
          network_mode: host
          mem_limit: 512m
          volumes:
            - /opt/adguardhome/work:/opt/adguardhome/work
            - /opt/adguardhome/conf:/opt/adguardhome/conf
            - /opt/npm/letsencrypt:/opt/npm/letsencrypt:ro
    mode: '0644'
  notify: Restart AdGuard Home

- name: Start AdGuard Home container
  community.docker.docker_compose_v2:
    project_src: /opt/adguardhome
    state: present

- name: Deploy AdGuardHome-Sync on replica node
  when: inventory_hostname == 'rpi-srv-02'
  block:
    - name: Create Sync directory
      ansible.builtin.file:
        path: /opt/adguardhome-sync
        state: directory
        mode: '0755'

    - name: Deploy Sync Docker Compose
      ansible.builtin.copy:
        dest: /opt/adguardhome-sync/docker-compose.yml
        content: |
          services:
            adguardhome-sync:
              image: ghcr.io/bakito/adguardhome-sync:latest@sha256:157e509baeef66cd400dae96c955a1e97312670e0285a92ebe2c3465b3e22e67
              container_name: adguardhome-sync
              restart: unless-stopped
              mem_limit: 128m
              environment:
                - ORIGIN_URL=http://10.0.20.2:3001
                - ORIGIN_USERNAME=dw
                - ORIGIN_PASSWORD={{ adguard_ui_password }}
                - REPLICA_URL=http://10.0.20.3:3001
                - REPLICA_USERNAME=dw
                - REPLICA_PASSWORD={{ adguard_ui_password }}
                - CRON=*/15 * * * *
        mode: '0644'

    - name: Start AdGuardHome-Sync
      community.docker.docker_compose_v2:
        project_src: /opt/adguardhome-sync
        state: present
