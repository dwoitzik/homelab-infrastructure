---
- name: Purge Proxmox Enterprise repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pbs-enterprise.list
    - /etc/apt/sources.list.d/pbs-enterprise.sources
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/pve-enterprise.sources

- name: Remove enterprise lines from main sources.list
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*enterprise\.proxmox\.com.*'
    state: absent

- name: Install gnupg and ca-certificates
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
    state: present
    update_cache: true

- name: Download Proxmox release key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
    mode: '0644'

- name: Add Proxmox Backup Server repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pbs trixie pbs-no-subscription"
    state: present
    filename: pbs

- name: Install Proxmox Backup Server package
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present

# PBS is host-native now (ct-mgmt-pbs-01/110 no longer exists). Used to
# bind-mount storage into that container's config; dead code.

# REL-051: the account owner deliberately disabled this offsite sync themselves --
# insufficient Google Drive storage quota for PBS's datastore, not a bug. Keep the
# config/script deployed (harmless, useful if re-enabled later with more Drive space
# or a different destination) but the cron job stays state: absent on purpose.
- name: Deploy rclone config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    mode: "0600"

- name: Deploy pbs-to-gdrive sync script
  ansible.builtin.template:
    src: pbs-to-gdrive.sh.j2
    dest: /usr/local/bin/pbs-to-gdrive.sh
    mode: "0750"

- name: Ensure rclone sync cron job is NOT scheduled (deliberately disabled, REL-051)
  ansible.builtin.cron:
    name: "PBS to GDrive offsite backup"
    user: root
    state: absent
