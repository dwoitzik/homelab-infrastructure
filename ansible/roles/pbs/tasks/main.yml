---
- name: Purge Proxmox Enterprise repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pbs-enterprise.list
    - /etc/apt/sources.list.d/pbs-enterprise.sources
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/pve-enterprise.sources

- name: Remove enterprise lines from main sources.list
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*enterprise\.proxmox\.com.*'
    state: absent

- name: Install gnupg and ca-certificates
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
    state: present
    update_cache: true

- name: Download Proxmox release key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
    # Pinned: without a checksum get_url reports a change on every --check run.
    checksum: sha256:1bcd2d5bab556076c9ea756a84fe2b7445b13f4ef6e97b2e412b68778377ba6d
    mode: '0644'

# deb822 to match this host's other sources; the old one-line apt_repository
# task wrote pbs.list alongside the pre-existing pbs.sources for the same repo,
# so apt warned "configured multiple times" on every update.
- name: Add Proxmox Backup Server repository
  ansible.builtin.deb822_repository:
    name: pbs
    types: deb
    uris: http://download.proxmox.com/debian/pbs
    suites: trixie
    components: pbs-no-subscription
    # The key downloaded above, so the repo doesn't depend on the archive-keyring package.
    signed_by: /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
    state: present

- name: Remove the legacy one-line PBS source that duplicated the deb822 entry
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pbs.list
    state: absent

- name: Install Proxmox Backup Server package
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present

# PBS is host-native now (ct-mgmt-pbs-01/110 no longer exists). Used to
# bind-mount storage into that container's config; dead code.

# REL-051: the account owner deliberately disabled this offsite sync themselves --
# insufficient Google Drive storage quota for PBS's datastore, not a bug. Keep the
# config/script deployed (harmless, useful if re-enabled later with more Drive space
# or a different destination) but the cron job stays state: absent on purpose.
- name: Ensure rclone config directory exists
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    mode: "0700"

# Separate config file from pve_host_backup's rclone.conf: both roles run on
# pve-mgmt-01, and a shared default path meant whichever ran last silently
# replaced the other's remote (this one holds the offsite gdrive remote).
- name: Deploy rclone config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/pbs-offsite.conf
    mode: "0600"

- name: Deploy pbs-to-gdrive sync script
  ansible.builtin.template:
    src: pbs-to-gdrive.sh.j2
    dest: /usr/local/bin/pbs-to-gdrive.sh
    mode: "0750"

- name: Ensure rclone sync cron job is NOT scheduled (deliberately disabled, REL-051)
  ansible.builtin.cron:
    name: "PBS to GDrive offsite backup"
    user: root
    state: absent

- name: Read the vzdump backup job
  ansible.builtin.command:
    cmd: pvesh get /cluster/backup/{{ pbs_vzdump_job_id }} --output-format json
  register: pbs_vzdump_job
  changed_when: false
  check_mode: false

- name: Run the vzdump backup job daily
  ansible.builtin.command:
    cmd: pvesh set /cluster/backup/{{ pbs_vzdump_job_id }} --schedule '{{ pbs_vzdump_schedule }}'
  when: (pbs_vzdump_job.stdout | from_json).schedule != pbs_vzdump_schedule
  changed_when: true

- name: Read the PBS verify jobs
  ansible.builtin.command:
    cmd: proxmox-backup-manager verify-job list --output-format json
  register: pbs_verify_jobs
  changed_when: false
  check_mode: false

- name: Create the weekly verify job
  ansible.builtin.command:
    cmd: >-
      proxmox-backup-manager verify-job create {{ pbs_verify_job_id }}
      --store {{ pbs_datastore }} --schedule '{{ pbs_verify_schedule }}'
      --ignore-verified true --outdated-after {{ pbs_verify_outdated_after_days }}
  when: pbs_verify_job_id not in (pbs_verify_jobs.stdout | from_json | map(attribute='id') | list)
  changed_when: true

- name: Keep the weekly verify job's settings
  ansible.builtin.command:
    cmd: >-
      proxmox-backup-manager verify-job update {{ pbs_verify_job_id }}
      --schedule '{{ pbs_verify_schedule }}'
      --ignore-verified true --outdated-after {{ pbs_verify_outdated_after_days }}
  vars:
    pbs_verify_job_live: "{{ pbs_verify_jobs.stdout | from_json | selectattr('id', 'equalto', pbs_verify_job_id) | first | default({}) }}"
  when:
    - pbs_verify_job_live | length > 0
    - (pbs_verify_job_live.schedule | default('') != pbs_verify_schedule)
      or (pbs_verify_job_live['outdated-after'] | default(0) | int != pbs_verify_outdated_after_days)
      or (pbs_verify_job_live['ignore-verified'] | default(true) | bool is false)
  changed_when: true

# GC and verify only report in the PBS task log; this publishes their outcome.
- name: Deploy the PBS job metrics script
  ansible.builtin.copy:
    src: pbs-job-metrics.py
    dest: /usr/local/sbin/pbs-job-metrics.py
    owner: root
    group: root
    mode: '0750'

- name: Publish PBS job metrics every 15 minutes
  ansible.builtin.cron:
    name: pbs-job-metrics
    user: root
    minute: "*/15"
    job: /usr/local/sbin/pbs-job-metrics.py {{ pbs_datastore }} {{ pbs_verify_job_id }} {{ pbs_textfile_dir }}
