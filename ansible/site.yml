---
- name: Provision Base OS and Docker infrastructure
  hosts: nodes
  become: true
  roles:
    - common
    - docker
    - monitoring_agent

# 2026-08-17 (BRIEFING-V4.md Section C / Phase 2): watchtower removed.
# Auto-pulling :latest on live containers directly contradicts having
# Renovate (which already handles version bumps via reviewed PRs) and
# GitOps generally -- two different systems racing to change the same
# running state, one of them with no review step and no record of what
# changed or when. Updates come through the repo (Renovate PR -> merge ->
# redeploy) or not at all now. Confirmed live before writing this: only 3
# hosts in the `nodes` group actually had it running (ct-srv-docker-01,
# ct-dmz-proxy-01, ct-dmz-games-01) -- media-acq/ai/jellyfin/nfs/atlantis
# were never in this group and never ran it.

# 2026-08-13: k3s_nodes was never in the `nodes` group, so these hosts never
# received `common` (including its inotify limits sysctl, whose own comment
# says it's "for k3s/container workloads" -- a gap that predates this
# recovery, now closed). docker is deliberately excluded here -- k3s uses
# containerd directly.
#
# 2026-08-23: node_exporter_native removed from this play -- these nodes
# already run kube-prometheus-stack's own node-exporter DaemonSet (that's
# what apps like node-exporter-rpi/app/ai/pve's custom scrape jobs exist
# to cover for hosts *without* the DaemonSet). Both were binding :9100;
# since systemd starts before kubelet on boot, the native one usually won
# the race -- confirmed live: the DaemonSet pods on all 3 nodes showed
# real restart histories (20-92 restarts) from losing that exact fight.
# Surfaced tonight as a `node_exporter.service` restart-handler failure
# ("address already in use") while applying an unrelated fix (inotify
# limits, common role, for a separate promtail/crowdsec crash on the
# same node -- coincidence of timing, not a shared root cause). Native
# node_exporter stopped and disabled live on all 3 nodes.
- name: Provision K3s Node Base OS
  hosts: k3s_nodes
  become: true
  roles:
    - common
    - k3s_node_tuning

- name: Provision HA Core Services & Gateway
  hosts: rpi_nodes
  become: true
  pre_tasks:
    - name: Stop Nginx Proxy Manager Docker stack
      community.docker.docker_compose_v2:
        project_src: /opt/npm
        state: absent
      failed_when: false

  roles:
    - rpi_optimize
    - keepalived
    - adguard
    - unbound
    - haproxy

- name: Provision Management Services
  hosts: mgmt_nodes
  become: true
  roles:
    - node_exporter_native
    - pbs

# node_exporter_native first -- nginx_proxy_manager's CrowdSec healthcheck
# needs the node_exporter user + textfile dir to already exist.
- name: Provision DMZ External Proxy
  hosts: dmz_proxies
  become: true
  roles:
    - node_exporter_native
    - nginx_proxy_manager
    - crowdsec_bouncer

# These 6 groups were never in `nodes` and had no dedicated play running
# `common` either -- same gap class as the k3s_nodes fix above, never
# closed for them (no unattended-upgrades on any of them).
- name: Provision Scanopy MGMT-VLAN Daemon
  hosts: scanopy_daemon_nodes
  become: true
  roles:
    - common
    - scanopy_daemon

- name: Provision Rybbit Analytics
  hosts: rybbit_nodes
  become: true
  roles:
    - common
    - rybbit

- name: Provision DMZ Game Servers
  hosts: dmz_games
  become: true
  roles:
    - minecraft

- name: Provision AI & LLM Services
  hosts: ai_nodes
  become: true
  roles:
    - common
    - node_exporter_native
    - ollama

- name: Provision Media Acquisition Stack (Mullvad-wrapped)
  hosts: media_acq_nodes
  become: true
  roles:
    - common
    - docker
    - node_exporter_native
    - media_acquisition

- name: Provision Jellyfin (hardware transcode)
  hosts: jellyfin_nodes
  become: true
  roles:
    - common
    - docker
    - node_exporter_native
    - jellyfin

- name: Provision NFS Storage Server
  hosts: nfs_nodes
  become: true
  roles:
    - common
    - nfs_server

- name: Provision Atlantis (GitOps runner, ADR-012)
  hosts: atlantis_nodes
  become: true
  roles:
    - common
    - docker
    - node_exporter_native
    - atlantis
    # ADR-021: self-hosted GitHub Actions runner on the same host, replacing
    # Atlantis's public webhook. Software staging (download/extract/deps)
    # runs unconditionally; registration + the systemd service are gated on
    # github_actions_runner_registration_token being supplied at run time
    # (--extra-vars only -- never committed, never vaulted, expires within
    # the hour). Atlantis's own container is retained as the terraform/CA-
    # trust execution environment workflow steps run inside, not replaced.
    - github_actions_runner

- name: Proxmox Host — Power Management
  hosts: pve_hosts
  become: true
  roles:
    - pve_power
    - node_exporter_native
    # BRIEFING-V4.md Phase 3: PBS's own nightly-backup job covers VMs/CTs,
    # never the hypervisor's own config (/etc/pve, network config) --
    # confirmed live, a real gap. Daily to Garage S3, staggered an hour
    # after PBS's own 03:00 job.
    - pve_host_backup
    # Item 5 of the 2026-08-23 steady-state consolidation goal: the
    # Prometheus-based NVMeWearWarning/NVMeWearCritical alerts exist as code
    # but don't fire yet (node-exporter-pve blocked by the unapplied
    # fwd_04a_srv_monitoring firewall rule) -- runs directly on the host
    # instead, no dependency on that pipeline.
    - ssd_wear_check
