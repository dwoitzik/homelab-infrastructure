---
- name: Provision Base OS and Docker infrastructure
  hosts: nodes
  become: true
  roles:
    - common
    - docker
    - watchtower
    - monitoring_agent

- name: Provision HA Core Services & Gateway
  hosts: rpi_nodes
  become: true
  pre_tasks:
    - name: Stop Nginx Proxy Manager Docker stack
      community.docker.docker_compose_v2:
        project_src: /opt/npm
        state: absent
      failed_when: false

  roles:
    - rpi_optimize
    - keepalived
    - adguard
    - unbound
    - haproxy

- name: Provision Management Services
  hosts: mgmt_nodes
  become: true
  roles:
    - node_exporter_native
    - pbs

- name: Provision DMZ External Proxy
  hosts: dmz_proxies
  become: true
  roles:
    - nginx_proxy_manager
    - crowdsec_bouncer

- name: Provision DMZ Game Servers
  hosts: dmz_games
  become: true
  roles:
    - minecraft

- name: Provision AI & LLM Services
  hosts: ai_nodes
  become: true
  roles:
    - node_exporter_native
    - ollama

- name: Provision Media Acquisition Stack (Mullvad-wrapped)
  hosts: media_acq_nodes
  become: true
  roles:
    - docker
    - node_exporter_native
    - media_acquisition

- name: Provision NFS Storage Server
  hosts: nfs_nodes
  become: true
  roles:
    - nfs_server

- name: Proxmox Host — Power Management
  hosts: pve_hosts
  become: true
  roles:
    - pve_power
    - node_exporter_native
