---
- name: Provision Base OS and Docker infrastructure
  hosts: nodes
  become: true
  roles:
    - common
    - docker
    - watchtower
    - monitoring_agent

# 2026-08-13: k3s_nodes was never in the `nodes` group, so these hosts never
# received `common` (including its inotify limits sysctl, whose own comment
# says it's "for k3s/container workloads" -- a gap that predates this
# recovery, now closed) or node_exporter_native. docker/watchtower are
# deliberately excluded here -- k3s uses containerd directly, and
# Watchtower auto-updating k3s-managed containers out from under the
# scheduler would fight GitOps/ArgoCD's own reconciliation.
- name: Provision K3s Node Base OS
  hosts: k3s_nodes
  become: true
  roles:
    - common
    - node_exporter_native
    - k3s_node_tuning

- name: Provision HA Core Services & Gateway
  hosts: rpi_nodes
  become: true
  pre_tasks:
    - name: Stop Nginx Proxy Manager Docker stack
      community.docker.docker_compose_v2:
        project_src: /opt/npm
        state: absent
      failed_when: false

  roles:
    - rpi_optimize
    - keepalived
    - adguard
    - unbound
    - haproxy

- name: Provision Management Services
  hosts: mgmt_nodes
  become: true
  roles:
    - node_exporter_native
    - pbs

- name: Provision DMZ External Proxy
  hosts: dmz_proxies
  become: true
  roles:
    - nginx_proxy_manager
    - crowdsec_bouncer

- name: Provision DMZ Game Servers
  hosts: dmz_games
  become: true
  roles:
    - minecraft

- name: Provision AI & LLM Services
  hosts: ai_nodes
  become: true
  roles:
    - node_exporter_native
    - ollama

- name: Provision Media Acquisition Stack (Mullvad-wrapped)
  hosts: media_acq_nodes
  become: true
  roles:
    - docker
    - node_exporter_native
    - media_acquisition

- name: Provision Jellyfin (hardware transcode)
  hosts: jellyfin_nodes
  become: true
  roles:
    - docker
    - node_exporter_native
    - jellyfin

- name: Provision NFS Storage Server
  hosts: nfs_nodes
  become: true
  roles:
    - nfs_server

- name: Provision Atlantis (GitOps runner, ADR-012)
  hosts: atlantis_nodes
  become: true
  roles:
    - docker
    - node_exporter_native
    - atlantis

- name: Proxmox Host — Power Management
  hosts: pve_hosts
  become: true
  roles:
    - pve_power
    - node_exporter_native
