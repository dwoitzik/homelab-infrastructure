---
# Privacy model: NZBHydra2 indexer search exits via Tor (fail-closed proxy in
# Hydra config), SABnzbd downloads go direct to Eweka over SSL. Images are
# Renovate-digest-pinned and converge from git main (ADR-054).
networks:
  media-acq-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

services:
  tor:
    image: peterdavehello/tor-socks-proxy:latest@sha256:0cc12d36d31265ce828c8422a7e163a0bf46755e90531f4c7d38a6149f071729
    container_name: tor
    networks:
      media-acq-net:
        ipv4_address: 172.28.1.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9150 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest@sha256:7d272e5d458dc0d20399a28bf41efcecdfef334c5220067546ea80cf6692966a
    container_name: nzbhydra2
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/nzbhydra2/config:/config
    ports:
      - "5076:5076"
    depends_on:
      - tor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5076/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:cc7abeeafa20dfba0637d30c60bc70b79656e427c60681cb411fd7b211a39435
    container_name: sabnzbd
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/sabnzbd/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "8080:8080"
    # Lowest IO weight so unrar/download writes never saturate the NVMe
    # and starve other processes (etcd WAL, PostgreSQL, etc.).
    blkio_config:
      weight: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:5c943771636f8f13b833efc0eae81b9373737435a262503a29157842c052ed0b
    container_name: sonarr
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/sonarr/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "8989:8989"
    blkio_config:
      weight: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    container_name: radarr
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/radarr/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "7878:7878"
    blkio_config:
      weight: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:b3db4247d3afa0c68bc5aa311bedd67b1caf4b3eabc3a85577682970435d5013
    container_name: bazarr
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/bazarr/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "6767:6767"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  # Jellyseerr was renamed to Seerr; the old image is frozen at 2.7.3. Container
  # and volume names are kept so the gitops rollback and the Ansible settings
  # task stay valid; Seerr migrates the data automatically on first start.
  jellyseerr:
    image: seerr/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    container_name: jellyseerr
    # Seerr ships no init process; runs as the node user (UID 1000), so the
    # config dir must be owned 1000:1000 (see the media_acquisition role).
    init: true
    networks:
      - media-acq-net
    environment:
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
    volumes:
      - /opt/media-acq/jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5055/api/v1/settings/public"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  autoheal:
    # Force-restarts any sibling that goes "unhealthy" -- the class of failure
    # `restart: unless-stopped` misses: a process still running but hung.
    image: willfarrell/autoheal:latest@sha256:a7ecfb0f179d50c2b5c008726fedf8c939eace5bd5faa95b48f20976f869e17a
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
