---
# Privacy model: NZBHydra2 indexer search exits via Tor (fail-closed proxy in
# Hydra config), SABnzbd downloads go direct to Eweka over SSL. Images are
# Renovate-digest-pinned and converge from git main (ADR-054).
networks:
  media-acq-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

services:
  tor:
    image: peterdavehello/tor-socks-proxy:latest@sha256:0cc12d36d31265ce828c8422a7e163a0bf46755e90531f4c7d38a6149f071729
    container_name: tor
    networks:
      media-acq-net:
        ipv4_address: 172.28.1.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9150 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest@sha256:177bea1fb1246dcbba796862db09b716e6e77b9d534b12b2d5e3951bd407bcca
    container_name: nzbhydra2
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/nzbhydra2/config:/config
    ports:
      - "5076:5076"
    depends_on:
      - tor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5076/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:793828eab1722556131d37187115a9d3e3b9703e03a55731a07f2e0fe4edc2c7
    container_name: sabnzbd
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/sabnzbd/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "8080:8080"
    # Lowest IO weight so unrar/download writes never saturate the NVMe
    # and starve other processes (etcd WAL, PostgreSQL, etc.).
    blkio_config:
      weight: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    container_name: sonarr
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/sonarr/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "8989:8989"
    blkio_config:
      weight: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:7dfd049e79c00b16fbc29c3f5d96a9e7b9e73a23930b4c5b3c4541d60b366814
    container_name: radarr
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/radarr/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "7878:7878"
    blkio_config:
      weight: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
    container_name: bazarr
    networks:
      - media-acq-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /opt/media-acq/bazarr/config:/config
      - /media:/media
      - /downloads/incomplete:/downloads/incomplete
    ports:
      - "6767:6767"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    container_name: jellyseerr
    networks:
      - media-acq-net
    environment:
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
    volumes:
      - /opt/media-acq/jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5055/api/v1/status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped

  autoheal:
    # Force-restarts any sibling that goes "unhealthy" -- the class of failure
    # `restart: unless-stopped` misses: a process still running but hung.
    image: willfarrell/autoheal:latest@sha256:de43e0064cee59af1a7a19f921f2cf10727e390dfcba2cc7d26ce9e2506e0bfe
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
