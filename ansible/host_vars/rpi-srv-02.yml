---
# Upgrades never overlap with the other DNS Pi.
common_apt_upgrade_time: "06:40"
# The SSD's JMicron JMS583 bridge (152d:0583) aborts and disconnects under UAS.
rpi_optimize_usb_storage_quirks:
  - "152d:0583:u"
# Root filesystem lives on the SSD (docs/runbooks/rpi-srv-02-ssd-boot.md); the
# SD card stays bootable as the fallback in the boot order.
rpi_optimize_eeprom_boot_order: "0xf14"
rpi_optimize_ssd_mount:
  path: /mnt/ssd
  uuid: 82267fae-e08c-441b-a534-bebf3ed407d7
# Authelia's Postgres standby (ADR-030): after a promotion Authelia connects
# from the k3s nodes (pods are SNATed to the node address).
rpi_optimize_hostfw_extra_rules:
  - "ip saddr { 10.0.20.11, 10.0.20.12, 10.0.20.13 } tcp dport 5432 accept"
  # Standby TLS front end (ADR-088); 443 is already open for the haproxy VIP.
  # 8443 takes internet clients from the router's failover dst-nat (headscale
  # only); 8081 is the health endpoint for router netwatch and blackbox probes.
  - "tcp dport 8443 accept"
  - "ip saddr { 10.0.20.1, 10.0.20.11, 10.0.20.12, 10.0.20.13 } tcp dport 8081 accept"
