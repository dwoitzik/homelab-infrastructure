name: Terraform Plan (ADR-021)

# Replaces Atlantis's webhook-driven `atlantis plan` PR comment. Atlantis's
# own webhook has no working inbound path since ADR-033 removed
# atlantis.woitzik.dev's public DNS/tunnel entry (see ADR-021's Context) --
# this reproduces the same comment-triggered UX using a self-hosted runner
# that polls GitHub outbound, so no inbound path is needed at all.
#
# Comment syntax matches Atlantis's own: `atlantis plan -d <stack>`, where
# <stack> is one of network/proxmox/cloudflare/garage (terraform/stacks/*).

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  plan:
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'atlantis plan')
    runs-on: self-hosted
    steps:
      - name: Acknowledge the comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Resolve PR head ref
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            // The self-hosted runner holds the infra credentials; never run fork code on it.
            if (pr.data.head.repo === null || pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Refusing to run: PR head is not a branch of this repository.');
              return;
            }
            core.setOutput('sha', pr.data.head.sha);

      - name: Parse stack name from comment
        id: parse
        env:
          # Passed via env, never interpolated directly into the script --
          # a PR comment is untrusted input; direct ${{ }} interpolation
          # into a run: block is a known GitHub Actions script-injection
          # pattern (the comment body becomes part of the shell script
          # itself). Referencing $COMMENT_BODY avoids that entirely.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          STACK=$(echo "$COMMENT_BODY" | grep -oE -- '-d[[:space:]]+[a-zA-Z0-9_/-]+' | head -1 | awk '{print $2}')
          if [ -z "$STACK" ]; then
            echo "No -d <stack> found in comment (expected: atlantis plan -d <network|proxmox|cloudflare|garage>)" >&2
            exit 1
          fi
          if [ ! -d "terraform/stacks/$STACK" ]; then
            echo "terraform/stacks/$STACK does not exist" >&2
            exit 1
          fi
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      # Runs inside Atlantis's own custom image (base atlantis image +
      # trusted Proxmox CA, see ansible/roles/atlantis/files/Dockerfile) so
      # the pinned Terraform version and CA trust match exactly what the
      # repo has used all along -- not a second, drifting toolchain.
      # --env-file references a host-local file (ansible/roles/atlantis's
      # terraform-runner.env.j2), the same Vault-sourced credentials
      # Atlantis's own container already runs with -- never duplicated into
      # GitHub Secrets.

      # --user matches the container to the runner's own uid:gid -- the
      # image's baked-in uid 100 can't write $GITHUB_WORKSPACE, owned by
      # the actions-runner account, so `terraform init` failed otherwise.
      - name: Terraform init + plan
        id: tfplan
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "/workspace/terraform/stacks/${{ steps.parse.outputs.stack }}" \
            --env-file /opt/atlantis/terraform-runner.env \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --entrypoint sh \
            atlantis-custom:v0.46.0 \
            -c "terraform init -input=false -no-color && terraform plan -input=false -no-color" \
            2>&1 | tee /tmp/tfplan-${{ github.run_id }}.txt
        continue-on-error: true

      - name: Write plan output into the PR description
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/tfplan-${{ github.run_id }}.txt';
            let output = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(no output captured)';
            // Plan and apply share the PR description (limit ~65536 chars); keep the tail, plans
            // usually have the useful summary at the end.
            if (output.length > 25000) {
              output = '... (truncated, showing last 25000 chars) ...\n' + output.slice(-25000);
            }
            const stack = '${{ steps.parse.outputs.stack }}';
            const outcome = '${{ steps.tfplan.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            // Output goes into a marked section of the PR description, edited in
            // place: description edits send no email, bot comments on the
            // owner's PRs emailed the owner on every plan and apply.
            const start = `<!-- terraform:${stack}:plan -->`;
            const end = `<!-- /terraform:${stack}:plan -->`;
            const section = `${start}\n<details><summary>${icon} Terraform Plan: <code>${stack}</code> (${new Date().toISOString()})</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>\n${end}`;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number,
            });
            const current = pr.body || '';
            const i = current.indexOf(start);
            const j = current.indexOf(end);
            const body = i !== -1 && j > i
              ? current.slice(0, i) + section + current.slice(j + end.length)
              : `${current}\n\n${section}`;
            await github.rest.pulls.update({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, body,
            });
