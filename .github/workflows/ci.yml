name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  terraform-network:
    name: Terraform / network
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/network

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  terraform-proxmox:
    name: Terraform / proxmox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/proxmox

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  terraform-cloudflare:
    name: Terraform / cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/cloudflare

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install "ansible-lint==26.4.0" "ansible-core>=2.16,<2.19"

      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write vault password file
        run: printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.ansible_vault_pass

      - name: ansible-lint
        run: ansible-lint
        working-directory: ansible

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md" "!terraform/**" "!ansible/k3s-cluster/**" "!CLAUDE.local.md"

  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform

      # Without this, kubeconform re-fetches every schema from
      # raw.githubusercontent.com on every single run -- hit that CDN's rate
      # limit (429) repeatedly during a busy PR session, failing CI for
      # commits that touched zero Kubernetes manifests. Cache persists the
      # downloaded schemas across runs so a stable k8s version only needs to
      # fetch each schema once.
      - name: Cache kubeconform schemas
        uses: actions/cache@v4
        with:
          path: /tmp/kubeconform-cache
          key: kubeconform-schemas-1.31.0-${{ hashFiles('kubernetes/**/*.yml', 'kubernetes/**/*.yaml') }}
          restore-keys: |
            kubeconform-schemas-1.31.0-

      - name: Validate k8s manifests
        run: |
          mkdir -p /tmp/kubeconform-cache
          find kubernetes/ -name "*.yaml" -o -name "*.yml" \
            | grep -v users_database \
            | xargs kubeconform \
                -kubernetes-version 1.31.0 \
                -cache /tmp/kubeconform-cache \
                -ignore-missing-schemas \
                -summary \
                -exit-on-error

  security-scan:
    name: Security / Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan k8s manifests for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan Terraform for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan k8s manifests (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Security / Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Scan for secrets (against known-leak baseline)
        run: gitleaks detect --baseline-path .gitleaks-baseline.json --no-banner -v
