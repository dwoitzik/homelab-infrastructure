name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  terraform-network:
    name: Terraform / network
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/network

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  terraform-proxmox:
    name: Terraform / proxmox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/proxmox

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  host-memory-overcommit-guard:
    name: Host memory overcommit guard (REL-035b, two-tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hard gate (VM reservations + ARC + host reserve vs 44 GB) fails this
      # job; the LXC soft check inside the same script only warns and never
      # affects its exit code. See scripts/check-host-memory-overcommit.py.
      - name: Check host memory allocation on mini
        run: python3 scripts/check-host-memory-overcommit.py

  terraform-cloudflare:
    name: Terraform / cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/cloudflare

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  terraform-garage:
    name: Terraform / garage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/garage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install "ansible-lint==26.4.0" "ansible-core>=2.16,<2.19"

      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write vault password file
        run: printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.ansible_vault_pass

      - name: ansible-lint
        run: ansible-lint
        working-directory: ansible

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md" "!terraform/**" "!ansible/k3s-cluster/**" "!CLAUDE.local.md"

  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform

      # PR #306's actions/cache fix only reduced how often kubeconform hit
      # raw.githubusercontent.com's rate limit (429) -- a cold/evicted cache,
      # or a manifest touching a not-yet-cached schema, still fell through to
      # a live network call and could still hard-fail CI. Schemas for every
      # built-in kind actually used under kubernetes/ are now vendored in
      # ci/kubeconform-schemas/ (see its README) and read via -schema-location,
      # so this validates fully offline -- no network call, no flake, ever.
      # CRD kinds with no upstream schema (Application, IngressRoute, etc.)
      # still resolve as "missing" and are skipped, same as before.
      - name: Validate k8s manifests
        run: |
          find kubernetes/ -name "*.yaml" -o -name "*.yml" \
            | grep -v users_database \
            | xargs kubeconform \
                -kubernetes-version 1.31.0 \
                -schema-location "ci/kubeconform-schemas/{{ .NormalizedKubernetesVersion }}-standalone/{{ .ResourceKind }}{{ .KindSuffix }}.json" \
                -ignore-missing-schemas \
                -summary \
                -exit-on-error

  prometheus-rules:
    # PrometheusRule CRDs are skipped by kubeconform (no upstream schema), so
    # nothing validated the rule bodies until now. A typo in an expr, a missing
    # 'for', or a bad label only surfaces as a silently dead alert at runtime.
    name: Prometheus rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool and yq
        run: |
          curl -sL --fail \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            -o /tmp/prometheus.tar.gz
          tar xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 /tmp/prometheus-3.5.0.linux-amd64/promtool /usr/local/bin/promtool
          # Installed explicitly rather than relying on the runner image: a
          # yq major bump changes 'ea' semantics and would silently alter what
          # gets validated here.
          curl -sL --fail \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod 0755 /usr/local/bin/yq
          promtool --version
          yq --version

      # 'ea' because several of these files hold more than one PrometheusRule
      # document, and promtool only understands the bare rule group, not the
      # CRD wrapper -- hence .spec before the pipe.
      - name: Check alerting rule syntax
        run: |
          status=0
          while IFS= read -r f; do
            printf '=== %s\n' "$f"
            yq ea '.spec' "$f" | promtool check rules /dev/stdin || status=1
          done < <(grep -rl 'kind: PrometheusRule' kubernetes/ --include='*.yml' --include='*.yaml')
          exit $status

  security-scan:
    name: Security / Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan k8s manifests for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan Terraform for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan k8s manifests (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Security / Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Scan for secrets (against known-leak baseline)
        run: gitleaks detect --baseline-path .gitleaks-baseline.json --no-banner -v
