name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  terraform-network:
    name: Terraform / network
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/network

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  terraform-proxmox:
    name: Terraform / proxmox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/proxmox

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  host-memory-overcommit-guard:
    name: Host memory overcommit guard (REL-035b, two-tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Hard gate (VM reservations + ARC + host reserve vs 44 GB) fails this
      # job; the LXC soft check inside the same script only warns and never
      # affects its exit code. See scripts/check-host-memory-overcommit.py.
      - name: Check host memory allocation on mini
        run: python3 scripts/check-host-memory-overcommit.py

  terraform-cloudflare:
    name: Terraform / cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/cloudflare

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  terraform-garage:
    name: Terraform / garage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/garage

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.63.1

      - name: TFLint
        run: tflint

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install "ansible-lint==26.4.0" "ansible-core>=2.16,<2.19"

      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write vault password file
        run: printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.ansible_vault_pass

      - name: ansible-lint
        run: ansible-lint
        working-directory: ansible

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md" "!terraform/**" "!ansible/k3s-cluster/**" "!CLAUDE.local.md"

  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform

      # PR #306's actions/cache fix only reduced how often kubeconform hit
      # raw.githubusercontent.com's rate limit (429) -- a cold/evicted cache,
      # or a manifest touching a not-yet-cached schema, still fell through to
      # a live network call and could still hard-fail CI. Schemas for every
      # built-in kind actually used under kubernetes/ are now vendored in
      # ci/kubeconform-schemas/ (see its README) and read via -schema-location,
      # so this validates fully offline -- no network call, no flake, ever.
      # CRD kinds with no upstream schema (Application, IngressRoute, etc.)
      # still resolve as "missing" and are skipped, same as before.
      - name: Validate k8s manifests
        run: |
          find kubernetes/ -name "*.yaml" -o -name "*.yml" \
            | grep -v users_database \
            | xargs kubeconform \
                -kubernetes-version 1.31.0 \
                -schema-location "ci/kubeconform-schemas/{{ .NormalizedKubernetesVersion }}-standalone/{{ .ResourceKind }}{{ .KindSuffix }}.json" \
                -ignore-missing-schemas \
                -summary \
                -exit-on-error

  security-scan:
    name: Security / Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Scan k8s manifests for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan Terraform for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan k8s manifests (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Security / Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Scan for secrets (against known-leak baseline)
        run: gitleaks detect --baseline-path .gitleaks-baseline.json --no-banner -v
