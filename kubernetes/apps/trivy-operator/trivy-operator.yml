apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    app.kubernetes.io/part-of: trivy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator
  namespace: trivy-system
data:
  trivy.severity: "CRITICAL,HIGH"
  trivy.timeout: "5m0s"
  trivy.resources.limits.cpu: "500m"
  trivy.resources.limits.memory: "500Mi"
  trivy.resources.requests.cpu: "100m"
  trivy.resources.requests.memory: "100Mi"
  scanJob.ttl: "1h"
  scanJob.deleteFinished: "true"
  vulnerabilityReports.scanner: "Trivy"
  configAuditReports.scanner: "Trivy"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-operator
  namespace: trivy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "serviceaccounts", "namespaces", "nodes", "replicationcontrollers", "limitranges", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports", "rbacauditreports", "exposedsecretreports", "clustervulnerabilityreports", "clusterconfigauditreports", "clusterrbacauditreports", "clusterexposedsecretreports", "infraassessmentreports", "clusterinfraassessmentreports", "sbomreports", "clustersbomreports", "clustercompliancereports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator
subjects:
  - kind: ServiceAccount
    name: trivy-operator
    namespace: trivy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-operator
    spec:
      serviceAccountName: trivy-operator
      containers:
        - name: trivy-operator
          image: docker.io/aquasec/trivy-operator:0.32.0
          args:
            - --overwrite
          env:
            - name: TRIVY_CACHE_DIR
              value: "/tmp/trivy-cache"
            - name: OPERATOR_LOG_LEVEL
              value: "info"
            - name: OPERATOR_NAMESPACE
              value: "trivy-system"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /tmp/trivy-cache
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
spec:
  selector:
    app.kubernetes.io/name: trivy-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
