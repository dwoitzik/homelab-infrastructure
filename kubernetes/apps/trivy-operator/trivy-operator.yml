apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    app.kubernetes.io/part-of: trivy
---
# REL-012c: catch-up scan storms after a node reboot were pushing etcd
# apply latency past its 100ms budget on the control-plane node and
# contributing to API Server outages. Give every scan job the lowest
# priority class so the scheduler evicts scanner pods first under load,
# and cap concurrent scan jobs so a backlog drains gradually instead of
# hammering every node at once.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: trivy-scan
value: -1000000
globalDefault: false
description: "Lowest-priority class for Trivy scan jobs; evicted first under node pressure."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator
  namespace: trivy-system
data:
  trivy.severity: "CRITICAL,HIGH"
  trivy.timeout: "5m0s"
  trivy.resources.limits.cpu: "500m"
  trivy.resources.limits.memory: "1Gi"
  trivy.resources.requests.cpu: "100m"
  trivy.resources.requests.memory: "100Mi"
  scanJob.ttl: "1h"
  scanJob.deleteFinished: "true"
  scanJob.podPriorityClassName: "trivy-scan"
  scanJob.tolerations: '[{"key":"kubernetes.io/scheduling-preference","operator":"Exists","effect":"PreferNoSchedule"}]'
  vulnerabilityReports.scanner: "Trivy"
  configAuditReports.scanner: "Trivy"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-operator
  namespace: trivy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
rules:
- apiGroups: [""]
  resources: ["configmaps", "limitranges", "nodes", "persistentvolumeclaims", "persistentvolumes", "pods", "replicationcontrollers", "resourcequotas", "services", "serviceaccounts"]
  verbs: ["get", "list", "watch"]
  # 2026-08-16 (KSV-0041, trivy config-scan finding): dropped create/update/patch
  # here -- cluster-wide write access to every Secret in every namespace, flagged
  # during today's credential rotation work. The namespace-scoped `Role` below
  # (trivy-system only) already grants write access to secrets where the operator
  # actually needs it (its own registry-credential-cache secrets); this ClusterRole
  # only needs read access for the actual scanning work, which is genuinely
  # cluster-wide.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["aquasecurity.github.io"]
  resources: ["clustercompliancedetailreports", "clustercompliancereports", "clusterconfigauditreports", "clusterinfraassessmentreports", "clusterrbacassessmentreports", "clustersbomreports", "clustervulnerabilityreports", "configauditreports", "exposedsecretreports", "infraassessmentreports", "rbacassessmentreports", "sbomreports", "vulnerabilityreports"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["aquasecurity.github.io"]
  resources: ["clustercompliancereports/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings", "clusterroles", "rolebindings", "roles"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator
subjects:
  - kind: ServiceAccount
    name: trivy-operator
    namespace: trivy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trivy-operator
  namespace: trivy-system
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trivy-operator
  namespace: trivy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trivy-operator
subjects:
- kind: ServiceAccount
  name: trivy-operator
  namespace: trivy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
spec:
  # 2026-08-22: paused (replicas: 0) during a sustained host load incident
  # (40+, I/O-bound -- NVMe queue depth pegged, matches the REL-012c
  # pattern this operator was already tuned for once). A manual `kubectl
  # scale --replicas=0` didn't hold -- ArgoCD's selfHeal reverted it within
  # a reconcile cycle, letting trivy-operator keep respawning concurrent
  # scan jobs (OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT=3 caps job count, not
  # the I/O each concurrent image-layer extraction generates) the whole
  # time load never cleanly recovered. Git-tracked this time so selfHeal
  # can't silently undo it. Re-enable (replicas: 1) once host load is
  # back to baseline and the operator's own scan-job I/O footprint has
  # been reviewed (e.g. lower the concurrency limit, or throttle image
  # pulls) rather than just flipping it back on to hit the same wall.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-operator
    spec:
      serviceAccountName: trivy-operator
      containers:
        - name: trivy-operator
          image: docker.io/aquasec/trivy-operator:0.33.0@sha256:ce5e4d5eeaf211b4e2091ed3209ce9676fd6bd7fb2f22f782559574a01ac219e
          args:
            - --overwrite
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            - name: TRIVY_CACHE_DIR
              value: "/tmp/trivy-cache"
            - name: OPERATOR_LOG_LEVEL
              value: "info"
            - name: OPERATOR_NAMESPACE
              value: "trivy-system"
            - name: OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT
              value: "3"
            # 2026-08-16: root-caused KubeAPIServerHighLatency (p99 apiserver latency,
            # matches the REL-012 etcd precursor pattern) to this, NOT node memory
            # pressure on vm-srv-k3s-11 as first suspected -- live evidence ruled that
            # out (zero swap, ~20% CPU, ~2% iowait, all fine). Real cause: SbomReport
            # objects are enormous (127KB-1.2MB each, sampled directly), one persists
            # permanently per distinct workload (~180 of them, ~200MB total -- almost
            # exactly the whole etcd DB's size), and LIST calls on this CRD type alone
            # were measured at p99 4.98s. Nothing in this cluster actually consumes SBOM
            # data (Trivy Operator itself has no UI, and was already removed from
            # Homepage for exactly that reason -- see kubernetes/apps/homepage/
            # homepage.yml). vulnerabilityReports are a separate, independently
            # generated report type and are unaffected by this.
            - name: OPERATOR_SBOM_GENERATION_ENABLED
              value: "false"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # Mounted at /tmp itself, not just /tmp/trivy-cache -- the policy
            # bundle downloader creates its own /tmp/trivy-<random> temp dirs
            # directly under /tmp (confirmed live: "mkdir /tmp/trivy-580419700:
            # read-only file system" when only the cache subpath was writable).
            - name: cache
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
spec:
  selector:
    app.kubernetes.io/name: trivy-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
