apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-firefly-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgres-firefly-credentials
    creationPolicy: Owner
  data:
    - remoteRef:
        key: secret/firefly
        property: postgres-user
      secretKey: POSTGRES_USER
    - remoteRef:
        key: secret/firefly
        property: postgres-password
      secretKey: POSTGRES_PASSWORD
    - remoteRef:
        key: secret/firefly
        property: postgres-db
      secretKey: POSTGRES_DB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-firefly-data
  namespace: database
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-firefly
  namespace: database
spec:
  replicas: 1
  serviceName: postgres-firefly
  selector:
    matchLabels:
      app: postgres-firefly
  template:
    metadata:
      labels:
        app: postgres-firefly
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-firefly-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "firefly"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "firefly"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-client
        resources:
          requests:
                storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-firefly
  namespace: database
spec:
  ports:
    - port: 5432
  selector:
    app: postgres-firefly
