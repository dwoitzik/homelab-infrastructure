apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-firefly-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgres-firefly-credentials
    creationPolicy: Owner
  data:
    - remoteRef:
        key: secret/firefly
        property: postgres-user
      secretKey: POSTGRES_USER
    - remoteRef:
        key: secret/firefly
        property: postgres-password
      secretKey: POSTGRES_PASSWORD
    - remoteRef:
        key: secret/firefly
        property: postgres-db
      secretKey: POSTGRES_DB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-firefly-data
  namespace: database
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-firefly
  namespace: database
spec:
  replicas: 1
  serviceName: postgres-firefly
  selector:
    matchLabels:
      app: postgres-firefly
  template:
    metadata:
      labels:
        app: postgres-firefly
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          # SEC-012: official entrypoint runs as root and needs CAP_CHOWN/
          # CAP_SETUID/CAP_SETGID to chmod /var/run/postgresql and switch to
          # the postgres user -- same pattern as the other postgres
          # containers in this repo (nextcloud, immich).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-firefly-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "firefly"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "firefly"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-client
        # volumeMode explicit: the API server defaults this live and ArgoCD
        # can never prune it back off an immutable volumeClaimTemplate,
        # leaving this StatefulSet permanently OutOfSync otherwise.
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-firefly
  namespace: database
spec:
  ports:
    - port: 5432
  selector:
    app: postgres-firefly
