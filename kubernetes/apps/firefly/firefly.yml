apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: firefly-iii-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: firefly-iii-secrets
    creationPolicy: Owner
  data:
    - remoteRef:
        key: secret/firefly
        property: app-key
      secretKey: APP_KEY
    - remoteRef:
        key: secret/firefly
        property: db-password
      secretKey: DB_PASSWORD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-iii
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-iii
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: firefly-iii
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # NOT readOnlyRootFilesystem: this image bundles nginx (needs to render
      # nginx.conf on every start) AND uses s6-overlay as its process
      # supervisor, which removes/recreates /run/s6 on every start. Confirmed
      # live across several attempts: /etc/nginx and /run/s6 writable mounts
      # fixed the nginx.conf error, but the s6-overlay preinit step remained
      # racy under a read-only root -- 2 restarts before even reaching a
      # stable state (not a one-time fluke), which is not an acceptable
      # "verified working" bar per this session's own standing discipline.
      # Not forcing it; same call as myspeed/scrutiny-collector.
      containers:
        - name: firefly-iii
          image: fireflyiii/core:version-6.6.6
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: SITE_OWNER
              value: "david@woitzik.dev"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-secrets
                  key: APP_KEY
            - name: DEFAULT_LANGUAGE
              value: de_DE
            - name: DEFAULT_LOCALE
              value: de_DE.UTF-8
            - name: TZ
              value: Europe/Berlin
            - name: TRUSTED_PROXIES
              value: "**"
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: postgres-firefly.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: firefly
            - name: DB_USERNAME
              value: firefly
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-secrets
                  key: DB_PASSWORD
            - name: APP_URL
              value: https://finance.woitzik.dev
            - name: AUTHENTICATION_GUARD
              value: web
          volumeMounts:
            - name: data
              mountPath: /var/www/html/storage/upload
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-iii-cron
  namespace: apps
spec:
  schedule: "*/5 * * * *"
  # Suspended: the cron errors on every run (DB connection issue) and its
  # recurring failed pods drive periodic I/O/load spikes after the cluster
  # restart. Re-enable once the DB is healthy again.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: firefly-iii-cron
        spec:
          restartPolicy: Never
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          initContainers:
            - name: seed-storage
              image: fireflyiii/core:version-6.6.6
              command: ["sh", "-c", "cp -a /var/www/html/storage/. /writable-storage/ 2>/dev/null; cp -a /var/www/html/bootstrap/cache/. /writable-bootstrap-cache/ 2>/dev/null; true"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: storage
                  mountPath: /writable-storage
                - name: bootstrap-cache
                  mountPath: /writable-bootstrap-cache
          containers:
            - name: firefly-iii-cron
              image: fireflyiii/core:version-6.6.6
              command: ["php", "/var/www/html/artisan", "firefly-iii:cron"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: storage
                  mountPath: /var/www/html/storage
                - name: data
                  mountPath: /var/www/html/storage/upload
                - name: bootstrap-cache
                  mountPath: /var/www/html/bootstrap/cache
                - name: tmp
                  mountPath: /tmp
              env:
                - name: APP_ENV
                  value: production
                - name: APP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: firefly-iii-secrets
                      key: APP_KEY
                - name: DB_CONNECTION
                  value: pgsql
                - name: DB_HOST
                  value: postgres-firefly.database.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_DATABASE
                  value: firefly
                - name: DB_USERNAME
                  value: firefly
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: firefly-iii-secrets
                      key: DB_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: firefly-data
            - name: storage
              emptyDir: {}
            - name: bootstrap-cache
              emptyDir: {}
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-iii
  namespace: apps
spec:
  ports:
    - port: 8080
  selector:
    app: firefly-iii
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-iii-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`finance.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer}, {name: authelia}]
    services: [{name: firefly-iii, port: 8080}]
