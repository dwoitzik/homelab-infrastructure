apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.20.1
          # SEC-012: image entrypoint runs as root and needs CAP_CHOWN to
          # chown /app/data and su-exec into uid 911 -- confirmed live,
          # dropping all capabilities crash-loops it ("operation not
          # permitted" on chown and the user switch).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 9000
          env:
            - name: BASE_URL
              value: https://mealie.woitzik.dev
            - name: TZ
              value: Europe/Berlin
            - name: ALLOW_SIGNUP
              value: "false"
            - name: DB_ENGINE
              value: sqlite
            - name: API_PORT
              value: "9000"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            # ingredient-parser downloads NLTK resources to this hardcoded
            # path on every start -- confirmed live, fails with "Read-only
            # file system" otherwise.
            - name: nltk-data
              mountPath: /app/nltk_data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
        - name: tmp
          emptyDir: {}
        - name: nltk-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: apps
spec:
  ports:
    - port: 9000
  selector:
    app: mealie
