apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: apps
spec:
  # REL-xxx: back to 1 for a clean SQLite migration on an empty PV. The
  # migration takes up to ~15min under load; the liveness probe allows 900s.
  # If a kill leaves a partial alembic state ("index ... already exists"),
  # scale to 0, empty the mealie-data PV, and scale back up.
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mealie
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.20.1
          # SEC-012: image entrypoint runs as root and needs CAP_CHOWN to
          # chown /app/data and su-exec into uid 911 -- confirmed live,
          # dropping all capabilities crash-loops it ("operation not
          # permitted" on chown and the user switch).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 9000
          env:
            - name: BASE_URL
              value: https://mealie.woitzik.dev
            - name: TZ
              value: Europe/Berlin
            - name: ALLOW_SIGNUP
              value: "false"
            - name: DB_ENGINE
              value: sqlite
            - name: API_PORT
              value: "9000"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            # ingredient-parser downloads NLTK resources to this hardcoded
            # path on every start -- confirmed live, fails with "Read-only
            # file system" otherwise.
            - name: nltk-data
              mountPath: /app/nltk_data
          # Live-tested via Pod IP: /api/app/about is public, returns real
          # version/config JSON, no auth/host-header issue.
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            # First start runs alembic migrations + NLTK download. On the
            # I/O-saturated nvme this took 72+ min (measured 2026-08-07) and a
            # 3600s window still killed the container in the final migration
            # steps. A kill mid-migration leaves corrupt sqlite state (tables
            # exist, no alembic_version marker -> "table ... already exists"
            # CrashLoop) that forces a PV wipe. 7200s lets one run finish.
            initialDelaySeconds: 7200
            periodSeconds: 30
            failureThreshold: 8
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
        - name: tmp
          emptyDir: {}
        - name: nltk-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: apps
spec:
  ports:
    - port: 9000
  selector:
    app: mealie
