# kube-bench — CIS Kubernetes Benchmark CronJob.
# Runs daily, checks control plane + node configuration, writes results to stdout.
# Needs hostPID + privileged to read kubelet/containerd configs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench
  namespace: apps
  labels:
    app.kubernetes.io/name: kube-bench
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kube-bench
        spec:
          hostPID: true
          tolerations:
            - operator: Exists
          containers:
            - name: kube-bench
              image: docker.io/aquasec/kube-bench:v0.15.6
              command: ["kube-bench", "--json"]
              volumeMounts:
                - name: var-lib-kubelet
                  mountPath: /var/lib/kubelet
                  readOnly: true
                - name: etc-kubernetes
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: proc
                  mountPath: /host/proc
                  readOnly: true
              env:
                - name: KUBEBENCH_NODE
                  value: ""
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          restartPolicy: Never
          volumes:
            - name: var-lib-kubelet
              hostPath:
                path: /var/lib/kubelet
                type: Directory
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
                type: Directory
            - name: proc
              hostPath:
                path: /proc
                type: Directory
