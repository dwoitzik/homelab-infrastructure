apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: open-webui-secrets
    creationPolicy: Owner
  data:
    - secretKey: webui-secret-key
      remoteRef:
        key: secret/open-webui
        property: webui-secret-key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: apps
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # SEC-012: open-webui rewrites some of its own static branding assets
      # (splash.png, favicon*.png, loader.js) at startup -- under
      # readOnlyRootFilesystem this failed with EROFS. /app/backend/open_webui/static
      # also ships real, required assets (fonts/, swagger-ui/, icons) that
      # an empty emptyDir overlay would wipe, so we copy the image's own
      # static dir into an emptyDir first, then overlay that -- preserves
      # existing files while making the directory writable.
      initContainers:
      - name: copy-static
        image: ghcr.io/open-webui/open-webui:v0.9.6
        command: ["sh", "-c", "cp -a /app/backend/open_webui/static/. /static-init/"]
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: static
          mountPath: /static-init
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:v0.9.6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        ports:
        - containerPort: 8080
        env:
        - name: OLLAMA_BASE_URL
          value: http://10.0.20.251:11434
        - name: WEBUI_AUTH
          value: "true"
        - name: ENABLE_OAUTH_SIGNUP
          value: "false"
        - name: ENABLE_SIGNUP
          value: "false"
        - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
          value: "Remote-Email"
        - name: WEBUI_AUTH_TRUSTED_NAME_HEADER
          value: "Remote-Name"
        # SEC-012: with readOnlyRootFilesystem, the entrypoint's fallback
        # (write a random key to ./.webui_secret_key in CWD) fails -- and
        # CWD (/app/backend) is the app code itself, not safe to overlay
        # with an emptyDir. Setting this directly also fixes a pre-existing
        # issue: every pod restart was already generating a NEW random key
        # each time (never persisted), silently invalidating all sessions.
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: open-webui-secrets
              key: webui-secret-key
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        - name: tmp
          mountPath: /tmp
        - name: static
          mountPath: /app/backend/open_webui/static
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data
      - name: tmp
        emptyDir: {}
      - name: static
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: apps
spec:
  ports:
  - port: 8080
  selector:
    app: open-webui
