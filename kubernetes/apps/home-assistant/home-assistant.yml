# 2026-08-19: ha.woitzik.dev was returning 400 Bad Request via Traefik.
# Root-caused live: "A request from a reverse proxy was received... but
# your HTTP integration is not set-up for reverse proxies" in HA's own
# logs -- a standard, well-known HA requirement when it sits behind a
# reverse proxy. Fixed by appending an `http:` block (use_x_forwarded_for +
# trusted_proxies: 10.42.0.0/16, the whole k3s pod CIDR since Traefik's
# pod IP changes on every restart) directly to the live
# /config/configuration.yaml on the home-assistant-config PVC. Not
# reflected in this manifest because HA's own configuration.yaml isn't
# GitOps-managed at all (lives entirely on the PVC, normally edited via
# HA's own UI/file editor, not this repo) -- documented here so the reason
# behind the live fix is discoverable, per phase8/LEDGER.md Entry 45.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.7.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8123
          env:
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            # s6-overlay v3's init tries to rm -rf /run/s6 on startup --
            # confirmed live, fails with "Read-only file system" otherwise.
            - name: run
              mountPath: /run
          # Live-tested: /manifest.json is public (no auth token needed,
          # unlike /api/*) and returns 200 once the frontend is up.
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            # Home Assistant can take several minutes to come up after a
            # restore (recorder sqlite recovery), so the liveness probe must
            # not kill it during a slow first start.
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: apps
spec:
  ports:
    - port: 8123
  selector:
    app: home-assistant
