apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
    creationPolicy: Merge
  data:
    - secretKey: hmac-secret
      remoteRef:
        key: secret/authelia
        property: hmac-secret
    - secretKey: oidc-issuer-private-key
      remoteRef:
        key: secret/authelia
        property: oidc-issuer-private-key
    - secretKey: jwt-secret
      remoteRef:
        key: secret/authelia
        property: jwt-secret
    - secretKey: session-secret
      remoteRef:
        key: secret/authelia
        property: session-secret
    - secretKey: redis-password
      remoteRef:
        key: secret/authelia
        property: redis-password
    # storage-password: NOT managed here on purpose. Authelia's Postgres user
    # password must be changed via `ALTER USER authelia WITH PASSWORD ...`
    # against postgres-authelia directly -- if this synced automatically from
    # Vault, a Vault-only rotation would silently break Authelia's DB connection
    # until someone remembers the matching ALTER USER step. Rotate both
    # together manually instead.
    # storage-key: NOT managed here -- changing it requires Authelia's
    # `storage encryption change-key` re-encryption procedure first (see
    # SEC-003 in docs/AUDIT.md). Still a placeholder value as of 2026-06-23.
