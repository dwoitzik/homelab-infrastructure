apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
    creationPolicy: Owner
  data:
    - secretKey: hmac-secret
      remoteRef:
        key: secret/authelia
        property: hmac-secret
    - secretKey: oidc-issuer-private-key
      remoteRef:
        key: secret/authelia
        property: oidc-issuer-private-key
    - secretKey: jwt-secret
      remoteRef:
        key: secret/authelia
        property: jwt-secret
    - secretKey: session-secret
      remoteRef:
        key: secret/authelia
        property: session-secret
    - secretKey: redis-password
      remoteRef:
        key: secret/authelia
        property: redis-password
    - secretKey: storage-password
      remoteRef:
        key: secret/authelia
        property: storage-password
    - secretKey: storage-key
      remoteRef:
        key: secret/authelia
        property: storage-key
    # storage-password: Vault-synced but must ALSO be applied via
    # `ALTER USER authelia WITH PASSWORD ...` against postgres-authelia
    # directly. Vault-only rotation silently breaks Authelia's DB connection.
