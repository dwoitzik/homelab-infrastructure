apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: apps
data:
  configuration.yml: |
    server:
      address: 'tcp://0.0.0.0:9091/'
    log:
      level: 'info'

    identity_validation:
      reset_password:
        jwt_secret: {{ secret "/config/secrets/jwt-secret" | msquote }}

    default_redirection_url: 'https://auth.woitzik.dev'

    authentication_backend:
      file:
        path: '/config/users/users_database.yml'

    session:
      name: 'authelia_session'
      domain: 'woitzik.dev'
      secret: {{ secret "/config/secrets/session-secret" | msquote }}
      same_site: 'lax'
      expiration: '1h'
      inactivity: '5m'
      remember_me: '1M'
      redis:
        host: 'redis-authelia.database.svc.cluster.local'
        port: 6379
        database_index: 0

    storage:
      encryption_key: {{ secret "/config/secrets/storage-key" | msquote }}
      postgres:
        address: 'tcp://postgres-authelia-rw.database.svc.cluster.local:5432'
        database: 'authelia'
        username: 'authelia'

    notifier:
      filesystem:
        filename: '/tmp/notification.txt'

    access_control:
      default_policy: 'one_factor'
      rules:
        - domain: 'auth.woitzik.dev'
          policy: 'bypass'
        - domain: 'pve.woitzik.dev'
          policy: 'two_factor'
          subject:
            - 'group:admins'
        # Whole /api/* bypassed -- the tracker script hits several paths
        # here before /track, and Rybbit's own backend already gates real
        # dashboard reads regardless of this rule.
        - domain: 'analytics.woitzik.dev'
          resources:
            - '^/api/.*$'
          policy: 'bypass'
        - domain: '*.woitzik.dev'
          policy: 'two_factor'

    identity_providers:
      oidc:
        hmac_secret: {{ secret "/config/secrets/hmac-secret" | msquote }}
        jwks:
          - key_id: 'authelia-main'
            algorithm: 'RS256'
            key: {{ secret "/config/secrets/oidc-issuer-private-key" | mindent 14 "|" | msquote }}
        clients:
          - client_id: 'proxmox'
            client_name: 'Proxmox VE'
            # Regenerated -- this client was configured here for weeks but
            # Proxmox itself never had a matching OIDC realm (`pveum realm
            # list` showed only pam/pve), so the old secret's plaintext was
            # never actually used/recoverable anywhere. Realm added live via
            # `pveum realm add authelia --type openid ...` with the new
            # plaintext; only the hash lives in git.
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$FEGdeGGmXuJmYdBfdr8ITQ$1s8+Vk67uAKpTc/RMVTV/JdEuvDmuweTZxWBXUqmyTQ'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://pve.woitzik.dev'
              - 'https://pve.woitzik.dev/api2/extjs/access/oidc/login'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'pbs'
            client_name: 'Proxmox Backup Server'
            # Regenerated 2026-08-27 -- same situation as the proxmox client
            # above: this client sat here for a while but PBS itself never
            # had a matching OpenID realm (`proxmox-backup-manager openid
            # list` was empty). Realm added live via `proxmox-backup-manager
            # openid create` with the new plaintext; only the hash lives in
            # git. PBS runs co-located on pve-mgmt-01 (10.0.10.10:8007) --
            # the separate ct-mgmt-pbs-01 (10.0.10.110) in inventory.ini is
            # stale, that host doesn't exist anymore.
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$5nnxOpLrnPQKL0LZE/715w$l1MyS99/37M3P54Hu+lAXmDIkVBk1c1KFB/5sSBuzz0'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://backup.woitzik.dev'
              - 'https://backup.woitzik.dev/api2/extjs/access/oidc/login'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'argocd'
            client_name: 'Argo CD'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$h560J807tdnz0wMCEopuhQ$mxnLZ9k0y1LD0LIQApMrR1eqMBC9BBU50btUL8RkYIU'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://argo.woitzik.dev/auth/callback'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            # ArgoCD's built-in OIDC client (coreos/go-oidc, not Dex) sends
            # client credentials via HTTP Basic Auth, not POST -- was set to
            # client_secret_post, which Authelia then rejects as an
            # unsupported auth method ("invalid_client"). Every other client
            # here already uses client_secret_basic; this one just didn't
            # match what ArgoCD actually sends.
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'grafana'
            client_name: 'Grafana'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$NBDGQppif1DH4R9JT2NBLA$d4dUnqOnMPH2PqaympkpxMIZ503yn9FBTAE/xilR2d8'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://monitoring.woitzik.dev/login/generic_oauth'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'headscale'
            client_name: 'Headscale'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$4SL81I6B3rAJT/YAqQoNxQ$fe0Cco+vMQ4lKnyEATtg3xkuvuoI9R7Sp04qooQacJA'
            public: false
            # Was one_factor -- the only OIDC client on this domain not requiring
            # 2FA, despite gating VPN registration for the whole tailnet (more
            # sensitive than ArgoCD/Grafana below, both two_factor).
            authorization_policy: two_factor
            redirect_uris:
              - 'https://headscale.woitzik.dev/oidc/callback'
            scopes: [openid, profile, email]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'nextcloud'
            client_name: 'Nextcloud'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$Wzn1HOsVqYBer35S+mI+3A$V6+ig73ataFSHXC8F+Qq81x3EgH52lyqSVGN+4phI0o'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://nextcloud.woitzik.dev/apps/user_oidc/code'
            scopes: [openid, profile, email]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'jellyfin'
            client_name: 'Jellyfin'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$iWMdjMq6pfzZdWSiYW4m4g$WIIhLxLonkcYmidtrRAn0W5Zp7tFE9ciYmU1cMLnQZU'
            public: false
            # Forward-auth stays off for Jellyfin (mobile clients can't do the
            # SSO redirect, see apps-ingressroute.yml) -- this is a native
            # in-app OIDC login button via the Community SSO plugin, opt-in
            # per client, so it doesn't affect API/mobile login at all.
            authorization_policy: two_factor
            # /sso/OID/r/authelia -- the plugin wiki's "/redirect/" alias
            # doesn't exist in this plugin version.
            redirect_uris:
              - 'https://media.woitzik.dev/sso/OID/r/authelia'
            scopes: [openid, profile, email]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
