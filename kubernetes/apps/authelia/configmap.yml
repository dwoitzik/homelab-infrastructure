apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: apps
data:
  configuration.yml: |
    server:
      address: 'tcp://0.0.0.0:9091/'
    log:
      level: 'info'

    identity_validation:
      reset_password:
        jwt_secret: {{ secret "/config/secrets/jwt-secret" | msquote }}

    default_redirection_url: 'https://auth.woitzik.dev'

    authentication_backend:
      file:
        path: '/config/users/users_database.yml'

    session:
      name: 'authelia_session'
      domain: 'woitzik.dev'
      secret: {{ secret "/config/secrets/session-secret" | msquote }}
      same_site: 'lax'
      expiration: '1h'
      inactivity: '5m'
      remember_me: '1M'
      redis:
        host: 'redis-authelia.database.svc.cluster.local'
        port: 6379
        database_index: 0

    storage:
      encryption_key: {{ secret "/config/secrets/storage-key" | msquote }}
      postgres:
        address: 'tcp://postgres-authelia-rw.database.svc.cluster.local:5432'
        database: 'authelia'
        username: 'authelia'

    notifier:
      filesystem:
        filename: '/tmp/notification.txt'

    access_control:
      default_policy: 'one_factor'
      rules:
        - domain: 'auth.woitzik.dev'
          policy: 'bypass'
        - domain: 'pve.woitzik.dev'
          policy: 'two_factor'
          subject:
            - 'group:admins'
        - domain: '*.woitzik.dev'
          policy: 'two_factor'

    identity_providers:
      oidc:
        hmac_secret: {{ secret "/config/secrets/hmac-secret" | msquote }}
        jwks:
          - key_id: 'authelia-main'
            algorithm: 'RS256'
            key: {{ secret "/config/secrets/oidc-issuer-private-key" | mindent 14 "|" | msquote }}
        clients:
          - client_id: 'proxmox'
            client_name: 'Proxmox VE'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$7T7F9hEJd0VzvLBVHWfuZw$G7xaFFtSx/6JHy8dVaLcZFy8G523C/XnTqOrL2aA//U'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://pve.woitzik.dev'
              - 'https://pve.woitzik.dev/api2/extjs/access/oidc/login'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'pbs'
            client_name: 'Proxmox Backup Server'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$9PhlazByK4bJMxisCcxqQQ$MnIJ94FXildgDhBxlKK6y5W35+WdIxUUlXIkSaBVn0M'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://backup.woitzik.dev'
              - 'https://backup.woitzik.dev/api2/extjs/access/oidc/login'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'argocd'
            client_name: 'Argo CD'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$h560J807tdnz0wMCEopuhQ$mxnLZ9k0y1LD0LIQApMrR1eqMBC9BBU50btUL8RkYIU'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://argo.woitzik.dev/auth/callback'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_post'
            consent_mode: implicit
          - client_id: 'grafana'
            client_name: 'Grafana'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$NBDGQppif1DH4R9JT2NBLA$d4dUnqOnMPH2PqaympkpxMIZ503yn9FBTAE/xilR2d8'
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - 'https://monitoring.woitzik.dev/login/generic_oauth'
            scopes: [openid, profile, email, groups]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
          - client_id: 'headscale'
            client_name: 'Headscale'
            client_secret: '$argon2id$v=19$m=65536,t=3,p=4$4SL81I6B3rAJT/YAqQoNxQ$fe0Cco+vMQ4lKnyEATtg3xkuvuoI9R7Sp04qooQacJA'
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - 'https://headscale.woitzik.dev/oidc/callback'
            scopes: [openid, profile, email]
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
            consent_mode: implicit
