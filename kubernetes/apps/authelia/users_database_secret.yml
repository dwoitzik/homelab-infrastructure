# SEC-014 (2026-07-06): was previously a plain committed Secret with the base64
# blob decoding straight to the file_authenticator's users_database.yml, including
# the real argon2 password hash -- readable by anyone with repo access (this is a
# public portfolio repo). Moved to Vault via ExternalSecret, same pattern as
# authelia-secrets. Same hash value as before this migration -- no login change,
# just moved where the source of truth lives.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authelia-users-db
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authelia-users-db
    creationPolicy: Owner
  data:
    - secretKey: users_database.yml
      remoteRef:
        key: secret/authelia
        property: users-database-yml
