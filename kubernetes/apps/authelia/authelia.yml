apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      enableServiceLinks: false
      tolerations:
      - key: "storage"
        operator: "Equal"
        value: "sdcard"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - rpi
      initContainers:
      - name: wait-for-vault-secret
        image: busybox:1.36
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        # REL-007: on a cold cluster restart Vault starts sealed; ExternalSecrets
        # can't sync until vault-unseal (polls every 5s) unseals it, so the
        # authelia-secrets Secret may not exist yet. Block here instead of
        # crash-looping the main container on missing secret files.
        command:
        - sh
        - -c
        - until [ -f /secrets/hmac-secret ] && [ -f /secrets/oidc-issuer-private-key ]; do echo waiting for authelia-secrets; sleep 2; done
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
      containers:
      - name: authelia
        image: ghcr.io/authelia/authelia:4.39.20
        # SEC-012: image entrypoint runs as root and needs CAP_CHOWN/
        # CAP_SETGID/CAP_SETUID to chown /config and su-exec into its
        # runtime user -- confirmed live, dropping all capabilities
        # crash-loops it ("su-exec: setgroups(0): Operation not permitted").
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 9091
        volumeMounts:
        - name: config
          mountPath: /config
        - name: secrets
          mountPath: /config/secrets
          readOnly: true
        - name: users-db
          mountPath: /config/users
          readOnly: true
        env:
        - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
          value: /config/secrets/storage-password
        - name: AUTHELIA_SESSION_REDIS_PASSWORD_FILE
          value: /config/secrets/redis-password
        - name: X_AUTHELIA_CONFIG_FILTERS
          value: template
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: authelia-config
      - name: secrets
        secret:
          secretName: authelia-secrets
          optional: true
      - name: users-db
        secret:
          secretName: authelia-users-db
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: apps
spec:
  ports:
  - port: 9091
  selector:
    app: authelia
