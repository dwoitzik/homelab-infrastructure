apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      enableServiceLinks: false
      tolerations:
      - key: "storage"
        operator: "Equal"
        value: "sdcard"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - rpi
      initContainers:
      - name: wait-for-vault-secret
        image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        # REL-007: on a cold cluster restart Vault starts sealed; ExternalSecrets
        # can't sync until vault-unseal (polls every 5s) unseals it, so the
        # authelia-secrets Secret may not exist yet. Block here instead of
        # crash-looping the main container on missing secret files.
        command:
        - sh
        - -c
        - until [ -f /secrets/hmac-secret ] && [ -f /secrets/oidc-issuer-private-key ]; do echo waiting for authelia-secrets; sleep 2; done
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: authelia
        image: ghcr.io/authelia/authelia:4.39.20
        # SEC-012: image entrypoint runs as root and needs CAP_CHOWN/
        # CAP_SETGID/CAP_SETUID to chown /config and su-exec into its
        # runtime user -- confirmed live, dropping all capabilities
        # crash-loops it ("su-exec: setgroups(0): Operation not permitted").
        # SEC-012: readOnlyRootFilesystem reverted live 2026-06-25 -- worked
        # in an initial manual test, then crash-looped in production with a
        # generic "Errors occurred performing startup checks" fatal (no
        # further detail logged) after surviving ~2.5h, 35+ restarts. The
        # initial test's apparent success was a false positive, not a real
        # fix -- see REL-021 in docs/AUDIT.md for the investigation.
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 9091
        # Reliability sweep (2026-07-08): no health probes at all -- a hang
        # (not a crash) would go undetected indefinitely, and Authelia
        # gates almost every other exposed service, so an undetected hang
        # here is a wide-blast-radius outage. /api/health confirmed live
        # (`{"status":"OK"}`, port 9091) -- it's also already the exact
        # endpoint blackbox-exporter scrapes externally
        # (blackbox-authelia-health job), so this is a known-good path, not
        # a guess.
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9091
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 9091
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /config
        - name: secrets
          mountPath: /config/secrets
          readOnly: true
        - name: users-db
          mountPath: /config/users
          readOnly: true
        # the filesystem notifier writes here (configuration.yml ->
        # notifier.filesystem.filename: /tmp/notification.txt)
        - name: tmp
          mountPath: /tmp
        env:
        - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
          value: /config/secrets/storage-password
        - name: AUTHELIA_SESSION_REDIS_PASSWORD_FILE
          value: /config/secrets/redis-password
        - name: X_AUTHELIA_CONFIG_FILTERS
          value: template
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: authelia-config
      - name: secrets
        secret:
          secretName: authelia-secrets
          optional: true
      - name: users-db
        secret:
          secretName: authelia-users-db
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: apps
spec:
  ports:
  - port: 9091
  selector:
    app: authelia
