apiVersion: v1
kind: Service
metadata:
  name: kasm
  namespace: apps
spec:
  ports:
    - port: 443
      targetPort: 443
      name: https
  selector:
    app: kasm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasm
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kasm
  template:
    metadata:
      labels:
        app: kasm
    spec:
      containers:
        - name: kasm
          image: kasmweb/kasm:1.15.0
          env:
            - name: KASM_EULA_AGREED
              value: "true"
            - name: REDIS_HOSTNAME
              value: "kasm-redis"
            - name: DB_HOSTNAME
              value: "kasm-db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kasm-secrets
                  key: db-password
            - name: MANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kasm-secrets
                  key: manager-token
          ports:
            - containerPort: 443
          volumeMounts:
            - name: data
              mountPath: /opt/kasm/current
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kasm-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kasm-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
