apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: apps
  labels:
    app.kubernetes.io/name: freshrss
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: freshrss
        image: freshrss/freshrss:1.30.2@sha256:a4a4a2233c082940b3ed5a32e2bf12d6c5271062be7e34c188dec99816540fc4
        ports:
        - containerPort: 80
          name: http
        env:
        - name: TZ
          value: Europe/Berlin
        - name: CRON_MIN
          value: "1,31"
        # Kubelet's default 1s HTTP timeout is shorter than this app's real
        # response time under load, so probes failed on latency, not health.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /var/www/FreshRSS/data
        - name: extensions
          mountPath: /var/www/FreshRSS/extensions
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: freshrss-data
      - name: extensions
        emptyDir: {}
