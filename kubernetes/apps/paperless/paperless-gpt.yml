apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-gpt
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-gpt
  template:
    metadata:
      labels:
        app: paperless-gpt
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: paperless-gpt
        image: icereed/paperless-gpt:v0.26.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
        env:
        - name: PAPERLESS_BASE_URL
          value: http://paperless.apps.svc.cluster.local:8000
        - name: PAPERLESS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: ai-api-token
        - name: LLM_PROVIDER
          value: ollama
        - name: OLLAMA_HOST
          value: http://10.0.20.251:11434
        # WRK-005 follow-up: minicpm-v (vision model) also produced garbage German
        # titles in practice, which led to disabling auto-tag entirely. Switched to
        # qwen2.5:7b-instruct (the GENERAL instruct variant, NOT the coder variant
        # that caused WRK-005) — significantly better instruction following for
        # multilingual text tasks. minicpm-v kept for VISION_LLM_MODEL only (image
        # input), where it performs well. 2026-07-01.
        - name: LLM_MODEL
          value: qwen2.5:7b-instruct
        - name: VISION_LLM_PROVIDER
          value: ollama
        - name: VISION_LLM_MODEL
          value: minicpm-v
        - name: IMAGE_MAX_RENDER_DPI
          value: "300"
        - name: IMAGE_MAX_PIXEL_DIMENSION
          value: "4000"
        - name: IMAGE_MAX_TOTAL_PIXELS
          value: "16000000"
        # WRK-005 follow-up 2026-07-01: switched to qwen2.5:7b-instruct which
        # has solid German instruction following. Re-enabled AUTO_TAG pointing
        # at "paperless-gpt" tag: docs tagged paperless-gpt get AI title+tags
        # applied automatically and the tag is removed. Tag new documents with
        # "paperless-gpt" on import to trigger the same pipeline.
        - name: AUTO_TAG
          value: paperless-gpt
        - name: LANGUAGE
          value: German
        - name: LOG_LEVEL
          value: info
        # REL-027: qwen2.5:7b-instruct occasionally ignored the title_prompt's
        # 60-char limit and generated a full multi-thousand-token document
        # instead of a title (task ran >2h on ai_nodes LXC, swapped it to a
        # crawl, dragged the whole mini host into overcommit). TOKEN_LIMIT
        # hard-caps generation length regardless of what the model decides to do.
        # 512 is enough for any single-value output (title/tag/correspondent/date).
        # Previous 1000 was set to cap runaway generation; keeping at 512 is
        # safer — the prompts now explicitly forbid reasoning, so output is short.
        - name: TOKEN_LIMIT
          value: "512"
        volumeMounts:
        # SEC-012: at startup the app creates any *missing* default prompt
        # files (tag_prompt.tmpl etc.) directly under /app/prompts -- a
        # plain subPath mount only covers title_prompt.tmpl, leaving the
        # rest of the directory read-only. Mounting the whole directory as
        # a writable emptyDir instead, seeded by the initContainer below
        # (copies the image's defaults, then overlays the ConfigMap's
        # custom title_prompt.tmpl on top).
        - name: prompts
          mountPath: /app/prompts
        - name: tmp
          mountPath: /tmp
        # settings.json and the local db -- both created fresh on first run
        - name: config
          mountPath: /app/config
        - name: db
          mountPath: /app/db
      initContainers:
      - name: seed-prompts
        image: icereed/paperless-gpt:v0.26.0
        command:
        - sh
        - -c
        # Copy image defaults first, then overlay ALL ConfigMap templates on top.
        # Previously only title_prompt.tmpl was overlaid; tag/correspondent/
        # document_type/created_date used untuned defaults.
        - cp -a /app/prompts/. /writable-prompts/ 2>/dev/null; for f in /configmap/*.tmpl; do cp "$f" /writable-prompts/; done
        volumeMounts:
        - name: prompts
          mountPath: /writable-prompts
        - name: prompts-configmap
          mountPath: /configmap
      volumes:
      - name: prompts
        emptyDir: {}
      - name: prompts-configmap
        configMap:
          name: paperless-gpt-prompts
      - name: tmp
        emptyDir: {}
      - name: config
        emptyDir: {}
      - name: db
        emptyDir: {}
