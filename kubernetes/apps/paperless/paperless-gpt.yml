apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-gpt
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-gpt
  template:
    metadata:
      labels:
        app: paperless-gpt
    spec:
      containers:
      - name: paperless-gpt
        image: icereed/paperless-gpt:v0.25.1
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
        env:
        - name: PAPERLESS_BASE_URL
          value: http://paperless.apps.svc.cluster.local:8000
        - name: PAPERLESS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: ai-api-token
        - name: LLM_PROVIDER
          value: ollama
        - name: OLLAMA_HOST
          value: http://10.0.20.251:11434
        # WRK-005: qwen2.5-coder:7b (a code-specialized model) was generating
        # multi-paragraph English essay summaries instead of short titles --
        # ignoring the prompt's explicit "title only" and "respond in German"
        # instructions outright, and in one case hallucinated a completely
        # unrelated personal-advice response. Confirmed live via paperless-gpt's
        # own logs (repeated "error creating correspondent: ... no more than 128
        # characters" failures, since it tried reusing the same broken text as a
        # correspondent name too). minicpm-v (already loaded, same size class,
        # already used as VISION_LLM_MODEL) tested clean and short in German on
        # the same prompts via a direct Ollama API call before deploying this.
        - name: LLM_MODEL
          value: minicpm-v
        - name: VISION_LLM_PROVIDER
          value: ollama
        - name: VISION_LLM_MODEL
          value: minicpm-v
        - name: IMAGE_MAX_RENDER_DPI
          value: "300"
        - name: IMAGE_MAX_PIXEL_DIMENSION
          value: "4000"
        - name: IMAGE_MAX_TOTAL_PIXELS
          value: "16000000"
        - name: AUTO_TAG
          value: paperless-gpt-to-process
        - name: LANGUAGE
          value: German
        - name: LOG_LEVEL
          value: info
        volumeMounts:
        - name: prompts
          mountPath: /app/prompts/title_prompt.tmpl
          subPath: title_prompt.tmpl
      volumes:
      - name: prompts
        configMap:
          name: paperless-gpt-prompts
