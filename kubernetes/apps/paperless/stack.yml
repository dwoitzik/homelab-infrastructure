apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-paperless
  namespace: apps
spec:
  serviceName: "postgres-paperless"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-paperless
  template:
    metadata:
      labels:
        app: postgres-paperless
    spec:
      initContainers:
      - name: wait-for-vault-secret
        image: busybox:1.36
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # REL-007: on a cold cluster restart Vault starts sealed; ExternalSecrets
        # can't sync until vault-unseal (polls every 5s) unseals it, so the
        # paperless-secrets Secret may not exist yet. Block here instead of
        # crash-looping the main container on a missing secretKeyRef.
        command:
        - sh
        - -c
        - until [ -f /secrets/postgres-password ]; do echo waiting for paperless-secrets; sleep 2; done
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: paperless-secrets
          mountPath: /secrets
          readOnly: true
      containers:
      - name: postgres
        image: postgres:16
        # SEC-012: official entrypoint runs as root and needs CAP_CHOWN/
        # CAP_SETUID/CAP_SETGID to chmod /var/run/postgresql and switch to
        # the postgres user -- confirmed live, dropping all capabilities
        # crash-loops it ("error: failed switching to 'postgres': operation
        # not permitted").
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: POSTGRES_DB
          value: paperless
        - name: POSTGRES_USER
          value: paperless
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: postgres-password
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-db-data
      - name: paperless-secrets
        secret:
          secretName: paperless-secrets
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-paperless
  namespace: apps
spec:
  ports:
  - port: 5432
  selector:
    app: postgres-paperless
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-paperless
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-paperless
  template:
    metadata:
      labels:
        app: redis-paperless
    spec:
      containers:
      - name: redis
        image: redis:7
        # SEC-012: redis:7 has no non-root default user despite running fine
        # under capability drop -- confirmed live, runAsNonRoot alone fails
        # admission ("container has runAsNonRoot and image will run as root").
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-paperless
  namespace: apps
spec:
  ports:
  - port: 6379
  selector:
    app: redis-paperless
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-addons
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-addons
  template:
    metadata:
      labels:
        app: paperless-addons
    spec:
      containers:
      - name: gotenberg
        image: gotenberg/gotenberg:8
        command: ["gotenberg", "--chromium-allow-list=file:///tmp/.*"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      - name: tika
        image: apache/tika:3.3.1.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 9998
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-addons
  namespace: apps
spec:
  ports:
  - name: gotenberg
    port: 3000
  - name: tika
    port: 9998
  selector:
    app: paperless-addons
