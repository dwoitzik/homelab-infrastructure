apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-paperless
  namespace: apps
spec:
  serviceName: "postgres-paperless"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-paperless
  template:
    metadata:
      labels:
        app: postgres-paperless
    spec:
      initContainers:
      - name: wait-for-vault-secret
        image: busybox:1.38
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        # REL-007: on a cold cluster restart Vault starts sealed; ExternalSecrets
        # can't sync until vault-unseal (polls every 5s) unseals it, so the
        # paperless-secrets Secret may not exist yet. Block here instead of
        # crash-looping the main container on a missing secretKeyRef.
        command:
        - sh
        - -c
        - until [ -f /secrets/postgres-password ]; do echo waiting for paperless-secrets; sleep 2; done
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: paperless-secrets
          mountPath: /secrets
          readOnly: true
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: postgres
        image: postgres:18.4
        # SEC-012: official entrypoint runs as root and needs CAP_CHOWN/
        # CAP_SETUID/CAP_SETGID to chmod /var/run/postgresql and switch to
        # the postgres user -- confirmed live, dropping all capabilities
        # crash-loops it ("error: failed switching to 'postgres': operation
        # not permitted").
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: POSTGRES_DB
          value: paperless
        - name: POSTGRES_USER
          value: paperless
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: postgres-password
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        # REL-028: postgres 18's image refuses to start against the old
        # 16.x-style mount (/var/lib/postgresql/data + subPath) -- 18+
        # requires a single mount at /var/lib/postgresql (docker-library/
        # postgres#1259). No subPath since this is a fresh PVC
        # (paperless-db-data-pg18), nothing else on it yet.
        - name: data
          mountPath: /var/lib/postgresql
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        # Live-tested: pg_isready -U paperless -> accepting connections.
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "paperless"]
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "paperless"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-db-data-pg18
      - name: paperless-secrets
        secret:
          secretName: paperless-secrets
          optional: true
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-paperless
  namespace: apps
spec:
  ports:
  - port: 5432
  selector:
    app: postgres-paperless
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-paperless
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-paperless
  template:
    metadata:
      labels:
        app: redis-paperless
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: redis
        image: redis:8.8.0
        # REL-031-redis (2026-07-05): same latent bug found live on
        # redis-nextcloud -- no PVC at all, but default redis persistence
        # settings still try to write RDB snapshots, which fail against the
        # read-only rootfs and eventually trip `stop-writes-on-bgsave-error`,
        # blocking ALL writes (including whatever this instance is used for)
        # once enough changes accumulate. Fixed proactively here the same way
        # (persistence off, invoke redis-server directly instead of the
        # image's default entrypoint, which needs CAP_SETUID to setpriv-drop
        # from root to the redis user).
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 6379
        # Live-tested: redis-cli ping -> PONG.
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-paperless
  namespace: apps
spec:
  ports:
  - port: 6379
  selector:
    app: redis-paperless
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-addons
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-addons
  template:
    metadata:
      labels:
        app: paperless-addons
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: gotenberg
        image: gotenberg/gotenberg:8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
        command: ["gotenberg", "--chromium-allow-list=file:///tmp/.*"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        # Live-tested: /health -> {"status":"up",...chromium/libreoffice...}.
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      - name: tika
        image: apache/tika:3.3.1.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 9998
        # Live-tested: GET / -> 200, Tika's server index page. No dedicated
        # lightweight health endpoint in this Tika version; the index page
        # is static and cheap enough to poll.
        readinessProbe:
          httpGet:
            path: /
            port: 9998
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 9998
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-addons
  namespace: apps
spec:
  ports:
  - name: gotenberg
    port: 3000
  - name: tika
    port: 9998
  selector:
    app: paperless-addons
