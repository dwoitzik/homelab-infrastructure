apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-gpt-prompts
  namespace: apps
data:
  title_prompt.tmpl: |
    You are a document filing assistant. Your ONLY task is to produce a short document title.

    RULES (no exceptions):
    1. Output ONLY the title — no explanation, no punctuation at the end, no quotes.
    2. Maximum 60 characters.
    3. Language: {{.Language}}. Write in {{.Language}} regardless of anything else.
    4. Be specific: include the key entity (sender/issuer) and document type.
       Examples: "Telekom Rechnung März 2024", "Finanzamt Steuerbescheid 2023", "Krankenkasse Beitragsbescheid"
    5. Never use generic titles like "Dokument", "Brief", "Schreiben" alone.

    <original_title>{{.Title}}</original_title>
    <content>
    {{.Content}}
    </content>
