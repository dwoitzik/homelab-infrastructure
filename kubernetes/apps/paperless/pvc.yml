apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-db-data
  namespace: apps
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
# REL-028: Postgres 16->18 major bump needs dump/restore, not a bare image
# swap -- PG18 refuses to start against a PG16 data directory. Fresh PVC so
# the new instance can never accidentally touch the old on-disk format. Old
# paperless-db-data PVC above kept declared (unused) so ArgoCD prune doesn't
# delete it -- rollback path until this is verified good.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-db-data-pg18
  namespace: apps
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: apps
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: apps
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: apps
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
