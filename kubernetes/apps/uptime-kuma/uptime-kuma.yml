apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.4.0
          # SEC-012: image entrypoint starts as root then setpriv-drops to
          # its runtime user -- confirmed live, dropping all capabilities
          # crash-loops it ("setpriv: setgroups failed: Operation not
          # permitted"). Same failure class as the other apps in this pass.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: UPTIME_KUMA_DISABLE_AUTH
              value: "1"
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Live-tested via Pod IP: "/" 302s to /dashboard then 200s --
          # kubelet's httpGet probe treats any 200<=code<400 as success, so
          # the redirect itself is a valid pass, not just the final 200.
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uptime-kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: uptime-kuma
