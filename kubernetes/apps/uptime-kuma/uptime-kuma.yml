apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1.23.17
          # SEC-012: image entrypoint starts as root then setpriv-drops to
          # its runtime user -- confirmed live, dropping all capabilities
          # crash-loops it ("setpriv: setgroups failed: Operation not
          # permitted"). Same failure class as the other apps in this pass.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: UPTIME_KUMA_DISABLE_AUTH
              value: "1"
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uptime-kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: uptime-kuma
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: status-main
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`status.woitzik.dev`)
    kind: Rule
    services: [{name: uptime-kuma, port: 3001}]
  tls: {secretName: wildcard-woitzik-dev-tls}
