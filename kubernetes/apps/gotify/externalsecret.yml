apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gotify-externalsecret
  namespace: apps
  labels:
    app.kubernetes.io/name: gotify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gotify-secrets
  data:
  - secretKey: admin-password
    remoteRef:
      key: secret/gotify
      property: admin-password
