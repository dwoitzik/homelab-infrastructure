apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: apps
  labels:
    app.kubernetes.io/name: gotify
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotify
  template:
    metadata:
      labels:
        app: gotify
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: gotify
        image: gotify/server:2.9.1
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: GOTIFY_DEFAULTUSER_NAME
          value: admin
        - name: GOTIFY_DEFAULTUSER_PASS
          valueFrom:
            secretKeyRef:
              name: gotify-secrets
              key: admin-password
        - name: GOTIFY_SERVER_PORT
          value: "8080"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gotify-data
