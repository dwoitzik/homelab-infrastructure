apiVersion: apps/v1
kind: Deployment
metadata:
  name: lubelogger
  namespace: apps
  labels:
    app.kubernetes.io/name: lubelogger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lubelogger
  template:
    metadata:
      labels:
        app: lubelogger
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: lubelogger
        image: hargata/lubelogger:v1.7.0@sha256:01bdb486af71e641c3ae41499e0412a21f2e04fa31b25c5c6531b42c112938e5
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DefaultConnectionStrings__SQLite_ConnectionString
          value: "Data Source=/data/LubeLogger.db"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        # Separate from the /data PVC (used for the SQLite DB via the env var
        # above) -- the app's own StaticHelper.InitMessage also writes to
        # /App/data (relative to its own working dir), confirmed live:
        # "System.IO.IOException: Read-only file system : '/App/data'".
        - name: app-data
          mountPath: /App/data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lubelogger-data
      - name: tmp
        emptyDir: {}
      - name: app-data
        emptyDir: {}
