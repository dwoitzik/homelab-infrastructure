apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: apps
  labels:
    app.kubernetes.io/name: linkding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: linkding
        image: sissbruecker/linkding:1.45.0
        ports:
        - containerPort: 9090
          name: http
        env:
        - name: LD_SUPERUSER_NAME
          value: admin
        - name: LD_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: linkding-secrets
              key: admin-password
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /etc/linkding/data
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: linkding-data
