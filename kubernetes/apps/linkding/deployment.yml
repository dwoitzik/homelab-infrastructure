apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: apps
  labels:
    app.kubernetes.io/name: linkding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: linkding
        image: sissbruecker/linkding:1.46.0@sha256:49eff0b0b90c63760fda75e615357a0e55fcb7dc51876f2a0a5dddb958bd3df4
        ports:
        - containerPort: 9090
          name: http
        env:
        - name: LD_SUPERUSER_NAME
          value: admin
        - name: LD_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: linkding-secrets
              key: admin-password
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
            # uwsgi's entrypoint runs as root and setgid()/setuid()s down to
            # www-data (33) itself -- confirmed live, dropping all caps
            # crash-loops it ("setgid(): Operation not permitted").
            add: ["SETGID", "SETUID"]
        volumeMounts:
        - name: data
          mountPath: /etc/linkding/data
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: linkding-data
      - name: tmp
        emptyDir: {}
