apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: headscale
          image: ghcr.io/juanfont/headscale:v0.29.2
          # SEC-012: needs to create /var/run/headscale (its unix socket dir)
          # at startup -- confirmed live, dropping all capabilities fails
          # with "creating directory failed with permission error".
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: headscale-oidc
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /etc/headscale/policy.hujson
              subPath: policy.hujson
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/headscale
          # Live-tested: GET /health on the http port returns {"status":"pass"}.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # Warm-standby HA (ADR-029): continuously ships db.sqlite's WAL to
        # rpi-srv-02. Same pod/PVC (sidecar pattern, not a separate
        # Deployment) because litestream needs to read the live WAL
        # directly, not a point-in-time copy.
        - name: litestream
          image: litestream/litestream:0.5.16@sha256:837279d1279a90d670c915ddbb641b6e7b98bc42cc4dfb040eb569ee931078a1
          args:
            - replicate
            - -config
            - /etc/litestream/litestream.yml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
            - name: litestream-ssh
              mountPath: /etc/litestream/ssh
              readOnly: true
            - name: litestream-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: litestream-config
          configMap:
            name: headscale-litestream-config
        - name: litestream-ssh
          secret:
            secretName: litestream-ssh-credentials
            defaultMode: 0400
        - name: litestream-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: apps
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: headscale
