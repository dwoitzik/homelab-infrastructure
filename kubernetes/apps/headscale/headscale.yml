apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
      annotations:
        kubectl.kubernetes.io/default-container: headscale
    spec:
      priorityClassName: node-pinned-stateful
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      initContainers:
        - name: public-ip-record-init
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sh", "-c"]
          args:
            - &public_ip_record |
              set -u
              f=/var/lib/headscale/extra-records.json
              while true; do
                ip=$(nslookup -type=a headscale.woitzik.dev 1.1.1.1 2>/dev/null \
                  | awk '/^Address: /{print $2}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
                if [ -n "$ip" ]; then
                  new="[{\"name\":\"headscale.woitzik.dev\",\"type\":\"A\",\"value\":\"$ip\"}]"
                  if [ "$(cat "$f" 2>/dev/null)" != "$new" ]; then
                    echo "$new" > "$f.tmp" && mv "$f.tmp" "$f" && echo "extra record -> $ip"
                  fi
                elif [ ! -f "$f" ]; then
                  echo "[]" > "$f"
                  echo "public lookup failed, wrote empty record set"
                fi
                [ "${ONCE:-0}" = 1 ] && exit 0
                sleep 300
              done
          env:
            - name: ONCE
              value: "1"
          securityContext: &public_ip_record_sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
          resources: &public_ip_record_res
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        # Keeps the public-address extra record current if the WAN IP changes.
        - name: public-ip-record
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sh", "-c"]
          args:
            - *public_ip_record
          securityContext: *public_ip_record_sc
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
          resources: *public_ip_record_res
        - name: headscale
          image: ghcr.io/juanfont/headscale:v0.29.8@sha256:f549a444481d7ab0ad8b506a7ee43cadb00001a20fbaec34b56f8ccb136735e0
          # SEC-012: needs to create /var/run/headscale (its unix socket dir)
          # at startup -- confirmed live, dropping all capabilities fails
          # with "creating directory failed with permission error".
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: headscale-oidc
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /etc/headscale/policy.hujson
              subPath: policy.hujson
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/headscale
          # Live-tested: GET /health on the http port returns {"status":"pass"}.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # Warm-standby HA (ADR-029): continuously ships db.sqlite's WAL to
        # rpi-srv-02. Same pod/PVC (sidecar pattern, not a separate
        # Deployment) because litestream needs to read the live WAL
        # directly, not a point-in-time copy.
        - name: litestream
          image: litestream/litestream:0.5.18@sha256:0512488c5fbcd5a86cc65d367542b7eb869f2fc2699c67e11f4fcec7e899e830
          args:
            - replicate
            - -config
            - /etc/litestream/litestream.yml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
            - name: litestream-ssh
              mountPath: /etc/litestream/ssh
              readOnly: true
            - name: litestream-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: litestream-config
          configMap:
            name: headscale-litestream-config
        - name: litestream-ssh
          secret:
            secretName: litestream-ssh-credentials
            defaultMode: 0400
        - name: litestream-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: apps
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: headscale
---
# Dedicated LoadBalancer IP for the DMZ reverse proxy (ct-dmz-proxy-01) to
# reach headscale directly, bypassing Traefik. Traefik can't proxy ts2021's
# noise-protocol upgrade (Upgrade: tailscale-control-protocol) -- it only
# forwards the literal "websocket" value -- same reason the Cloudflare
# Tunnel route was moved off it. sourceRanges restricts this IP to the DMZ
# subnet only; nothing else on the network can reach it directly.
apiVersion: v1
kind: Service
metadata:
  name: headscale-dmz-lb
  namespace: apps
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 10.0.30.0/24
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: headscale
