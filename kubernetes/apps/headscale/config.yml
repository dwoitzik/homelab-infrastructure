apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: apps
data:
  config.yaml: |
    server_url: https://headscale.woitzik.dev
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090

    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    database:
      type: sqlite3
      sqlite:
        path: /var/lib/headscale/db.sqlite

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    derp:
      server:
        enabled: false
        region_id: 999
        region_code: homelab
        region_name: Homelab
        stun_listen_addr: 0.0.0.0:3478
        private_key_path: /var/lib/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: true
        ipv4: ""
        ipv6: ""
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      paths: []
      auto_update_enabled: true
      update_frequency: 24h

    dns:
      magic_dns: true
      base_domain: headscale.net
      nameservers:
        global:
          - 10.0.20.5
      extra_records: []

    oidc:
      issuer: "https://auth.woitzik.dev"
      client_id: "headscale"
      # client_secret injected via HEADSCALE_OIDC_CLIENT_SECRET env var from
      # headscale-oidc Secret (ExternalSecret → Vault secret/headscale)
      scope: ["openid", "profile", "email"]

    log:
      format: text
      level: info

    policy:
      mode: file
      path: /etc/headscale/policy.hujson
  policy.hujson: |
    {
      // Least-privilege tailnet ACL (Phase 1.4). Previously no policy existed at all
      // ("acl policy not found") -- Headscale's behavior with no policy is undocumented
      // enough not to rely on, and "on the tailnet or not" isn't least-privilege. This
      // is a single-operator homelab tailnet: one real user (dw), one subnet router
      // (the in-cluster tailscale-subnet-router pod, subnet-router.yml, advertising only
      // 10.0.20.0/24 per REL-033 -- already scoped off every other VLAN).
      "groups": {
        "group:admin": ["dw@"]
      },
      "tagOwners": {
        // Only group:admin (dw) can tag a node as the subnet router -- prevents any
        // future/rogue node from self-tagging to get route-auto-approval.
        "tag:subnet-router": ["group:admin"]
      },
      "acls": [
        {
          // dw's own devices: full access to the whole tailnet (including the
          // advertised 10.0.20.0/24 LAN route). This is the only principal that
          // exists on this tailnet today -- default-deny for everything else.
          "action": "accept",
          "src": ["group:admin"],
          "dst": ["*:*"]
        }
      ],
      "autoApprovers": {
        "routes": {
          // Matches subnet-router.yml's TS_ROUTES exactly -- only this specific
          // route auto-approves, and only from a node carrying tag:subnet-router.
          "10.0.20.0/24": ["tag:subnet-router"]
        }
      }
    }
