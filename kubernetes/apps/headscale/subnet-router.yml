apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tailscale-router-state
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: tailscale
          image: tailscale/tailscale:stable
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-subnet-router
                  key: TS_AUTHKEY
            # REL-033: was 10.0.0.0/16 -- advertised every VLAN (MGMT/DMZ/IOT/ADMIN
            # included) to any approved tailnet device, bypassing the MikroTik's
            # zero-trust VLAN segmentation entirely for VPN clients. Actual use case
            # is internal services (Jellyfin etc, all behind the Traefik VIP on SRV),
            # so scope to just that VLAN.
            - name: TS_ROUTES
              value: "10.0.20.0/24"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_HOSTNAME
              value: "homelab-router"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_EXTRA_ARGS
              # --advertise-tags requires tag:subnet-router to already exist in the
              # ACL's tagOwners with dw (this authkey's owning user) as an owner --
              # see kubernetes/apps/headscale/config.yml's policy.hujson (Phase 1.4).
              # --advertise-exit-node: operator wants mobile-data traffic routed
              # through the homelab's own WAN uplink, not just the internal LAN
              # route. Gated by the same tag:subnet-router autoApprover as the LAN
              # route, so only this node can ever become an exit node.
              value: "--login-server=https://headscale.woitzik.dev --advertise-tags=tag:subnet-router --advertise-exit-node"
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
            - name: dev-tun
              mountPath: /dev/net/tun
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tailscale-router-state
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
