apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: nextcloud-secrets
    creationPolicy: Owner
  data:
    # postgres-password / admin-password here are the *bootstrap* values
    # (POSTGRES_PASSWORD / NEXTCLOUD_ADMIN_PASSWORD env), consumed by
    # Postgres/Nextcloud's entrypoints ONLY on a completely fresh
    # install (empty data dir / no config.php yet) -- confirmed live:
    # on an already-installed instance these env vars are silently ignored
    # on every subsequent pod restart. A Vault-only rotation of these keys
    # does NOT change the live credential once installed.
    #
    # To actually rotate on a live instance (same pattern as Authelia's
    # storage-password, see authelia/external-secret.yml):
    #   1. ALTER USER against Postgres directly -- but the role Nextcloud
    #      actually connects as day-to-day is NOT "nextcloud" (the
    #      POSTGRES_USER bootstrap/superuser role) -- Nextcloud's installer
    #      auto-created its own lower-privilege role (this install: "oc_dw",
    #      admin-username-prefixed) and config.php's real dbuser/dbpassword
    #      point at THAT role. Rotate oc_dw's Postgres password, not just
    #      "nextcloud"'s -- check `occ config:system:get dbuser` first.
    #   2. `occ config:system:set dbpassword --value=...` to match, THEN
    #      verify with `occ status` before moving on -- setting dbpassword
    #      before the matching ALTER USER breaks the live DB connection
    #      immediately (hit this live during the 2026-07-07 rotation).
    #   3. `occ user:resetpassword --password-from-env <user>` (OC_PASS env)
    #      for the actual admin login -- NEXTCLOUD_ADMIN_PASSWORD alone does
    #      nothing post-install.
    - secretKey: postgres-password
      remoteRef:
        key: secret/nextcloud
        property: postgres-password
    - secretKey: admin-password
      remoteRef:
        key: secret/nextcloud
        property: admin-password
