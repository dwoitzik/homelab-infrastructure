apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-db-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
# REL-028: Postgres 16->18 major bump needs dump/restore, not a bare image
# swap -- PG18 refuses to start against a PG16 data directory. Fresh PVC so
# the new instance can never accidentally touch the old on-disk format. Old
# nextcloud-db-data PVC above kept declared (unused) so ArgoCD prune doesn't
# delete it -- rollback path until this is verified good.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-db-data-pg18
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-nextcloud
  namespace: apps
spec:
  serviceName: postgres-nextcloud
  replicas: 1
  selector:
    matchLabels:
      app: postgres-nextcloud
  template:
    metadata:
      labels:
        app: postgres-nextcloud
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: postgres
          image: postgres:18.4-alpine
          # SEC-012: official entrypoint runs as root and needs CAP_CHOWN/
          # CAP_SETUID/CAP_SETGID to chmod /var/run/postgresql and switch to
          # the postgres user -- confirmed live (same failure as
          # paperless/stack.yml's postgres), dropping all capabilities
          # crash-loops it.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-db-data-pg18
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-nextcloud
  namespace: apps
spec:
  ports:
    - port: 5432
  selector:
    app: postgres-nextcloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-nextcloud
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-nextcloud
  template:
    metadata:
      labels:
        app: redis-nextcloud
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: redis
          image: redis:7.4.9-alpine
          # SEC-012: this instance has no command override, so it runs the
          # image's default entrypoint, which needs CAP_SETUID to setpriv-drop
          # from root to the redis user -- confirmed live ("setpriv: setresuid
          # failed: Operation not permitted"). redis-authelia (system/redis)
          # tolerates the same capability drop fine because it overrides
          # command: with redis-server directly, skipping that entrypoint.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nextcloud
  namespace: apps
spec:
  ports:
    - port: 6379
  selector:
    app: redis-nextcloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: nextcloud
          image: nextcloud:30.0.17-apache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: postgres-nextcloud
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: postgres-password
            - name: REDIS_HOST
              value: redis-nextcloud
            - name: NEXTCLOUD_ADMIN_USER
              value: dw
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: admin-password
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.woitzik.dev
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.woitzik.dev
            - name: TRUSTED_PROXIES
              value: 10.42.0.0/16 10.43.0.0/16
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: tmp
              mountPath: /tmp
            # entrypoint writes redis-session.ini etc. here on every start --
            # a plain emptyDir loses the base image's default PHP module
            # configs, so an initContainer seeds a writable copy first.
            - name: php-conf
              mountPath: /usr/local/etc/php/conf.d
            - name: apache-run
              mountPath: /var/run/apache2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      initContainers:
        - name: copy-php-conf
          image: nextcloud:30.0.17-apache
          command: ["sh", "-c", "cp -a /usr/local/etc/php/conf.d/. /writable-conf/"]
          volumeMounts:
            - name: php-conf
              mountPath: /writable-conf
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
        - name: tmp
          emptyDir: {}
        - name: php-conf
          emptyDir: {}
        - name: apache-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: apps
spec:
  ports:
    - port: 80
  selector:
    app: nextcloud
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: apps
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: nextcloud
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: nextcloud-cron
              image: nextcloud:30.0.17-apache
              command: [php, -f, /var/www/html/cron.php]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data
            - name: tmp
              emptyDir: {}
