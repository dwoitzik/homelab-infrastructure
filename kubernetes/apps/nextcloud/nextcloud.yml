apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
# 2026-08-14: found live -- the entrypoint's `rsync -rlDog --delete
# /usr/src/nextcloud/ /var/www/html/` (the app's own code, tens of thousands
# of small files, re-synced on every single container start by design of
# this image) was writing straight to the NFS-backed nextcloud-data PVC
# above, mounted at the whole /var/www/html root. NFS's per-file write
# latency times tens of thousands of files made this take longer than even
# a 10+ minute liveness grace period -- confirmed live via `ps aux` showing
# the rsync process stuck in D-state (uninterruptible disk wait) and
# `kubectl top` showing ~25m CPU / near-idle the whole time (I/O-bound, not
# CPU-bound work) -- SIGKilled mid-copy, every restart, for the full 10h
# this pod had been up. This is a different, deeper root cause than the
# probe-timing fix already applied below (REL-012-class fix for a real but
# separate problem: contention during a 30-app simultaneous deploy) -- that
# fix was correct for its own scenario but didn't address this one, since
# steady-state restarts here never actually reach a steady state to begin
# with.
#
# Fix: give the disposable, always-freshly-rsynced application code its own
# fast local-path volume instead of NFS -- it's reproducible from the image
# on every start regardless, nothing here needs to survive a pod restart
# except what's subPath-mounted from nextcloud-data below (data/, config/,
# custom_apps/ -- the actual persistent, user-relevant state). Confirmed
# safe to restructure: Nextcloud has never actually been used (no real user
# data at risk either way), and the Deployment is already hard node-pinned
# (nodeSelector: vm-srv-k3s-12), so a node-local PV introduces no new
# scheduling constraint that wasn't already there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# REL-028: Postgres 16->18 major bump needs dump/restore, not a bare image
# swap -- PG18 refuses to start against a PG16 data directory. Fresh PVC so
# the new instance can never accidentally touch the old on-disk format. Old
# nextcloud-db-data PVC (pre-migration, 5Gi) removed 2026-07-05 after a full
# day+ verified good on pg18 (survived a real production outage/fix -- REL-039
# -- in between) -- if a rollback is ever needed again, restore from the daily
# Velero backup instead of relying on the old live PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-db-data-pg18
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-nextcloud
  namespace: apps
spec:
  serviceName: postgres-nextcloud
  # REL-012 stabilization: scaled to 0 during cluster stabilization (I/O).
  # Re-enabled 2026-08-10 after ai-01 decommission + load dropped (host load
  # ~4). Cluster stable.
  replicas: 1
  selector:
    matchLabels:
      app: postgres-nextcloud
  template:
    metadata:
      labels:
        app: postgres-nextcloud
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-srv-k3s-12
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: postgres
          image: postgres:18.4-alpine
          # SEC-012: official entrypoint runs as root and needs CAP_CHOWN/
          # CAP_SETUID/CAP_SETGID to chmod /var/run/postgresql and switch to
          # the postgres user -- confirmed live (same failure as
          # paperless/stack.yml's postgres), dropping all capabilities
          # crash-loops it.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
          volumeMounts:
            # REL-028: postgres 18's image refuses to start against the old
            # 16.x-style mount (/var/lib/postgresql/data + subPath) -- 18+
            # requires a single mount at /var/lib/postgresql, data goes into
            # an auto-versioned subdirectory it manages itself
            # (docker-library/postgres#1259). No subPath since this is a
            # fresh PVC (nextcloud-db-data-pg18), nothing else on it yet.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          # Live-tested: pg_isready -U nextcloud -> accepting connections.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nextcloud"]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "nextcloud"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-db-data-pg18
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-nextcloud
  namespace: apps
spec:
  ports:
    - port: 5432
  selector:
    app: postgres-nextcloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-nextcloud
  namespace: apps
spec:
  # REL-012 stabilization: scaled to 0 during cluster stabilization (I/O).
  # Re-enabled 2026-08-10. Redis runs without persistence (ephemeral cache).
  replicas: 1
  selector:
    matchLabels:
      app: redis-nextcloud
  template:
    metadata:
      labels:
        app: redis-nextcloud
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-srv-k3s-12
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: redis
          image: redis:8.8.0-alpine
          # REL-031-redis (2026-07-05): this container has no PVC at all, but
          # was still running with redis's default persistence settings --
          # confirmed live it kept trying (and failing) to write RDB
          # snapshots to the read-only rootfs ("Failed opening the temp RDB
          # file ... Read-only file system"), which after enough writes hits
          # Redis's own `stop-writes-on-bgsave-error` safeguard and starts
          # REFUSING writes entirely, including PHP session writes -- this is
          # what actually took Nextcloud down (looked like a capabilities
          # issue at first, was a red herring; the real cause was this).
          # Fixed the same way as immich-redis/valkey: invoke redis-server
          # directly with persistence off instead of the image's default
          # entrypoint (which needs CAP_SETUID to setpriv-drop from root).
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          # Live-tested: redis-cli ping -> PONG.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nextcloud
  namespace: apps
spec:
  ports:
    - port: 6379
  selector:
    app: redis-nextcloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: apps
spec:
  # REL-012 stabilization: scaled to 0 during cluster stabilization (I/O).
  # Re-enabled 2026-08-10.
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: vm-srv-k3s-12
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: nextcloud
          image: nextcloud:34.0.1-apache
          # REL-029 regression (2026-07-05): re-hardening to `drop: ["ALL"]"`
          # after the upgrade chain broke the container permanently, not just
          # during upgrades -- Apache's main process needs CAP_SETGID itself
          # to spawn worker processes as www-data (uid/gid 33), confirmed live
          # ("setgid: unable to set group id to Group 33" on every new worker,
          # HTTP requests timing out). Same class of issue as the SEC-012
          # comments on postgres/redis containers elsewhere in this repo --
          # this image's entrypoint is never actually capability-drop-safe,
          # not just during major-version upgrades. Do not re-add this drop.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: postgres-nextcloud
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: postgres-password
            - name: REDIS_HOST
              value: redis-nextcloud
            - name: NEXTCLOUD_ADMIN_USER
              value: dw
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: admin-password
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.woitzik.dev
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.woitzik.dev
            - name: TRUSTED_PROXIES
              value: 10.42.0.0/16 10.43.0.0/16
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            # Application code -- local-path (fast, node-local), rebuilt
            # fresh from the image on every start regardless. See the
            # nextcloud-html PVC comment above for why this moved off NFS.
            - name: html
              mountPath: /var/www/html
            # The only parts that actually need to persist across restarts,
            # subPath-mounted from the NFS-backed data PVC into their normal
            # locations inside the code tree above.
            - name: data
              mountPath: /var/www/html/data
              subPath: data
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
            - name: tmp
              mountPath: /tmp
            # entrypoint writes redis-session.ini etc. here on every start --
            # a plain emptyDir loses the base image's default PHP module
            # configs, so an initContainer seeds a writable copy first.
            - name: php-conf
              mountPath: /usr/local/etc/php/conf.d
            - name: apache-run
              mountPath: /var/run/apache2
          # Live-tested via Pod IP: /status.php needs a Host header override
          # -- NEXTCLOUD_TRUSTED_DOMAINS only permits nextcloud.woitzik.dev,
          # kubelet's real Pod-IP Host header would otherwise 400 (same
          # failure class the homepage batch caught).
          # 2026-08-13: first-ever boot runs Nextcloud's install/migration
          # sequence before Apache serves anything - confirmed live this
          # was taking longer than the previous grace window under load
          # (30 apps deploying at once), causing a restart-before-it-
          # finishes crash loop. Steady-state restarts (already installed)
          # come up fast regardless - this only costs time on first boot.
          # 2026-08-14: even after moving the codebase off NFS (nextcloud-html
          # PVC above), the first-ever rsync of the app's ~40k small files
          # still took well past the previous 620s readiness grace -- watched
          # it live via `ps aux` (the rsync stayed I/O-bound the whole time,
          # not CPU-bound: single-digit CPU-seconds accumulated over several
          # minutes of wall time) and confirmed a SECOND attempt (after the
          # first got killed) progressed at essentially the same slow pace,
          # not the much-faster delta-sync speed a mostly-already-synced
          # retry should show -- this genuinely appears to be this specific
          # hardware's I/O ceiling for a bursty many-small-file write (the
          # same DRAM-less-NVMe write-amplification pattern docs/HARDWARE.md
          # already documents for other workloads), not an NFS-specific or
          # probe-timing-specific problem on its own. Not chasing this
          # further live (anti-loop) -- generous grace here is the accepted,
          # pragmatic accommodation: this cost is paid once (first boot only,
          # steady-state restarts against an already-populated local-path PVC
          # should be fast), and Nextcloud has no real users yet, so a slow
          # first start is a real but low-stakes trade-off.
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: "nextcloud.woitzik.dev"
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: "nextcloud.woitzik.dev"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 60
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      initContainers:
        - name: copy-php-conf
          image: nextcloud:34.0.1-apache
          command: ["sh", "-c", "cp -a /usr/local/etc/php/conf.d/. /writable-conf/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: php-conf
              mountPath: /writable-conf
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-html
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
        - name: tmp
          emptyDir: {}
        - name: php-conf
          emptyDir: {}
        - name: apache-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: apps
spec:
  ports:
    - port: 80
  selector:
    app: nextcloud
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: apps
spec:
  schedule: "*/5 * * * *"
  # REL-xxx: suspended during cluster stabilization -- the 5-min cron produced
  # 22-min runs (cron.php background jobs) that saturated the host nvme (60%+
  # iowait in the VM, D-state postgres/vault), driving load >300. Re-enable
  # once the cluster is quiet and load stays <30.
  suspend: true
  concurrencyPolicy: Forbid
  # REL-061: a single failed run from 2026-06-28/29 (root cause not
  # determinable -- pod logs already garbage-collected by the time this was
  # investigated) sat as the one retained failedJobsHistoryLimit entry for
  # over a week, since nothing rotates a failed Job out until a NEWER
  # failure replaces it. That kept re-triggering KubeJobFailed's 2h Discord
  # repeat_interval indefinitely for a problem that was already gone. 24h
  # TTL is enough time to actually investigate a real failure.
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: nextcloud
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: nextcloud-cron
              image: nextcloud:34.0.1-apache
              command: [php, -f, /var/www/html/cron.php]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data
            - name: tmp
              emptyDir: {}
