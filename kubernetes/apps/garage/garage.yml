# REL-019: garage-data migrated off rpool (the fast SSD shared by every
# VM/LXC) onto the archive pool's 2TB USB HDD -- the storage CLAUDE.local.md
# always intended for Garage/backups, and the structural fix for the chronic
# disk I/O contention behind REL-005/REL-012/REL-016/REL-019. Data moved
# live via rsync --remove-source-files directly on the host (~176GB,
# verified file-count and a final delta sync after the cluster came back
# up); this static PV/PVC pair replaces the old nfs-client-provisioned one
# (deleted, but its underlying NFS directory survives untouched --
# reclaimPolicy was Retain). nfs-subdir-external-provisioner only manages a
# single fixed NFS root, so a second storage class wasn't an option without
# standing up a whole second provisioner instance for one PVC -- a static
# PV pointed directly at the new export (same pattern already used for
# jellyfin/usenet's media-nfs-v2) is simpler for this one-off.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-data-archive
spec:
  capacity:
    storage: 150Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.20.100
    path: /archive-garage-data
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: garage-data-archive
  resources:
    requests:
      storage: 150Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      annotations:
        # REL-019: Velero's daily-backup Schedule (includedNamespaces: "*",
        # defaultVolumesToFsBackup: true) was backing up Garage's own data/meta
        # volumes via kopia INTO Garage itself (its S3 backend) -- a circular
        # write that grew unbounded (30-day TTL) until it filled rpool and
        # paused the whole k3s cluster. Garage is the backup target, not
        # something that needs filesystem-level backup; its content should be
        # protected via S3-level replication/snapshots instead, not Velero FS
        # backup of its own backing store. See docs/AUDIT.md REL-019.
        backup.velero.io/backup-volumes-excludes: data,meta
      labels:
        app: garage
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          args: ["/garage", "server"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            - name: GARAGE_CONFIG
              value: /etc/garage.toml
            - name: GARAGE_ALLOW_WORLD_READABLE_SECRETS
              value: "true"

          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          # Reliability sweep (2026-07-08): no health probes at all -- a
          # hang here is high blast radius, every backup (Velero, CNPG) and
          # this repo's own Terraform state depend on Garage. TCP-only
          # (not HTTP path-based): this image has no wget/curl to verify a
          # real endpoint against live before trusting it, and Garage's
          # admin API health-check path wasn't confirmed live -- matches
          # the SEC-012 lesson (a wrong assumed endpoint caused a
          # false-positive failure loop earlier this session). Still
          # catches the main risk: the S3 API process being completely
          # dead/not listening.
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: config.toml
              readOnly: true
            - name: secrets
              mountPath: /etc/garage/secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/garage/data
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: secrets
          secret:
            secretName: garage-secrets
            defaultMode: 384
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
        - name: meta
          persistentVolumeClaim:
            claimName: garage-meta
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: apps
spec:
  ports:
    - port: 3900
      targetPort: 3900
      name: s3
    - port: 3903
      targetPort: 3903
      name: admin
  selector:
    app: garage
