# nfs-client (nfs-subdir-external-provisioner) does not enforce quotas -- this
# request is informational only. Actual usage was found at 115G+ during the
# REL-019 incident (see docs/AUDIT.md) vs. the 10Gi originally declared here;
# raised to reflect real usage so the number isn't actively misleading.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 150Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      annotations:
        # REL-019: Velero's daily-backup Schedule (includedNamespaces: "*",
        # defaultVolumesToFsBackup: true) was backing up Garage's own data/meta
        # volumes via kopia INTO Garage itself (its S3 backend) -- a circular
        # write that grew unbounded (30-day TTL) until it filled rpool and
        # paused the whole k3s cluster. Garage is the backup target, not
        # something that needs filesystem-level backup; its content should be
        # protected via S3-level replication/snapshots instead, not Velero FS
        # backup of its own backing store. See docs/AUDIT.md REL-019.
        backup.velero.io/backup-volumes-excludes: data,meta
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          args: ["/garage", "server"]
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            - name: GARAGE_CONFIG
              value: /etc/garage.toml
            - name: GARAGE_ALLOW_WORLD_READABLE_SECRETS
              value: "true"

          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: config.toml
              readOnly: true
            - name: secrets
              mountPath: /etc/garage/secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/garage/data
            - name: meta
              mountPath: /var/lib/garage/meta
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: secrets
          secret:
            secretName: garage-secrets
            defaultMode: 384
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
        - name: meta
          persistentVolumeClaim:
            claimName: garage-meta
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: apps
spec:
  ports:
    - port: 3900
      targetPort: 3900
      name: s3
    - port: 3903
      targetPort: 3903
      name: admin
  selector:
    app: garage
