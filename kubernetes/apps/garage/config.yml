apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: apps
data:
  config.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"

    # 2026-08-21 (phase8/LEDGER.md item 3): migrated from sqlite to lmdb (the
    # actual Garage-recommended default since v0.9.0; sqlite was the historical
    # choice here, not a deliberate pick). LMDB's own docs warn it's "prone to
    # database corruption after an unclean shutdown" -- the documented
    # mitigation is replication_factor>=2 or metadata_auto_snapshot_interval.
    # replication_factor is fixed at 1 by this cluster's single-node hardware
    # (see below), so this is the mitigation actually available here.
    metadata_auto_snapshot_interval = "6h"

    replication_factor = 1

    # 2026-08-19 (ADR-023): capped down from Garage's own default (16) after a
    # `garage repair blocks` run drove NVMe write latency to ~5s and host load
    # to 25+ -- this node's data directory shares one physical NVMe with the
    # k3s control-plane VM and everything else on this host (docs/HARDWARE.md),
    # so Garage's own read/write concurrency needs to stay conservative
    # regardless of what a standalone Garage deployment on dedicated disks
    # would tune it to. See phase8/LEDGER.md Entry 40 for the incident.
    block_max_concurrent_reads = 8

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret_file = "/etc/garage/secrets/rpc_secret"

    [s3_api]
    s3_region = "homelab"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.woitzik.dev"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.s3.woitzik.dev"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
    admin_token_file = "/etc/garage/secrets/admin_token"
