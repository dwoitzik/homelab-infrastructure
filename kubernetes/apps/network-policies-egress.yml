# Egress half of default-deny for the `apps` namespace. These policies were
# applied live on 2026-08-23 (goal-1 apps NetworkPolicy work) but never
# committed to git -- pure declared-vs-live drift, caught 2026-08-26 while
# diagnosing a real outage it caused (see the cloudflared rule below). This
# file makes the live state real IaC; names/specs match what was already
# running so this apply adopts the existing resources rather than recreating
# them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-intra-namespace
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.20.11/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-database
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-web
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-synapse-federation
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: synapse
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 8448
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-tailscale-wireguard
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: tailscale-subnet-router
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: UDP
---
# Applied live 2026-08-26 (stopgap kubectl apply, not yet committed until
# now) alongside the cloudflared fix below -- same root incident, a second
# real gap in the same NetworkPolicy rollout. allow-egress-tailscale-
# wireguard covers the actual WireGuard tunnel traffic, but the
# tailscale-subnet-router pod also needs a plain HTTPS connection to
# Headscale's own control-plane endpoint (routed in-cluster through
# Traefik, kube-system, port 8443) to register/re-authenticate -- without
# this, the subnet router can't reach the control plane at all, even
# though the tunnel-traffic rule below is satisfied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-tailscale-headscale-control
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: tailscale-subnet-router
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
---
# THE FIX: cloudflared was never given an egress rule for its actual tunnel
# port. `allow-egress-web` above only covers 443/80 -- cloudflared's edge
# connection uses 7844 (both the QUIC and the --protocol http2 fallback this
# deployment forces, per cloudflared.yml). Missing this since the 2026-08-23
# apply meant cloudflared crash-looped for 4 days straight (295 restarts),
# taking down every public hostname behind it (headscale, photos, the
# Atlantis GitHub webhook) with a hard "connection refused" -- confirmed live
# that raw TCP to Cloudflare's edge on 7844 works fine from the node/host,
# it's specifically this pod's egress that was blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cloudflared-tunnel
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: cloudflared
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 7844
        - protocol: UDP
          port: 7844
    # Second half of the fix (found 2026-08-27, live NetworkPolicy audit):
    # the 7844 rule above only covers the outbound tunnel control connection
    # to Cloudflare's edge -- it says nothing about the return path
    # cloudflared needs to actually PROXY a tunneled request back into the
    # cluster. `allow-egress-web` doesn't cover this either: its `except
    # 10.0.0.0/8` excludes it, because k3s's own Service CIDR (10.43.0.0/16,
    # where Traefik's ClusterIP lives) is itself a subnet of 10.0.0.0/8 --
    # the same collateral-exclusion shape as the LAN carve-out, just for a
    # cluster-internal address instead of a physical host. Confirmed live via
    # cloudflared's own logs: continuous `dial tcp 10.43.26.11:443: connect:
    # connection refused` against `traefik.kube-system.svc.cluster.local`,
    # while Traefik's own access log for the same window shows it serving
    # every other client's requests successfully -- Traefik itself was never
    # down, only this pod's egress to it. Same namespaceSelector/podSelector/
    # port pattern as allow-egress-tailscale-headscale-control above, which
    # already proves this exact selector reaches Traefik correctly.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8000
---
# Warm-standby HA (ADR-029): the litestream sidecars on headscale and
# vaultwarden need egress to rpi-srv-02's restricted SFTP replica target
# (10.0.20.3:22, the litestream user set up by
# ansible/roles/litestream_standby -- chrooted, SFTP-only, no shell). A
# plain IP+port rule rather than a pod/namespaceSelector since rpi-srv-02
# isn't a cluster member. One rule covering both apps via matchExpressions
# rather than two near-identical policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-litestream-sftp
  namespace: apps
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["headscale", "vaultwarden"]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.20.3/32
      ports:
        - protocol: TCP
          port: 22
---
# homepage is a dashboard aggregator by design -- its whole job is polling
# ~15+ services across multiple namespaces (argocd, kube-system, security,
# monitoring) plus external LAN hosts that aren't in the cluster at all
# (Proxmox, Jellyfin, the RPis' beszel agents). Same root gap as the
# cloudflared/tailscale-subnet-router incidents (2026-08-23 NetworkPolicy
# rollout never got a matching egress rule per pod), caught a third time
# when the homepage dashboard itself started showing connection errors.
# A single narrow port rule would just break again the next time a widget
# is added -- broad internal-LAN egress fits what this pod actually does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-homepage-lan
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: homepage
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
---
# Same root gap, found via Loki: myspeed has thrown "NoServers" on every
# hourly test since the 2026-08-23 rollout (confirmed live -- server
# discovery works fine on 443, but the actual test servers it's handed run
# on provider-controlled ports like 8080, which aren't predictable or
# enumerable). allow-egress-web only covers 80/443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-myspeed-test-servers
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: myspeed
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
