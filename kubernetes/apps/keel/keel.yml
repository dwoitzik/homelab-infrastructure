apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keel
rules:
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # REL-043: keel also watches DaemonSets internally (unconditionally, not
  # gated by whether any DS actually carries a keel.sh/policy annotation) --
  # missing this spammed "cannot list resource daemonsets" every ~45s.
  # Read-only: none of this repo's DaemonSets (node-exporter, promtail,
  # metallb-speaker) are meant to be Keel-auto-updated, so no update/patch.
  - apiGroups: ["apps", "extensions"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keel
subjects:
  - kind: ServiceAccount
    name: keel
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel
  namespace: apps
  labels:
    app: keel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keel
  template:
    metadata:
      labels:
        app: keel
    spec:
      serviceAccountName: keel
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: keel
          image: keelhq/keel:0.20.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 9300
          env:
            - name: NAMESPACE
              value: "" # Monitor all namespaces
            - name: POLL_INTERVAL
              value: "1h"
            - name: DEBUG
              value: "false"
            - name: NOTIFICATION_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keel
  namespace: apps
spec:
  ports:
    - port: 9300
      targetPort: 9300
  selector:
    app: keel
