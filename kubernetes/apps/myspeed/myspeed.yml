apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myspeed-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  # nfs-client, not local-path -- local-path pins the PV to whichever node
  # created it (via nodeAffinity), so the pod can only ever be (re)scheduled
  # back onto that one node. Matches every other app's PVC in this repo.
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myspeed
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myspeed
  template:
    metadata:
      labels:
        app: myspeed
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: myspeed
        image: germannewsmaker/myspeed:1.0.9
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5216
        volumeMounts:
        - name: data
          # MySpeed's actual DB lives at /myspeed/data/storage.db (confirmed
          # live via exec) -- the PVC was mounted at /app/data, a path the
          # app never wrote to at all. So nothing was ever actually
          # persisted: every restart/reschedule/redeploy showed the
          # first-run setup wizard again, silently, since day one.
          mountPath: /myspeed/data
        # Live-tested via Pod IP: "/" returns 200 with the frontend HTML.
        readinessProbe:
          httpGet:
            path: /
            port: 5216
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 5216
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: myspeed-data
---
apiVersion: v1
kind: Service
metadata:
  name: myspeed
  namespace: apps
spec:
  ports:
  - port: 5216
    targetPort: 5216
  selector:
    app: myspeed
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: myspeed-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`speed.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer}, {name: authelia}]
    services: [{name: myspeed, port: 5216}]
