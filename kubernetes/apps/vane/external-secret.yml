apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vane-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vane-secrets
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: secret/vane
        property: anthropic-api-key
