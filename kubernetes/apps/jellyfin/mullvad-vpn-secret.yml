# Mullvad WireGuard credentials for gluetun VPN sidecar on SABnzbd.
# DO NOT COMMIT actual values — apply manually:
#   kubectl create secret generic mullvad-vpn -n apps \
#     --from-literal=private-key=<your-wg-private-key> \
#     --from-literal=addresses=<your-mullvad-ip>/32
#
# Retrieve credentials: mullvad.net → Account → WireGuard configuration → Generate key.
# The private key and assigned IP (e.g. 10.68.x.x/32) come from that page.
apiVersion: v1
kind: Secret
metadata:
  name: mullvad-vpn
  namespace: apps
type: Opaque
stringData:
  private-key: REPLACE_WITH_MULLVAD_WIREGUARD_PRIVATE_KEY
  addresses: REPLACE_WITH_MULLVAD_ASSIGNED_IP_CIDR
