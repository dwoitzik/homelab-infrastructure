---
# Jellyseerr - Request management (Jellyfin + Sonarr + Radarr)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: apps
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      containers:
        - name: jellyseerr
          image: fallenbagel/jellyseerr:latest
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: apps
spec:
  selector:
    app: jellyseerr
  ports:
    - port: 5055
      targetPort: 5055
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`requests.woitzik.dev`)
    kind: Rule
    middlewares: [{name: authelia, namespace: apps}]
    services: [{name: jellyseerr, port: 5055}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# SABnzbd - Usenet downloader (routes all traffic through Mullvad WireGuard)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: apps
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      # Init container sets up WireGuard tunnel; kernel interface persists for main container
      initContainers:
        - name: mullvad-setup
          image: alpine:3
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache wireguard-tools iproute2 iptables ip6tables

              # Bring up VPN tunnel
              wg-quick up /etc/wireguard/wg0.conf

              # Save gateway before we kill the default route
              GW=$(ip route | awk '/default/{print $3; exit}')

              # KILL SWITCH: block all non-VPN external traffic via iptables
              # Allow loopback and established connections
              iptables -A OUTPUT -o lo -j ACCEPT
              iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
              # Allow traffic on VPN tunnel
              iptables -A OUTPUT -o wg0 -j ACCEPT
              # Allow cluster-internal CIDRs via eth0 (k3s pod + service + homelab)
              iptables -A OUTPUT -o eth0 -d 10.0.0.0/8 -j ACCEPT
              iptables -A OUTPUT -o eth0 -d 172.16.0.0/12 -j ACCEPT
              iptables -A OUTPUT -o eth0 -d 192.168.0.0/16 -j ACCEPT
              # Allow WireGuard handshake to Mullvad endpoint via eth0
              iptables -A OUTPUT -o eth0 -p udp --dport 51820 -j ACCEPT
              # DROP everything else (kill switch — no VPN = no traffic)
              iptables -A OUTPUT -o eth0 -j DROP

              # IPv6 kill switch (Mullvad is IPv4-only on most servers)
              ip6tables -A OUTPUT -o lo -j ACCEPT
              ip6tables -A OUTPUT -o wg0 -j ACCEPT
              ip6tables -A OUTPUT -j DROP

              # Ensure cluster routes go via eth0 (not through wg0)
              ip route add 10.42.0.0/16 via $GW dev eth0 2>/dev/null || true
              ip route add 10.43.0.0/16 via $GW dev eth0 2>/dev/null || true

              echo "=== Kill switch active — external traffic only via Mullvad ==="
              wg show
              iptables -L OUTPUT --line-numbers -n
          securityContext:
            capabilities:
              add: [NET_ADMIN, SYS_MODULE]
          volumeMounts:
            - name: mullvad-config
              mountPath: /etc/wireguard/wg0.conf
              subPath: wg0.conf
      containers:
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: mullvad-config
          secret:
            secretName: mullvad-wg-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-config
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: apps
spec:
  selector:
    app: sabnzbd
  ports:
    - port: 8080
      targetPort: 8080
