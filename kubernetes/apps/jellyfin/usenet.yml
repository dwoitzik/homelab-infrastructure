# Media acquisition stack — external services pointing to ct-srv-media-acq-01 (LXC 202, 10.0.20.253)
# Migrated from k8s Deployments to dedicated Docker Compose LXC (WRK-006 complete).
# All six apps (Jellyseerr, SABnzbd, Sonarr, Radarr, Bazarr, NZBHydra2) run on the LXC.
# IngressRoutes remain unchanged; k8s cluster-local DNS (*.apps.svc.cluster.local) resolves
# to these External services, so Homepage widgets and Authelia middleware need no updates.
---
# Jellyseerr
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: apps
spec:
  clusterIP: None
  ports:
  - port: 5055
    targetPort: 5055
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jellyseerr
  namespace: apps
subsets:
- addresses:
  - ip: 10.0.20.253
  ports:
  - port: 5055
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`requests.woitzik.dev`)
    kind: Rule
    middlewares: [{name: authelia, namespace: apps}]
    services: [{name: jellyseerr, port: 5055}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
