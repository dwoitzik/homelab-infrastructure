apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: usenet-searcher-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: usenet-searcher-secrets
    creationPolicy: Owner
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: secret/homepage
        property: sonarr-api-key
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: secret/homepage
        property: radarr-api-key
