# WRK-007: Jellyfin moved to a dedicated GPU-passthrough LXC (ct-srv-jellyfin-01,
# 10.0.20.254) for VAAPI hardware transcode access to mini's APU -- the k3s
# Deployment had no GPU passthrough at all (pure software transcode). Provisioning
# is Ansible (ansible/roles/jellyfin), not k8s; this Service+EndpointSlice exists
# purely so Traefik's existing IngressRoute (services: [{name: jellyfin, port: 8096}])
# keeps working unchanged, routing to the external LXC instead of a cluster pod.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: apps
spec:
  ports:
    - port: 8096
      targetPort: 8096
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin
  namespace: apps
  labels:
    kubernetes.io/service-name: jellyfin
addressType: IPv4
ports:
  - name: ""
    port: 8096
endpoints:
  - addresses:
      - 10.0.20.254
