apiVersion: batch/v1
kind: CronJob
metadata:
  name: usenet-searcher
  namespace: apps
  labels:
    app.kubernetes.io/name: usenet-searcher
    app.kubernetes.io/part-of: media-stack
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: usenet-searcher
        spec:
          restartPolicy: OnFailure
          containers:
          - name: searcher
            image: docker.io/python:3.13-alpine
            command: ["python3", "/scripts/search.py"]
            envFrom:
            - secretRef:
                name: usenet-searcher-secrets
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            resources:
              limits:
                cpu: 50m
                memory: 48Mi
              requests:
                cpu: 10m
                memory: 32Mi
          volumes:
          - name: scripts
            configMap:
              name: usenet-searcher-script
              defaultMode: 0555
