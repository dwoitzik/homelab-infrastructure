apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: apps
  labels:
    app.kubernetes.io/name: synapse
    app.kubernetes.io/part-of: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      initContainers:
      - name: init-config
        image: matrixdotorg/synapse:v1.158.0@sha256:5f868df1f5772907c6dbe973a9b69ab530a5d6bb317c011a3788f7ad78eb1292
        command:
          - sh
          - -c
          - |
            set -ex
            mkdir -p /data/keys
            rm -f /data/homeserver.yaml /data/log.config
            cp /source/homeserver.yaml /data/homeserver.yaml
            cp /source/log.config /data/log.config
            sed -i "s|\${SYNAPSE_DB_PASSWORD}|$SYNAPSE_DB_PASSWORD|g" /data/homeserver.yaml
            grep password /data/homeserver.yaml
            python3 -m synapse.app.homeserver \
              --config-path /data/homeserver.yaml \
              --generate-keys \
              --report-stats=no
        env:
        - name: SYNAPSE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: synapse-secrets
              key: SYNAPSE_DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /data
        - name: source
          mountPath: /source
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      containers:
      - name: synapse
        image: matrixdotorg/synapse:v1.158.0@sha256:5f868df1f5772907c6dbe973a9b69ab530a5d6bb317c011a3788f7ad78eb1292
        command: ["python3", "-m", "synapse.app.homeserver"]
        args:
          - "--config-path"
          - "/data/homeserver.yaml"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8008
          name: http
        readinessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
          initialDelaySeconds: 30
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: media
          mountPath: /media
        - name: tmp
          mountPath: /tmp
      securityContext:
        fsGroup: 991
        runAsUser: 991
        runAsNonRoot: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: synapse-data
      - name: media
        persistentVolumeClaim:
          claimName: synapse-media
      - name: source
        configMap:
          name: synapse-config
      - name: tmp
        emptyDir: {}
