apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: apps
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-web
  template:
    metadata:
      labels:
        app: element-web
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: element-web
        image: vectorim/element-web:v1.12.25@sha256:ac50d4eebafd954d7d7e2887d4693bcc91c54c0d00546a3410eeae77e6b342d5
        env:
        - name: ELEMENT_WEB_PORT
          value: "80"
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /app/config.json
          subPath: config.json
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /run
        # nginx's own entrypoint envsubst's default.conf.template -> conf.d/
        # default.conf at startup -- confirmed live: "can't create
        # /etc/nginx/conf.d/default.conf: Read-only file system". It was
        # silently falling back to the image's baked-in config (which happens
        # to work here since no env-var substitution is actually needed), but
        # that's a fragile coincidence, not a real fix.
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: config
        configMap:
          name: element-config
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-conf
        emptyDir: {}
