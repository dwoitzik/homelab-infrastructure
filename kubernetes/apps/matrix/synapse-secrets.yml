# DB password shared between CNPG cluster and Synapse deployment.
# After creating postgres-synapse-user in database namespace, copy the
# password here:
#   PASS=$(kubectl get secret postgres-synapse-user -n database -o jsonpath='{.data.password}' | base64 -d)
#   kubectl create secret generic synapse-db-credentials -n apps --from-literal=password="$PASS"
apiVersion: v1
kind: Secret
metadata:
  name: synapse-db-credentials
  namespace: apps
type: Opaque
stringData:
  password: REPLACE_ME
