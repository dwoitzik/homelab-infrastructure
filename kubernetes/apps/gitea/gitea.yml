apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: web
              containerPort: 3000
            - name: ssh
              containerPort: 22
          env:
            - name: GITEA__server__DOMAIN
              value: git.woitzik.dev
            - name: GITEA__server__ROOT_URL
              value: https://git.woitzik.dev
            - name: GITEA__server__SSH_DOMAIN
              value: git.woitzik.dev
            - name: GITEA__server__SSH_PORT
              value: "22"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /data/gitea/gitea.db
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: secret-key
            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: internal-token
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: GITEA__admin__DEFAULT_EMAIL_NOTIFICATIONS
              value: disabled
            - name: GITEA__time__DEFAULT_UI_LOCATION
              value: Europe/Berlin
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: apps
spec:
  ports:
    - name: web
      port: 3000
    - name: ssh
      port: 22
  selector:
    app: gitea
