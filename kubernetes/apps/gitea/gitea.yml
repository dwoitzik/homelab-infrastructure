apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitea
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: gitea
          image: gitea/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
          # SEC-012: the official image's entrypoint runs as root and needs
          # CAP_CHOWN/CAP_SETGID/CAP_SETUID etc. to chown/chmod its data dirs
          # and su-exec into the git user -- confirmed live, dropping all
          # capabilities crash-loops it ("chown: Operation not permitted",
          # "su-exec: setgroups: Operation not permitted"). Only the
          # privilege-escalation flag is safe to set here.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: web
              containerPort: 3000
            - name: ssh
              containerPort: 22
          env:
            - name: GITEA__server__DOMAIN
              value: git.woitzik.dev
            - name: GITEA__server__ROOT_URL
              value: https://git.woitzik.dev
            - name: GITEA__server__SSH_DOMAIN
              value: git.woitzik.dev
            - name: GITEA__server__SSH_PORT
              value: "22"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /data/gitea/gitea.db
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: secret-key
            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: internal-token
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: GITEA__admin__DEFAULT_EMAIL_NOTIFICATIONS
              value: disabled
            - name: GITEA__time__DEFAULT_UI_LOCATION
              value: Europe/Berlin
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # s6-svscan is invoked directly on /etc/s6 (not s6-overlay v3's
            # init wrapper, so S6_READ_ONLY_ROOT has no effect here) and
            # writes its lock file relative to that directory -- confirmed
            # live: a plain emptyDir at /etc/s6 fails startup entirely
            # (service run-scripts missing), so an initContainer seeds a
            # writable copy of the image's baked-in /etc/s6 instead.
            - name: s6
              mountPath: /etc/s6
            # sshd (git-over-SSH, port 22) needs to chmod/regenerate
            # /etc/ssh/sshd_config and host keys on every start -- same
            # seed-then-mount pattern as /etc/s6 above.
            - name: ssh-etc
              mountPath: /etc/ssh
          # Live-tested: /api/healthz returns {"status":"pass"}. Generous
          # initialDelay -- Recreate strategy + SQLite means a full restart
          # can take a while to open the DB file.
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      initContainers:
        - name: copy-s6
          image: gitea/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
          command: ["sh", "-c", "cp -a /etc/s6/. /writable-s6/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: s6
              mountPath: /writable-s6
        - name: copy-ssh
          image: gitea/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
          command: ["sh", "-c", "cp -a /etc/ssh/. /writable-ssh/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ssh-etc
              mountPath: /writable-ssh
      volumes:
        - name: tmp
          emptyDir: {}
        - name: s6
          emptyDir: {}
        - name: ssh-etc
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: apps
spec:
  ports:
    - name: web
      port: 3000
    - name: ssh
      port: 22
  selector:
    app: gitea
