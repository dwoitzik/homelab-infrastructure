apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-secrets
    creationPolicy: Owner
  # admin-password intentionally not carried over: it was dead cruft in the
  # old hand-created Secret, never actually referenced by gitea.yml's env
  # (only secret-key/internal-token are wired). Gitea reads GITEA__ env vars
  # fresh on every start (unlike Nextcloud/Postgres, which only use their
  # equivalent env vars at first-run install) -- confirmed live: rotating
  # secret-key/internal-token here and restarting the pod is sufficient, no
  # separate `gitea admin user` step needed.
  data:
    - secretKey: secret-key
      remoteRef:
        key: secret/gitea
        property: secret-key
    - secretKey: internal-token
      remoteRef:
        key: secret/gitea
        property: internal-token
