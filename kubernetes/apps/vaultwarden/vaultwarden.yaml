apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vaultwarden
        image: vaultwarden/server:1.37.1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 80
        env:
        - name: SIGNUPS_ALLOWED
          value: "true"
        - name: DOMAIN
          value: "https://vault.woitzik.dev"
        # Reliability sweep (2026-07-08): no health probes at all -- a hang
        # (not a crash) would go undetected indefinitely, Kubernetes would
        # keep routing traffic to an unresponsive pod forever. TCP-only
        # (not HTTP path-based) because this image has no wget/curl to
        # verify a real HTTP endpoint against live before trusting it --
        # matches the SEC-012 lesson (a wrong assumed endpoint caused a
        # false-positive failure loop earlier this session). Still catches
        # the main risk: the process being completely dead/not listening.
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: vault-data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: vault-data
        persistentVolumeClaim:
          claimName: vaultwarden-data
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: apps
spec:
  selector:
    app: vaultwarden
  ports:
  - port: 80
    targetPort: 80
