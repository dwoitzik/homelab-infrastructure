apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: renovate-token
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: renovate-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: secret/renovate
        property: github-pat
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: apps
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:43.253.2
              # SEC-012: runAsNonRoot reverted after the same admission
              # failure pattern hit other images in this pass (image's
              # default user turned out to be root, not assumed non-root) --
              # not confirmed broken here directly, but not worth the risk
              # of the next scheduled run failing unattended.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-token
                      key: token
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_REPOSITORIES
                  value: '["dwoitzik/homelab-infrastructure"]'
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: optional
                - name: RENOVATE_GIT_AUTHOR
                  value: "dwoitzik <woitzikdavid18@gmail.com>"
                - name: LOG_LEVEL
                  value: info
                # REL-066: repo growth (this session's IAC-GAPS work added
                # terraform/stacks/garage, terraform/stacks/proxmox's
                # host-config.tf, and several new ExternalSecrets --
                # depCount went from ~190 to 217) pushed every run's RSS
                # past the 1Gi container limit starting ~2026-07-08 ~00:36 --
                # confirmed via `kubectl get pod ... -o json`, every retry
                # for 16+ hours ended `exitCode:137, reason:OOMKilled`, not a
                # crash/error (log just cuts off mid-extraction with no exit
                # message, which is the OOMKill signature -- SIGKILL gives
                # the process no chance to log anything). Not a config
                # regression (PR #316's tiered-automerge, a bad image tag) --
                # confirmed via job history: the 3 runs before this repo
                # growth landed succeeded cleanly on the same image/config.
                # --max-old-space-size caps V8's own heap; actual container
                # RSS also includes git clone/worktree data and non-heap
                # buffers, typically 20-50% more than the heap cap -- so it
                # must stay meaningfully under the container's memory limit,
                # not equal to it. Raised proportionally with the limit below
                # (896Mi heap under a 1Gi limit left ~13% headroom, too
                # tight for a repo that just grew -- 1536Mi under 2Gi keeps
                # the same ~25% headroom with room for further growth).
                #
                # 2026-07-09 recurrence: OOMKilled again under the same 2Gi
                # limit -- confirmed via `kubectl describe pod` on the last 3
                # failing jobs (exitCode 137, reason OOMKilled), 3 retries
                # each. Not a repo-growth or config-change repeat of the
                # above: no commits landed between the last clean run and the
                # first failure that materially grew dep count (219 deps/67
                # files, same order as before), and the internal-docs
                # relocation (#355/#356) merged *after* failures had already
                # started, plus Renovate never scans .md files anyway. Read
                # as: 2Gi was already marginal (one clean pass wasn't proof
                # it was sized right), and normal run-to-run variance --
                # digest-pin lookups across 128 container images in the
                # kubernetes manager, or host memory pressure (this host has
                # a documented swap-under-pressure history, see
                # docs/OPERATIONS.md) -- was enough to tip it over.
                #
                # Real dmesg oom-kill records pulled from the node (not just
                # Prometheus scrape samples) showed every one of the 20 kills
                # landing at MainThread anon-rss ~2054-2064Mi -- consistently
                # only ~30-40Mi over the 2Gi cap. That's censored data: the
                # kernel kills the instant the cgroup limit is crossed, so it
                # proved 2Gi was insufficient, not what the true uncapped
                # peak was. Raised to 4Gi -- ALSO OOMKilled (anon-rss
                # ~4.12-4.15Gi at kill, same near-the-cap pattern), and the
                # retry loop's CPU/memory pressure on this node (which also
                # runs one of two etcd members) contributed to a real
                # cluster-wide apiserver outage on 2026-07-09 16:34.
                #
                # Root-caused properly after that (uncapped diagnostic run,
                # isolated on a non-k3s LXC with 12Gi headroom, real GitHub
                # token, real branches): NOT a leak. True peak ~3.99Gi, one
                # transient spike from Renovate's terraform manager
                # SHA256-hashing all 14 platform builds of a major
                # hashicorp/aws provider bump (5.x->6.53.0) at the default
                # concurrentRequestLimit (16 simultaneous provider-zip
                # downloads buffered in memory). Given real headroom, GC
                # reclaims it fine and the run finishes clean (exit 0). Under
                # a tight cgroup limit, the hard kill lands mid-spike before
                # GC catches up. Real fix is in renovate.json (hostRules:
                # concurrentRequestLimit=2 for releases.hashicorp.com),
                # flattening the peak at the source. This resource bump is
                # now backed by the real measured peak instead of a
                # multiplier guess: 6Gi/4608Mi heap, ~1.5x the confirmed
                # 3.99Gi peak, real GC margin rather than hoping the ceiling
                # survives a spike untouched.
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=4608"
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  cpu: 500m
                  memory: 6Gi
          volumes:
            - name: tmp
              emptyDir: {}
