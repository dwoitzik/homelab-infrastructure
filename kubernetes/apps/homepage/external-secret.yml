apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: homepage-secrets
    creationPolicy: Owner
  data:
    - secretKey: HOMEPAGE_VAR_ADGUARD_PASSWORD
      remoteRef:
        key: secret/homepage
        property: adguard-password
    - secretKey: HOMEPAGE_VAR_ARGOCD_TOKEN
      remoteRef:
        key: secret/homepage
        property: argocd-token
    - secretKey: HOMEPAGE_VAR_BAZARR_API_KEY
      remoteRef:
        key: secret/homepage
        property: bazarr-api-key
    - secretKey: HOMEPAGE_VAR_GRAFANA_PASSWORD
      remoteRef:
        key: secret/homepage
        property: grafana-password
    - secretKey: HOMEPAGE_VAR_JELLYFIN_API_KEY
      remoteRef:
        key: secret/homepage
        property: jellyfin-api-key
    - secretKey: HOMEPAGE_VAR_JELLYSEERR_API_KEY
      remoteRef:
        key: secret/homepage
        property: jellyseerr-api-key
    - secretKey: HOMEPAGE_VAR_RADARR_API_KEY
      remoteRef:
        key: secret/homepage
        property: radarr-api-key
    - secretKey: HOMEPAGE_VAR_SABNZBD_API_KEY
      remoteRef:
        key: secret/homepage
        property: sabnzbd-api-key
    - secretKey: HOMEPAGE_VAR_SONARR_API_KEY
      remoteRef:
        key: secret/homepage
        property: sonarr-api-key
    # 2026-08-15: added for the Proxmox and CrowdSec widget fixes in
    # homepage.yml -- see the comments on those widgets for root cause.
    # secret/homepage in Vault does not have these properties populated yet
    # (this agent had no Vault write access this session); until it does,
    # ESO will sync these as empty/missing keys and the widgets will keep
    # showing an API error, same as today, just for the documented reason.
    - secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN_ID
      remoteRef:
        key: secret/homepage
        property: proxmox-token-id
    - secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN
      remoteRef:
        key: secret/homepage
        property: proxmox-token
    - secretKey: HOMEPAGE_VAR_CROWDSEC_USERNAME
      remoteRef:
        key: secret/homepage
        property: crowdsec-username
    - secretKey: HOMEPAGE_VAR_CROWDSEC_PASSWORD
      remoteRef:
        key: secret/homepage
        property: crowdsec-password
