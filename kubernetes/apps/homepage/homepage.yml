apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: apps
data:
  services.yaml: |
    - Infrastructure:
        - Proxmox VE:
            icon: proxmox.png
            href: https://pve.woitzik.dev
            description: Hypervisor · 3 VMs, 5 LXC
            siteMonitor: https://pve.woitzik.dev
        - PBS:
            icon: proxmox.png
            href: https://backup.woitzik.dev
            description: Proxmox Backup Server
            siteMonitor: https://backup.woitzik.dev
        - MikroTik:
            icon: mikrotik.png
            href: https://router.woitzik.dev
            description: RB5009 · Core Router
        - Headscale:
            icon: tailscale.png
            href: https://headscale.woitzik.dev
            description: VPN Mesh Controller
    - Platform:
        - ArgoCD:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/argo-cd.svg
            href: https://argo.woitzik.dev
            description: GitOps · homelab-infrastructure
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
        - Traefik:
            icon: traefik.png
            href: https://traefik.woitzik.dev
            description: Edge Router · 35+ Routes
            widget:
              type: traefik
              url: http://traefik-api.kube-system.svc.cluster.local:9000
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.woitzik.dev
            description: Distributed Block Storage
    - Security:
        - Authelia:
            icon: authelia.png
            href: https://auth.woitzik.dev
            description: SSO · 2FA Identity Provider
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.woitzik.dev
            description: Password Manager
        - AdGuard A:
            icon: adguard-home.png
            href: http://10.0.20.2:3001
            description: DNS Filter · rpi-srv-01
            widget:
              type: adguard
              url: http://10.0.20.2:3001
              username: dw
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
        - AdGuard B:
            icon: adguard-home.png
            href: http://10.0.20.3:3001
            description: DNS Filter · rpi-srv-02
            widget:
              type: adguard
              url: http://10.0.20.3:3001
              username: dw
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Apps:
        - Paperless-ngx:
            icon: paperless-ngx.png
            href: https://docs.woitzik.dev
            description: Document Management
        - Open WebUI:
            icon: open-webui.png
            href: https://ai.woitzik.dev
            description: Local LLM Interface
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.woitzik.dev
            description: Files · Calendar · Contacts
        - Mealie:
            icon: mealie.png
            href: https://mealie.woitzik.dev
            description: Recipe Manager
        - Home Assistant:
            icon: home-assistant.png
            href: https://ha.woitzik.dev
            description: Smart Home Hub
        - Gitea:
            icon: gitea.png
            href: https://git.woitzik.dev
            description: Private Git · Azure Modules
        - Garage S3:
            icon: minio.png
            href: https://s3.woitzik.dev
            description: S3 Object Storage · Velero / TF State
    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: https://monitoring.woitzik.dev
            description: Metrics · k3s Cluster
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: admin
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://status.woitzik.dev
            description: Service Uptime Monitor
        - Loki:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/loki.svg
            href: https://loki.woitzik.dev
            description: Log Aggregation · Promtail
  kubernetes.yaml: |
    mode: cluster
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showNodes: true
        nodes:
          show: true
          cpu: true
          memory: true
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        locale: de-DE
        format:
          dateStyle: short
          timeStyle: short
          hour12: false
  layout.yaml: |
    Infrastructure:
      style: grid
      columns: 4
    Platform:
      style: grid
      columns: 3
    Security:
      style: grid
      columns: 4
    Apps:
      style: grid
      columns: 4
    Monitoring:
      style: grid
      columns: 3
  settings.yaml: |
    title: David's Homelab
    theme: dark
    color: slate
    fontFamily: Inter
    layout:
      header:
        style: grid
        columns: 4
    hideHostname: true
    hideConfig: true
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - icon: si-github
              href: https://github.com
        - Docker Hub:
            - icon: si-docker
              href: https://hub.docker.com
        - Artifact Hub:
            - icon: si-helm
              href: https://artifacthub.io
    - Media:
        - YouTube:
            - icon: si-youtube
              href: https://youtube.com
        - Reddit:
            - icon: si-reddit
              href: https://reddit.com
    - Cloud:
        - Cloudflare:
            - icon: si-cloudflare
              href: https://dash.cloudflare.com
        - Azure Portal:
            - icon: si-microsoftazure
              href: https://portal.azure.com
        - Lemon Squeezy:
            - icon: si-lemonsqueezy
              href: https://app.lemonsqueezy.com
  custom.css: |
    body {
      background: radial-gradient(circle at top, #141414 0%, #050505 100%) !important;
      color: #fafafa !important;
      font-family: 'Inter', system-ui, sans-serif !important;
    }
    .grid { gap: 1.5rem !important; }
    .card {
      background: rgba(20, 20, 20, 0.5) !important;
      backdrop-filter: blur(12px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(12px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      border-radius: 14px !important;
      padding: 1.25rem !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .card:hover {
      border-color: rgba(255, 140, 0, 0.55) !important;
      transform: scale(1.02) translateY(-3px) !important;
      background: rgba(35, 35, 35, 0.65) !important;
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 140, 0, 0.1) !important;
    }
    .group-title, #services-header span {
      color: #777 !important;
      font-size: 0.75rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
      border-left: 3px solid #FF8C00 !important;
      padding-left: 0.75rem !important;
    }
    .text-slate-500 { color: #666 !important; font-size: 0.82rem !important; }
    .icon {
      filter: grayscale(1) opacity(0.65) !important;
      transition: filter 0.3s ease, transform 0.3s ease !important;
      width: 40px !important;
      height: 40px !important;
    }
    .card:hover .icon {
      filter: grayscale(0) opacity(1) !important;
      transform: scale(1.08) !important;
    }
    /* Widget stats — orange accent */
    .widget-stats span { color: #FF8C00 !important; }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: homepage-secrets
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "home.woitzik.dev"
        volumeMounts:
        - name: config
          mountPath: /app/config/services.yaml
          subPath: services.yaml
        - name: config
          mountPath: /app/config/widgets.yaml
          subPath: widgets.yaml
        - name: config
          mountPath: /app/config/layout.yaml
          subPath: layout.yaml
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        - name: config
          mountPath: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - name: config
          mountPath: /app/config/custom.css
          subPath: custom.css
        - name: config
          mountPath: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
        - name: logs
          mountPath: /app/config/logs
      volumes:
      - name: config
        configMap:
          name: homepage-config
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: homepage
