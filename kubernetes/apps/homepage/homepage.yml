  # v1.13.2 added custom.js and proxmox.yaml skeletons; without pre-supplied
  # files the startup copyfile hits EROFS (readOnlyRootFilesystem). Same fix
  # as docker.yaml — mount empty files via subPath.
  custom.js: ""
  proxmox.yaml: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      initContainers:
      - name: copy-next
        image: ghcr.io/gethomepage/homepage:v1.13.2
        command: ["sh", "-c", "cp -a /app/.next/. /next-init/"]
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: next-dir
          mountPath: /next-init
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:v1.13.2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: homepage-secrets
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "home.woitzik.dev"
        volumeMounts:
        - name: config
          mountPath: /app/config/services.yaml
          subPath: services.yaml
        - name: config
          mountPath: /app/config/widgets.yaml
          subPath: widgets.yaml
        - name: config
          mountPath: /app/config/layout.yaml
          subPath: layout.yaml
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        - name: config
          mountPath: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - name: config
          mountPath: /app/config/custom.css
          subPath: custom.css
        - name: config
          mountPath: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
        - name: config
          mountPath: /app/config/docker.yaml
          subPath: docker.yaml
        - name: config
          mountPath: /app/config/custom.js
          subPath: custom.js
        - name: config
          mountPath: /app/config/proxmox.yaml
          subPath: proxmox.yaml
        - name: logs
          mountPath: /app/config/logs
        - name: tmp
          mountPath: /tmp
        # SEC-012: Next.js writes its ISR prerender output under /app/.next
        # at runtime (e.g. "Failed to update prerender cache for /en ...
        # open '/app/.next/server/pages/en.html'") -- EROFS under
        # readOnlyRootFilesystem. /app/.next also holds the compiled server
        # bundle the app needs to run at all, so (same as open-webui's
        # static dir) a bare emptyDir would wipe it -- copy-next
        # initContainer seeds a writable copy first.
        - name: next-dir
          mountPath: /app/.next
        # 2026-08-14: found the other half of the SEC-012 fix above was
        # missing. copy-next fixed Next.js's *write* path (EROFS on the
        # baked-in prerendered page), but the page's own build config sets
        # initialRevalidateSeconds: false (checked live via
        # .next/prerender-manifest.json) -- Next.js never automatically
        # re-renders a page like that on its own; it only ever serves the
        # exact HTML gethomepage's own upstream image baked in at their
        # `next build` time (their own demo services.yaml, not this
        # deployment's real config), forever, surviving every restart
        # unchanged (confirmed: identical ETag across a full rollout
        # restart). Fix: manually trigger Next.js's on-demand-revalidation
        # feature once per pod start, using the previewModeId already baked
        # into the image's own prerender-manifest.json (not a secret --
        # it's specifically the credential this exact mechanism is meant to
        # be used with, read from inside the pod, never sent anywhere
        # external). Confirmed live: a single request with header
        # `x-prerender-revalidate: <previewModeId>` to the page itself makes
        # Next.js properly re-render from the live mounted config and write
        # the result back to /app/.next (now writable thanks to copy-next),
        # serving correctly from then on -- x-nextjs-cache flips from HIT
        # (stale) to REVALIDATED, then HIT again on the corrected page.
        lifecycle:
          postStart:
            exec:
              command:
                - sh
                - -c
                - |
                  id=$(sed -n 's/.*"previewModeId": *"\([^"]*\)".*/\1/p' /app/.next/prerender-manifest.json)
                  i=0
                  while [ "$i" -lt 15 ]; do
                    wget -q -O /dev/null --header="Host: localhost:3000" --header="x-prerender-revalidate: $id" http://localhost:3000/ && exit 0
                    i=$((i + 1))
                    sleep 1
                  done
        # Live-tested: /api/healthcheck returns "up". Host header override is
        # required -- HOMEPAGE_ALLOWED_HOSTS only permits home.woitzik.dev
        # (+ loopback), and kubelet's httpGet probe otherwise sends the Pod
        # IP as Host, which Next.js's host validation middleware 400s on.
        # Confirmed live: this bit both readiness and liveness probes and
        # actually restarted the pod once before being caught.
        readinessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3000
            httpHeaders:
              - name: Host
                value: "localhost:3000"
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3000
            httpHeaders:
              - name: Host
                value: "localhost:3000"
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: homepage-config
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: next-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: homepage
