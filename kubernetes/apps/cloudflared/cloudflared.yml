apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # One connector per node, so losing a node never takes the tunnel down.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        args:
        - tunnel
        - "--no-autoupdate"
        # Default QUIC transport was dropping streams every ~10min ("no recent
        # network activity") -- the MikroTik's UDP conntrack times out the
        # tunnel's idle QUIC flow faster than cloudflared's own keepalive,
        # and GitHub webhook deliveries landing in that gap got a 502. HTTP/2
        # runs over TCP, which the router's NAT session tracking handles the
        # normal way.
        - --protocol
        - http2
        - --metrics
        - 0.0.0.0:20241
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-secrets
              key: tunnel-token
        ports:
        - name: metrics
          containerPort: 20241
        # Live-tested: /ready returns readyConnections (tunnel's actual
        # connection count to Cloudflare's edge), not just process-up --
        # catches a cloudflared that's running but has lost its tunnel.
        readinessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: tmp
        emptyDir: {}
