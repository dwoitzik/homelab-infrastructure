apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        args:
        - tunnel
        - "--no-autoupdate"
        - --metrics
        - 0.0.0.0:20241
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-secrets
              key: tunnel-token
        ports:
        - name: metrics
          containerPort: 20241
        # Live-tested: /ready returns readyConnections (tunnel's actual
        # connection count to Cloudflare's edge), not just process-up --
        # catches a cloudflared that's running but has lost its tunnel.
        readinessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: tmp
        emptyDir: {}
