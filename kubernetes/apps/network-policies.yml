# Default deny all ingress in apps namespace
# Explicit allow rules below open only what's needed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Traefik (kube-system) to reach all apps for reverse proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
# headscale-dmz-lb traffic arrives SNAT'd to a pod-CIDR address, so it
# never matches allow-intra-namespace below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-headscale-dmz-lb
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: headscale
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8080
---
# Allow intra-namespace traffic (pods within apps talk to each other).
# REL-034/ADR-012: previously excluded atlantis (it held Terraform apply
# credentials for the entire homelab and had zero auth of its own on its raw
# Service, so a blanket intra-namespace allow meant any pod in `apps` could
# reach its plan/apply UI unauthenticated). Atlantis no longer runs in this
# namespace at all -- it's a dedicated LXC now (ct-srv-atlantis-01) -- so the
# whole class of risk this exclusion guarded against no longer applies here;
# reverted to a plain blanket allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
---
# Allow monitoring (Prometheus) to scrape metrics from apps
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Allow ArgoCD to reach apps (health checks)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-argocd
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
---
# Allow Velero to reach Garage S3 for backups
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-velero
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
---
# Allow database namespace (CNPG/Authelia postgres) to reach Garage S3 --
# CNPG's barman-cloud backup plugin archives WAL/base-backups here (see
# REL-057b). Found live but with zero IaC trail during the 2026-07-08
# hardening pass, alongside discovering this whole file has zero ArgoCD
# Application tracking it (see gitops-tracking-application.yml) -- added
# here BEFORE enabling that tracking's automated prune, since pruning
# first would have deleted this and broken CNPG's backup archiving.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-database-to-garage
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - port: 3900
          protocol: TCP
