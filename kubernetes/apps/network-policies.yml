# Default deny all ingress in apps namespace
# Explicit allow rules below open only what's needed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Traefik (kube-system) to reach all apps for reverse proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
# Allow intra-namespace traffic (pods within apps talk to each other).
# REL-034: excludes atlantis -- it holds Terraform apply credentials for the
# entire homelab (Proxmox, MikroTik, Cloudflare) and had zero auth of its
# own on its raw Service. A blanket intra-namespace allow meant any other
# pod in `apps` (confirmed live: gitea) could reach its plan/apply UI with
# no authentication at all -- the only thing actually gating
# atlantis.woitzik.dev externally is an undocumented Cloudflare Access
# policy (not in Terraform, not reviewable in git). This policy no longer
# covers atlantis; see allow-atlantis-ingress below for its own narrow rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: apps
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [atlantis]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
---
# REL-034: atlantis gets its own narrow ingress instead of the blanket
# intra-namespace allow above -- only cloudflared (its actual public entry
# path) may reach it directly. allow-from-traefik/allow-from-monitoring/
# allow-from-argocd (podSelector: {} below) still apply on top of this,
# which is intentional (health checks, metrics scraping).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-atlantis-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: atlantis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
---
# Allow monitoring (Prometheus) to scrape metrics from apps
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Allow ArgoCD to reach apps (health checks)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-argocd
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
---
# Allow Velero to reach Garage S3 for backups
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-velero
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
