apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  # nfs-client, not local-path -- same reasoning as every other app's PVC in
  # this repo (myspeed, uptime-kuma, etc.): local-path pins the PV to
  # whichever node created it, nfs-client doesn't.
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beszel
  template:
    metadata:
      labels:
        app: beszel
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: beszel
          # Pinned, not :latest -- Kyverno's disallow-latest-tag policy
          # rejects unpinned tags (caught live: the first deploy attempt was
          # blocked by the admission webhook before any pod was created).
          image: henrygd/beszel:0.18.8@sha256:4c51486968efa0b0a702c1b0967966a2e06fb250b7418f3072d2488faea27c51
          env:
            # Internal-only -- no Cloudflare DNS record for this host (see
            # the IngressRoute below), so this is only ever reached via the
            # AdGuard *.woitzik.dev wildcard rewrite from the LAN.
            - name: APP_URL
              value: https://beszel.woitzik.dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: data
              mountPath: /beszel_data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: beszel
  namespace: apps
spec:
  ports:
    - port: 8090
      targetPort: 8090
  selector:
    app: beszel
---
# Internal-only, deliberately: no cloudflare_dns_record for this host in
# terraform/stacks/cloudflare, so it never resolves outside the LAN --
# reached only via AdGuard's existing *.woitzik.dev -> Traefik VIP wildcard
# rewrite. Same authelia gate as every other internal admin surface.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beszel-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`beszel.woitzik.dev`)
      kind: Rule
      middlewares: [{name: crowdsec-bouncer}, {name: authelia}]
      services: [{name: beszel, port: 8090}]
