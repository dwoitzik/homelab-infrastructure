apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: apps
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "Homelab Search"
      debug: false
    server:
      # Replace with a random 32+ char secret; update here or manage via ExternalSecret
      secret_key: "2a4571382e643af9c1e8006296736624c2ca73d03b0389b96f7f7b6469bfd6bf" # gitleaks:allow -- session signing only, no user data, Authelia gates access
      bind_address: "0.0.0.0:8080"
      limiter: false
      image_proxy: true
    ui:
      default_locale: "de"
      default_theme: simple
      center_alignment: true
    search:
      safe_search: 0
      autocomplete: "google"
      default_lang: "de-DE"
    # REL-033: default engine set (use_default_settings: true, ~70 engines) fans
    # every query out and waits up to the default 3s/engine before finalizing --
    # one slow/unreachable engine drags out the whole response. Capping
    # request_timeout bounds worst-case page latency regardless of which
    # engines are slow that day.
    outgoing:
      request_timeout: 2.0
      max_request_timeout: 4.0
      pool_connections: 100
      pool_maxsize: 20
    # brave/startpage/wikidata CAPTCHA or rate-limit this egress IP
    # outright. duckduckgo re-enabled for a retest -- self-hosted SearXNG
    # reports generally list it as one of the more reliable engines.
    engines:
      - name: brave
        disabled: true
      - name: duckduckgo
        disabled: false
      - name: startpage
        disabled: true
      - name: wikidata
        disabled: true
      # Documented SearXNG option: routes through Google's mobile UI, which
      # isn't subject to the same rate-limiting as the desktop endpoint --
      # the actual fix for silent empty results, not just a toggle.
      - name: google
        use_mobile_ui: true
      # bing scrapes its own low-confidence "related content" widgets as if
      # they were organic results for niche queries -- fine for common
      # terms, actively wrong (off-topic, wrong language) for anything else.
      - name: bing
        disabled: true
      - name: qwant
        disabled: false
      - name: mojeek
        disabled: false
      # HTTP protocol error on every request -- broken, not just rate-limited.
      - name: yahoo
        disabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: searxng
        image: searxng/searxng:2026.7.1-c5d8d05f0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
            add: ["SETGID", "SETUID", "CHOWN"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/searxng
        # Live-tested via Pod IP: "/" returns 200 with the search page HTML,
        # no host-validation issue (unlike homepage's Next.js middleware).
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: searxng-config
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: apps
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: searxng
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`search.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer}, {name: authelia}]
    services: [{name: searxng, port: 8080}]
