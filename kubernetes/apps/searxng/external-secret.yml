apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: searxng-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: searxng-secrets
  data:
    - secretKey: brave-api-key
      remoteRef:
        key: secret/searxng
        property: brave-api-key
