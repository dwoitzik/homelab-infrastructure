# Scrutiny — S.M.A.R.T. disk health monitoring
# Hub/Spoke layout: InfluxDB + Web UI + Collector DaemonSet
# Collector needs hostPID + SYS_RAWIO for smartctl access
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scrutiny-influxdb-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scrutiny-config
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrutiny-influxdb
  namespace: apps
spec:
  serviceName: scrutiny-influxdb
  replicas: 1
  selector:
    matchLabels:
      app: scrutiny-influxdb
  template:
    metadata:
      labels:
        app: scrutiny-influxdb
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: influxdb
          image: influxdb:2.8
          ports:
            - containerPort: 8086
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: setup
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: admin
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scrutiny-secrets
                  key: influxdb-password
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: homelab
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: scrutiny
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scrutiny-secrets
                  key: influxdb-token
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
            - name: config
              mountPath: /etc/influxdb2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scrutiny-influxdb-data
        - name: config
          persistentVolumeClaim:
            claimName: scrutiny-config
---
apiVersion: v1
kind: Service
metadata:
  name: scrutiny-influxdb
  namespace: apps
spec:
  clusterIP: None
  ports:
    - port: 8086
      targetPort: 8086
  selector:
    app: scrutiny-influxdb
---
apiVersion: v1
kind: Secret
metadata:
  name: scrutiny-secrets
  namespace: apps
type: Opaque
stringData:
  influxdb-password: "scrutiny-homelab-2026"
  influxdb-token: "scrutiny-homelab-token-2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutiny-web
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scrutiny-web
  template:
    metadata:
      labels:
        app: scrutiny-web
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: web
          image: ghcr.io/analogj/scrutiny:v0.9.2-web
          ports:
            - containerPort: 8080
          env:
            - name: SCRUTINY_WEB_INFLUXDB_HOST
              value: scrutiny-influxdb
            - name: SCRUTINY_WEB_INFLUXDB_PORT
              value: "8086"
            - name: SCRUTINY_WEB_INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scrutiny-secrets
                  key: influxdb-token
            - name: SCRUTINY_WEB_INFLUXDB_ORG
              value: homelab
            - name: SCRUTINY_WEB_INFLUXDB_BUCKET
              value: scrutiny
            - name: TZ
              value: Europe/Berlin
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 4
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scrutiny-web
  namespace: apps
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: scrutiny-web
---
# Collector DaemonSet — runs on every node for S.M.A.R.T. data collection
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scrutiny-collector
  namespace: apps
spec:
  selector:
    matchLabels:
      app: scrutiny-collector
  template:
    metadata:
      labels:
        app: scrutiny-collector
    spec:
      hostPID: true
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: collector
          image: ghcr.io/analogj/scrutiny:v0.9.2-collector
          env:
            - name: COLLECTOR_API_ENDPOINT
              value: http://scrutiny-web.apps.svc.cluster.local:8080
            - name: COLLECTOR_CRON_SCHEDULE
              value: "*/30 * * * *"
            - name: TZ
              value: Europe/Berlin
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
              readOnly: true
            - name: udev
              mountPath: /run/udev
              readOnly: true
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: udev
          hostPath:
            path: /run/udev
