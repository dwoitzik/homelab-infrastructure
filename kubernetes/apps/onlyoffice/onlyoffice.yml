# OnlyOffice Document Server — bundled image (PG + Redis + Nginx included)
# Memory-heavy: 2GB+ RAM required. Scheduled on k3s-13 via nodeAffinity.
---
apiVersion: v1
kind: Secret
metadata:
  name: onlyoffice-secrets
  namespace: apps
type: Opaque
stringData:
  jwt-secret: "onlyoffice-homelab-jwt-2026"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onlyoffice-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [vm-srv-k3s-13]
      containers:
        - name: onlyoffice
          image: onlyoffice/documentserver:9.4
          ports:
            - containerPort: 80
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onlyoffice-secrets
                  key: jwt-secret
            - name: JWT_HEADER
              value: Authorization
            - name: ALLOW_PRIVATE_IP
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: 2000m
              memory: 2560Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/www/onlyoffice/Data
            - name: log
              mountPath: /var/log/onlyoffice
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onlyoffice-data
        - name: log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: apps
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: onlyoffice
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onlyoffice-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`onlyoffice.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer}, {name: authelia}]
    services: [{name: onlyoffice, port: 80}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlyoffice
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: /kubernetes/apps/onlyoffice
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/apps/onlyoffice
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
