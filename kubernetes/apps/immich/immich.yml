apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: apps
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
      annotations:
        backup.velero.io/backup-volumes: db
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: postgres
        image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
        # SEC hardening (2026-07-08): was running as root (confirmed live via
        # `kubectl exec ... id`) with no securityContext at all. pgdata is
        # already owned 999:0 on disk (the image's own entrypoint already
        # chowns it on first init) so runAsUser:999 needs no extra chown
        # step, unlike immich-server/immich-ml below.
        # 2026-08-17 (KSV-0014 dedicated pass): readOnlyRootFilesystem added,
        # with the /var/run/postgresql socket dir this comment previously
        # flagged as the blocker -- verified live, DB connectivity intact.
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: immich
        - name: POSTGRES_USER
          value: immich
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secrets
              key: db-password
        - name: POSTGRES_INITDB_ARGS
          value: "--data-checksums"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # 2026-08-16: memory limit raised 1Gi->1.5Gi alongside the new /dev/shm
        # mount below -- tmpfs usage counts against the container's own memory
        # cgroup, and 1Gi was already tight for a 512MB shared_buffers instance
        # before adding shm headroom on top of it.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        # Live-tested: `pg_isready -U immich` -> "accepting connections".
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "immich"]
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "immich"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: db
          mountPath: /var/lib/postgresql/data
        - name: tmp
          mountPath: /tmp
        - name: dshm
          mountPath: /dev/shm
        - name: run
          mountPath: /var/run/postgresql
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: immich-db-pg16
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
      # 2026-08-16: no /dev/shm volume existed here at all -- the container ran on
      # the containerd default (64Mi), while shared_buffers is 512MB. Root-caused
      # as the likely cause of the "crash of another server process / possibly
      # corrupted shared memory" restarts recorded in docs/EXPOSURE.md (17 restarts
      # before this pass) -- not real data corruption; a full VACUUM (VERBOSE,
      # ANALYZE) completed with zero errors across every page, and 24,721 real
      # assets are present. 1Gi gives headroom above shared_buffers for parallel
      # query workers' dynamic shared memory segments, which is what actually needs
      # /dev/shm space beyond shared_buffers itself.
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: apps
spec:
  ports:
  - port: 5432
  selector:
    app: immich-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: valkey
        image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
        command: ["valkey-server", "--save", "", "--appendonly", "no"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # Live-tested: `valkey-cli ping` -> PONG.
        readinessProbe:
          exec:
            command: ["valkey-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          exec:
            command: ["valkey-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: apps
spec:
  ports:
  - port: 6379
  selector:
    app: immich-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
      annotations:
        # library lives on the 2TB HDD archive pool — large cold storage, not
        # worth backing up as a filesystem blob (re-upload source from phone).
        backup.velero.io/backup-volumes-excludes: library
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # SEC hardening attempted 2026-07-08, deferred: was running as root
      # (confirmed live) despite already having most other hardening
      # (readOnlyRootFilesystem, capability drop). The image has a standard
      # Node.js "node" user (uid/gid 1000, confirmed via /etc/passwd), but
      # /usr/src/app/upload is root:root on disk AND is NFS-backed
      # (10.0.20.100:/usb-immich-library, 54GB of mostly small files) --
      # an initContainer `chown -R` to fix that hung for 2+ minutes without
      # completing and was live-tested, caught, and rolled back (NFS chown
      # over many small files is metadata-operation-bound, not
      # bandwidth-bound -- this isn't a "wait longer" problem). Deferred as
      # a genuine design decision, not silently dropped: needs either a
      # scheduled low-traffic-window background chown (could take a long
      # time, must not block pod startup) or accepting root here as a
      # documented residual risk, mitigated by the capability
      # drop/no-priv-escalation/readOnlyRootFilesystem/seccomp already in
      # place. Flagged in the hardening report, not resolved in this PR.
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 2283
        env:
        - name: TZ
          value: Europe/Berlin
        - name: IMMICH_HOST
          value: "0.0.0.0"
        - name: DB_HOSTNAME
          value: immich-postgres
        - name: DB_USERNAME
          value: immich
        - name: DB_DATABASE_NAME
          value: immich
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secrets
              key: db-password
        - name: REDIS_HOSTNAME
          value: immich-redis
        - name: IMMICH_MACHINE_LEARNING_URL
          value: http://immich-ml:3003
        - name: IMMICH_MEDIA_LOCATION
          value: /usr/src/app/upload
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: immich-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi
        # Live-tested via Pod IP: /api/server/ping -> {"res":"pong"}, no auth.
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: library
          mountPath: /usr/src/app/upload
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: library
        persistentVolumeClaim:
          claimName: immich-library
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: apps
spec:
  ports:
  - port: 2283
    targetPort: 2283
  selector:
    app: immich-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-ml
  template:
    metadata:
      labels:
        app: immich-ml
      annotations:
        # ML cache holds downloaded CLIP/face models (~3GB) — re-downloadable,
        # exclude from Velero to keep backup sizes manageable.
        backup.velero.io/backup-volumes-excludes: cache
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # SEC hardening (2026-07-08): was running as root (confirmed live).
      # Unlike immich-server this image has no named non-root user in
      # /etc/passwd (no "node"-style convention) -- using uid/gid 65534
      # (nobody), the same arbitrary-non-root convention already used
      # elsewhere in this repo (blackbox-exporter, snmp-exporter). /cache's
      # top level is already 777 (any uid can write), but its subdirectories
      # (clip/facial-recognition/huggingface/ocr, holding downloaded models)
      # are root:root 755 -- chowning them so 65534 can actually read/write
      # the cached models instead of silently re-downloading on every
      # restart.
      initContainers:
      - name: fix-cache-ownership
        image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
        command: ["chown", "-R", "65534:65534", "/cache"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: cache
          mountPath: /cache
      containers:
      - name: immich-ml
        image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3003
        env:
        - name: IMMICH_HOST
          value: "0.0.0.0"
        - name: IMMICH_PORT
          value: "3003"
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /cache/huggingface
        - name: XDG_CACHE_HOME
          value: /cache/xdg
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        # Live-tested via Pod IP: /ping -> "pong". Longer initialDelay -- ML
        # models load into memory on startup before this responds.
        readinessProbe:
          httpGet:
            path: /ping
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /ping
            port: 3003
          initialDelaySeconds: 40
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: immich-ml-cache
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-ml
  namespace: apps
spec:
  ports:
  - port: 3003
  selector:
    app: immich-ml
