# Immich photo library → SanDisk 3.2Gen1 USB stick (460 GB, ~149 MB/s read, ~73 MB/s write).
# Write-once/read-many workload (originals + thumbnails written at upload, read thereafter)
# is a good fit for USB flash. Databases and random-write workloads stay on SSD (immich-db).
#
# Storage setup (imperative):
#   On Proxmox host:
#     # USB stick is in /etc/fstab at /mnt/pve/usb-immich (UUID=2bf6bef6-...)
#     mkdir -p /mnt/pve/usb-immich/immich-library
#     pct set 220 -mp3 /mnt/pve/usb-immich/immich-library,mp=/usb-immich-library
#   Then run Ansible to reload NFS exports:
#     ansible-playbook ansible/site.yml --limit nfs_nodes
#   Vault secret (seed once):
#     vault kv put secret/immich db-password=<random32> jwt-secret=<random64>
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-usb
spec:
  capacity:
    storage: 400Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.20.100
    path: /usb-immich-library
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: immich-library-usb
  resources:
    requests:
      storage: 400Gi
---
# Immich PostgreSQL data — SSD-backed NFS (metadata + pgvecto.rs face vectors).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
# ML model cache — downloaded once (~3GB), re-downloadable, SSD-backed NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
