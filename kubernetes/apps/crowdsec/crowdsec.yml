apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-config
  namespace: security
data:
  acquis.yaml: |
    ---
    filenames:
      - /var/log/containers/traefik-*_kube-system_*.log
    force_inotify: true
    poll_without_inotify: true
    labels:
      type: containerd
      program: traefik
  config.yaml: |
    common:
      daemonize: false
      log_media: stdout
      log_level: info
    config_paths:
      config_dir: /etc/crowdsec/
      data_dir: /var/lib/crowdsec/data/
      simulation_path: /etc/crowdsec/simulation.yaml
      hub_dir: /etc/crowdsec/hub/
      index_path: /etc/crowdsec/hub/.index.json
      notification_dir: /etc/crowdsec/notifications/
      plugin_dir: /usr/local/lib/crowdsec/plugins/
    crowdsec_service:
      acquisition_path: /etc/crowdsec/acquis.yaml
      acquisition_dir: /etc/crowdsec/acquis.d
      parser_routines: 1
    db_config:
      type: sqlite
      db_path: /var/lib/crowdsec/data/crowdsec.db
      log_level: info
      flush:
        max_items: 5000
        max_age: 7d
    api:
      server:
        listen_uri: 0.0.0.0:8080
        profiles_path: /etc/crowdsec/profiles.yaml
        trusted_ips:
          - 127.0.0.1
          - ::1
      client:
        insecure_skip_verify: false
        credentials_path: /etc/crowdsec/local_api_credentials.yaml
    prometheus:
      enabled: true
      level: full
      listen_addr: 0.0.0.0
      listen_port: 6060
  profiles.yaml: |
    name: default_ip_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
      - type: ban
        duration: 4h
    on_success: break
    ---
    name: default_range_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Range"
    decisions:
      - type: ban
        duration: 4h
    on_success: break
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crowdsec
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crowdsec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec
subjects:
  - kind: ServiceAccount
    name: crowdsec
    namespace: security
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crowdsec
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec
    spec:
      serviceAccountName: crowdsec
      tolerations:
        - operator: Exists
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          args:
            - crowdsec
            - -config=/etc/crowdsec/config.yaml
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 6060
              protocol: TCP
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
            - name: PARSERS
              value: "crowdsecurity/cri-logs"
            - name: GID
              value: "0"
            # 2026-08-17 (Section C, secrets hygiene): was a hardcoded plaintext
            # value committed to git -- gitleaks' ruleset doesn't pattern-match
            # this specific string as a secret, so it went unnoticed by CI.
            # Rotated (old value invalidated by this same change -- CrowdSec's
            # entrypoint re-registers the "traefik" bouncer with whatever key
            # this env var holds on every container start) and moved to a real
            # k8s Secret. Not yet Vault/ESO-backed (this agent has no live
            # Vault write token this session) -- that migration is a real,
            # tracked follow-up, not silently dropped; see phase8/STATE.md.
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: crowdsec-bouncer-key-traefik
                  key: key
            - name: CROWDSEC_API_SERVER_LISTEN_URI
              value: "0.0.0.0:8080"
            - name: CROWDSEC_PROMETHEUS_LISTEN_ADDR
              value: "0.0.0.0"
            - name: CROWDSEC_DB_TYPE
              value: "sqlite"
            - name: CROWDSEC_DB_DB_PATH
              value: "/var/lib/crowdsec/data/crowdsec.db"
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec/acquis.yaml
              subPath: acquis.yaml
            - name: config
              mountPath: /etc/crowdsec/profiles.yaml
              subPath: profiles.yaml
            - name: data
              mountPath: /var/lib/crowdsec/data
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # 2026-08-16: requests/limits doubled after all 3 pods hit "database is
          # locked"/"context canceled" on their emptyDir sqlite (crowdsec.db) during
          # the local-lvm thin-pool exhaustion incident that crashed the host that
          # day -- the original 200m/128Mi ceiling left no headroom for SQLite
          # transactions to complete promptly once the node was under I/O pressure,
          # so locks were held longer and readiness/liveness probes started failing
          # (broke the Homepage bouncer-auth widget). Storage crisis itself is
          # resolved (see phase8/LEDGER.md Entries 6-8); this is a smaller, cheap,
          # separate hardening step so the same probe-flap doesn't recur under any
          # future I/O-pressure event, not a claim that today's root cause repeats.
          # CPU limit 400m->700m: `kubectl top` showed this container sustained
          # at/above its old ceiling (throttled), slowing LAPI response time for
          # the Homepage widget and bouncer checks.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 700m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        # Re-creates the Homepage widget's LAPI login on every boot (machine DB
        # is an emptyDir, wiped on restart). Username/password come from the
        # same Vault property the widget itself uses -- must stay in sync.
        - name: dashboard-machine-registrar
          image: crowdsecurity/crowdsec:latest
          command:
            - sh
            - -c
            - |
              # `cscli lapi status` needs local_api_credentials.yaml, which
              # only the main container ever has -- used as a readiness gate
              # here it never returns, wedging this sidecar forever.
              until wget -q -O /dev/null http://127.0.0.1:8080/health; do sleep 2; done
              # -f redirects cscli's own credentials-file write (defaults to a
              # read-only path here), which otherwise makes a successful add
              # misreport as failed.
              if cscli machines add "$DASHBOARD_MACHINE_USERNAME" --password "$DASHBOARD_MACHINE_PASSWORD" --force -f /tmp/unused-credentials.yaml 2>&1; then
                echo "registered $DASHBOARD_MACHINE_USERNAME"
              else
                echo "registration failed (see error above)"
              fi
              sleep infinity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: DASHBOARD_MACHINE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-dashboard-machine
                  key: username
            - name: DASHBOARD_MACHINE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-dashboard-machine
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec/config.yaml
              subPath: config.yaml
            # cscli machines add loads the LAPI profile config too, not just
            # config.yaml -- missing this made every add fail silently until
            # caught via a manual exec (profiles.yaml: no such file or dir).
            - name: config
              mountPath: /etc/crowdsec/profiles.yaml
              subPath: profiles.yaml
            - name: registrar-tmp
              mountPath: /tmp
            # cscli itself (not just the crowdsec daemon) writes a trace dir
            # under here -- confirmed live: "while setting up trace
            # directory: mkdir /var/lib/crowdsec/data/trace: read-only file
            # system". Shares the same volume as the main container; cscli
            # here only ever reads/writes its own trace scratch space, no
            # conflict with the daemon's actual DB in the same dir.
            - name: data
              mountPath: /var/lib/crowdsec/data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: crowdsec-config
        - name: data
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: registrar-tmp
          emptyDir: {}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-dashboard-machine
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: crowdsec-dashboard-machine
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/homepage
        property: crowdsec-username
    - secretKey: password
      remoteRef:
        key: secret/homepage
        property: crowdsec-password
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  selector:
    app.kubernetes.io/name: crowdsec
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 6060
      targetPort: metrics
      protocol: TCP
