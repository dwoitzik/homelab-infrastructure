apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    app.kubernetes.io/part-of: security
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-config
  namespace: security
data:
  acquis.yaml: |
    ---
    filenames:
      - /var/log/containers/traefik-*_kube-system_*.log
    force_inotify: true
    labels:
      type: containerd
      program: traefik
  config.yaml: |
    common:
      daemonize: false
      log_media: stdout
      log_level: info
    config_paths:
      config_dir: /etc/crowdsec/
      data_dir: /var/lib/crowdsec/data/
      simulation_path: /etc/crowdsec/simulation.yaml
      hub_dir: /etc/crowdsec/hub/
      index_path: /etc/crowdsec/hub/.index.json
      notification_dir: /etc/crowdsec/notifications/
      plugin_dir: /usr/local/lib/crowdsec/plugins/
    crowdsec_service:
      acquisition_path: /etc/crowdsec/acquis.yaml
      acquisition_dir: /etc/crowdsec/acquis.d
      parser_routines: 1
    db_config:
      type: sqlite
      db_path: /var/lib/crowdsec/data/crowdsec.db
      log_level: info
      flush:
        max_items: 5000
        max_age: 7d
    api:
      server:
        listen_uri: 0.0.0.0:8080
        profiles_path: /etc/crowdsec/profiles.yaml
        trusted_ips:
          - 127.0.0.1
          - ::1
      client:
        insecure_skip_verify: false
        credentials_path: /etc/crowdsec/local_api_credentials.yaml
    prometheus:
      enabled: true
      level: full
      listen_addr: 0.0.0.0
      listen_port: 6060
  profiles.yaml: |
    name: default_ip_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
      - type: ban
        duration: 4h
    on_success: break
    ---
    name: default_range_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Range"
    decisions:
      - type: ban
        duration: 4h
    on_success: break
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crowdsec
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crowdsec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec
subjects:
  - kind: ServiceAccount
    name: crowdsec
    namespace: security
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crowdsec
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec
    spec:
      serviceAccountName: crowdsec
      tolerations:
        - operator: Exists
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          args:
            - crowdsec
            - -config=/etc/crowdsec/config.yaml
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 6060
              protocol: TCP
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-scenarios"
            - name: PARSERS
              value: "crowdsecurity/cri-logs"
            - name: GID
              value: "0"
            - name: BOUNCER_KEY_traefik
              value: "bFWgFb0LBV6OUspll3IZyqgIAwwLlQ5RbXV39Cgd"
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec/acquis.yaml
              subPath: acquis.yaml
            - name: config
              mountPath: /etc/crowdsec/config.yaml
              subPath: config.yaml
            - name: config
              mountPath: /etc/crowdsec/profiles.yaml
              subPath: profiles.yaml
            - name: data
              mountPath: /var/lib/crowdsec/data
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: crowdsec-config
        - name: data
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  selector:
    app.kubernetes.io/name: crowdsec
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 6060
      targetPort: metrics
      protocol: TCP
