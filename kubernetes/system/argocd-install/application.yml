# ArgoCD's own workloads (ADR-078). No prune and no resources finalizer, so neither a
# bad commit nor deleting this Application can remove ArgoCD. Recovery without ArgoCD:
# `kubectl apply --server-side -k kubernetes/system/argocd-install`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-install
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/system/argocd-install
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
