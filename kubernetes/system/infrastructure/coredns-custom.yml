apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # Dedicated server block: the main `.` block already runs `hosts` once
  # (NodeHosts) and a second instance in the same block errors. Routes this
  # hostname to Traefik's ClusterIP instead of its flaky LB VIP -- ADR-040.
  woitzik-dev-internal.server: |
    auth.woitzik.dev:53 {
        hosts {
            10.43.26.11 auth.woitzik.dev
            fallthrough
        }
    }
