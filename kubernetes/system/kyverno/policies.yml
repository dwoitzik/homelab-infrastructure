# Kyverno cluster policies.
# require-resource-limits and disallow-latest-tag were Audit-only until the
# underlying gaps (IAC-001, SEC-005) were fixed; flipped to Enforce 2026-06-23
# once a PolicyReport sweep confirmed zero violations cluster-wide.
#
# Both are scoped to [apps, database] only, not monitoring. The PolicyReport
# sweep only reflected pods that existed *at that moment*; restarting Grafana
# (kube-prometheus-stack chart) immediately after enforcing got blocked --
# grafana-sc-dashboard, grafana-sc-datasources, and other chart-templated
# sidecars across kube-prometheus-stack/loki/promtail in `monitoring` lack
# resources by upstream chart default. Chasing every third-party sidecar's
# resource values (and keeping them patched as charts get upgraded) is a
# separate, larger effort than this pass's scope: the manifests this repo
# directly authors. `apps` and `database` are 100% hand-written manifests in
# this repo, so enforcement there doesn't have this problem.

---
# Block pods missing resource limits.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/description: >
      Pods without resource limits can starve other workloads on the same node.
      Run `kubectl get policyreport -A` to see violations before enforcing.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-container-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [apps, database]
      validate:
        message: "Container '{{ request.object.spec.containers[0].name }}' must define resources.limits (cpu and memory)."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""
---
# Block privileged containers outright.
# This is safe to enforce immediately — no homelab service needs privileged mode.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/description: >
      Privileged containers have host-level access and should never run in this cluster.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [apps, monitoring, database, external-secrets]
      validate:
        message: "Privileged containers are not allowed."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || false }}"
                    operator: Equals
                    value: true
---
# Block use of :latest or untagged images. All manifests pinned to semver tags
# as of SEC-005 (2026-06-23) -- see docs/AUDIT.md.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow :latest Image Tag
    policies.kyverno.io/description: >
      Images pinned to :latest are non-deterministic and make rollbacks impossible.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [apps, database]
      validate:
        message: "Container '{{ request.object.spec.containers[0].name }}' must use a specific image tag, not :latest or untagged."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image | contains(@, ':') }}"
                    operator: Equals
                    value: false
