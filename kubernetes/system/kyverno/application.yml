apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      targetRevision: 3.5.3
      chart: kyverno
      helm:
        values: |
          # Fail-open: when Kyverno is unavailable the API server must not block
          # requests. With failurePolicy:Fail every admission call waits up to 30s
          # before timing out, driving p99 latency to 60s+ (REL-024 pattern).
          features:
            forceFailurePolicyIgnore:
              enabled: true
            # Off by default in the chart -- PolicyException objects are
            # otherwise silently ignored by the admission controller. Scoped
            # to apps only, not cluster-wide, on purpose.
            policyExceptions:
              enabled: true
              namespace: apps
          admissionController:
            replicas: 1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 384Mi
          # Policy reports are one datastore write per resource; enforcement happens at
          # admission, and kyverno-policy-drift-check covers running pods instead.
          backgroundController:
            enabled: false
          cleanupController:
            # Leader-election lease is 6x/5x the retry period; 10s gives 60s/50s so an
            # apiserver latency blip no longer makes the single replica exit.
            extraArgs:
              leaderElectionRetryPeriod: 10s
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
          reportsController:
            enabled: false
    # Policies live in Git like the controller, not applied by hand.
    - repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
      targetRevision: main
      path: kubernetes/system/kyverno
      directory:
        include: policies.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
