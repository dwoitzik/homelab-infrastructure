apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    targetRevision: 3.5.3
    chart: kyverno
    helm:
      values: |
        # Fail-open: when Kyverno is unavailable the API server must not block
        # requests. With failurePolicy:Fail every admission call waits up to 30s
        # before timing out, driving p99 latency to 60s+ (REL-024 pattern).
        # webhookFailurePolicy is not a valid 3.5.x chart key;
        # forceFailurePolicyIgnore maps to --forceFailurePolicyIgnore CLI arg.
        admissionController:
          forceFailurePolicyIgnore: true
          replicas: 1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
        # Background controller scans all existing resources and generates/updates
        # policyreports in etcd — 357 reports in apps/monitoring alone, each an
        # etcd write. On a single-node etcd this is a significant fraction of all
        # write traffic. Disable: enforcement is handled by the admission webhook.
        backgroundController:
          enabled: false
        cleanupController:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        reportsController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
