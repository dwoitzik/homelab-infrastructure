apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    targetRevision: 3.2.6
    chart: kyverno
    helm:
      values: |
        admissionController:
          replicas: 1
        backgroundController:
          enabled: true
        reportsController:
          enabled: true
        cleanupJobs:
          admissionReports:
            image:
              registry: registry.k8s.io
              repository: kubectl
              tag: v1.28.5
          clusterAdmissionReports:
            image:
              registry: registry.k8s.io
              repository: kubectl
              tag: v1.28.5
          ephemeralReports:
            image:
              registry: registry.k8s.io
              repository: kubectl
              tag: v1.28.5
          clusterEphemeralReports:
            image:
              registry: registry.k8s.io
              repository: kubectl
              tag: v1.28.5
          updateRequests:
            image:
              registry: registry.k8s.io
              repository: kubectl
              tag: v1.28.5
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
