apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-unseal
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-unseal
  template:
    metadata:
      labels:
        app: vault-unseal
    spec:
      serviceAccountName: vault-unseal
      restartPolicy: Always
      containers:
        - name: unseal
          image: hashicorp/vault:1.17
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              while true; do
                STATUS=$(vault status -format=json 2>/dev/null | grep '"sealed"' | grep -c 'true' || true)
                if [ "$STATUS" -gt "0" ]; then
                  echo "$(date): Vault is sealed, unsealing..."
                  vault operator unseal "$UNSEAL_KEY_1" 2>&1 || true
                  vault operator unseal "$UNSEAL_KEY_2" 2>&1 || true
                  echo "$(date): Unseal attempt done"
                fi
                sleep 5
              done
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: UNSEAL_KEY_1
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key1
            - name: UNSEAL_KEY_2
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key2
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-unseal
  namespace: vault
