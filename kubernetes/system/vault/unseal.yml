apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-unseal
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-unseal
  template:
    metadata:
      labels:
        app: vault-unseal
    spec:
      serviceAccountName: vault-unseal
      restartPolicy: Always
      containers:
        - name: unseal
          image: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
          # SEC-012: hashicorp/vault's default image user is root -- confirmed
          # live, runAsNonRoot alone fails admission ("container has
          # runAsNonRoot and image will run as root").
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              # Poll seal-status over HTTP, not the vault CLI: the 2.1.1 binary
              # is ~500MB (hashicorp/vault#21069) and this 64Mi cgroup can never
              # cache it, so each exec reread hundreds of MB from the NVMe.
              while true; do
                SEALED=$(wget -q -O- -T 5 --tries=1 "$VAULT_ADDR/v1/sys/seal-status" 2>/dev/null \
                  | grep -o '"sealed":[a-z]*' | cut -d: -f2)
                if [ "$SEALED" = "true" ]; then
                  echo "$(date): Vault is sealed, unsealing..."
                  wget -q -O- -T 5 --tries=1 --post-data="{\"key\":\"$UNSEAL_KEY_1\"}" "$VAULT_ADDR/v1/sys/unseal" >/dev/null 2>&1 || true
                  wget -q -O- -T 5 --tries=1 --post-data="{\"key\":\"$UNSEAL_KEY_2\"}" "$VAULT_ADDR/v1/sys/unseal" >/dev/null 2>&1 || true
                  echo "$(date): Unseal attempt done"
                fi
                sleep 5
              done
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: UNSEAL_KEY_1
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key1
            - name: UNSEAL_KEY_2
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-unseal
  namespace: vault
