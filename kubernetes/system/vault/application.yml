apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.28.1
    chart: vault
    helm:
      values: |
        server:
          ha:
            enabled: false
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/vault/data"
                node_id = "vault-0"
              }
              service_registration "kubernetes" {}
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: local-path
            accessMode: ReadWriteOnce
          # Bumped after a live incident: vault-0 was chronically running at
          # 511Mi against a 512Mi limit for 9+ days (readiness probe timing
          # out thousands of times), and during a host-wide memory-pressure
          # spike its raft barrier writes started failing outright
          # ("failed to persist keyring: context deadline exceeded"). Real
          # host RAM was scarce that day too, but this container had zero
          # margin of its own regardless of host state.
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            enabled: true
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        ui:
          enabled: true
        injector:
          enabled: false
        csi:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
