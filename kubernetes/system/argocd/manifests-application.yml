# REL-035: kubernetes/system/argocd/ was tracked in git but owned by NO ArgoCD
# Application -- system-manifests' directory.include only matches
# {apps-ingressroute,other-ingressroute,pod-disruption-budgets}.yml at the top
# level of kubernetes/system/, never recursing into subdirectories. Discovered
# because the Authelia fix committed to argo-main/ingressroute.yml never took
# live effect via GitOps; a fully untracked duplicate (argo-final, no auth)
# was the only live route until it was found and manually removed.
#
# argocd-cm.yml, argocd-cmd-params-cm.yml and argocd-rbac-cm.yml (ArgoCD's own
# bootstrap/RBAC config) stay out of automated sync until each is individually
# diffed against live -- selfHeal+prune there has cluster-wide blast radius.
#
# argocd-notifications-cm.yml and notifications-external-secret.yml added
# 2026-07-07 (autonomy-readiness task 2): argocd-notifications-cm existed
# live with zero data (notifications-controller running but configured to do
# nothing) and was never git-tracked at all -- same orphan-config class as
# the REL-035/042 bugs above, just never noticed because an empty config
# doesn't fail loudly.
#
# network-policies.yml added 2026-07-07 (REL-055b): same orphan-config class
# again -- these 5 NetworkPolicies were live since the original 2026-05-31
# manual bootstrap and never git-tracked. Brought under GitOps here after
# fixing the bug they had (see the file's own header comment for the
# namespaceSelector:{} / kube-router NetworkPolicy enforcement finding).
#
# system-app-bootstrap.yml is now included here: it was the only file in this
# directory with no owner, so edits to it never reached the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/system/argocd
    directory:
      # Included after the diff its own header demanded: every field is
      # identical to live, so selfHeal has nothing to revert. Renamed .yaml ->
      # .yml because a brace glob ending in .yml cannot match it.
      include: '{ingressroute,external-secret,argocd-notifications-cm,notifications-external-secret,network-policies,system-app-bootstrap,apps-applicationset}.yml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
