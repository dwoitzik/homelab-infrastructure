# Same Discord incoming-webhook URL Alertmanager already uses
# (secret/alertmanager:discord-webhook-url), merged into argocd's own
# notifications-secret under the key name argocd-notifications-cm.yml
# references via `$discord-webhook-url`. creationPolicy Merge, not Owner --
# argocd-notifications-controller manages this Secret's other keys itself.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Merge
  data:
    - secretKey: discord-webhook-url
      remoteRef:
        key: secret/alertmanager
        property: discord-webhook-url
