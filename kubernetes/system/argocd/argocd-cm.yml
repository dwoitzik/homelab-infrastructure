apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argo.woitzik.dev
  accounts.admin: apiKey, login
  # Reconciliation interval — raised 2026-08-08 to reduce ArgoCD controller
  # churn on the low-I/O nodes. Default is 180s of every 30s→3m polling loop.
  timeout.reconciliation: 300s
  timeout.hard.reconciliation: 3600s
  oidc.config: |
    name: Authelia
    issuer: https://auth.woitzik.dev
    clientID: argocd
    clientSecret: $argocd-secret:oidc.clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
  # ExternalSecret/ClusterSecretStore/SecretStore drift: the ESO mutating
  # webhook defaults fields (conversionStrategy, decodingStrategy,
  # metadataPolicy, deletionPolicy) that the git manifests leave out. ArgoCD
  # diffs them as changes → permanent OutOfSync → selfHeal auto-sync loop that
  # churns the API server and keeps ~12 apps Degraded/OutOfSync. Ignore the
  # defaulted fields + status cluster-wide (applies to every Application).
  resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
    jqPathExpressions:
      - .spec.data[].remoteRef.conversionStrategy
      - .spec.data[].remoteRef.decodingStrategy
      - .spec.data[].remoteRef.metadataPolicy
      - .spec.target.deletionPolicy
      - .status
  resource.customizations.ignoreDifferences.external-secrets.io_ClusterSecretStore: |
    jqPathExpressions:
      - .status
  resource.customizations.ignoreDifferences.external-secrets.io_SecretStore: |
    jqPathExpressions:
      - .status
  # ArgoCD has no built-in health check for CNPG's Cluster CRD -- without
  # this it reports every Cluster as permanently Unknown regardless of
  # actual state, dragging the whole Application's health down with it.
  resource.customizations.health.postgresql.cnpg.io_Cluster: |
    health_status = {}
    if obj.status ~= nil and obj.status.phase ~= nil then
      if obj.status.phase == "Cluster in healthy state" then
        health_status.status = "Healthy"
        health_status.message = obj.status.phase
        return health_status
      end
      if obj.status.phase == "Failed" then
        health_status.status = "Degraded"
        health_status.message = obj.status.phase
        return health_status
      end
      health_status.status = "Progressing"
      health_status.message = obj.status.phase
      return health_status
    end
    health_status.status = "Progressing"
    health_status.message = "Waiting for Cluster status"
    return health_status
