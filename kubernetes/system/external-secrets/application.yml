apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    targetRevision: 2.15.0
    chart: external-secrets
    helm:
      values: |
        installCRDs: true
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 256Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 80Mi
            limits:
              memory: 192Mi
        serviceMonitor:
          enabled: true
          namespace: monitoring
          # The default skips the ServiceMonitor when the chart cannot see the
          # monitoring.coreos.com API at render time, which drops metrics silently.
          renderMode: alwaysRender
          # Prometheus only selects ServiceMonitors carrying this label.
          additionalLabels:
            release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
