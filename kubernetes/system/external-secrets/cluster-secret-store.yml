# ClusterSecretStore backed by Vault KV v2.
# Bootstrap order:
#   1. ArgoCD syncs vault/ Application → Vault pod running
#   2. kubectl exec vault-0 -n vault -- vault operator init
#   3. Unseal (3 of 5 keys), copy root token
#   4. kubectl create secret generic vault-token -n external-secrets --from-literal=token=<root-token>
#   5. ArgoCD syncs this store → ESO connects to Vault
#   6. Migrate raw k8s Secrets to Vault KV paths (see ROADMAP.md)
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
