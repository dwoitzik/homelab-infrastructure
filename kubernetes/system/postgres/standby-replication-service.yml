# ADR-030: dedicated entry point for rpi-srv-02's warm standby, restricted
# to its LAN IP three independent ways (loadBalancerSourceRanges here,
# network-policies.yml's ipBlock, cluster.yml's pg_hba) -- see the ADR.
apiVersion: v1
kind: Service
metadata:
  name: postgres-authelia-standby-replication
  namespace: database
spec:
  type: LoadBalancer
  # Local keeps rpi-srv-02's source IP. Cluster SNATs it to a node address,
  # so the pg_hba rule and the NetworkPolicy ipBlock both reject the standby.
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 10.0.20.3/32
  selector:
    cnpg.io/cluster: postgres-authelia
    cnpg.io/instanceRole: primary
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
