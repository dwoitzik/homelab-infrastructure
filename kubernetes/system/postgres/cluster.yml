# CloudNativePG Cluster replacing the bare postgres StatefulSet.
#
# Migration steps (one-time, after operator is Running):
#   1. Dump from old StatefulSet:
#      kubectl exec postgres-authelia-0 -n database -- \
#        pg_dump -U authelia authelia > /tmp/authelia.sql
#   2. Wait for CNPG cluster to be Ready:
#      kubectl get cluster postgres-authelia -n database
#   3. Restore into CNPG primary:
#      kubectl exec -n database postgres-authelia-1 -c postgres -- \
#        psql -U authelia -d authelia < /tmp/authelia.sql
#   4. Delete old StatefulSet and its PVC:
#      kubectl delete statefulset postgres-authelia -n database
#      kubectl delete pvc data-postgres-authelia-0 -n database
#
# Prerequisites:
#   kubectl create secret generic postgres-authelia-user -n database \
#     --from-literal=username=authelia \
#     --from-literal=password=<same password as in authelia-secrets/storage-password>
#
# ADR-030 prerequisite: postgres-authelia-rpi02-replica k8s Secret + matching
# Vault password entry, both already generated -- see ansible/roles/postgres_authelia_standby.

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-authelia
  namespace: database
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
    # ADR-030: password-authenticated replication for the rpi-srv-02 warm
    # standby, restricted to its exact LAN IP -- CNPG's own default pg_hba
    # rules are cert-authenticated and don't cover an external standby.
    pg_hba:
      - hostssl replication rpi02_replica 10.0.20.3/32 scram-sha-256

  managed:
    roles:
      # ADR-030: minimal-privilege role for rpi-srv-02's standby only --
      # replication only, no login to any real database, no superuser.
      - name: rpi02_replica
        ensure: present
        login: true
        replication: true
        superuser: false
        passwordSecret:
          name: postgres-authelia-rpi02-replica

  bootstrap:
    initdb:
      database: authelia
      owner: authelia
      secret:
        name: postgres-authelia-user

  storage:
    size: 12Gi
    storageClass: local-path

  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # PodMonitor generated here is deliberately disabled -- CNPG's own
  # auto-generated one only carries the `cnpg.io/cluster` label, but this
  # cluster's Prometheus requires `release: kube-prometheus-stack` on every
  # PodMonitor (podMonitorSelector), so it was silently never scraped despite
  # showing Synced/Healthy in ArgoCD. See postgres-monitoring.yml for the
  # git-managed replacement carrying both labels.
  monitoring:
    enablePodMonitor: false

  # REL-057b: was s3://velero/cnpg-postgres-authelia -- CNPG's own barman-cloud
  # archiving shared Velero's bucket, and its unrecognized top-level directory
  # tripped Velero's own bucket-validation logic, intermittently marking the
  # BackupStorageLocation Unavailable (confirmed live, correlates with 2 of the
  # last 5 daily Velero backups actually failing). One bucket per backup
  # *system*, not per database, so future CNPG clusters land under their own
  # prefix here instead of colliding again.
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/authelia
      endpointURL: http://garage.apps.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: cnpg-garage-backup
          key: access-key-id
        secretAccessKey:
          name: cnpg-garage-backup
          key: secret-access-key
        region:
          name: cnpg-backup-config
          key: region
      wal:
        compression: gzip
      data:
        compression: gzip
