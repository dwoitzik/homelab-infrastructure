apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-garage-backup
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cnpg-garage-backup
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: secret/garage
        property: velero-access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: secret/garage
        property: velero-secret-access-key
