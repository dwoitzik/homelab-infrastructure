apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-garage-backup
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cnpg-garage-backup
    creationPolicy: Owner
  data:
    # REL-057b: was pointed at the velero-* properties -- CNPG's barman-cloud
    # was authenticating into Velero's own bucket with (what was in practice)
    # Velero's own credential. Repointed to a key scoped only to the new
    # cnpg-backups bucket (see cluster.yml) so CNPG can never again write an
    # unrecognized top-level directory into Velero's bucket and trip its
    # BackupStorageLocation validation.
    - secretKey: access-key-id
      remoteRef:
        key: secret/garage
        property: cnpg-backups-access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: secret/garage
        property: cnpg-backups-secret-access-key
