# firefly-iii's postgres was a plain, unmanaged StatefulSet -- no CNPG
# operator, no ScheduledBackup, no failover, unlike every sibling database
# in this namespace. Database was empty at migration, no data risk.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-firefly-cnpg-user
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgres-firefly-cnpg-user
    creationPolicy: Owner
  data:
    - remoteRef:
        key: secret/firefly
        property: postgres-user
      secretKey: username
    - remoteRef:
        key: secret/firefly
        property: postgres-password
      secretKey: password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-firefly
  namespace: database
spec:
  instances: 1
  priorityClassName: node-pinned-stateful
  # Pinned so an operator upgrade never moves the cluster to a new default image or major.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:14f7842047c843a1a055024c0ba63a8740b08f886ab3fc2e1d2bb87af0988b67

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "64MB"
      # Default 5min forces a 16 MB WAL segment per cluster every 5 minutes, even idle.
      archive_timeout: "30min"

  bootstrap:
    initdb:
      database: firefly
      owner: firefly
      secret:
        name: postgres-firefly-cnpg-user

  storage:
    size: 2Gi
    storageClass: local-path

  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

  monitoring:
    enablePodMonitor: false

  # WAL archiving and base backups through the Barman Cloud plugin; the target
  # and retention live in the ObjectStore of the same name (object-stores.yml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-firefly
