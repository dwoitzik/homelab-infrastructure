apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-synapse
  namespace: database
spec:
  instances: 1
  # Pinned so an operator upgrade never moves the cluster to a new default image or major.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      # Default 5min forces a 16 MB WAL segment per cluster every 5 minutes, even idle.
      archive_timeout: "30min"

  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      secret:
        name: postgres-synapse-user

  storage:
    size: 10Gi
    storageClass: local-path

  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  monitoring:
    enablePodMonitor: false

  # WAL archiving and base backups through the Barman Cloud plugin; the target
  # and retention live in the ObjectStore of the same name (object-stores.yml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-synapse
