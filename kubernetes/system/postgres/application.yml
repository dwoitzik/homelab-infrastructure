apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-authelia
  namespace: database
spec:
  serviceName: "postgres-authelia"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-authelia
  template:
    metadata:
      labels:
        app: postgres-authelia
    spec:
      containers:
      - name: postgresql
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: "authelia"
        - name: POSTGRES_DB
          value: "authelia"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "longhorn"
      resources:
        requests:
          storage: 8Gi
