apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-n8n
  namespace: database
spec:
  # REL-xxx stabilization pause lifted 2026-08-13: this cluster (and
  # cluster-synapse.yml alongside it) had never actually been applied to
  # the rebuilt cluster at all -- both live under kubernetes/system/postgres/,
  # outside the homelab-apps ApplicationSet's kubernetes/apps/* glob, so
  # nothing was tracking them (same class of gap as the CNPG Authelia
  # cluster before it was wired in). Applied fresh, hibernated, and swapped
  # in the preserved pre-disaster PVC data (n8n: pvc-f1e0d4df..., verified
  # via database contents matching the Phase 1 EVIDENCE.md record), then
  # un-hibernated. Real recovered data, not a fresh-empty cluster.
  instances: 1
  priorityClassName: node-pinned-stateful
  # Pinned so an operator upgrade never moves the cluster to a new default image or major.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "64MB"
      # Default 5min forces a 16 MB WAL segment per cluster every 5 minutes, even idle.
      archive_timeout: "30min"

  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: postgres-n8n-user

  storage:
    size: 5Gi
    storageClass: local-path

  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

  monitoring:
    enablePodMonitor: false

  # WAL archiving and base backups through the Barman Cloud plugin; the target
  # and retention live in the ObjectStore of the same name (object-stores.yml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-n8n
