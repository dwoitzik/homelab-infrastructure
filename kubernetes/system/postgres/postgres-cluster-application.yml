# Loads CNPG Cluster and backup credentials from this directory.
# Apply AFTER cloudnative-pg operator Application is synced and CRDs are installed.
# Bootstrap command: kubectl apply -f kubernetes/system/postgres/postgres-cluster-application.yml
#
# REPLACE_ME (2026-08-01): user-n8n/user-synapse Secrets were previously part of
# this App's sync set. They are CNPG *bootstrap* secrets -- CNPG reads them once
# at initdb to set the initial DB role password, and ignores them afterwards.
# ArgoCD selfHeal (enabled below) kept reverting the live passwords to the
# REPLACE_ME placeholder from Git, breaking every app that reads the secret after
# a pod restart (synapse, n8n -- see session 2026-08-01 crash loop). They are now
# excluded from the sync set on purpose; keep the real values in Vault
# (secret/synapse db-password, secret/n8n db-password) and patch the live Secrets
# manually after any re-clone, matching the ALTER USER in the running DB.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: HEAD
    path: kubernetes/system/postgres
    directory:
      include: '{cluster,cluster-n8n,cluster-synapse,cluster-firefly,external-secret,scheduled-backup,backup-config,network-policies,postgres-monitoring,standby-replication-service}.yml'
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  # CNPG writes its defaults back into .spec, so a spec declaring only what it
  # means diffs forever and selfHeal chases it in a loop. Ignore only the
  # operator-owned fields; storage/backup/monitoring/postgresql stay diffable.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /spec/enablePDB
        - /spec/enableSuperuserAccess
        - /spec/failoverDelay
        - /spec/imageName
        - /spec/logLevel
        - /spec/affinity/podAntiAffinityType
        - /spec/backup/target
        - /spec/bootstrap/initdb/encoding
        - /spec/bootstrap/initdb/localeCType
        - /spec/bootstrap/initdb/localeCollate
        - /spec/managed/roles/0/connectionLimit
        - /spec/managed/roles/0/inherit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
