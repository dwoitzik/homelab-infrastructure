# HashiCorp Vault UI (secrets management — secrets.woitzik.dev)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-main
  namespace: vault
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`secrets.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer, namespace: apps}, {name: authelia, namespace: apps}]
    services: [{name: vault, port: 8200}]
---
# REL-033: ArgoCD IngressRoute moved to kubernetes/system/argocd/ingressroute.yml
# (co-located with the app it fronts, now Authelia-gated there) -- this was a
# byte-identical duplicate (same name+namespace, so no Traefik routing conflict,
# but two Applications fighting to own one object is its own footgun).
---
# Router (MikroTik at 10.0.10.1:80) — headless Service + Endpoints
# Note: ExternalName with raw IPs doesn't work reliably in k8s/Traefik
apiVersion: v1
kind: Service
metadata:
  name: router-external
  namespace: apps
spec:
  clusterIP: None
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: router-external
  namespace: apps
subsets:
- addresses:
  - ip: 10.0.10.1
  ports:
  - port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router-main
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`router.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer, namespace: apps}, {name: authelia, namespace: apps}]
    services: [{name: router-external, port: 80}]
---
# Traefik API — ClusterIP so homepage widget can reach port 9000
apiVersion: v1
kind: Service
metadata:
  name: traefik-api
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
  - name: api
    port: 9000
    targetPort: traefik
---
# Loki — redirect browser traffic to Grafana Explore, keep API path for Promtail
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-to-grafana-redirect
  namespace: monitoring
spec:
  redirectRegex:
    regex: "^https://loki\\.woitzik\\.dev/?$"
    replacement: "https://monitoring.woitzik.dev/explore"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-main
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`loki.woitzik.dev`) && PathPrefix(`/loki`)
    kind: Rule
    services: [{name: loki, port: 3100}]
  - match: Host(`loki.woitzik.dev`)
    kind: Rule
    middlewares: [{name: loki-to-grafana-redirect}, {name: crowdsec-bouncer, namespace: apps}, {name: authelia, namespace: apps}]
    services: [{name: loki, port: 3100}]
---
# Traefik Dashboard (api@internal — Authelia-protected)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`traefik.woitzik.dev`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
    kind: Rule
    middlewares: [{name: crowdsec-bouncer, namespace: apps}, {name: authelia, namespace: apps}]
    services:
    - name: api@internal
      kind: TraefikService
