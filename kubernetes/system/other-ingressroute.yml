# HashiCorp Vault UI (secrets management — secrets.woitzik.dev)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-main
  namespace: vault
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`secrets.woitzik.dev`)
    kind: Rule
    middlewares: [{name: authelia, namespace: apps}]
    services: [{name: vault, port: 8200}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# ArgoCD
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argo-main
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`argo.woitzik.dev`)
    kind: Rule
    services: [{name: argocd-server, port: 80}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Grafana
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-main
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`monitoring.woitzik.dev`)
    kind: Rule
    services: [{name: kube-prometheus-stack-grafana, port: 80}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Longhorn
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-main
  namespace: longhorn-system
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`longhorn.woitzik.dev`)
    kind: Rule
    middlewares: [{name: authelia, namespace: apps}]
    services: [{name: longhorn-frontend, port: 80}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Router (MikroTik at 10.0.10.1:80) — headless Service + Endpoints
# Note: ExternalName with raw IPs doesn't work reliably in k8s/Traefik
apiVersion: v1
kind: Service
metadata:
  name: router-external
  namespace: apps
spec:
  clusterIP: None
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: router-external
  namespace: apps
subsets:
- addresses:
  - ip: 10.0.10.1
  ports:
  - port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router-main
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`router.woitzik.dev`)
    kind: Rule
    middlewares: [{name: authelia, namespace: apps}]
    services: [{name: router-external, port: 80}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Traefik API — ClusterIP so homepage widget can reach port 9000
apiVersion: v1
kind: Service
metadata:
  name: traefik-api
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
  - name: api
    port: 9000
    targetPort: traefik
---
# Loki — redirect browser traffic to Grafana Explore, keep API path for Promtail
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-to-grafana-redirect
  namespace: monitoring
spec:
  redirectRegex:
    regex: "^https://loki\\.woitzik\\.dev/?$"
    replacement: "https://monitoring.woitzik.dev/explore"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-main
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`loki.woitzik.dev`) && PathPrefix(`/loki`)
    kind: Rule
    services: [{name: loki, port: 3100}]
  - match: Host(`loki.woitzik.dev`)
    kind: Rule
    middlewares: [{name: loki-to-grafana-redirect}]
    services: [{name: loki, port: 3100}]
  tls: {secretName: wildcard-woitzik-dev-tls}
