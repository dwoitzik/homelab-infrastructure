# REL-061: cloudflare-api-token-secret was a bare, hand-created Secret
# (kubectl apply'd once on 2026-06-02, never touched since) -- not
# Vault/ExternalSecret-managed at all, and its token silently went invalid at
# some point (confirmed live via Cloudflare's own /user/tokens/verify:
# "Invalid API Token"). Used by both this ClusterIssuer's DNS-01 solver AND
# infrastructure/cloudflare-ddns.yml's CronJob -- both were broken.
#
# Replaced with the same token Terraform/Atlantis already uses for the
# cloudflare stack (ansible vault: cloudflare_api_token /
# vault_atlantis_cloudflare_api_token) -- confirmed live via the Cloudflare
# API to be valid, active, and to have working DNS:Edit on this zone (GET
# and PUT both tested directly against the real cobblemon.woitzik.dev
# record) before wiring it in here. Reusing an already-vetted,
# already-in-use token rather than minting a new one avoids the REL-048
# dashboard bug (silently drops permission groups when adding a 2nd one).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: secret/cloudflare
        property: api-token
