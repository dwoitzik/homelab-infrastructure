apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/system/cert-manager-config
    # system-app-bootstrap already owns every kubernetes/system/*/application.yml;
    # without this exclude the app manages its own Application too (two owners,
    # SharedResourceWarning, stuck OutOfSync).
    directory:
      exclude: application.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
