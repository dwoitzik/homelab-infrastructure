apiVersion: v1
kind: Service
metadata:
  name: redis-authelia
  namespace: database
spec:
  ports:
  - port: 6379
  selector:
    app: redis-authelia
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-authelia
  namespace: database
spec:
  serviceName: "redis-authelia"
  replicas: 1
  selector:
    matchLabels:
      app: redis-authelia
  template:
    metadata:
      labels:
        app: redis-authelia
    spec:
      containers:
      - name: redis
        image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
        # SEC-012: redis:7-alpine has no non-root default user -- confirmed
        # live elsewhere (redis-paperless/redis-nextcloud), runAsNonRoot
        # alone fails admission. Not yet rolled out to this StatefulSet's
        # live pod when caught, fixed here before it could.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "nfs-client"
      resources:
        requests:
          storage: 8Gi
