apiVersion: v1
kind: Service
metadata:
  name: redis-authelia
  namespace: database
spec:
  ports:
  - port: 6379
  selector:
    app: redis-authelia
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-authelia
  namespace: database
spec:
  serviceName: "redis-authelia"
  replicas: 1
  selector:
    matchLabels:
      app: redis-authelia
  template:
    metadata:
      labels:
        app: redis-authelia
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "nfs-client"
      resources:
        requests:
          storage: 8Gi
