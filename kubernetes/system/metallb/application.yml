apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.14.3
    chart: metallb
    helm:
      values: |
        controller:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        speaker:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # Section H finding: this cluster only ever uses L2Advertisement
          # (see kubernetes/system/metallb-config/pool.yml -- zero
          # BGPAdvertisement resources exist anywhere in the repo or live
          # cluster). The chart's default speaker.frr.enabled=true bundles
          # an FRR/BGP sidecar into every speaker pod regardless, which
          # sits idle for L2-only setups -- and was chronically crash-
          # looping doing so (1000+ restarts per pod over 9 days,
          # "watchfrr restart all" / failed initial daemon connections,
          # confirmed live via crictl logs). Disabling removes a
          # completely unused container that was the actual source of
          # that restart noise, not a real functional loss.
          frr:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bgppeers.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
