apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.traefik.io/traefik
    targetRevision: 28.3.0
    chart: traefik
    helm:
      values: |
        additionalArguments:
          # REL-037: default is false, so every IngressRoute outside apps ns
          # referencing {name: authelia, namespace: apps} was silently failing
          # ("middleware apps/authelia is not in the IngressRoute namespace X")
          # -- confirmed live for argo-main, grafana-main, loki-main,
          # vault-main, status-final. Traefik fails closed on a broken
          # middleware ref (404, not open passthrough), so this was an outage,
          # not an exposure -- but it meant argo/grafana/vault/loki were all
          # unreachable, and the Authelia gating never actually took effect.
          - "--providers.kubernetescrd"
          - "--providers.kubernetescrd.allowCrossNamespace=true"
          - "--providers.kubernetesingress"
          - "--serverstransport.insecureskipverify=true"
          - "--api.dashboard=true"
          - "--api.insecure=true"
          - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          - "--entrypoints.websecure.proxyProtocol.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          # Traefik v3 default readTimeout is 60s; large Immich uploads over
          # NFS-backed USB storage exceed that → 502. Set to 0 (unlimited).
          - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
          # Plugin source comes from the plugin-source initContainer, never from
          # plugins.traefik.io (ADR-079). Chart 27 has no localPlugins value.
          - "--experimental.localPlugins.crowdsec.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
        ports:
          web:
            redirectTo:
              port: websecure
          websecure:
            tls:
              enabled: true
              secretName: wildcard-woitzik-dev-tls
          # Loki push for DMZ hosts on its own entrypoint and LB IP, so the DMZ
          # firewall rule reaches one route instead of every Traefik host.
          lokipush:
            port: 3101
            expose: false
            exposedPort: 3101
            protocol: TCP
            tls:
              enabled: true
        logs:
          general:
            level: INFO
          access:
            enabled: true
            format: json
            fields:
              headers:
                defaultMode: keep
                names:
                  User-Agent: redact
                  Authorization: redact
                  Cookie: redact
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        ingressRoute:
          dashboard:
            enabled: false
        tlsStore:
          default:
            defaultCertificate:
              secretName: wildcard-woitzik-dev-tls
        # A Traefik that failed to load the plugin still answers /ping, so it
        # would turn Ready and 404 every crowdsec-protected route. Startup only
        # passes once the middleware is enabled; Ready waits for startup.
        startupProbe:
          exec:
            command:
              - sh
              - -c
              - wget -qO- -T 2 http://127.0.0.1:9000/api/http/middlewares/apps-crowdsec-bouncer@kubernetescrd | grep -q '"status":"enabled"'
          initialDelaySeconds: 2
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 60
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        additionalVolumeMounts:
          - name: plugins-local
            mountPath: /plugins-local
            readOnly: true
        # The bouncer key comes from a Secret: the crowdsec middleware reads the
        # mounted file (crowdsecLapiKeyFile in kubernetes/apps/crowdsec/middleware.yml).
        volumes:
          - name: crowdsec-bouncer-key
            mountPath: /etc/traefik/crowdsec
            type: secret
            secretName: crowdsec-bouncer-key
        # Two replicas for real HA -- previously single-replica, a
        # cluster-wide ingress outage on any restart/crash/node-drain
        # (ADR-040 flagged this as "worth revisiting separately"). Certs
        # come from cert-manager via tlsStore.defaultCertificate above, not
        # Traefik's own ACME resolver, so there's no local state that
        # multiple replicas would fragment.
        deployment:
          replicas: 2
          # Built by .github/workflows/traefik-plugin-image.yml. A failed pull
          # keeps the new pod from starting while the old replica keeps serving.
          initContainers:
            - name: plugin-source
              image: ghcr.io/dwoitzik/traefik-crowdsec-plugin:v1.6.0@sha256:27821bfcc8550f763682b63084bcc423e24c8f6fe142c4259907de7fa54eaa11
              command: ["cp", "-R", "/plugins-local/.", "/target/"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: plugins-local
                  mountPath: /target
          additionalVolumes:
            - name: plugins-local
              emptyDir:
                sizeLimit: 16Mi
        # Soft anti-affinity so the two replicas prefer different nodes --
        # actually protects against a node failure, not just a pod crash.
        # Soft, not hard: a 3-node cluster with uneven node roles shouldn't
        # risk one replica going Pending over a scheduling preference.
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
                  topologyKey: kubernetes.io/hostname
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
