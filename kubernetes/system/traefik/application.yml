apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.traefik.io/traefik
    targetRevision: 27.0.2
    chart: traefik
    helm:
      values: |
        additionalArguments:
          - "--providers.kubernetescrd"
          - "--providers.kubernetesingress"
          - "--serverstransport.insecureskipverify=true"
          - "--api.dashboard=true"
          - "--api.insecure=true"
          - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          - "--entrypoints.websecure.proxyProtocol.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          # Traefik v3 default readTimeout is 60s; large Immich uploads over
          # NFS-backed USB storage exceed that → 502. Set to 0 (unlimited).
          - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
        ports:
          web:
            redirectTo:
              port: websecure
          websecure:
            tls:
              enabled: true
              secretName: traefik-tls-secret
        logs:
          general:
            level: INFO
          access:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        ingressRoute:
          dashboard:
            enabled: false
        tlsStore:
          default:
            defaultCertificate:
              secretName: traefik-tls-secret
        tolerations:
        - key: "storage"
          operator: "Equal"
          value: "sdcard"
          effect: "NoSchedule"
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: node-type
                  operator: In
                  values:
                  - rpi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
