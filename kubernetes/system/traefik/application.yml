apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.traefik.io/traefik
    targetRevision: 27.0.2
    chart: traefik
    helm:
      values: |
        additionalArguments:
          # REL-037: default is false, so every IngressRoute outside apps ns
          # referencing {name: authelia, namespace: apps} was silently failing
          # ("middleware apps/authelia is not in the IngressRoute namespace X")
          # -- confirmed live for argo-main, grafana-main, loki-main,
          # vault-main, status-final. Traefik fails closed on a broken
          # middleware ref (404, not open passthrough), so this was an outage,
          # not an exposure -- but it meant argo/grafana/vault/loki were all
          # unreachable, and the Authelia gating never actually took effect.
          - "--providers.kubernetescrd"
          - "--providers.kubernetescrd.allowCrossNamespace=true"
          - "--providers.kubernetesingress"
          - "--serverstransport.insecureskipverify=true"
          - "--api.dashboard=true"
          - "--api.insecure=true"
          - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          - "--entrypoints.websecure.proxyProtocol.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          # Traefik v3 default readTimeout is 60s; large Immich uploads over
          # NFS-backed USB storage exceed that → 502. Set to 0 (unlimited).
          - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
        ports:
          web:
            redirectTo:
              port: websecure
          websecure:
            tls:
              enabled: true
              secretName: wildcard-woitzik-dev-tls
        logs:
          general:
            level: INFO
          access:
            enabled: true
            format: json
            fields:
              headers:
                defaultMode: keep
                names:
                  User-Agent: redact
                  Authorization: redact
                  Cookie: redact
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        ingressRoute:
          dashboard:
            enabled: false
        tlsStore:
          default:
            defaultCertificate:
              secretName: wildcard-woitzik-dev-tls
        experimental:
          plugins:
            crowdsec:
              moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
              version: v1.6.0
        # 2026-08-17 (Section C, secrets hygiene): was a hardcoded plaintext
        # value committed to git -- this is the actual leak the brief named
        # ("the plaintext key in traefik/application.yml are known"). The
        # crowdsec-bouncer-traefik-plugin reads the key from this env var
        # directly; the volume-mounted Secret below it was likely a dead,
        # never-consumed leftover from an earlier config attempt (the plugin
        # has no documented mechanism to read a key from a mounted file path).
        # Rotated (CrowdSec's own bouncer registry updated via the matching
        # BOUNCER_KEY_traefik env var in kubernetes/apps/crowdsec/crowdsec.yml,
        # confirmed live: cscli bouncers list shows the "traefik" bouncer
        # valid, real external traffic through Traefik confirmed working
        # afterward) and moved to the same real k8s Secret the volume mount
        # below already referenced -- so this now actually uses it, instead
        # of duplicating the value in plaintext next to an unused mount.
        env:
          - name: CROWDSEC_BOUNCER_KEY_traefik
            valueFrom:
              secretKeyRef:
                name: crowdsec-bouncer-key
                key: crowdsec-bouncer-key
        volumes:
          - name: crowdsec-bouncer-key
            mountPath: /etc/traefik/crowdsec
            type: secret
            secretName: crowdsec-bouncer-key
        tolerations:
        - key: "storage"
          operator: "Equal"
          value: "sdcard"
          effect: "NoSchedule"
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: node-type
                  operator: In
                  values:
                  - rpi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
