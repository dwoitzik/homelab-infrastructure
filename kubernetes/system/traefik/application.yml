apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.traefik.io/traefik
    targetRevision: 27.0.2
    chart: traefik
    helm:
      values: |
        additionalArguments:
          # REL-037: default is false, so every IngressRoute outside apps ns
          # referencing {name: authelia, namespace: apps} was silently failing
          # ("middleware apps/authelia is not in the IngressRoute namespace X")
          # -- confirmed live for argo-main, grafana-main, loki-main,
          # vault-main, status-final. Traefik fails closed on a broken
          # middleware ref (404, not open passthrough), so this was an outage,
          # not an exposure -- but it meant argo/grafana/vault/loki were all
          # unreachable, and the Authelia gating never actually took effect.
          - "--providers.kubernetescrd"
          - "--providers.kubernetescrd.allowCrossNamespace=true"
          - "--providers.kubernetesingress"
          - "--serverstransport.insecureskipverify=true"
          - "--api.dashboard=true"
          - "--api.insecure=true"
          - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          - "--entrypoints.websecure.proxyProtocol.trustedIPs=10.42.0.0/16,10.0.0.0/8"
          # Traefik v3 default readTimeout is 60s; large Immich uploads over
          # NFS-backed USB storage exceed that → 502. Set to 0 (unlimited).
          - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
        ports:
          web:
            redirectTo:
              port: websecure
          websecure:
            tls:
              enabled: true
              secretName: traefik-tls-secret
        logs:
          general:
            level: INFO
          access:
            enabled: true
            format: json
            fields:
              headers:
                defaultMode: keep
                names:
                  User-Agent: redact
                  Authorization: redact
                  Cookie: redact
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        ingressRoute:
          dashboard:
            enabled: false
        tlsStore:
          default:
            defaultCertificate:
              secretName: traefik-tls-secret
        experimental:
          plugins:
            crowdsec:
              moduleName: github.com/harlanchen/crowdsec-bouncer-traefik-plugin
              version: v1.3.3
        env:
          - name: CROWDSEC_BOUNCER_KEY_traefik
            value: "bFWgFb0LBV6OUspll3IZyqgIAwwLlQ5RbXV39Cgd"
        tolerations:
        - key: "storage"
          operator: "Equal"
          value: "sdcard"
          effect: "NoSchedule"
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: node-type
                  operator: In
                  values:
                  - rpi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
