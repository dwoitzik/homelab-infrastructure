apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-provisioner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner
    targetRevision: 4.0.18
    helm:
      values: |
        nfs:
          server: 10.0.20.100
          path: /nfs-data/k8s-general
          mountOptions:
            - nfsvers=4.1
            - hard
            - timeo=600
            - retrans=3
        storageClass:
          name: nfs-client
          defaultClass: false
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          pathPattern: "${.PVC.namespace}/${.PVC.name}"
          onDelete: retain
        # The chart only supports one replica, and it deploys with Recreate, so
        # leader election protects nothing; its Endpoints lease was renewed every
        # few seconds and flapped, a steady stream of datastore writes.
        leaderElection:
          enabled: false
        replicaCount: 1
        # REL-071 (2026-07-10, applied 2026-07-12): this pod's own root-mount
        # volume (the entire shared NFS export, /persistentvolumes) was
        # getting fs-backed-up by Velero as one 33.4GB/207s blob every
        # night -- confirmed live via real PodVolumeBackup stats, ~65% of
        # total bytes in that run. Genuinely redundant: every individual
        # app's own PVC (a subdirectory of this same tree) is already
        # backed up separately via its own pod's mount. Verified this
        # targets the actually-contended disk (rpool, confirmed via
        # findmnt/zfs list) before excluding it, unlike the first
        # (wrong) hypothesis of excluding garage-data/immich-library,
        # which live on separate USB-attached disks entirely.
        podAnnotations:
          backup.velero.io/backup-volumes-excludes: nfs-subdir-external-provisioner-root
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            # 64Mi gave client-go's informer/retry traffic no headroom while
            # the API server was slow -- this Pod restarts for any timeout.
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
