apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-provisioner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner
    targetRevision: 4.0.18
    helm:
      values: |
        nfs:
          server: 10.0.20.100
          path: /nfs-data/k8s-general
          mountOptions:
            - nfsvers=4.1
            - hard
            - timeo=600
            - retrans=3
        storageClass:
          name: nfs-client
          defaultClass: false
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          pathPattern: "${.PVC.namespace}/${.PVC.name}"
          onDelete: retain
        # nfs-subdir-external-provisioner has no leader election in its
        # provision/delete controller loop -- running 2 replicas (as this was
        # set to, with no documented rationale) means both processes race on
        # the same NFS directory. Found while investigating REL-023: both
        # replicas had 68-74 restarts with exit code 255 ("Unknown"
        # termination, consistent with unhandled panics from the race), and
        # Velero's fs-backup of this pod's own PV was failing/canceling on a
        # fresh attempt -- plausibly because there were two candidate pods
        # for the same single-writer PV instead of one. This chart has never
        # supported >1 replica; see upstream project docs/issues.
        replicaCount: 1
        # REL-071 (2026-07-10, applied 2026-07-12): this pod's own root-mount
        # volume (the entire shared NFS export, /persistentvolumes) was
        # getting fs-backed-up by Velero as one 33.4GB/207s blob every
        # night -- confirmed live via real PodVolumeBackup stats, ~65% of
        # total bytes in that run. Genuinely redundant: every individual
        # app's own PVC (a subdirectory of this same tree) is already
        # backed up separately via its own pod's mount. Verified this
        # targets the actually-contended disk (rpool, confirmed via
        # findmnt/zfs list) before excluding it, unlike the first
        # (wrong) hypothesis of excluding garage-data/immich-library,
        # which live on separate USB-attached disks entirely.
        podAnnotations:
          backup.velero.io/backup-volumes-excludes: nfs-subdir-external-provisioner-root
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
