# Jellyfin -- no Authelia; its own login gates access (native clients can't
# complete the redirect). Public via the Cloudflare tunnel; this LAN/VPN route
# carries the matching rate limit. See ADR-064.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: media-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`media.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer}, {name: jellyfin-ratelimit}]
    services: [{name: jellyfin, port: 8096}]
# SABnzbd, Sonarr, Radarr, Bazarr — IngressRoutes consolidated into
# kubernetes/apps/jellyfin/usenet.yml alongside their External service definitions.
---
# Rybbit -- external LXC, see kubernetes/apps/rybbit/rybbit.yml. Two routes:
# the tracker endpoints the woitzik.dev script calls are open (CrowdSec + rate
# limit), everything else (dashboard, login, admin API) sits behind Authelia.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rybbit-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`analytics.woitzik.dev`) && (Path(`/api/script.js`) || Path(`/api/replay.js`) || Path(`/api/metrics.js`) || Path(`/api/track`) || Path(`/api/identify`) || Path(`/api/health`) || PathPrefix(`/api/session-replay/record/`) || PathPrefix(`/api/site/`))
    kind: Rule
    priority: 200
    middlewares:
      - name: crowdsec-bouncer
      - name: rybbit-ratelimit
    services: [{name: external-rybbit, port: 80}]
  - match: Host(`analytics.woitzik.dev`)
    kind: Rule
    middlewares:
      - name: crowdsec-bouncer
      - name: authelia
    services: [{name: external-rybbit, port: 80}]

# Note: claude.woitzik.dev (ttyd on ct-srv-claude-agent, Admin VLAN) is
# deliberately NOT routed through Traefik/this cluster -- see ADR-032. Routing
# it here would need the cluster (VLAN20) to reach into the Admin VLAN
# (10.0.100.0/24), which the network's firewall rules intentionally don't
# allow in that direction. ADR-032's own dedicated Cloudflare Tunnel for it
# was applied once (PR #437) then destroyed by the very next apply (ADR-033's
# public-exposure-allowlist, PR #440) -- the operator confirmed directly
# (2026-08-15) that this hostname was never meant to be public at all, so no
# tunnel exists for it today (verified 2026-08-23: no public DNS record, no
# cloudflared process running). This host is reachable via Tailscale/LAN
# only, which was always the primary access path.
