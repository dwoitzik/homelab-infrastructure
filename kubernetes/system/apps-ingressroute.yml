---
# Jellyfin — no Authelia; Jellyfin's own auth handles access control.
# Cloudflare tunnel also bypasses Authelia (direct to Jellyfin login), so this
# makes the internal path consistent. App clients (Android/iOS) cannot handle
# Authelia's SSO redirect flow.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: media-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`media.woitzik.dev`)
    kind: Rule
    services: [{name: jellyfin, port: 8096}]
  tls: {secretName: wildcard-woitzik-dev-tls}
