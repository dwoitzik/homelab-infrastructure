# Proxmox Backup (PBS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pbs-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`backup.woitzik.dev`)
    kind: Rule
    middlewares:
      - name: crowdsec-bouncer
      - name: authelia
      - name: websockets
    services:
      - name: external-pbs
        port: 8007
        scheme: https
        serversTransport: insecure-transport
        passHostHeader: true
