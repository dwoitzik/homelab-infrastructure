# Proxmox (PVE)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`pve.woitzik.dev`)
    kind: Rule
    middlewares:
      - name: crowdsec-bouncer
      - name: authelia
      - name: websockets
    services:
      - name: external-pve
        port: 8006
        scheme: https
        serversTransport: insecure-transport
---
# Proxmox Backup (PBS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pbs-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`backup.woitzik.dev`)
    kind: Rule
    middlewares:
      - name: crowdsec-bouncer
      - name: authelia
      - name: websockets
    services:
      - name: external-pbs
        port: 8007
        scheme: https
        serversTransport: insecure-transport
        passHostHeader: true
---
# External services for pve-final / pbs-final — these are manual Services +
# Endpoints pointing at host-ported apps. PVE and PBS both run natively on
# the same pve-mgmt-01 host (proxmox-backup-server co-installed alongside
# Proxmox VE, not a separate guest) - both reachable at 10.0.10.10, just
# different ports. Were NOT git-tracked until 2026-08-08 (the PVE/PBS
# outage was partly caused by them living only as untracked live objects).
# 2026-08-20: PBS's Endpoints IP was wrong (10.0.10.110, which doesn't
# exist anywhere on this host - `ip addr` confirms only 10.0.10.10) -
# real, live root cause of backup.woitzik.dev's Bad Gateway. Fixed to
# match PVE's entry above.
apiVersion: v1
kind: Service
metadata:
  name: external-pve
  namespace: apps
spec:
  ports:
  - port: 8006
    protocol: TCP
    targetPort: 8006
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-pve
  namespace: apps
subsets:
- addresses:
  - ip: 10.0.10.10
  ports:
  - port: 8006
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: external-pbs
  namespace: apps
spec:
  ports:
  - port: 8007
    protocol: TCP
    targetPort: 8007
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-pbs
  namespace: apps
subsets:
- addresses:
  - ip: 10.0.10.10
  ports:
  - port: 8007
    protocol: TCP
---
# Scanopy (network topology map, ADR-031) -- LAN/Tailscale only, same as
# every other internal tool: reachable via the *.woitzik.dev wildcard AdGuard
# rewrite to this Traefik LB, never via the Cloudflare Tunnel.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scanopy-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`scanopy.woitzik.dev`)
    kind: Rule
    middlewares:
      - name: crowdsec-bouncer
      - name: authelia
    services: [{name: scanopy-server, port: 60072}]
