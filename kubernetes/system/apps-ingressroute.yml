# Home Assistant (Authelia guards web UI; Companion app should use Headscale VPN
# for direct local access, same pattern as Jellyfin below)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ha-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`ha.woitzik.dev`)
    kind: Rule
    middlewares: [{name: authelia}]
    services: [{name: home-assistant, port: 8123}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Jellyfin — no Authelia; Jellyfin's own auth handles access control.
# Cloudflare tunnel also bypasses Authelia (direct to Jellyfin login), so this
# makes the internal path consistent. App clients (Android/iOS) cannot handle
# Authelia's SSO redirect flow.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: media-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`media.woitzik.dev`)
    kind: Rule
    services: [{name: jellyfin, port: 8096}]
  tls: {secretName: wildcard-woitzik-dev-tls}
# SABnzbd, Sonarr, Radarr, Bazarr — IngressRoutes consolidated into
# kubernetes/apps/jellyfin/usenet.yml alongside their External service definitions.
