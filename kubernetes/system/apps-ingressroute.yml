# Immich
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`photos.woitzik.dev`)
    kind: Rule
    # SEC hardening (2026-07-08): no rate limiting existed on this route at
    # all -- Immich has no external auth in front of it (mobile app needs
    # API-token auth, not Authelia's browser redirect), so this is the only
    # brute-force/abuse mitigation on login and upload. See
    # apps/immich/middleware.yml for the limit rationale.
    middlewares: [{name: immich-ratelimit}]
    services: [{name: immich-server, port: 2283}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Vaultwarden — Authelia added (2026-07-17) as defense-in-depth; Vaultwarden's
# own 2FA remains the primary gate but forward-auth stops unauthenticated
# browser sessions from even reaching the VW login page.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`vault.woitzik.dev`)
    kind: Rule
    middlewares: [{name: crowdsec-bouncer}, {name: authelia}]
    services: [{name: vaultwarden, port: 80}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# AdGuard Home external service (primary RPi at 10.0.20.2:3001)
apiVersion: v1
kind: Service
metadata:
  name: external-dns
  namespace: apps
spec:
  clusterIP: None
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-dns
  namespace: apps
subsets:
- addresses:
  - ip: 10.0.20.2
  ports:
  - port: 3001
---
