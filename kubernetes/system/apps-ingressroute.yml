# Authelia
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`auth.woitzik.dev`)
    kind: Rule
    services: [{name: authelia, port: 9091}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
