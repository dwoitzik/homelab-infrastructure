# AdGuard Home external service (primary RPi at 10.0.20.2:3001)
apiVersion: v1
kind: Service
metadata:
  name: external-dns
  namespace: apps
spec:
  clusterIP: None
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-dns
  namespace: apps
subsets:
- addresses:
  - ip: 10.0.20.2
  ports:
  - port: 3001
---
# DNS (AdGuard)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dns-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`dns.woitzik.dev`)
    kind: Rule
    middlewares: [{name: authelia}]
    services: [{name: external-dns, port: 3001}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Garage API (S3)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: garage-s3-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`s3.woitzik.dev`)
    kind: Rule
    services: [{name: garage, port: 3900}]
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Proxmox (PVE)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`pve.woitzik.dev`)
    kind: Rule
    middlewares:
      - name: websockets
    services:
      - name: external-pve
        port: 8006
        scheme: https
        serversTransport: insecure-transport
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Proxmox Backup (PBS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pbs-final
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`backup.woitzik.dev`)
    kind: Rule
    middlewares:
      - name: websockets
    services:
      - name: external-pbs
        port: 8007
        scheme: https
        serversTransport: insecure-transport
        passHostHeader: true
  tls: {secretName: wildcard-woitzik-dev-tls}
---
# Uptime Kuma
