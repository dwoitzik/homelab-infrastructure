apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pve-exporter
  template:
    metadata:
      labels:
        app: pve-exporter
    spec:
      # ADR-036: soft preference off vm-srv-k3s-11, which had accumulated
      # most of this cluster's stateful/heavy workload with nothing
      # steering new placements elsewhere.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - vm-srv-k3s-11
      containers:
      - name: pve-exporter
        image: prompve/prometheus-pve-exporter:3.10.2@sha256:7ed5dbff1b145e62e94003cb78d70226d9a7c4d4d1c928b3c7daed21ae9a84d8
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 9221
        args:
          - --config.file=/etc/pve/pve.yml
        volumeMounts:
        - name: config
          mountPath: /etc/pve
          readOnly: true
        - name: tmp
          mountPath: /tmp
        env:
        - name: PVE_URL
          value: "https://10.0.10.10:8006"
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        secret:
          secretName: pve-exporter-config
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  ports:
  - port: 9221
    targetPort: 9221
  selector:
    app: pve-exporter
