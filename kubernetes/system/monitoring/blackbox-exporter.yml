# Standalone prometheus-blackbox-exporter deployment.
# The kube-prometheus-stack Helm chart (61.3.2) has the subchart in its
# dependency list but does not render it into the ArgoCD-managed release —
# most likely because ArgoCD strips sub-chart archives during Helm rendering
# from the upstream Prometheus Community repo. Deploy standalone here so
# the scrape configs in application.yml (job_name: blackbox-http and
# blackbox-authelia-health) can reach the expected service DNS name.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: []
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
      # For endpoints protected by Authelia: Authelia returns 401 for
      # unauthenticated probes (forward-auth mode, no browser session).
      # A 401 means the service IS reachable and the auth layer IS working --
      # that is what endpoint monitoring cares about, not the auth result.
      http_auth_ok:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: [200, 301, 302, 401, 403]
          method: GET
          follow_redirects: false
          preferred_ip_protocol: ip4
      http_2xx_skip_tls:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: []
          follow_redirects: true
          tls_config:
            insecure_skip_verify: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-blackbox-exporter
  template:
    metadata:
      labels:
        app: prometheus-blackbox-exporter
    spec:
      # This pod's DNS resolution otherwise inherits the node's own
      # resolv.conf, which points at the LAN AdGuard resolver -- AdGuard
      # rewrites every *.woitzik.dev query to its internal LAN IP (see
      # docs/URL-INVENTORY.md's own Methodology section). Probing through
      # that rewrite would silently test the internal path and prove
      # nothing about real external reachability, which is the entire
      # point of this exporter. Pinning to public resolvers makes every
      # probe's DNS lookup genuinely external, even though the resulting
      # HTTP connection still originates from this LAN.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "1.1.1.1"
          - "8.8.8.8"
      containers:
      - name: blackbox-exporter
        image: prom/blackbox-exporter:v0.28.0
        args:
          - --config.file=/config/blackbox.yml
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        ports:
        - name: http
          containerPort: 9115
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: blackbox-exporter-config
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  ports:
  - name: http
    port: 9115
    targetPort: http
  selector:
    app: prometheus-blackbox-exporter
