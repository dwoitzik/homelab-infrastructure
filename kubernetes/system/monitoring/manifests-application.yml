# REL-014: every raw manifest in this directory (PrometheusRules, the pve-exporter
# Deployment, Discord/Grafana ExternalSecrets, the Grafana IngressRoute, NetworkPolicies,
# dashboard ConfigMaps) was live in the cluster but tracked by NO ArgoCD Application --
# deployed once manually at some point, then orphaned from GitOps. A full cluster rebuild
# from git alone would never have restored any of it (confirmed live: loki-dashboard
# ConfigMap is in git but doesn't exist in the cluster -- silent drift already happened).
# kubernetes/apps/* gets this automatically via the homelab-apps ApplicationSet;
# kubernetes/system/* does not, so each subdirectory needs its own Application, same
# pattern as vault-manifests/velero-manifests.
#
# REL-042 (2026-07-05): `application.yml` (defines the kube-prometheus-stack
# Application itself) and this file were BOTH missing from the include glob
# below -- meaning neither was ever re-synced by ArgoCD after their initial
# manual bootstrap. A real fix merged to application.yml on 2026-06-27
# (removing a broken `configSecret` reference that silently killed Discord
# alerting) sat in git for 8+ days having zero effect live, because nothing
# was watching that file. Adding both here so any future edit to either one
# actually gets applied automatically going forward.
#
# Third occurrence of the same class: network-policies-egress.yml was live
# but missing from this glob too -- added below for the same reason.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/system/monitoring
    directory:
      include: '{alertmanager-config,blackbox-exporter,snmp-exporter,control-plane-alerts,slo-rules,hardware-temp-alerts,storage-capacity-alerts,postgres-alerts,cert-manager-alerts,velero-alerts,silent-failure-alerts,argocd-servicemonitor,pve-exporter,alertmanager-discord,external-secret,ingressroute,network-policies,network-policies-egress,loki-dashboard,slo-dashboard,application,manifests-application,tailnet-route-drift-check}.yml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # 2026-09-10: these 3 Secrets are ExternalSecret targets with
  # creationPolicy: Merge (same object name as their ExternalSecret CR).
  # Found live with ArgoCD's own tracking-id/last-applied-configuration
  # annotations describing the *ExternalSecret* stamped onto the *Secret*
  # object itself (confirmed via `kubectl get secret ... -o
  # jsonpath='{.metadata.annotations}'` -- a real kind mismatch, not a
  # parsing artifact). That made every comparison unresolvable: ArgoCD kept
  # diffing the Secret's actual fields against a rendered ExternalSecret
  # schema, self-healing every ~5min for 19+ hours straight
  # (autoHealAttemptsCount 240+, see phase8/LEDGER.md) and contributing to
  # controller-wide churn. Ignoring data + annotations on these three stops
  # ArgoCD from re-litigating fields ESO legitimately owns, regardless of
  # how the cross-kind annotation corruption happened.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: grafana-admin-secret
      namespace: monitoring
      jsonPointers:
        - /data
        - /metadata/annotations
    - group: ""
      kind: Secret
      name: grafana-oidc-secret
      namespace: monitoring
      jsonPointers:
        - /data
        - /metadata/annotations
    - group: ""
      kind: Secret
      name: alertmanager-discord-webhook
      namespace: monitoring
      jsonPointers:
        - /data
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
