apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-storage-capacity-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: storage.capacity
      rules:
        # REL-019: rpool (the only fast SSD on `mini`, shared by every VM/LXC)
        # silently filled to 96% and then hard 0% available, pausing all three
        # k3s VMs on disk I/O error with zero advance warning -- pve-exporter
        # itself had been failing 401 Unauthorized since deployment, so there
        # was no metric to alert on even if a rule had existed. Both gaps are
        # fixed now; this rule is the actual "catch it before ENOSPC" piece.
        - alert: ProxmoxStorageCapacityHigh
          expr: (pve_disk_usage_bytes{id=~"storage/.+"} / pve_disk_size_bytes{id=~"storage/.+"}) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox storage {{ $labels.id }} is {{ $value | humanizePercentage }} full"
            description: >
              {{ $labels.id }} on the Proxmox host has been above 85% capacity for 10+
              minutes. rpool (local-zfs) has hit hard ENOSPC before and paused every k3s VM
              with no warning (REL-019 in docs/AUDIT.md) -- ZFS write performance also
              degrades sharply well before 100% full. Investigate now, not after it locks up.

        - alert: ProxmoxStorageCapacityCritical
          expr: (pve_disk_usage_bytes{id=~"storage/.+"} / pve_disk_size_bytes{id=~"storage/.+"}) > 0.93
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox storage {{ $labels.id }} is {{ $value | humanizePercentage }} full -- ENOSPC imminent"
            description: >
              {{ $labels.id }} is above 93% capacity for 5+ minutes. At this level ZFS slop
              reservation is close to exhausted -- the next sustained write burst (a Velero
              backup, an Ollama model pull, anything) can pause every VM on this pool with an
              I/O error (status: io-error in `qm status`), as happened in REL-019. Free space
              now: check `zfs list -o name,used,avail -s used` on mini for the largest
              consumers.

    # Written by zfs-pool-metrics.py (Ansible role pve_zfs_health) on pve-mgmt-01.
    # The archive pool is a single USB disk with no redundancy, so ZFS can detect
    # corruption there but never repair it.
    - name: storage.zfs
      rules:
        - alert: ZFSPoolNotOnline
          expr: zfs_pool_online == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.pool }} is not ONLINE"
            description: >
              Run `zpool status -v {{ $labels.pool }}` on pve-mgmt-01. For archive a
              SUSPENDED or UNAVAIL state usually means the USB disk dropped off the bus;
              check `dmesg` and the cable before anything else.
        - alert: ZFSPoolDataErrors
          expr: zfs_pool_data_errors > 0 or zfs_pool_scrub_errors > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.pool }} has permanent data errors"
            description: >
              ZFS found blocks it could not repair. `zpool status -v {{ $labels.pool }}`
              lists the affected files; restore or delete them, `zpool clear`, then scrub.
              A PBS chunk under /mnt/pbs-storage/.chunks means the snapshots using it no
              longer restore: verify the datastore and forget the failed snapshots.
        - alert: ZFSPoolDeviceErrorsIncreasing
          expr: zfs_pool_vdev_errors - zfs_pool_vdev_errors offset 1h > 0
          labels:
            severity: critical
          annotations:
            summary: "ZFS {{ $labels.type }} errors increasing on {{ $labels.pool }}/{{ $labels.vdev }}"
            description: >
              {{ $value }} new {{ $labels.type }} errors in the last hour. Check
              `zpool status -v {{ $labels.pool }}` and `dmesg` for I/O errors; repeated
              errors on the archive USB disk mean the disk or its bridge is failing.
        - alert: ZFSPoolDeviceErrorsPresent
          expr: zfs_pool_vdev_errors > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ZFS {{ $labels.pool }}/{{ $labels.vdev }} holds {{ $value }} {{ $labels.type }} errors"
            description: >
              Counters only reset on `zpool clear`. Once the cause is understood and
              any data errors are resolved, clear them so a new error stands out.
        - alert: ZFSScrubOverdue
          expr: time() - zfs_pool_scrub_end_timestamp_seconds > 40 * 86400 and zfs_pool_scrub_running == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.pool }} has not completed a scrub in 40 days"
            description: >
              The monthly scrub (/etc/cron.d/zfs-scrub-all, second Wednesday 09:00) did
              not run or did not finish. Check `zpool status {{ $labels.pool }}`.
        - alert: ZFSPoolMetricsStale
          expr: |
            time() - zfs_pool_metrics_last_run_timestamp_seconds > 1800
            or absent(zfs_pool_metrics_last_run_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool health metrics from pve-mgmt-01 are stale"
            description: >
              zfs-pool-metrics.timer stopped writing zfs_pools.prom, so the ZFS alerts
              cannot fire. Check `systemctl status zfs-pool-metrics.service`.
