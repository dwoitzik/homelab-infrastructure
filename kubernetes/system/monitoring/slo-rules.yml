# SLO definitions for woitzik.dev homelab services.
# Target: 99.9% availability (43.2 min/month error budget).
#
# Multi-window burn-rate alerts (SRE Workbook), 30d budget:
#   - Page (2h+1h): ≥30x → budget gone in ~24h, 2h window spends ~8%
#   - Ticket (6h+30m): ≥6x → budget gone in ~5d, 6h window spends 5%

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-slo-recording-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: slo.availability.1m
      interval: 1m
      rules:
        # SLI: fraction of successful HTTP probes in the last 5 minutes
        - record: job_instance:probe_success:rate5m
          expr: avg_over_time(probe_success[5m])

        # Error rate per instance (1 - success rate)
        - record: job_instance:probe_error:rate5m
          expr: 1 - avg_over_time(probe_success[5m])

    - name: slo.availability.windows
      interval: 1m
      rules:
        # Short windows (for fast-burn detection)
        - record: job_instance:probe_success:rate1h
          expr: avg_over_time(probe_success[1h])
        - record: job_instance:probe_success:rate2h
          expr: avg_over_time(probe_success[2h])

        # Medium windows
        - record: job_instance:probe_success:rate6h
          expr: avg_over_time(probe_success[6h])
        - record: job_instance:probe_success:rate30m
          expr: avg_over_time(probe_success[30m])

        # Long windows (for slow-burn detection)
        - record: job_instance:probe_success:rate24h
          expr: avg_over_time(probe_success[24h])

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-slo-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: slo.burn-rate.page
      rules:
        # Fast burn: ≥30x error budget consumption over 2h + 1h window
        # Fires when ~8% of the 30d budget is gone in 2 hours
        - alert: SLOAvailabilityFastBurn
          expr: |
            (1 - job_instance:probe_success:rate2h) > (30 * (1 - 0.999))
            and
            (1 - job_instance:probe_success:rate1h) > (30 * (1 - 0.999))
          for: 2m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "SLO fast burn: {{ $labels.instance }}"
            description: >
              {{ $labels.instance }} error rate is burning through the monthly error budget
              at ≥30x the allowed rate (2h and 1h windows). At this pace the 30d
              99.9% budget is exhausted in ~24h.
              Current 2h error rate: {{ $value | humanizePercentage }}

    - name: slo.burn-rate.ticket
      rules:
        # Slow-medium burn: ≥6x over 6h + 30m window
        - alert: SLOAvailabilitySlowBurn
          expr: |
            (1 - job_instance:probe_success:rate6h) > (6 * (1 - 0.999))
            and
            (1 - job_instance:probe_success:rate30m) > (6 * (1 - 0.999))
          for: 15m
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: "SLO slow burn: {{ $labels.instance }}"
            description: >
              {{ $labels.instance }} error rate is burning through the monthly error budget
              at ≥6x the allowed rate (6h and 30m windows). At this pace the 30d
              99.9% budget is exhausted in ~5 days.
              Current 6h error rate: {{ $value | humanizePercentage }}
