# 99.9% availability over 30d for every blackbox-* probe job (not ha-standby-*, which is down by design); ADR-085.
# Only the page alerts are critical (Discord); the 3d ticket is warning (not routed).
# The page rules need for: because one failed probe in 60/h already exceeds 14.4x.

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-slo-recording-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: slo.availability.1m
      interval: 1m
      rules:
        - record: job_instance:probe_success:rate5m
          expr: avg_over_time(probe_success{job=~"blackbox-.*"}[5m])

        - record: job_instance:probe_error:rate5m
          expr: 1 - avg_over_time(probe_success{job=~"blackbox-.*"}[5m])

    - name: slo.availability.windows
      interval: 1m
      rules:
        - record: job_instance:probe_success:rate30m
          expr: avg_over_time(probe_success{job=~"blackbox-.*"}[30m])
        - record: job_instance:probe_success:rate1h
          expr: avg_over_time(probe_success{job=~"blackbox-.*"}[1h])
        - record: job_instance:probe_success:rate6h
          expr: avg_over_time(probe_success{job=~"blackbox-.*"}[6h])
        # Dashboard only.
        - record: job_instance:probe_success:rate24h
          expr: avg_over_time(probe_success{job=~"blackbox-.*"}[24h])
        - record: job_instance:probe_success:rate3d
          expr: avg_over_time(probe_success{job=~"blackbox-.*"}[3d])

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-slo-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: slo.burn-rate.page
      rules:
        # $value is the burn rate over the long window, as a multiple of the budget rate.
        - alert: SLOAvailabilityFastBurn
          expr: |
            (1 - job_instance:probe_success:rate1h) / (1 - 0.999) > 14.4
            and
            (1 - job_instance:probe_success:rate5m) / (1 - 0.999) > 14.4
          for: 10m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "SLO fast burn: {{ $labels.instance }}"
            description: >-
              {{ $labels.instance }} ({{ $labels.job }}) is burning the 30d 99.9% error
              budget at {{ $value | printf "%.1f" }}x over the last 1h (page threshold
              14.4x on 1h and 5m). Sustained 14.4x empties the budget in about 2 days.
            runbook_url: https://github.com/dwoitzik/homelab-infrastructure/blob/main/docs/RUNBOOK-alert-response.md

        - alert: SLOAvailabilitySlowBurn
          expr: |
            (1 - job_instance:probe_success:rate6h) / (1 - 0.999) > 6
            and
            (1 - job_instance:probe_success:rate30m) / (1 - 0.999) > 6
          for: 1h
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "SLO slow burn: {{ $labels.instance }}"
            description: >-
              {{ $labels.instance }} ({{ $labels.job }}) is burning the 30d 99.9% error
              budget at {{ $value | printf "%.1f" }}x over the last 6h (page threshold
              6x on 6h and 30m). Sustained 6x empties the budget in 5 days.
            runbook_url: https://github.com/dwoitzik/homelab-infrastructure/blob/main/docs/RUNBOOK-alert-response.md

    - name: slo.burn-rate.ticket
      rules:
        - alert: SLOAvailabilityBudgetBurn
          expr: |
            (1 - job_instance:probe_success:rate3d) / (1 - 0.999) > 1
            and
            (1 - job_instance:probe_success:rate6h) / (1 - 0.999) > 1
          for: 1h
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: "SLO budget burn: {{ $labels.instance }}"
            description: >-
              {{ $labels.instance }} ({{ $labels.job }}) has spent the 30d 99.9% error
              budget at {{ $value | printf "%.2f" }}x the sustainable rate over the
              last 3 days (ticket threshold 1x on 3d and 6h). Not paged; look at it
              during the week.
            runbook_url: https://github.com/dwoitzik/homelab-infrastructure/blob/main/docs/RUNBOOK-alert-response.md
