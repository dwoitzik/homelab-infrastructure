apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-error-budget-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  slo-error-budget.json: |
    {
      "title": "SLO Error Budget",
      "uid": "homelab-slo",
      "tags": ["slo", "reliability"],
      "time": {"from": "now-30d", "to": "now"},
      "refresh": "5m",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Error Budget Remaining (30d)",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 4},
          "targets": [
            {
              "expr": "100 * (1 - (1 - avg_over_time(probe_success{job=\"blackbox-http\"}[30d])) / (1 - 0.999))",
              "legendFormat": "Budget %"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "thresholds": {
              "steps": [
                {"value": null, "color": "red"},
                {"value": 10, "color": "yellow"},
                {"value": 50, "color": "green"}
              ]
            }
          },
          "fieldConfig": {
            "defaults": {"unit": "percent", "min": 0, "max": 100}
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Current Availability (24h)",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 4},
          "targets": [
            {
              "expr": "100 * avg by (instance) (job_instance:probe_success:rate24h{job=\"blackbox-http\"})",
              "legendFormat": "{{instance}}"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "thresholds": {
              "steps": [
                {"value": null, "color": "red"},
                {"value": 99, "color": "yellow"},
                {"value": 99.9, "color": "green"}
              ]
            }
          },
          "fieldConfig": {
            "defaults": {"unit": "percent", "decimals": 3}
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Probe Success Rate — All Services",
          "gridPos": {"x": 0, "y": 4, "w": 24, "h": 8},
          "targets": [
            {
              "expr": "100 * avg_over_time(probe_success{job=\"blackbox-http\"}[5m])",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 95,
              "max": 100,
              "thresholds": {
                "steps": [
                  {"value": null, "color": "red"},
                  {"value": 99, "color": "yellow"},
                  {"value": 99.9, "color": "green"}
                ]
              },
              "custom": {"lineWidth": 2}
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Burn Rate (1h window) — SLO Threshold 30x = 3%",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 8},
          "targets": [
            {
              "expr": "(1 - job_instance:probe_success:rate1h{job=\"blackbox-http\"}) / (1 - 0.999)",
              "legendFormat": "{{instance}} burn rate"
            },
            {
              "expr": "vector(30)",
              "legendFormat": "Page threshold (30x)"
            },
            {
              "expr": "vector(6)",
              "legendFormat": "Ticket threshold (6x)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"lineWidth": 2}
            }
          }
        }
      ],
      "schemaVersion": 39
    }
