# Default-deny ingress for kube-node-lease, which only holds API objects and runs no
# pods. Keeps "every namespace has a default-deny" true without exceptions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kube-node-lease
spec:
  podSelector: {}
  policyTypes:
    - Ingress
