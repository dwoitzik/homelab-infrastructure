apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 93.11.0
    chart: kube-prometheus-stack
    helm:
      values: |
        # The chart reads the top-level crds.enabled; a crds block under
        # prometheusOperator is ignored.
        crds:
          enabled: true
        # Replaced by KubeMemoryOvercommitWorkerLoss in control-plane-alerts.yml.
        defaultRules:
          disabled:
            KubeMemoryOvercommit: true
            # Replaced by job-failures in silent-failure-alerts.yml.
            KubeJobFailed: true
        prometheusOperator:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
          # Applies to the config-reloader sidecars of Prometheus and Alertmanager.
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          # ADR-036: soft preference off vm-srv-k3s-11, which had
          # accumulated most of this cluster's stateful/heavy workload with
          # nothing steering new placements elsewhere.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - vm-srv-k3s-11

        # ADR-036: same soft preference as prometheusOperator above.
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 256Mi
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - vm-srv-k3s-11

        # k3s bundles kube-proxy/scheduler/controller-manager into the single
        # k3s server binary -- they're never exposed as separately-scrapable
        # endpoints the way kubeadm clusters expose them, so the chart's
        # default ServiceMonitors for these can never succeed and their
        # paired alert rules (KubeProxyDown, KubeSchedulerDown,
        # KubeControllerManagerDown, severity=critical) fire permanently.
        # Found firing continuously since 2026-06-22 in a full alert sweep --
        # disabling rather than fixing the target, since there is no real
        # target to fix on k3s. See REL-022 in docs/AUDIT.md.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        # Same REL-022 reasoning as kubeScheduler/kubeProxy above: k3s uses
        # SQLite/kine, not etcd (ADR-015) -- no real :2379 target exists, so
        # the chart's default etcd ServiceMonitor/alerts/dashboard were dead
        # weight (etcd dashboard was one of the Grafana curation findings).
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        # k3s runs every control-plane component in one process with one
        # metrics registry, so the server node's kubelet /metrics repeats
        # everything the apiserver job already scrapes (~93k series).
        kubelet:
          serviceMonitor:
            metricRelabelings:
              # Chart default, kept because setting this list replaces it.
              - action: drop
                sourceLabels: [__name__, le]
                regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
              - action: drop
                sourceLabels: [__name__]
                regex: (apiserver|apiextensions|aggregator|etcd|scheduler|watch_cache)_.+

        # prometheus-blackbox-exporter subchart is not rendered from the
        # kube-prometheus-stack Helm release in ArgoCD (subchart not bundled
        # in upstream tarball). Deployed standalone via monitoring-manifests
        # ApplicationSet (kubernetes/system/monitoring/blackbox-exporter.yml)
        # at the same DNS name: prometheus-blackbox-exporter.monitoring.svc.
        prometheus-blackbox-exporter:
          enabled: false

        prometheus-node-exporter:
          priorityClassName: node-daemon
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi

        grafana:
          priorityClassName: node-pinned-stateful
          assertNoLeakedSecrets: false
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          # ADR-036: soft preference off vm-srv-k3s-11, which had
          # accumulated most of this cluster's stateful/heavy workload with
          # nothing steering new placements elsewhere.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - vm-srv-k3s-11
          # Grafana's SQLite database lives on its own volume: on an emptyDir every
          # pod move re-ran the full migration set, which outlasted the liveness
          # window under node I/O load and crash-looped the pod.
          persistence:
            enabled: true
            type: pvc
            storageClassName: local-path
            size: 2Gi
          # null drops the chart's default rollingUpdate block, which Helm would
          # otherwise merge in and the API rejects for Recreate.
          deploymentStrategy:
            type: Recreate
            rollingUpdate: null
          # Room for the one-time migration run on a fresh volume.
          livenessProbe:
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 90
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          ingress:
            enabled: false
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
            datasources:
              enabled: true
              searchNamespace: ALL
            dashboards:
              enabled: true
              searchNamespace: ALL
              label: grafana_dashboard
              labelValue: "1"
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: 'grafana-com'
                  orgId: 1
                  folder: 'Infrastructure'
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/grafana-com
          dashboards:
            grafana-com:
              proxmox-pve:
                gnetId: 10347
                revision: 5
                datasource: Prometheus
              node-exporter-full:
                gnetId: 1860
                revision: 37
                datasource: Prometheus
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: "traceID=(\\w+)"
                    name: TraceID
                    url: "$${__value.raw}"
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3100
              jsonData:
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
                search:
                  hide: false
                lokiSearch:
                  datasourceUid: loki
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc-secret
                key: client-secret
          grafana.ini:
            analytics:
              check_for_updates: false
              reporting_enabled: false
            news:
              news_feed_enabled: false
            auth:
              oauth_auto_login: true
            server:
              domain: monitoring.woitzik.dev
              root_url: https://monitoring.woitzik.dev
              serve_from_sub_path: false
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              client_id: grafana
              scopes: openid profile email groups
              empty_scopes: false
              auth_url: https://auth.woitzik.dev/api/oidc/authorization
              token_url: https://auth.woitzik.dev/api/oidc/token
              api_url: https://auth.woitzik.dev/api/oidc/userinfo
              login_attribute_path: preferred_username
              groups_attribute_path: groups
              role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
            security:
              allow_embedding: true
              cookie_samesite: lax
              cookie_secure: false
            sessions:
              cookie_samesite: lax
              cookie_secure: false
            dashboards:
              # Landing dashboard (landing-dashboard.yml) replaces the SLO
              # dashboard as home -- broader at-a-glance view (health, backup
              # freshness, storage, SSD wear, cert expiry, power). SLO
              # dashboard still exists, just not the default view anymore.
              default_home_dashboard_path: /tmp/dashboards/homelab-landing.json
          dnsConfig:
            options:
              - name: ndots
                value: "1"
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            # ADR-036: same reasoning as grafana's affinity below.
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values:
                            - vm-srv-k3s-11
            secrets:
              - alertmanager-discord-webhook
            # REL-042: AlertmanagerConfig objects can't be referenced as
            # receivers from this main route (confirmed with upstream --
            # they're meant to be self-contained); the discord routing lives
            # entirely in alertmanager-config.yml's own route instead. This
            # exempts that object (same namespace as Alertmanager) from the
            # default per-namespace matcher the operator would otherwise
            # inject, which would silently scope it to namespace=monitoring
            # only -- see the comment in alertmanager-config.yml for the full
            # story of the 8-day silent breakage this caused.
            alertmanagerConfigMatcherStrategy:
              type: OnNamespaceExceptForAlertmanagerNamespace
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              - source_matchers:
                  - severity = critical
                target_matchers:
                  - severity = warning
                equal:
                  - alertname
                  - namespace
            route:
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 24h
              receiver: "null"
              routes:
                - receiver: "null"
                  matchers:
                    - alertname =~ "InfoInhibitor|Watchdog|TestAlert"
                - receiver: "null"
                  matchers:
                    - alertname =~ "KubeProxyDown|KubeSchedulerDown|KubeControllerManagerDown"
            receivers:
              - name: "null"
        prometheus:
          prometheusSpec:
            # Scrape every 60s instead of chart default 30s: halves scrape
            # load on the control-plane node and TSDB retention growth; 15s
            # granularity is far below any alert window we configure.
            scrapeInterval: 60s
            # Must live under containers[]: the Prometheus CRD has no
            # spec.livenessProbe, so a flat key here is silently dropped by
            # structural schema pruning while ArgoCD still reports Synced.
            containers:
              - name: prometheus
                livenessProbe:
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 12
                readinessProbe:
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 4
            # ADR-036 follow-up: k3s-13 (4GB, smallest node) also excluded --
            # Prometheus alone runs ~1.4Gi, more than a third of that node's
            # total memory, and was found pushing it to 100% utilization.
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values:
                            - vm-srv-k3s-11
                            - vm-srv-k3s-13
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 2Gi
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
            retention: 30d
            retentionSize: 12GiB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-client
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            additionalScrapeConfigs:
              - job_name: 'node-exporter-rpi'
                static_configs:
                  - targets:
                      - '10.0.20.2:9100'
                      - '10.0.20.3:9100'
                    labels:
                      group: 'rpi_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-app'
                static_configs:
                  - targets:
                      - '10.0.20.252:9100'
                    labels:
                      group: 'app_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-ai'
                static_configs:
                  - targets:
                      - '10.0.20.251:9100'
                    labels:
                      group: 'ai_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-rybbit'
                static_configs:
                  - targets:
                      - '10.0.20.205:9100'
                    labels:
                      group: 'rybbit_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              # Reachable via router rule fwd_monitoring_dmz_scrape (10.0.20.0/24 ->
              # DMZ tcp/9100). Carries the crowdsec_* textfile metrics from ct-dmz-proxy-01.
              - job_name: 'node-exporter-dmz'
                static_configs:
                  - targets:
                      - '10.0.30.2:9100'
                    labels:
                      group: 'dmz_proxies'
                  - targets:
                      - '10.0.30.3:9100'
                    labels:
                      group: 'dmz_games'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-pve'
                static_configs:
                  - targets:
                      - '10.0.10.10:9100'
                    labels:
                      group: 'pve_hosts'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'proxmox-pve'
                metrics_path: /pve
                params:
                  module: [default]
                  cluster: ['1']
                  node: ['pve']
                static_configs:
                  - targets:
                      - '10.0.10.10'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - target_label: __address__
                    replacement: 'pve-exporter.monitoring.svc.cluster.local:9221'
                  - source_labels: [__param_target]
                    target_label: instance
              - job_name: 'snmp-mikrotik'
                metrics_path: /snmp
                params:
                  module: [if_mib]
                static_configs:
                  - targets:
                      - '10.0.10.1'
                    labels:
                      group: 'mikrotik'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - target_label: __address__
                    replacement: 'prometheus-snmp-exporter.monitoring.svc.cluster.local:9116'
                  - source_labels: [__param_target]
                    target_label: instance
              # Scope fix, 2026-08-22: this job used to list all ~44
              # woitzik.dev hostnames declared anywhere in the repo's
              # IngressRoutes, resolved via the blackbox-exporter pod's
              # forced public resolver (dnsPolicy: None, 1.1.1.1/8.8.8.8 --
              # see blackbox-exporter.yml). ADR-033 (2026-08-14) made public
              # DNS/tunnel exposure an explicit allowlist of exactly two
              # hostnames (photos, headscale) -- every other hostname here
              # has had no public DNS record since that ADR landed, so ~41 of
              # these probes have been failing by construction, not
              # reflecting any real outage, ever since. Narrowed to the
              # hostnames that are actually publicly resolvable, matching
              # what this job's own alerts (ExternalProbeFailed etc.) claim
              # to measure: real external reachability. LAN/VPN reachability
              # of everything else is real monitoring value but a genuinely
              # separate concern (needs an internal resolver path this pod
              # deliberately doesn't have) -- not covered here, tracked as a
              # known gap rather than silently dropped (see ROADMAP.md).
              #
              # Correction, 2026-08-23: claude.woitzik.dev was removed from
              # this list. ADR-032's dedicated tunnel for it was applied once
              # (PR #437) then destroyed by the very next apply in the same
              # session (ADR-033's allowlist PR, #440) -- confirmed via
              # `terraform/stacks/cloudflare/imports.tf`'s own note and the
              # operator's direct 2026-08-15 confirmation recorded there:
              # claude.woitzik.dev was never meant to be on the public
              # allowlist. This host has no public DNS record (`dig +short
              # @1.1.1.1 claude.woitzik.dev A` -> NXDOMAIN) and no
              # `cloudflared` connector process running anywhere. The probe
              # had been reporting `probe_success 0` (confirmed via a live
              # Prometheus query) the entire time, correctly reflecting that
              # -- it was never a false "up", just a target that should never
              # have been on this list post-ADR-033. This agent's own ttyd
              # remains reachable via Tailscale/LAN only, as designed.
              - job_name: 'blackbox-http'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_auth_ok]
                static_configs:
                  - targets:
                      - https://headscale.woitzik.dev
                      - https://photos.woitzik.dev
                      - https://media.woitzik.dev
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              # auth.woitzik.dev lost its public DNS record in the same
              # ADR-033 change -- this health check was never about external
              # reachability (Authelia is LAN/VPN-only by design), so probing
              # it through the public-only resolver above was wrong from the
              # start and has been failing silently since 2026-08-14. The
              # blackbox pod has no cluster DNS (dnsPolicy: None, see
              # blackbox-exporter.yml), so *.svc.cluster.local wouldn't
              # resolve either -- targets Authelia's ClusterIP directly,
              # which needs no resolver at all. ClusterIP is stable for the
              # life of the Service; only revisit if authelia's Service is
              # ever deleted/recreated (`kubectl get svc -n apps authelia`).
              - job_name: 'blackbox-authelia-health'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      - http://10.43.107.252:9091/api/health
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              # 2026-09-10: Vaultwarden had zero synthetic monitoring, found
              # while chasing a client-reported sync failure with a
              # perfectly clean server side (ArgoCD Synced/Healthy, litestream
              # current, app logs all 200s). Same ClusterIP-direct pattern as
              # Authelia above, not the public blackbox-http job -- vault.woitzik.dev
              # has no public DNS record by design (ADR-033), so a
              # public-resolver probe would just permanently fail. This
              # catches "Vaultwarden itself is down or unhealthy"; it can't
              # catch "the tailnet path to it is broken" -- see
              # tailnet-route-drift-check.yml for that half of the gap.
              - job_name: 'blackbox-vaultwarden-health'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      - http://10.43.186.87:80/alive
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              # In-cluster health of Jellyfin and Nextcloud. Targets come from the
              # Service endpoints (pod IP), since the blackbox pod has no cluster DNS.
              - job_name: 'blackbox-jellyfin-health'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_2xx]
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names: [apps]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_name]
                    regex: jellyfin
                    action: keep
                  - source_labels: [__address__]
                    target_label: __param_target
                    replacement: http://$1/health
                  - target_label: instance
                    replacement: jellyfin
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              - job_name: 'blackbox-nextcloud-health'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_nextcloud_status]
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names: [apps]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_name]
                    regex: nextcloud
                    action: keep
                  - source_labels: [__address__]
                    target_label: __param_target
                    replacement: http://$1/status.php
                  - target_label: instance
                    replacement: nextcloud
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              # Standby TLS front end on rpi-srv-02 (ADR-088): LAN and public listeners.
              # Not named blackbox-*: ExternalProbeFailed pages on those, and this
              # one is a warning until a failover is live (ha-standby-alerts.yml).
              - job_name: 'ha-standby-proxy'
                scrape_interval: 120s
                metrics_path: /probe
                params:
                  module: [tls_ha_standby]
                static_configs:
                  - targets:
                      - 10.0.20.3:443
                      - 10.0.20.3:8443
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              # 1 only while headscale-standby runs; the router keys its failover on the same URL.
              - job_name: 'ha-standby-active'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      - http://10.0.20.3:8081/
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              # The tracker endpoint woitzik.dev visitors hit, resolved via public DNS
              # through the Cloudflare tunnel. http_2xx, not http_auth_ok: a 401/403
              # here would mean the tracker is blocked, not that it is up.
              - job_name: 'blackbox-rybbit-public'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      - https://analytics.woitzik.dev/api/health
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
