apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 61.3.2
    chart: kube-prometheus-stack
    helm:
      values: |
        prometheusOperator:
          crds:
            enabled: false

        # k3s bundles kube-proxy/scheduler/controller-manager into the single
        # k3s server binary -- they're never exposed as separately-scrapable
        # endpoints the way kubeadm clusters expose them, so the chart's
        # default ServiceMonitors for these can never succeed and their
        # paired alert rules (KubeProxyDown, KubeSchedulerDown,
        # KubeControllerManagerDown, severity=critical) fire permanently.
        # Found firing continuously since 2026-06-22 in a full alert sweep --
        # disabling rather than fixing the target, since there is no real
        # target to fix on k3s. See REL-022 in docs/AUDIT.md.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        # prometheus-blackbox-exporter subchart is not rendered from the
        # kube-prometheus-stack Helm release in ArgoCD (subchart not bundled
        # in upstream tarball). Deployed standalone via monitoring-manifests
        # ApplicationSet (kubernetes/system/monitoring/blackbox-exporter.yml)
        # at the same DNS name: prometheus-blackbox-exporter.monitoring.svc.
        prometheus-blackbox-exporter:
          enabled: false

        grafana:
          assertNoLeakedSecrets: false
          enabled: true
          ingress:
            enabled: false
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
            datasources:
              enabled: true
              searchNamespace: ALL
            dashboards:
              enabled: true
              searchNamespace: ALL
              label: grafana_dashboard
              labelValue: "1"
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: 'grafana-com'
                  orgId: 1
                  folder: 'Infrastructure'
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/grafana-com
          dashboards:
            grafana-com:
              proxmox-pve:
                gnetId: 10347
                revision: 9
                datasource: Prometheus
              node-exporter-full:
                gnetId: 1860
                revision: 37
                datasource: Prometheus
              proxmox-summary:
                gnetId: 19022
                revision: 5
                datasource: Prometheus
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: "traceID=(\\w+)"
                    name: TraceID
                    url: "$${__value.raw}"
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3100
              jsonData:
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
                search:
                  hide: false
                lokiSearch:
                  datasourceUid: loki
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc-secret
                key: client-secret
          grafana.ini:
            analytics:
              check_for_updates: false
              reporting_enabled: false
            news:
              news_feed_enabled: false
            auth:
              oauth_auto_login: true
            server:
              domain: monitoring.woitzik.dev
              root_url: https://monitoring.woitzik.dev
              serve_from_sub_path: false
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              client_id: grafana
              scopes: openid profile email groups
              empty_scopes: false
              auth_url: https://auth.woitzik.dev/api/oidc/authorization
              token_url: https://auth.woitzik.dev/api/oidc/token
              api_url: https://auth.woitzik.dev/api/oidc/userinfo
              login_attribute_path: preferred_username
              groups_attribute_path: groups
              role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
            security:
              allow_embedding: true
              cookie_samesite: lax
              cookie_secure: false
            sessions:
              cookie_samesite: lax
              cookie_secure: false
          dnsConfig:
            options:
              - name: ndots
                value: "1"
        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-discord-webhook
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              - source_matchers:
                  - severity = critical
                target_matchers:
                  - severity = warning
                equal:
                  - alertname
                  - namespace
            route:
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 24h
              # Default: silence everything (only explicit critical routes fire)
              receiver: "null"
              routes:
                # Always silence these
                - receiver: "null"
                  matchers:
                    - alertname =~ "InfoInhibitor|Watchdog|TestAlert"
                # k3s false positives — components are embedded, never expose metrics
                - receiver: "null"
                  matchers:
                    - alertname =~ "KubeProxyDown|KubeSchedulerDown|KubeControllerManagerDown"
                # Hardware temperature alerts go to Discord regardless of severity
                - receiver: discord
                  matchers:
                    - alertname =~ "ProxmoxHostHighTemp|RpiHighTemp"
                  group_wait: 30s
                  repeat_interval: 2h
                # Only critical alerts go to Discord, with 2h repeat to avoid spam
                - receiver: discord
                  matchers:
                    - severity = critical
                  group_wait: 30s
                  repeat_interval: 2h
            receivers:
              - name: "null"
              - name: discord
                discord_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
                    title: |-
                      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
                    message: |-
                      {{ range .Alerts -}}
                      **Alert:** {{ .Annotations.summary }}{{ if .Annotations.description }}
                      **Description:** {{ .Annotations.description }}{{ end }}
                      **Severity:** `{{ .Labels.severity }}`{{ if .Labels.namespace }}
                      **Namespace:** `{{ .Labels.namespace }}`{{ end }}{{ if .Labels.pod }}
                      **Pod:** `{{ .Labels.pod }}`{{ end }}
                      {{ end }}
        prometheus:
          prometheusSpec:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-client
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            additionalScrapeConfigs:
              - job_name: 'node-exporter-rpi'
                static_configs:
                  - targets:
                      - '10.0.20.2:9100'
                      - '10.0.20.3:9100'
                    labels:
                      group: 'rpi_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-app'
                static_configs:
                  - targets:
                      - '10.0.20.252:9100'
                    labels:
                      group: 'app_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-ai'
                static_configs:
                  - targets:
                      - '10.0.20.251:9100'
                    labels:
                      group: 'ai_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-pve'
                static_configs:
                  - targets:
                      - '10.0.10.10:9100'
                    labels:
                      group: 'pve_hosts'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'proxmox-pve'
                metrics_path: /pve
                params:
                  module: [default]
                  cluster: ['1']
                  node: ['pve']
                static_configs:
                  - targets:
                      - '10.0.10.10'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - target_label: __address__
                    replacement: 'pve-exporter.monitoring.svc.cluster.local:9221'
                  - source_labels: [__param_target]
                    target_label: instance
              - job_name: 'blackbox-http'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      - https://auth.woitzik.dev
                      - https://home.woitzik.dev
                      - https://monitoring.woitzik.dev
                      - https://vault.woitzik.dev
                      - https://status.woitzik.dev
                      - https://nextcloud.woitzik.dev
                      - https://ha.woitzik.dev
                      - https://argo.woitzik.dev
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              - job_name: 'blackbox-authelia-health'
                scrape_interval: 60s
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      - https://auth.woitzik.dev/api/health
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
