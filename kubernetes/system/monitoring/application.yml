apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 61.3.2
    chart: kube-prometheus-stack
    helm:
      values: |
        prometheusOperator:
          crds:
            enabled: false
        grafana:
          assertNoLeakedSecrets: false
          enabled: true
          ingress:
            enabled: false
          adminPassword: "homelab-admin-2026"
          sidecar:
            datasources:
              enabled: true
              searchNamespace: ALL
            dashboards:
              enabled: true
              searchNamespace: ALL
              label: grafana_dashboard
              labelValue: "1"
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: 'grafana-com'
                  orgId: 1
                  folder: 'Infrastructure'
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/grafana-com
          dashboards:
            grafana-com:
              proxmox-pve:
                gnetId: 10347
                revision: 9
                datasource: Prometheus
              node-exporter-full:
                gnetId: 1860
                revision: 37
                datasource: Prometheus
              proxmox-summary:
                gnetId: 19022
                revision: 5
                datasource: Prometheus
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000
          grafana.ini:
            analytics:
              check_for_updates: false
              reporting_enabled: false
            news:
              news_feed_enabled: false
            auth:
              oauth_auto_login: true
            server:
              domain: monitoring.woitzik.dev
              root_url: https://monitoring.woitzik.dev
              serve_from_sub_path: false
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              client_id: grafana
              client_secret: dubist1plebyakalb
              scopes: openid profile email groups
              empty_scopes: false
              auth_url: https://auth.woitzik.dev/api/oidc/authorization
              token_url: https://auth.woitzik.dev/api/oidc/token
              api_url: https://auth.woitzik.dev/api/oidc/userinfo
              login_attribute_path: preferred_username
              groups_attribute_path: groups
              role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
            security:
              allow_embedding: true
              cookie_samesite: lax
              cookie_secure: false
            sessions:
              cookie_samesite: lax
              cookie_secure: false
          dnsConfig:
            options:
              - name: ndots
                value: "1"
        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-discord-webhook
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              - source_matchers:
                  - severity = critical
                target_matchers:
                  - severity = warning
                equal:
                  - alertname
                  - namespace
            route:
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: discord
              routes:
                - receiver: "null"
                  matchers:
                    - alertname =~ "InfoInhibitor|Watchdog"
                - receiver: discord
                  matchers:
                    - severity = critical
                  group_wait: 10s
                  repeat_interval: 1h
                - receiver: discord
                  matchers:
                    - severity = warning
                  group_wait: 5m
                  repeat_interval: 4h
            receivers:
              - name: "null"
              - name: discord
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
                    title: |-
                      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
                    message: |-
                      {{ range .Alerts -}}
                      **Alert:** {{ .Annotations.summary }}{{ if .Annotations.description }}
                      **Description:** {{ .Annotations.description }}{{ end }}
                      **Severity:** `{{ .Labels.severity }}`{{ if .Labels.namespace }}
                      **Namespace:** `{{ .Labels.namespace }}`{{ end }}{{ if .Labels.pod }}
                      **Pod:** `{{ .Labels.pod }}`{{ end }}
                      {{ end }}
        prometheus:
          prometheusSpec:
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            additionalScrapeConfigs:
              - job_name: 'node-exporter-rpi'
                static_configs:
                  - targets:
                      - '10.0.20.2:9100'
                      - '10.0.20.3:9100'
                    labels:
                      group: 'rpi_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-app'
                static_configs:
                  - targets:
                      - '10.0.20.252:9100'
                    labels:
                      group: 'app_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'node-exporter-ai'
                static_configs:
                  - targets:
                      - '10.0.20.251:9100'
                    labels:
                      group: 'ai_nodes'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: 'proxmox-pve'
                metrics_path: /pve
                params:
                  module: [default]
                  cluster: ['1']
                  node: ['pve']
                static_configs:
                  - targets:
                      - '10.0.10.10'
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - target_label: __address__
                    replacement: 'pve-exporter.monitoring.svc.cluster.local:9221'
                  - source_labels: [__param_target]
                    target_label: instance
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
