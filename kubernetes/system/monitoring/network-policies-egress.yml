---
# CrowdSec syncs community blocklists against its Central API
# (app.crowdsec.net / api.crowdsec.net over HTTPS) -- narrow to 443, not a
# blanket internet allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-crowdsec-capi
  namespace: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 443
---
# cert-manager: ClusterIssuer `letsencrypt-production` uses DNS-01 via
# Cloudflare (checked live: `kubectl get clusterissuer -o yaml`), so this
# needs outbound 443 to both acme-v02.api.letsencrypt.org and
# api.cloudflare.com -- neither has a pinnable IP, same class of allow as
# CrowdSec's CAPI rule above. Plus apiserver (watches Certificate/Issuer
# CRDs, writes the resulting TLS Secrets) and DNS. Egress-only: the
# webhook/apiserver interaction this namespace was originally deferred for
# is an ingress concern (apiserver calling INTO cert-manager-webhook),
# untouched by any of this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
