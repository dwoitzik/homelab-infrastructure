# Section F hardening: egress half of default-deny for the namespaces with
# the narrowest, best-understood traffic patterns. Ingress default-deny
# already existed for monitoring/security/vault (see network-policies.yml
# and the security/vault Applications) -- this closes egress the same way.
#
# k3s's "kubernetes" API server Service has no pod backing it (the node
# itself serves :6443), so NetworkPolicy's namespaceSelector can't match it
# -- apiserver egress needs an explicit ipBlock at the control-plane node's
# IP. Scoped to vm-srv-k3s-11 (10.0.20.11), the only control-plane node.
#
# 2026-08-22 (night): cert-manager, cnpg-system, argocd, and velero added
# below, each after actually checking its real traffic (ClusterIssuer spec,
# BackupStorageLocation configs, ArgoCD Application repoURLs, argocd-cm's
# OIDC issuer) rather than guessing. cert-manager's webhook/apiserver
# interaction (the reason it was deferred) is an INGRESS concern -- the
# apiserver calls into cert-manager-webhook for CRD conversion/validation --
# and every policy in this file is Egress-only, so that footgun doesn't
# apply here; ingress for these namespaces is untouched.
#
# database, external-secrets, nfs-provisioner, and trivy-system still need
# the same apiserver-ipBlock + real-traffic-check pass this file establishes
# the pattern for -- not done this round, no new reasoning to add.
#
# 2026-08-23: apps closed too, after the real per-workload pass the earlier
# note above said it needed. Checked every one of its ~38 workloads'
# container ports/images/configs (not guessed) to find what actually needs
# more than the broad-443 pattern:
#
# - tailscale-subnet-router: WireGuard is UDP, NAT-traversal based (no fixed
#   port) -- allowed UDP to anywhere, falls back to DERP over 443/TCP
#   (already covered by the broad allow) if UDP is blocked upstream anyway.
# - synapse: Matrix federation is TCP 8448, checked live in its own config,
#   separate from the client-facing 443 path.
# - headscale: checked its config.yml -- runs its own EMBEDDED DERP server
#   (serves relay traffic as ingress, not something it needs egress for) and
#   only calls out over HTTPS for the default Tailscale DERP map
#   (controlplane.tailscale.com) -- the broad-443 allow already covers this,
#   no special case needed despite being flagged as a risk earlier.
# - authelia (this cluster's Authelia instance lives IN apps, not database):
#   needs its own CNPG Postgres AND its session-store Redis
#   (`redis-authelia`), both of which live in the `database` namespace --
#   same Postgres pattern for any other apps-namespace workload with a
#   cluster.yml under kubernetes/system/postgres/ (n8n, synapse).
#   `database`'s own `allow-from-apps` NetworkPolicy already expects this
#   direction, checked before assuming it. First attempt at this rule only
#   opened 5432 -- missed the Redis port entirely, caught live (Authelia's
#   own logs: "Unable to save updated user session ... connection refused"
#   to redis-authelia's pod IP) and fixed before calling this done, not
#   left as a silent regression.
#
# Everything else (freshrss, linkding, mealie, n8n, renovate, keel, searxng,
# home-assistant, homepage, and more) genuinely does need broad, many-host
# external HTTP(S) egress by design -- that's not a gap in the traffic map,
# it's what these apps actually are (an RSS reader has to reach arbitrary
# feed hosts, a workflow-automation tool has to reach arbitrary APIs). The
# broad-443 allow already used elsewhere in this file is the correct,
# proportionate answer for all of them -- narrowing further would need a
# per-app allowlist with no real security payoff over "not TCP-443/80 or
# UDP-anywhere", since that's genuinely what normal operation looks like for
# most of this namespace.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-intra-namespace
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
---
# vault-unseal reads/writes its unseal-key material via a k8s Secret --
# needs the API server, which has no pod behind its Service (see header).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.20.11/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
