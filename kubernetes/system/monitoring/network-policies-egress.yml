# Section F hardening: egress half of default-deny for the namespaces with
# the narrowest, best-understood traffic patterns. Ingress default-deny
# already existed for monitoring/security/vault (see network-policies.yml
# and the security/vault Applications) -- this closes egress the same way.
#
# k3s's "kubernetes" API server Service has no pod backing it (the node
# itself serves :6443), so NetworkPolicy's namespaceSelector can't match it
# -- apiserver egress needs an explicit ipBlock at the control-plane node's
# IP. Scoped to vm-srv-k3s-11 (10.0.20.11), the only control-plane node.
#
# 2026-08-22 (night): cert-manager, cnpg-system, argocd, and velero added
# below, each after actually checking its real traffic (ClusterIssuer spec,
# BackupStorageLocation configs, ArgoCD Application repoURLs, argocd-cm's
# OIDC issuer) rather than guessing. cert-manager's webhook/apiserver
# interaction (the reason it was deferred) is an INGRESS concern -- the
# apiserver calls into cert-manager-webhook for CRD conversion/validation --
# and every policy in this file is Egress-only, so that footgun doesn't
# apply here; ingress for these namespaces is untouched.
#
# database, external-secrets, nfs-provisioner, and trivy-system still need
# the same apiserver-ipBlock + real-traffic-check pass this file establishes
# the pattern for -- not done this round, no new reasoning to add.
#
# apps (40 workloads) is still deliberately excluded, now with sharper
# reasoning than "no traffic map yet": a naive blanket 443-egress-only
# rule (the pattern used below for cert-manager/argocd) would break real,
# named things in this specific namespace -- `tailscale-subnet-router`
# needs outbound WireGuard UDP, `synapse` needs Matrix federation on 8448
# (not 443), `headscale` needs its DERP relay traffic. A correct policy
# here needs a real per-workload pass, not a copy of the pattern below.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-intra-namespace
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
---
# vault-unseal reads/writes its unseal-key material via a k8s Secret --
# needs the API server, which has no pod behind its Service (see header).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.20.11/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
