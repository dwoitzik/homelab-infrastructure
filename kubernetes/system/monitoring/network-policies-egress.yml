# argocd: repo-server clones charts/manifests from ~13 distinct external
# hosts (checked live via every Application's repoURL -- GitHub, jetstack,
# grafana, hashicorp, metallb, kyverno, prometheus-community, vmware-tanzu,
# chaos-mesh, external-secrets, cloudnative-pg, nfs-subdir-external-
# provisioner, traefik's own chart repo), none with pinnable IPs -- same
# broad-443 class as cert-manager/CrowdSec above. argocd-server ALSO makes
# a server-to-server OIDC call to Authelia at its public hostname
# (auth.woitzik.dev, checked live via `argocd-cm`'s oidc.config), which
# resolves via the LAN AdGuard rewrite to Traefik's ClusterIP LB
# (10.0.20.200) -- inside the 10.0.0.0/8 range the broad rule excludes, so
# it needs its own explicit allow or OIDC login breaks. Plus apiserver
# (argocd's core job -- gets this wrong and the whole cluster's GitOps
# stops reconciling) and DNS.
#
# The Traefik allow below targets Traefik's own pod (namespace kube-system,
# port 8443/websecure) rather than an ipBlock on 10.0.20.200 -- tried the
# ipBlock first and it silently failed ("connection refused", confirmed via
# a throwaway pod in argocd vs. the same request from an unrestricted
# namespace). k3s's built-in NetworkPolicy controller (kube-router)
# evaluates egress rules AFTER kube-proxy's DNAT for a Service's
# LoadBalancer IP, so by the time the policy runs, the packet's real
# destination is already the backing pod's IP/port (8443), not 10.0.20.200
# -- an ipBlock on the LB IP can never match. This is a real, general
# gotcha for any future "allow egress to a Service by its LB/ClusterIP"
# rule in this cluster, not specific to Authelia.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-intra-namespace
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.20.11/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-chart-repos
  namespace: argocd
spec:
  podSelector: {}
