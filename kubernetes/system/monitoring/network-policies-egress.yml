# database (CNPG Postgres for authelia/n8n/synapse) -- database's own
# allow-from-apps NetworkPolicy already expects this direction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-database
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
---
# Broad HTTP(S) egress -- the actual, legitimate operating mode for most of
# this namespace (RSS/bookmark/recipe importers, workflow automation, a
# private search engine querying multiple backends, dependency-update bots).
# Same class of allow as CrowdSec's CAPI rule / cert-manager's ACME rule
# elsewhere in this file, just needed by more workloads here. Port 80
# included alongside 443 -- some external resources apps like freshrss/
# linkding fetch (favicons, older RSS feeds) still aren't HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-web
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# Matrix federation (synapse-to-synapse, other homeservers) -- separate from
# the client-facing 443 path, checked live in synapse's own config.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-synapse-federation
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: synapse
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 8448
---
# WireGuard is UDP, NAT-traversal based -- no fixed port to allowlist.
# Falls back to DERP over 443/TCP (already covered by allow-egress-web
# above) if direct UDP is blocked upstream of this cluster anyway. Scoped
# to this one pod, not the whole namespace -- the broadest allow in this
# file, kept as narrow as the actual need (one workload, not everything).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-tailscale-wireguard
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: tailscale-subnet-router
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - protocol: UDP
