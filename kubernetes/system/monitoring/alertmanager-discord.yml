apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Merge
  data:
    - secretKey: url
      remoteRef:
        key: secret/alertmanager
        property: discord-webhook-url
