# Wazuh, CrowdSec, and the CNPG operator all silently broke and stayed
# broken for days -- caught only by manual audit. These rules target the
# exact failure modes: operator down, backups stopping, log source stale.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-silent-failure-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnpg.operator
      rules:
        - alert: CNPGOperatorDown
          expr: |
            (kube_deployment_status_replicas_available{namespace="cnpg-system", deployment="cloudnative-pg"} == 0)
            or
            (absent(kube_deployment_status_replicas_available{namespace="cnpg-system", deployment="cloudnative-pg"}))
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CNPG operator has 0 ready replicas"
            description: >
              The cloudnative-pg operator (cnpg-system) has had 0 available replicas for
              10+ minutes, or the deployment is missing entirely. No new Backup objects can
              be created and Cluster reconciliation stops while this is down -- it was down
              10+ hours undetected before this rule existed, during which Authelia's backups
              silently stopped. Uses kube-state-metrics rather than the operator's own
              metrics on purpose: the operator being down is exactly the case its own
              /metrics endpoint can't report on.

    - name: cnpg.backup
      rules:
        - alert: CNPGAutheliaBackupTooOld
          expr: |
            (time() - cnpg_collector_last_available_backup_timestamp{namespace="database", pod=~"postgres-authelia-.*"}) > 97200
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "postgres-authelia's last successful backup is over 27h old"
            description: >
              postgres-authelia's ScheduledBackup runs daily at 02:00 -- no successful
              backup in 27+ hours (one cycle plus buffer) means the schedule stopped
              firing or every attempt is failing. This exact gap let Authelia's backups
              silently stop for 6 days (2026-08-25 to 2026-08-31, root cause: CNPG
              operator down). Check:
              kubectl get backup -n database --sort-by=.metadata.creationTimestamp | tail,
              and CNPGOperatorDown above.

    - name: crowdsec
      rules:
        # These rules can only fire if this series exists, and it never has: the
        # router's inter-VLAN ACL lets internal VLANs reach the DMZ on 443 only,
        # so scraping 10.0.30.2:9100 was always refused (0/366 up-samples, 30d).
        # warning, not critical: the gap is real and permanent until the router
        # ACL changes, so a critical here would page every night about something
        # that cannot be fixed from this repo and cannot self-resolve.
        - alert: CrowdSecDMZMetricsAbsent
          expr: |
            absent(crowdsec_container_up{instance=~"10.0.30.2.*"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No CrowdSec metrics arrive from ct-dmz-proxy-01 -- its alerts below cannot fire"
            description: >
              The DMZ proxy is unreachable on the node_exporter port, so neither
              CrowdSecContainerDown nor CrowdSecAcquisitionSourceMissing can ever evaluate:
              both match on crowdsec_* series that Prometheus has never received. The bouncer
              on this WAN-adjacent host is therefore unmonitored, which is the exact silent
              failure this file exists to prevent. Cause is the router inter-VLAN ACL
              (internal -> DMZ allows 443 only), not a stopped exporter -- the container has
              been up for 4+ weeks. Closing this needs either an ACL exception for 9100 or
              a push-based path; until then treat the two crowdsec alerts as non-functional.
              Severity is warning by design: the condition holds permanently until the router
              is reconfigured, so as a critical it would page nightly with no action available
              on the cluster side. Raise it back to critical once 9100 is reachable.

        - alert: CrowdSecContainerDown
          expr: |
            crowdsec_container_up{instance=~"10.0.30.2.*"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec container is not running on ct-dmz-proxy-01"
            description: >
              The crowdsec Docker container on ct-dmz-proxy-01 (the WAN-adjacent box) has
              been down for 10+ minutes -- its nftables bouncer stops receiving new
              decisions and community-blocklist sync stops. Check: ssh + `docker ps` /
              `docker logs crowdsec` on that host.

        - alert: CrowdSecAcquisitionSourceMissing
          expr: |
            crowdsec_acquis_source_missing{instance=~"10.0.30.2.*"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec's configured log source is missing on ct-dmz-proxy-01"
            description: >
              One of CrowdSec's acquis.yaml sources (auth.log, NPM's fallback access log)
              doesn't exist or isn't growing -- this is exactly how detection silently died
              this session (acquis.yaml pointed at a nonexistent file for an unknown
              duration, collections stayed "enabled" the whole time with zero real
              ingestion). Deliberately not alerting on decision-count: zero decisions is a
              legitimate quiet-day outcome, a missing source file never is.

    - name: renovate
      rules:
        - alert: RenovateCronJobStale
          expr: |
            time() - kube_cronjob_status_last_schedule_time{namespace="apps", cronjob="renovate"} > 21600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Renovate hasn't been scheduled in 6+ hours"
            description: >
              The renovate CronJob runs every 2h; no schedule attempt in 6+ hours means
              the CronJob is suspended, the controller is stuck, or something cluster-wide
              is blocking scheduling. Dependency PRs silently stop appearing -- exactly
              the deprecation-creeps-in-unnoticed pattern this file targets. Check:
              kubectl get cronjob -n apps renovate.

        - alert: RenovateJobFailing
          expr: |
            kube_job_status_failed{namespace="apps", job_name=~"renovate-[0-9]+"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "A scheduled Renovate run failed"
            description: >
              A renovate-<timestamp> Job (cronjob="renovate") reported a failure. Often
              a transient registry/API hiccup, but repeated failures mean dependency
              scanning has silently stopped making progress. Check:
              kubectl logs -n apps job/<job-name>.
