# Default-deny ingress for metallb-system. The speakers run on the host
# network, which NetworkPolicy does not cover, so this applies to the
# controller: its admission webhook and metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Admission webhook, called by the apiserver from the node network. No
# `from`: the source address differs per node, and the port only serves the
# apiserver's TLS webhook calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-from-apiserver
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 7472
