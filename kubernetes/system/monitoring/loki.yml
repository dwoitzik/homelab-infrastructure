apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.6.2
    chart: loki
    helm:
      values: |
        loki:
          analytics:
            reporting_enabled: false
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          # Few, quiet streams: short chunk lifetimes meant one tiny Garage
          # object per stream every 30 min. A longer WAL checkpoint keeps the
          # bigger in-memory chunks from being rewritten every 5 min instead.
          ingester:
            chunk_idle_period: 30m
            max_chunk_age: 2h
            chunk_target_size: 1572864
            wal:
              dir: /var/loki/wal
              checkpoint_duration: 15m
          compactor:
            working_directory: /var/loki/compactor
            compaction_interval: 10m
            retention_enabled: true
            retention_delete_delay: 2h
            retention_delete_worker_count: 150
            delete_request_store: s3
          limits_config:
            retention_period: 30d
            ingestion_rate_mb: 2
            ingestion_burst_size_mb: 4
            per_stream_rate_limit: 512k
            per_stream_rate_limit_burst: 1M
          ruler:
            alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            enable_api: true
            ring:
              kvstore:
                store: memberlist
            rule_path: /var/loki/rules
            storage:
              type: s3
              s3:
                bucketnames: loki-data
                endpoint: http://garage.apps.svc.cluster.local:3900
                region: homelab
                s3_force_path_style: true
                insecure: true
          memberlist:
            join_members:
              - loki-memberlist.monitoring.svc.cluster.local
          storage:
            type: s3
            bucketNames:
              chunks: loki-data
              ruler: loki-data
              admin: loki-data
            s3:
              endpoint: http://garage.apps.svc.cluster.local:3900
              region: homelab
              s3ForcePathStyle: true
              insecure: true
          schemaConfig:
            configs:
              - from: "2024-04-01"
                object_store: s3
                store: tsdb
                schema: v13
                index:
                  prefix: index_
                  period: 24h
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          # ADR-036: soft preference off vm-srv-k3s-11, which had
          # accumulated most of this cluster's stateful/heavy workload with
          # nothing steering new placements elsewhere.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - vm-srv-k3s-11
          persistence:
            storageClass: nfs-client
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          extraEnv:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: loki-s3-secrets
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: loki-s3-secrets
                  key: secret-access-key
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          # 2026-08-22 right-sizing: allocatedMemory below is memcached's own
          # -m cache-size flag (512MB) -- the old 256Mi k8s request was
          # already smaller than what memcached is configured to use, so
          # observed usage (338Mi) exceeding it was expected, not a leak.
          # Requesting closer to the configured allocation instead of an
          # arbitrary smaller number.
          allocatedMemory: 512
          maxItemSize: 5m
          resources:
            requests:
              cpu: 50m
              memory: 448Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # ADR-036: same soft preference off vm-srv-k3s-11 as singleBinary
          # above.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - vm-srv-k3s-11
        resultsCache:
          allocatedMemory: 512
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - vm-srv-k3s-11
        memcachedExporter:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
        lokiCanary:
          enabled: false
        test:
          enabled: false
        # ADR-036: same soft preference off vm-srv-k3s-11 as the rest of
        # this stack, for the nginx gateway frontend.
        gateway:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - vm-srv-k3s-11
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# Pod log shipping (replaced the deprecated Promtail chart). The relabel rules
# reproduce Promtail's kubernetes-pods job so existing LogQL keeps working.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.15.0
    chart: alloy
    helm:
      values: |
        global:
          # Pod log files under /var/log/pods are root-owned, mode 0640.
          podSecurityContext:
            runAsUser: 0
            runAsGroup: 0
        controller:
          type: daemonset
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          volumes:
            extra:
              - name: alloy-data
                hostPath:
                  path: /var/lib/alloy
                  type: DirectoryOrCreate
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
        alloy:
          enableReporting: false
          # Read positions survive pod restarts, so a restart neither re-sends nor skips lines.
          storagePath: /var/lib/alloy
          mounts:
            varlog: true
            extra:
              - name: alloy-data
                mountPath: /var/lib/alloy
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 384Mi
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("NODE_NAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_controller_name"]
                  regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
                  target_label  = "__tmp_controller_name"
                }
                rule {
                  source_labels = [
                    "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                    "__meta_kubernetes_pod_label_app",
                    "__tmp_controller_name",
                    "__meta_kubernetes_pod_name",
                  ]
                  regex        = "^;*([^;]+)(;.*)?$"
                  target_label = "app"
                }
                rule {
                  source_labels = [
                    "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
                    "__meta_kubernetes_pod_label_instance",
                  ]
                  regex        = "^;*([^;]+)(;.*)?$"
                  target_label = "instance"
                }
                rule {
                  source_labels = [
                    "__meta_kubernetes_pod_label_app_kubernetes_io_component",
                    "__meta_kubernetes_pod_label_component",
                  ]
                  regex        = "^;*([^;]+)(;.*)?$"
                  target_label = "component"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node_name"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["namespace", "app"]
                  separator     = "/"
                  target_label  = "job"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
                rule {
                  source_labels = [
                    "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
                    "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                    "__meta_kubernetes_pod_container_name",
                  ]
                  separator    = "/"
                  regex        = "true/(.*)"
                  replacement  = "/var/log/pods/*$1/*.log"
                  target_label = "__path__"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              // New files must be read from the start, or short-lived Job pods lose
              // the lines written before discovery. Known files resume from positions.
              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              loki.process "pods" {
                stage.cri {}
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
