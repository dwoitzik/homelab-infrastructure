# REL-012: control plane crash-looped a day with zero alerting, caught only by chance.
# Not etcd -- k3s runs SQLite via kine (ADR-015); REL-012's trigger was an un-vacuumed
# state.db (fixed by the k3s monthly-vacuum role). These alerts keep that silent again.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-control-plane-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: control-plane.health
      rules:
        # 30s equals one scrape interval, so a single failed scrape pages
        # even though the API server itself was healthy throughout.
        - alert: KubeAPIServerDown
          expr: up{job="apiserver"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes API server is unreachable"
            description: >
              Prometheus can't scrape the API server (job=apiserver). This is single-node
              control plane on this homelab -- when this fires, kubectl/ArgoCD/Atlantis
              are all down too. Known recurring cause: kine/SQLite datastore latency under
              disk I/O contention (REL-012 in docs/HOMELAB-AUDIT.md) -- check `journalctl -u
              k3s` on vm-srv-k3s-11 for "apply request took too long" warnings.

        - alert: KubeAPIServerHighLatency
          expr: |
            histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|CONNECT"}[5m])) by (le)) > 5
          # Prometheus pod restarts fabricate a junk p99 here: bucket counters reset
          # mid-[5m]-window, sparse-bucket quantile reads 27+s. `for: 2m` couldn't shed
          # a restart artifact; 10m does while a genuine sustained episode still fires.
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "API server p99 request latency is {{ $value | printf \"%.1f\" }}s"
            description: >
              p99 API server request latency (excluding long-lived WATCH/CONNECT) has been
              above 5s for 10+ minutes -- the same symptom that preceded every REL-012
              control-plane episode (kine/SQLite "apply request took too long" warnings up
              to 14.3s, expected ~100ms). Catches the slow-but-not-yet-down window, which
              is far more common than full outages. WATCH/CONNECT excluded: they are
              long-lived streams that naturally reach 60s and would otherwise cause
              constant false positives.
