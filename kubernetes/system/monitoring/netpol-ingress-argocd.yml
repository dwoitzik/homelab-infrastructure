# Default-deny ingress for argocd. Every ArgoCD component has its own
# ingress policy in kubernetes/system/argocd/network-policies.yml; this
# covers any pod that has none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
