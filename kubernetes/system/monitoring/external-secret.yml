apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  # REL-019: this secret previously shipped as a plaintext placeholder
  # (token_value: REPLACE_WITH_TOKEN_VALUE) directly in pve-exporter.yml,
  # meaning pve-exporter had been failing 401 Unauthorized since deployment --
  # zero Proxmox host metrics (including disk capacity) were ever scraped.
  # Found while investigating why no alert caught the rpool-full incident.
  name: pve-exporter-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pve-exporter-config
    creationPolicy: Owner
    template:
      data:
        pve.yml: |
          default:
            user: prometheus@pve
            token_name: prometheus
            token_value: {{ .tokenValue }}
            verify_ssl: false
  data:
    - secretKey: tokenValue
      remoteRef:
        key: secret/pve-exporter
        property: token-value
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Merge
  data:
    - secretKey: admin-user
      remoteRef:
        key: secret/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: secret/grafana
        property: admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oidc-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-oidc-secret
    creationPolicy: Merge
  data:
    - secretKey: client-secret
      remoteRef:
        key: secret/grafana
        property: oidc-client-secret
