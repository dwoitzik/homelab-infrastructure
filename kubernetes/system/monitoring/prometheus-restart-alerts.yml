apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-prometheus-restart-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: prometheus.restarts
      rules:
          # Scoped to the prometheus container: config-reloader in the same pod restarts on
          # every config reload, which is normal and would swamp this count. The 6h window
          # tolerates one deploy restart; a fully dead Prometheus can't alert, hence dead-mans-switch.
          - alert: PrometheusFrequentRestarts
            expr: |
              changes(process_start_time_seconds{job="kube-prometheus-stack-prometheus", container="prometheus"}[6h]) >= 2
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus restarted {{ $value | humanize }}x in the last hour on {{ $labels.pod }}"
              description: >
                {{ $labels.pod }} recorded {{ $value | humanize }} process starts within an hour.
                Historically this ran at a median of 180 minutes between restarts, which went
                unnoticed because nothing alerted on it. Check the liveness probe timeout against
                the self-scrape duration first: a probe that kills Prometheus during a slow scrape
                is the failure mode that produced this in the first place.
