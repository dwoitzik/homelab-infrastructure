# Default-deny ingress for nfs-provisioner. The provisioner only talks out
# (apiserver, NFS server) and exposes no port, so nothing is allowed in.
# Egress policies for this namespace are in network-policies-egress.yml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nfs-provisioner
spec:
  podSelector: {}
  policyTypes:
    - Ingress
