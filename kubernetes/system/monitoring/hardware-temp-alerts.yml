apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-hardware-temp-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: hardware.temperature
      rules:
        - alert: ProxmoxHostHighTemp
          expr: node_hwmon_temp_celsius{group="pve_hosts"} > 85
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox host running hot: {{ $value | printf \"%.1f\" }}°C"
            description: >
              {{ $labels.chip }} on the Proxmox host has been above 85°C for 3+ minutes.
              This host has frozen under thermal/load stress before - investigate before it
              happens again rather than after.

        - alert: RpiHighTemp
          expr: node_thermal_zone_temp{group="rpi_nodes"} > 75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} running hot: {{ $value | printf \"%.1f\" }}°C"
            description: >
              RPi CPU temperature above 75°C for 5+ minutes. These run DNS for the whole
              house - check airflow/dust before it throttles.
