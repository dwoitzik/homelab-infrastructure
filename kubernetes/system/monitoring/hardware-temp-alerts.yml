apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-hardware-temp-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: hardware.temperature
      rules:
        - alert: ProxmoxHostHighTemp
          expr: node_hwmon_temp_celsius{group="pve_hosts"} > 85
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox host running hot: {{ $value | printf \"%.1f\" }}°C"
            description: >
              {{ $labels.chip }} on the Proxmox host has been above 85°C for 3+ minutes.
              This host has frozen under thermal/load stress before - investigate before it
              happens again rather than after.

        - alert: RpiHighTemp
          expr: node_thermal_zone_temp{group="rpi_nodes"} > 75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} running hot: {{ $value | printf \"%.1f\" }}°C"
            description: >
              RPi CPU temperature above 75°C for 5+ minutes. These run DNS for the whole
              house - check airflow/dust before it throttles.

    # Thresholds and full reasoning: docs/HARDWARE.md, "SSD wear tracking and
    # replacement trigger". The boot NVMe backs all 3 k3s VMs and every LXC
    # on this single-disk host -- no separate physical fallback exists.
    - name: hardware.ssd_wear
      rules:
        - alert: NVMeWearWarning
          expr: smart_nvme_percentage_used >= 80 or smart_nvme_available_spare_percent < 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Boot NVMe wear at {{ $value | printf \"%.0f\" }}% -- start sourcing a replacement"
            description: >
              percentage_used or available_spare has crossed the warning threshold. Not
              urgent same-week, but this drive has no physical fallback -- see
              docs/HARDWARE.md for the full projection and why the trend has been
              tracked this closely.
        - alert: NVMeWearCritical
          expr: smart_nvme_percentage_used >= 90 or smart_nvme_available_spare_percent < 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Boot NVMe wear critical: {{ $value | printf \"%.0f\" }}% -- replace now"
            description: >
              This drive backs every k3s VM and every LXC on this single-disk host.
              Waiting for an actual failure past this threshold is not an acceptable
              risk -- see docs/HARDWARE.md's replacement trigger.
        # Split from NVMeWearCritical: smart_device_healthy is a 0/1 flag, not
        # a percentage -- sharing $value made a healthy-flag trip misread as
        # "0% worn" instead of the critical condition it actually is.
        - alert: NVMeUnhealthy
          expr: smart_device_healthy == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Boot NVMe failed its own SMART self-assessment"
            description: >
              smartctl's smart_status.passed is false, or the metrics script
              couldn't read the drive at all (both report as 0 here) -- check
              `smartctl -a /dev/nvme0n1` on pve-mgmt-01 directly.

    # Per-LXC memory cgroup counters from the pve_lxc_memory_metrics textfile
    # collector. A container held at memory.high reclaims and stalls without
    # an OOM; on the host that only shows up as load (ADR-066).
    - name: pve.lxc_memory
      rules:
        - alert: LXCMemoryThrottled
          expr: rate(lxc_cgroup_memory_events_total{event="high"}[10m]) > 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "LXC {{ $labels.ctid }} ({{ $labels.name }}) throttled at memory.high: {{ $value | printf \"%.0f\" }} events/s"
            description: >
              The container keeps hitting memory.high and the kernel is reclaiming
              inside its cgroup. Check what is filling it (tmpfs/shmem counts
              against the container) with `cat /sys/fs/cgroup/lxc/{{ $labels.ctid }}/memory.stat`
              on pve-mgmt-01 before it turns into a stall.
        - alert: LXCMemoryStall
          expr: rate(lxc_cgroup_memory_pressure_seconds_total{kind="full"}[10m]) > 0.10
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "LXC {{ $labels.ctid }} ({{ $labels.name }}) fully stalled on memory {{ $value | humanizePercentage }} of the time"
            description: >
              Every task in the container has been waiting on memory reclaim for
              more than 10% of wall time for 15 minutes. Nothing OOMs in this
              state; the processes hang in D state and host load climbs. Raise
              the container's memory or remove what is filling its cgroup.
        - alert: LXCMemoryMetricsStale
          expr: time() - lxc_cgroup_memory_metrics_last_run_timestamp_seconds > 600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LXC memory cgroup metrics have not been refreshed for {{ $value | humanizeDuration }}"
            description: >
              lxc-memory-metrics.timer on pve-mgmt-01 stopped writing
              lxc_memory.prom, so LXCMemoryThrottled and LXCMemoryStall cannot
              fire. Check `systemctl status lxc-memory-metrics.service`.
