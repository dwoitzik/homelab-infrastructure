apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/system/velero
    directory:
      # WRK-008 (2026-06-25 - 2026-08-22): offsite-schedule.yml/
      # r2-backuplocation.yml/r2-usage-guard.yml were excluded here because
      # the ACCOUNT_ID placeholder was literal and no credential secret
      # existed -- syncing them would have created an Unavailable
      # BackupStorageLocation and a Schedule failing daily at 4am. Real R2
      # bucket + Account ID + API token now exist (velero-r2-credentials
      # Secret applied, endpoint filled in both files), so the deferral no
      # longer applies -- including them now.
      #
      # restore-test.yml (BRIEFING-V4.md Section D) added 2026-08-17: declares
      # its own namespaces (velero-restore-test, plus Role/RoleBinding in
      # velero) explicitly on every resource, so it's safe to sync from this
      # Application even though its destination.namespace default is velero.
      include: '{secrets,schedule,restore-test,offsite-schedule,r2-backuplocation,r2-usage-guard}.yml'
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
