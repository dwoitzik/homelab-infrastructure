apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwoitzik/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/system/velero
    directory:
      # WRK-008: offsite-schedule.yml/r2-backuplocation.yml are deliberately
      # excluded -- scaffolded but incomplete (literal ACCOUNT_ID placeholder,
      # credential secret doesn't exist anywhere), user decided to leave
      # deferred rather than complete or remove (2026-06-25). Don't add them
      # here until real R2 credentials exist -- confirmed live that including
      # them creates an Unavailable BackupStorageLocation and a Schedule that
      # would fail daily at 4am.
      #
      # restore-test.yml (BRIEFING-V4.md Section D) added 2026-08-17: declares
      # its own namespaces (velero-restore-test, plus Role/RoleBinding in
      # velero) explicitly on every resource, so it's safe to sync from this
      # Application even though its destination.namespace default is velero.
      include: '{secrets,schedule,restore-test}.yml'
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
