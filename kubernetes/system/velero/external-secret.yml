apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: velero-s3-credentials
    creationPolicy: Merge
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id = {{ .accessKeyId }}
          aws_secret_access_key = {{ .secretAccessKey }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: secret/garage
        property: velero-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: secret/garage
        property: velero-secret-access-key
