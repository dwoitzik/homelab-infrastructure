          command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; while true; do sleep 3600 & wait $!; done"]
          env:
            - name: HOME
              value: /tmp
            - name: DUMP_TARGETS
              value: IMMICH PAPERLESS NEXTCLOUD
            - {name: IMMICH_HOST, value: immich-postgres}
            - {name: IMMICH_DB, value: immich}
            - {name: IMMICH_USER, value: immich}
            - name: IMMICH_PASSWORD
              valueFrom: {secretKeyRef: {name: immich-secrets, key: db-password}}
            - {name: PAPERLESS_HOST, value: postgres-paperless}
            - {name: PAPERLESS_DB, value: paperless}
            - {name: PAPERLESS_USER, value: paperless}
            - name: PAPERLESS_PASSWORD
              valueFrom: {secretKeyRef: {name: paperless-secrets, key: postgres-password}}
            - {name: NEXTCLOUD_HOST, value: postgres-nextcloud}
            - {name: NEXTCLOUD_DB, value: nextcloud}
            - {name: NEXTCLOUD_USER, value: nextcloud}
            - name: NEXTCLOUD_PASSWORD
              valueFrom: {secretKeyRef: {name: nextcloud-secrets, key: postgres-password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: dumps
