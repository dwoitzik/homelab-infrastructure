---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-dumps
  namespace: database
  labels:
    app: pg-dump
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-dumps
  namespace: apps
  labels:
    app: pg-dump
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-dump
  namespace: database
  labels:
    app: pg-dump
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pg-dump
  template:
    metadata:
      labels:
        app: pg-dump
      annotations:
        pre.hook.backup.velero.io/container: pg-dump
        pre.hook.backup.velero.io/command: '["/bin/sh", "/scripts/pg-dump.sh"]'
        # Continue, not Fail: Fail would skip the pg-dumps volume entirely,
        # losing the dumps that did succeed. The error still marks the backup
        # PartiallyFailed, which VeleroBackupPartialFailure alerts on.
        pre.hook.backup.velero.io/on-error: Continue
        pre.hook.backup.velero.io/timeout: 15m
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pg-dump
          image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; while true; do sleep 3600 & wait $!; done"]
          env:
            - name: HOME
              value: /tmp
            - name: DUMP_TARGETS
              value: AUTHELIA FIREFLY N8N SCANOPY SYNAPSE
            - {name: AUTHELIA_HOST, value: postgres-authelia-rw}
            - {name: AUTHELIA_DB, value: authelia}
            - name: AUTHELIA_USER
              valueFrom: {secretKeyRef: {name: postgres-authelia-user, key: username}}
            - name: AUTHELIA_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-authelia-user, key: password}}
            - {name: FIREFLY_HOST, value: postgres-firefly-rw}
            - {name: FIREFLY_DB, value: firefly}
            - name: FIREFLY_USER
              valueFrom: {secretKeyRef: {name: postgres-firefly-cnpg-user, key: username}}
            - name: FIREFLY_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-firefly-cnpg-user, key: password}}
            - {name: N8N_HOST, value: postgres-n8n-rw}
            - {name: N8N_DB, value: n8n}
            - name: N8N_USER
              valueFrom: {secretKeyRef: {name: postgres-n8n-user, key: username}}
            - name: N8N_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-n8n-user, key: password}}
            - {name: SCANOPY_HOST, value: postgres-scanopy-rw}
            - {name: SCANOPY_DB, value: scanopy}
            - name: SCANOPY_USER
              valueFrom: {secretKeyRef: {name: postgres-scanopy-user, key: username}}
            - name: SCANOPY_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-scanopy-user, key: password}}
            - {name: SYNAPSE_HOST, value: postgres-synapse-rw}
            - {name: SYNAPSE_DB, value: synapse}
            - name: SYNAPSE_USER
              valueFrom: {secretKeyRef: {name: postgres-synapse-user, key: username}}
            - name: SYNAPSE_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-synapse-user, key: password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: dumps
              mountPath: /dumps
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dumps
          persistentVolumeClaim:
            claimName: pg-dumps
        - name: script
          configMap:
            name: pg-dump-script
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-dump
  namespace: apps
  labels:
    app: pg-dump
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pg-dump
  template:
    metadata:
      labels:
        app: pg-dump
      annotations:
        pre.hook.backup.velero.io/container: pg-dump
        pre.hook.backup.velero.io/command: '["/bin/sh", "/scripts/pg-dump.sh"]'
