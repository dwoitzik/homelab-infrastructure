              mountPath: /tmp
      volumes:
        - name: dumps
          persistentVolumeClaim:
            claimName: pg-dumps
        - name: script
          configMap:
            name: pg-dump-script
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# The database namespace denies egress by default; the dump pod only needs
# the Postgres instances.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-pg-dump
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: pg-dump
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/podRole: instance
      ports:
        - port: 5432
          protocol: TCP
