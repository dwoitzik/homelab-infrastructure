# Consistent pg_dump archives, taken by a Velero pre-backup hook and copied by
# the same backup. Offsite they replace the raw data directories (ADR-075).
# One client (18) for the 16, 17 and 18 servers; restores need it too.
apiVersion: v1
kind: ConfigMap
metadata:
  name: offsite-volume-policy
  namespace: velero
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      # emptyDirs hold caches, sockets and scratch space that the pods rebuild
      # on start; copying them offsite only costs R2 space.
      - conditions:
          volumeTypes:
            - emptyDir
        action:
          type: skip
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-dump-script
  namespace: database
  labels:
    app: pg-dump
data:
  pg-dump.sh: |
    #!/bin/sh
    # Pre-backup hook: a dump replaces the old file only once pg_restore reads it,
    # failures exit non-zero. "restore <NAME>" loads it back (DISASTER-RECOVERY.md).
    set -u
    OUT=/dumps
    load() {
      eval "host=\$${1}_HOST db=\$${1}_DB user=\$${1}_USER"
      eval "export PGPASSWORD=\"\$${1}_PASSWORD\""
      export PGCONNECT_TIMEOUT=10
      file=$(echo "$1" | tr 'A-Z' 'a-z')
    }
    if [ "${1:-}" = restore ]; then
      load "$2"
      exec pg_restore --host="$host" --username="$user" --dbname="$db" \
        --clean --if-exists --no-owner --exit-on-error "$OUT/$file.dump"
    fi
    rc=0
    for name in $DUMP_TARGETS; do
      load "$name"
      tmp="$OUT/.$file.dump.partial"
      start=$(date +%s)
      if pg_dump --host="$host" --username="$user" --dbname="$db" \
          --format=custom --file="$tmp" && pg_restore --list "$tmp" >/dev/null; then
        mv -f "$tmp" "$OUT/$file.dump"
        echo "pg-dump: $file ok, $(wc -c < "$OUT/$file.dump") bytes, $(( $(date +%s) - start ))s"
      else
        rm -f "$tmp"
        echo "pg-dump: $file FAILED, previous dump kept" >&2
        rc=1
      fi
    done
    date -u +%FT%TZ > "$OUT/.last-run"
    exit $rc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-dump-script
  namespace: apps
  labels:
    app: pg-dump
data:
  pg-dump.sh: |
    #!/bin/sh
    # Pre-backup hook: a dump replaces the old file only once pg_restore reads it,
    # failures exit non-zero. "restore <NAME>" loads it back (DISASTER-RECOVERY.md).
