# Offsite backup to Cloudflare R2 — critical data only, kopia/zstd; large volumes
# (media, prometheus, loki, garage) excluded via label. TTL 3 days not 7 (a full set
# ~4 GiB; 7 days of dedup deltas hit the r2-usage-guard cap — see ADR-062). Runs 04:00.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-offsite
  namespace: velero
spec:
  schedule: "0 4 * * *"
  template:
    ttl: 72h0m0s
    storageLocation: r2-offsite
    defaultVolumesToFsBackup: true
    includedNamespaces:
      - apps
      - vault
      - database
      - argocd
    excludedNamespaces: []
    volumeSnapshotLocations:
      - default
