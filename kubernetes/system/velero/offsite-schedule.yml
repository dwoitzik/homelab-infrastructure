# Offsite backup to Cloudflare R2, sized for the r2-usage-guard cap (ADR-062,
# ADR-075). Excluded: large volumes (pod annotations), emptyDirs (volume policy),
# raw Postgres directories (labelSelector); databases go as pg_dump archives.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-offsite
  namespace: velero
spec:
  schedule: "0 4 * * *"
  template:
    ttl: 72h0m0s
    storageLocation: r2-offsite
    defaultVolumesToFsBackup: true
    includedNamespaces:
      - apps
      - vault
      - database
      - argocd
    excludedNamespaces: []
    resourcePolicy:
      kind: configmap
      name: offsite-volume-policy
    # A pod left out of the backup takes its volumes with it. On restore the
    # databases come up from Git (CNPG bootstraps an empty cluster) and the
    # dumps are loaded with pg_restore, see DISASTER-RECOVERY.md.
    labelSelector:
      matchExpressions:
        - key: cnpg.io/podRole
          operator: NotIn
          values: [instance]
        - key: cnpg.io/pvcRole
          operator: NotIn
          values: [PG_DATA, PG_WAL]
        - key: app
          operator: NotIn
          values: [immich-postgres, postgres-paperless, postgres-nextcloud]
    volumeSnapshotLocations:
      - default
