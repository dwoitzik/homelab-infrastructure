# Scratch space for the Postgres half of monthly-restore-test (restore-test.yml).
# Nothing here archives: the scratch Cluster only reads the backups, and this
# ObjectStore carries no retention policy.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-restore-test
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cnpg-restore-test
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The operator polls each instance's status API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-cnpg-operator
  namespace: cnpg-restore-test
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-garage-backup
  namespace: cnpg-restore-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cnpg-garage-backup
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: secret/garage
        property: cnpg-backups-access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: secret/garage
        property: cnpg-backups-secret-access-key
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-config
  namespace: cnpg-restore-test
type: Opaque
stringData:
  region: homelab
---
# Same bucket path as database/postgres-firefly; the plugin resolves an
# externalCluster's ObjectStore in the Cluster's own namespace.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-firefly-source
  namespace: cnpg-restore-test
spec:
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 384Mi
  configuration:
    destinationPath: s3://cnpg-backups/firefly
    endpointURL: http://garage.apps.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: cnpg-garage-backup
        key: access-key-id
      secretAccessKey:
        name: cnpg-garage-backup
        key: secret-access-key
      region:
        name: cnpg-backup-config
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
---
# Created by the job, kept here so the shape is reviewable. The job applies it as is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-test-postgres-cluster
  namespace: velero
data:
  cluster.yml: |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: firefly-restore
      namespace: cnpg-restore-test
    spec:
      instances: 1
      imageName: ghcr.io/cloudnative-pg/postgresql:17.2
      storage:
        size: 2Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      bootstrap:
        recovery:
          source: origin
      externalClusters:
        - name: origin
          plugin:
            name: barman-cloud.cloudnative-pg.io
            parameters:
              barmanObjectName: postgres-firefly-source
              serverName: postgres-firefly
