apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 7.2.2
    chart: velero
    helm:
      values: |
        upgradeCRDs: false
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              config:
                region: homelab
                s3ForcePathStyle: true
                s3Url: http://garage.apps.svc.cluster.local:3900
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: homelab
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.10.1
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        credentials:
          useSecret: true
          existingSecret: velero-s3-credentials
        backupsEnabled: true
        snapshotsEnabled: true
        deployNodeAgent: true
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      # REL-019: selfHeal disabled (not removed entirely, so this stays
      # visible/intentional) while the velero Deployment is manually scaled
      # to 0 (`kubectl scale deployment velero -n velero --replicas=0`).
      # Found live: the velero Deployment's controller spawns per-namespace
      # BackupRepository maintenance Jobs every ~1.5-2h *independently* of
      # the daily-backup Schedule's paused state (that only stops new
      # backups, not ongoing repo maintenance/repacking) -- these jobs do
      # heavy read/write against Garage's data on rpool and were still
      # actively driving disk contention hours after daily-backup was
      # paused. Couldn't find a Helm value for this chart that maps to
      # replicas (no helm CLI available to check `helm show values`
      # locally; guessing a wrong key in git would be worse than not having
      # one). Re-enable selfHeal and scale back to 1 once Garage's data has
      # migrated off rpool onto the archive pool.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
