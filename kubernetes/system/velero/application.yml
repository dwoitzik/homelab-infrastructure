apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 7.2.2
    chart: velero
    helm:
      values: |
        upgradeCRDs: false
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              config:
                region: homelab
                s3ForcePathStyle: true
                s3Url: http://garage.apps.svc.cluster.local:3900
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: homelab
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.2
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        credentials:
          useSecret: true
          existingSecret: velero-s3-credentials
        backupsEnabled: true
        snapshotsEnabled: true
        deployNodeAgent: true
        # Reduce kopia maintenance frequency from 1h (default) to 24h per repo.
        # With 11 BackupRepositories, hourly maintenance = 11 concurrent kopia jobs/hour
        # hammering rpool NVMe, which competes with etcd and caused cluster IO pressure.
        extraArgs:
          - --default-repo-maintenance-frequency=24h
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      # REL-019: selfHeal was disabled here while Garage's data lived on
      # rpool -- the velero Deployment's per-namespace BackupRepository
      # maintenance Jobs (spawned every ~1.5-2h, independently of the
      # daily-backup Schedule's paused state) were driving heavy read/write
      # against Garage's data on the contended fast SSD. Re-enabled now that
      # Garage's data has migrated to the archive pool (see garage.yml),
      # which has 1.3TB+ free -- the same maintenance traffic is no longer
      # competing for scarce space.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
