apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 7.2.2
    chart: velero
    helm:
      values: |
        upgradeCRDs: false
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              config:
                region: homelab
                s3ForcePathStyle: true
                s3Url: http://garage.apps.svc.cluster.local:3900
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: homelab
          # ADR-038: AWS SDK for Go v2's S3 module (v1.74.1+, per its own
          # changelog) started auto-attaching a CRC32 checksum to every
          # PutObject by default, regardless of the BSL's own
          # `checksumAlgorithm: ""` setting above (that setting stops
          # Velero from requesting a checksum explicitly -- it doesn't
          # stop the SDK's own newer default behavior underneath). This is
          # what was actually breaking `daily-offsite` against Cloudflare
          # R2 for 7+ days straight (`x-amz-tagging` in the error is R2's
          # own mislabeling of the real unsupported header -- confirmed via
          # the plugin's source, which never sets a real Tagging header
          # unless `tagging` is set in the BSL config, which it isn't
          # here). WHEN_REQUIRED reverts the SDK to pre-v1.74.1 behavior;
          # AWS's own documented fix for exactly this S3-compatible-backend
          # class of breakage, not Velero-specific.
          # NOTE: this chart's extraEnvVars is a flat key/value map, not a
          # list of {name, value} objects (confirmed against the actual
          # values.yaml for the pinned 7.2.2 chart) -- a first attempt used
          # the wrong shape and silently rendered nothing.
          extraEnvVars:
            AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
            AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          # REL-044: originally placed at the top level as `extraArgs` and
          # misspelled `--default-repo-maintenance-frequency` -- Helm silently
          # ignores unknown top-level keys, and the flag (even if it had been
          # read) doesn't exist under that name, so this never actually took
          # effect despite being merged 11 days earlier. Confirmed via the
          # chart's own deployment.yaml template
          # ({{ .Values.configuration.extraArgs }}) and the real flag name
          # (velero/velero#8156, #8543): `--default-repo-maintain-frequency`.
          # Reduce kopia maintenance frequency from 1h (default) to 24h --
          # with 11 BackupRepositories, hourly maintenance = 11 concurrent
          # kopia jobs/hour hammering rpool NVMe, competing with etcd.
          extraArgs:
            - --default-repo-maintain-frequency=24h
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.2
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        credentials:
          useSecret: true
          existingSecret: velero-s3-credentials
        backupsEnabled: true
        snapshotsEnabled: true
        # ADR-036: soft preference off vm-srv-k3s-11 for the main Velero
        # Deployment only -- deliberately NOT applied to nodeAgent below,
        # which is a DaemonSet and must keep running on every node.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - vm-srv-k3s-11
        deployNodeAgent: true
        # REL-064 load-smoothing: node-agent had NO resource limits at all
        # (confirmed live: `resources: {}` on the running DaemonSet) --
        # kopia's own internal parallel chunking/compression could burst to
        # every core the k3s VM has (4 vCPU) on all 3 nodes simultaneously,
        # which is the actual driver of the 82-90C nightly spike (REL-062),
        # not vzdump and not literally which hour it runs.
        #
        # v1.14.1 (this chart's pinned appVersion) has no
        # loadConcurrency/node-agent-config knob to reduce how many
        # PodVolumeBackups run in parallel per node -- checked directly
        # against the running binary (`node-agent server --help`), that
        # flag doesn't exist in this version. A CPU *limit* is the real
        # lever actually available here: Kubernetes enforces it as a CFS
        # quota, which throttles kopia's own internal parallelism instead
        # of capping cross-pod concurrency -- same practical effect (flatter
        # load, longer duration, lower peak) via the mechanism this version
        # actually supports.
        #
        # ionice/nice were considered and don't apply here: node-agent's
        # backup work runs the kopia library in-process (not exec'ing a
        # separate `kopia` binary per operation), so there's no external
        # process to wrap with an I/O/CPU scheduling class -- a CPU cgroup
        # limit is the equivalent control point Kubernetes actually exposes
        # for in-process work like this.
        #
        # 1000m caps each node-agent pod (one per node, 3 nodes) to 1 of the
        # node's 4 vCPU -- worst case (all 3 nodes backing up volumes at
        # once) is 3 cores of contention host-wide instead of previously
        # unbounded (up to 12 cores worth, one full node each). Tradeoff:
        # longer backup wall-clock time in exchange for a materially lower
        # peak -- exactly what REL-064 is watching for. 250m request keeps
        # it schedulable without reserving much when idle (backups are once
        # nightly, not constant).
        nodeAgent:
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      # REL-019: selfHeal was disabled here while Garage's data lived on
      # rpool -- the velero Deployment's per-namespace BackupRepository
      # maintenance Jobs (spawned every ~1.5-2h, independently of the
      # daily-backup Schedule's paused state) were driving heavy read/write
      # against Garage's data on the contended fast SSD. Re-enabled now that
      # Garage's data has migrated to the archive pool (see garage.yml),
      # which has 1.3TB+ free -- the same maintenance traffic is no longer
      # competing for scarce space.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
