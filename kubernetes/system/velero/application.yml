apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 11.4.0
    chart: velero
    helm:
      values: |
        upgradeCRDs: false
        image:
          tag: v1.17.2
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              validationFrequency: 1h
              config:
                region: homelab
                s3ForcePathStyle: true
                s3Url: http://garage.apps.svc.cluster.local:3900
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: homelab
          # ADR-038: hardening for S3-compatible backends (R2, Garage); the SDK
          # otherwise attaches a CRC32 checksum to every PutObject.
          extraEnvVars:
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: WHEN_REQUIRED
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: WHEN_REQUIRED
          # REL-044: originally placed at the top level as `extraArgs` and
          # misspelled `--default-repo-maintenance-frequency` -- Helm silently
          # ignores unknown top-level keys, and the flag (even if it had been
          # read) doesn't exist under that name, so this never actually took
          # effect despite being merged 11 days earlier. Confirmed via the
          # chart's own deployment.yaml template
          # ({{ .Values.configuration.extraArgs }}) and the real flag name
          # (velero/velero#8156, #8543): `--default-repo-maintain-frequency`.
          # Reduce kopia maintenance frequency from 1h (default) to 24h --
          # with 11 BackupRepositories, hourly maintenance = 11 concurrent
          # kopia jobs/hour hammering rpool NVMe, competing with etcd.
          extraArgs:
            - --default-repo-maintain-frequency=24h
            # ADR-067: a hung kopia upload otherwise holds the backup for the
            # 4h default. The slowest healthy volume takes about 2 minutes.
            - --fs-backup-timeout=45m
            - --default-item-operation-timeout=45m
        initContainers:
          - name: velero-plugin-for-aws
            # ADR-038: v1.14.3+ is the first tagged release that omits the empty
            # x-amz-tagging header R2 rejects. 1.11-1.13 (the matrix pairs for
            # Velero 1.15-1.17) still send it, so the 1.14 line is used throughout.
            image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        credentials:
          useSecret: true
          existingSecret: velero-s3-credentials
        backupsEnabled: true
        snapshotsEnabled: true
        # ADR-036: soft preference off vm-srv-k3s-11 for the main Velero
        # Deployment only -- deliberately NOT applied to nodeAgent below,
        # which is a DaemonSet and must keep running on every node.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - vm-srv-k3s-11
        deployNodeAgent: true
        # Server process only; kopia data movement runs in the data mover pods.
        resources:
          requests:
            cpu: 100m
            memory: 448Mi
          limits:
            memory: 1536Mi
        # REL-064: kopia runs in data mover pods since 1.17; one per node at a
        # time, 1 CPU each, keeps the old per-node load. Default priority on
        # purpose: a nightly job should not preempt pinned pods (ADR-083).
        nodeAgent:
          priorityClassName: node-daemon
          extraArgs:
            - --node-agent-configmap=velero-node-agent-config
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 1Gi
        # Data mover pods are bound to the source pod's node by nodeName, so the
        # kubelet rejects them (OutOfmemory) instead of the scheduler finding
        # room; small requests keep them admissible on a fully requested node.
        configMaps:
          node-agent-config:
            data:
              node-agent-config.json: |
                {
                  "loadConcurrency": {
                    "globalConfig": 1
                  },
                  "podResources": {
                    "cpuRequest": "10m",
                    "cpuLimit": "1000m",
                    "memoryRequest": "32Mi",
                    "memoryLimit": "1Gi"
                  }
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      # REL-019: selfHeal was disabled here while Garage's data lived on
      # rpool -- the velero Deployment's per-namespace BackupRepository
      # maintenance Jobs (spawned every ~1.5-2h, independently of the
      # daily-backup Schedule's paused state) were driving heavy read/write
      # against Garage's data on the contended fast SSD. Re-enabled now that
      # Garage's data has migrated to the archive pool (see garage.yml),
      # which has 1.3TB+ free -- the same maintenance traffic is no longer
      # competing for scarce space.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
