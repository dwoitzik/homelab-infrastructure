apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  # REL-019: was paused because this schedule's filesystem backup of
  # Garage's own data/meta volumes (defaultVolumesToFsBackup +
  # includedNamespaces: "*") wrote backup chunks into Garage's own S3
  # backend, growing unbounded until it filled rpool and paused the whole
  # k3s cluster. Re-enabled after verifying both halves of the fix live: a
  # manual test Backup confirmed the garage.yml backup-volumes-excludes
  # annotation correctly skips Garage's data/meta volumes (only its tmp
  # scratch emptyDir gets backed up), and Garage's actual data has since
  # migrated off rpool onto the archive pool (1.3TB+ free), so even
  # unrelated backup/maintenance traffic no longer competes for the
  # contended fast SSD. See AUDIT.md REL-019.
  #
  # REL-062: CORRECTED 2026-07-07, see AUDIT.md for the full retraction --
  # the original version of this comment claimed this schedule ("0 3 * * *")
  # collided with PBS's own vzdump job (jobs.cfg on mini says "03:00") and
  # moved it to "0 1 * * *" to separate them. That was wrong: mini runs
  # Europe/Berlin (CEST, UTC+2), so vzdump's configured "03:00" is 01:00 UTC
  # -- confirmed against its own live task history, which runs 01:00-~01:15
  # UTC every day. This CronJob's schedule is evaluated in UTC by the k8s
  # controller, so "0 1 * * *" actually MOVED Velero directly INTO vzdump's
  # real window instead of away from it -- the opposite of the intent.
  #
  # The two jobs never overlapped in the first place. The real finding
  # (confirmed via a full week of Prometheus history, not one night): Velero's
  # own backup ALONE pushes host temp into the 82-90C range every single
  # night at 03:00 UTC, regardless of vzdump -- 2026-07-04 hit 90C with no
  # alert at all. 2026-07-07's ProxmoxHostHighTemp/KubeAPIServerDown wasn't a
  # one-off double-stacking incident, it was this same nightly pattern
  # crossing the alert threshold clearly enough to fire. Moving the schedule
  # doesn't fix that -- Velero's own backup workload (defaultVolumesToFsBackup
  # across every namespace) is heavy enough on its own. Kept clear of
  # vzdump's real 01:00-~01:15 UTC window and the 04:00 R2 offsite schedule
  # as basic hygiene, not as a thermal fix -- physical cooling is a hardware
  # problem, out of scope for a schedule change.
  schedule: "0 5 * * *"
  template:
    ttl: 168h0m0s
    includedNamespaces:
      - "*"
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
    storageLocation: default
    volumeSnapshotLocations:
      - default
    # nfs-client storage class has no native CSI snapshotter, so PVC data is
    # only captured via filesystem backup (kopia, deployed by velero node-agent).
    # Without this, backups only contain k8s manifests, not actual volume data.
    defaultVolumesToFsBackup: true
