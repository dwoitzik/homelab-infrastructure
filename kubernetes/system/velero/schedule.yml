apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  schedule: "0 3 * * *"
  template:
    ttl: 720h0m0s
    includedNamespaces:
      - "*"
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
    storageLocation: default
    volumeSnapshotLocations:
      - default
    # nfs-client storage class has no native CSI snapshotter, so PVC data is
    # only captured via filesystem backup (kopia, deployed by velero node-agent).
    # Without this, backups only contain k8s manifests, not actual volume data.
    defaultVolumesToFsBackup: true
