apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  # REL-019: paused after this schedule's filesystem backup of Garage's own
  # data/meta volumes (defaultVolumesToFsBackup + includedNamespaces: "*")
  # wrote backup chunks into Garage's own S3 backend, growing unbounded until
  # it filled rpool and paused the whole k3s cluster. Re-enable once the
  # garage.yml backup-volumes-excludes annotation fix has been live for at
  # least one full run and confirmed to skip Garage's volumes. See AUDIT.md.
  paused: true
  schedule: "0 3 * * *"
  template:
    ttl: 720h0m0s
    includedNamespaces:
      - "*"
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
    storageLocation: default
    volumeSnapshotLocations:
      - default
    # nfs-client storage class has no native CSI snapshotter, so PVC data is
    # only captured via filesystem backup (kopia, deployed by velero node-agent).
    # Without this, backups only contain k8s manifests, not actual volume data.
    defaultVolumesToFsBackup: true
