apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.chaos-mesh.org
    targetRevision: 2.8.3
    chart: chaos-mesh
    helm:
      values: |
        controllerManager:
          replicaCount: 1
        chaosDaemon:
          runtime: containerd
          socketPath: /run/k3s/containerd/containerd.sock
        dashboard:
          create: true
          securityMode: false
        # Chart default self-generates a new random self-signed cert on
        # every render (no stable seed), so ArgoCD's selfHeal saw these
        # Secrets and the webhook configs referencing them as permanently
        # OutOfSync and kept re-applying them. Delegating to cert-manager
        # (already deployed cluster-wide) makes the certs stable across
        # renders. Chart limitation: chaos-mesh-chaosd-client-certs has no
        # cert-manager equivalent in 2.8.3 and will keep regenerating
        # regardless -- it's only used for the optional chaosd CLI's mTLS
        # to the controller manager, not the admission webhooks, so it
        # doesn't carry the same blast radius as the ones fixed here.
        webhook:
          certManager:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
