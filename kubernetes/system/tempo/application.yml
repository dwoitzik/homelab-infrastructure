apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.10.3
    chart: tempo
    helm:
      values: |
        tempo:
          storage:
            trace:
              backend: local
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          retention: 72h
        persistence:
          enabled: true
          storageClassName: nfs-client
          size: 10Gi
        # ADR-036: soft preference off vm-srv-k3s-11, which had accumulated
        # most of this cluster's stateful/heavy workload with nothing
        # steering new placements elsewhere.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - vm-srv-k3s-11
        serviceMonitor:
          enabled: true
          namespace: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
